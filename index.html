  bulkWhatsApp(type){
    const subs=DB.subscriptions();
    const children=DB.children();
    const settings=DB.settings();
    const applyVars=(tmpl,c,s)=>(tmpl||'')
      .replace(/{name}/g,c.name||'')
      .replace(/{parentName}/g,c.parentName||'')
      .replace(/{date}/g,formatDate(s.endDate))
      .replace(/{remaining}/g,String(s.price-s.paidAmount));
    let list=[];
    let title='';
    let tmpl='';
    if(type==='defaulters'){
      list=subs.filter(s=>Views._paymentState(s)==='defaulter');
      title='🔴 تذكيرات المتعثرين بالسداد';
      tmpl=settings.waTemplateDefaulter||'السلام عليكم {parentName}، اشتراك طفلكم {name} انتهى بتاريخ {date} ولا يزال متبقي {remaining} ر.س. يرجى التواصل.';
    } else {
      list=subs.filter(s=>Views._paymentState(s)==='pending');
      title='🟠 تذكيرات المعلّقين';
      tmpl=settings.waTemplatePending||'السلام عليكم {parentName}، يوجد {remaining} ر.س متبقي على اشتراك {name} (ينتهي {date}). يرجى إتمام السداد.';
    }
    const rows=list.map(s=>{
      const c=children.find(x=>x.id===s.childId)||{};
      const phone=(c.parentPhone||'').replace(/^\+?/,'').replace(/^0/,'966');
      const msg=applyVars(tmpl,c,s);
      const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:'';
      return {c,s,url,phone};
    });
    App.showModal(`
    <div class="modal-overlay" onclick="if(event.target===this)App.closeModal()">
    <div class="modal" style="max-width:660px">
      <div class="modal-header"><h2>${title} (${rows.length})</h2><button class="close-btn" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="background:#fef9c3;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#92400e">
          ⚠️ كل رابط يفتح واتساب ويملأ الرسالة تلقائياً. اضغط إرسال في واتساب لكل شخص.
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>الطفل</th><th>ولي الأمر</th><th>المتبقي</th><th>الهاتف</th><th>إرسال</th></tr></thead>
          <tbody>${rows.map(r=>`<tr>
            <td><strong>${esc(r.c.name||'—')}</strong></td>
            <td style="font-size:13px">${esc(r.c.parentName||'—')}</td>
            <td style="color:#ef4444;font-weight:700">${(r.s.price-r.s.paidAmount).toLocaleString()} ر.س</td>
            <td style="font-size:12px">${r.c.parentPhone||'—'}</td>
            <td>${r.url?`<a href="${r.url}" target="_blank" class="btn btn-wa btn-xs">💬 إرسال</a>`:'<span style="color:#94a3b8;font-size:12px">لا يوجد رقم</span>'}</td>
          </tr>`).join('')}
          </tbody>
        </table></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="App.closeModal()">إغلاق</button>
      </div>
    </div></div>`);
  },

  runPayroll(month){
    const emps=DB.hrEmployees().filter(e=>(e.status||'active')==='active'||(e.status||'active')==='on_leave');
    const bid=Auth.branchId();
    const list=bid?emps.filter(e=>e.branchId===bid):emps;
    const existing=new Set(DB.hrPayroll().filter(p=>p.month===month).map(p=>p.employeeId));
    const toAdd=list.filter(e=>!existing.has(e.id));
    if(toAdd.length===0){toast('ℹ️ المسير موجود لجميع الموظفين هذا الشهر');return;}
    // حساب الغياب من سجل الحضور
    const daysInMonth=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate();
    const workingDays=Math.round(daysInMonth*26/31); // تقريب 26 يوم عمل/شهر (م. العمل السعودي)
    const newRecords=toAdd.map(e=>{
      const absences=DB.hrAttendance().filter(a=>a.employeeId===e.id&&a.date.startsWith(month)&&a.status==='absent').length;
      const lateMinTotal=DB.hrAttendance().filter(a=>a.employeeId===e.id&&a.date.startsWith(month)&&a.status==='late').reduce((s,a)=>s+(+a.lateMinutes||0),0);
      const dailyRate=(+e.basicSalary||0)/workingDays;
      const absenceDeduction=Math.round(dailyRate*absences*100)/100;
      const lateDeduction=Math.round(lateMinTotal/(8*60)*dailyRate*100)/100;
      // خصم الإجازة المرضية: اليوم 31-90 خصم 25% من الراتب اليومي (نظام العمل السعودي)
      const yearStart=month.slice(0,4)+'-01-01';
      const yearEnd=month.slice(0,4)+'-12-31';
      const sickLeaves=DB.hrLeaves().filter(l=>l.employeeId===e.id&&l.type==='sick'&&l.status==='approved');
      const totalSickYTD=sickLeaves.filter(l=>l.startDate>=yearStart&&l.startDate<=yearEnd).reduce((s,l)=>s+(+l.days||0),0);
      const monthSickDays=sickLeaves.filter(l=>l.startDate.startsWith(month)).reduce((s,l)=>s+(+l.days||0),0);
      // حساب أيام في النطاق 75% (31-90) للشهر
      const prevSick=totalSickYTD-monthSickDays;
      let sick75Days=0;
      for(let i=0;i<monthSickDays;i++){const dayNum=prevSick+i+1;if(dayNum>=31&&dayNum<=90) sick75Days++;}
      const sickDeduction=Math.round(sick75Days*dailyRate*0.25*100)/100;
      const gosiDeduction=Math.round((+e.basicSalary||0)*(+e.gosiRate||9)/100*100)/100;
      const netSalary=(+e.basicSalary||0)+(+e.housingAllowance||0)+(+e.transportAllowance||0)+(+e.otherAllowances||0)-absenceDeduction-lateDeduction-sickDeduction-gosiDeduction;
      return {id:uid(),employeeId:e.id,month,basicSalary:+e.basicSalary||0,housingAllowance:+e.housingAllowance||0,transportAllowance:+e.transportAllowance||0,otherAllowances:+e.otherAllowances||0,gosiRate:+e.gosiRate||9,gosiDeduction,absenceDays:absences,absenceDeduction,lateDeduction,sickDeduction,sick75Days,loanDeduction:0,otherDeductions:0,bonus:0,netSalary,paymentStatus:'pending',paymentDate:'',notes:'',generatedAt:T0,generatedBy:Auth.user?.name||'—'};
    });
    const existing2=DB.hrPayroll();
    newRecords.forEach(r=>existing2.push(r));
    DB.save('hr_payroll',existing2);
    toast(`✅ تم إنشاء مسير ${newRecords.length} موظف لشهر ${month}`);
    App.go('hr',{hrTab:'payroll',hrMonth:month});
  },

async function doTenantLogin(){
  const username=document.getElementById('tl-user')?.value?.trim();
  const password=document.getElementById('tl-pass')?.value?.trim();
  const errEl=document.getElementById('tenant-login-err');
  const btn=document.getElementById('tl-btn');
  if(!username||!password){if(errEl){errEl.textContent='⚠️ أدخلي اسم المستخدم وكلمة المرور';errEl.style.display='flex';}return;}
  if(btn){btn.disabled=true;btn.textContent='...جاري الدخول';}
  try{
    const res=await tenantApiCall('/tenant/login',{method:'POST',body:JSON.stringify({username,password})});
    TenantSession.save({token:res.token,tenant:res.tenant});
    TenantSession.pendingCreds={username,password}; // لتأسيس أول مدير عام إن كانت مدرسة جديدة بلا بيانات بعد
    if(!res.active){

    }

    if(errEl){errEl.textContent='⚠️ اسم المستخدم أو كلمة المرور غير صحيحة';errEl.style.display='flex';}
  }finally{
    if(btn){btn.disabled=false;btn.textContent='تسجيل الدخول';}
  }
}

// ===== تشغيل التطبيق بعد نجاح دخول المدرسة =====
async function startAppForTenant(){
  API_TOKEN=TenantSession.token;
  document.getElementById('app').innerHTML=`<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;background:linear-gradient(150deg,#0f766e,#064e3b)"><img src="logo.png" style="width:90px;height:90px;object-fit:contain;margin-bottom:16px" onerror="this.style.display='none'"><p style="color:#fff;font-size:22px;font-weight:700">${esc(TenantSession.tenant?.name||'مدار')}</p><p style="color:rgba(255,255,255,.7);font-size:14px;margin-top:10px">⏳ جاري الاتصال بقاعدة البيانات...</p></div>`;
  try{
    await DB.initStorage();
  }catch(e){
    if(e.code==='subscription_inactive'){
      const t={...TenantSession.tenant,...(e.tenantInfo||{})};
      TenantSession.save({token:TenantSession.token,tenant:t});
      document.getElementById('app').innerHTML=Views.subscriptionStatus(t);
      return;
    }
    if(e.code==='unauthorized'){
      TenantSession.clear();
      document.getElementById('app').innerHTML=Views.platformGate('login');
      return;
    }
    console.error('[boot] تعذّر الاتصال بالخادم:',e);
    document.getElementById('app').innerHTML=Views.connectionError();
    return;
  }
  DB.init();
  TenantSession.pendingCreds=null; // استُهلكت إن لزم الأمر، لا نُبقي كلمة المرور صريحة في الذاكرة
  // إصلاحات تاريخية خاصة بمدرسة "مدارك/روافد" المُرحّلة فقط — لا تُطبَّق على مدرسة جديدة
  if(TenantSession.tenant?.id==='default'){
    (()=>{
      const fixes={
        'b1':{correct:'الفرع الأول - هارون الرشيد', old:['الفرع الرئيسي','الفرع الأول']},
        'b2':{correct:'الفرع الثاني - زامل بن سليم', old:['الفرع الثاني']},
      };
      const branches=DB.branches();
      let changed=false;
      branches.forEach(b=>{
        const fix=fixes[b.id];
        if(fix&&fix.old.includes(b.name)){b.name=fix.correct;changed=true;}
      });
      if(changed) DB.save('branches',branches);
    })();
    (()=>{
      try{
        const HLAT=24.6882151, HLNG=46.7946825; // هارون الرشيد
        const ZLAT=24.6941321, ZLNG=46.7871351; // زامل بن سليم
        const near=(a,v)=>Math.abs((+a||0)-v)<1e-6;
        const empty=(v)=>v==null||v===''||v===undefined;
        const branches=DB.branches();
        let changed=false;
        const b2=branches.find(x=>x.id==='b2'||(x.name||'').includes('زامل بن سليم'));
        if(b2&&near(b2.lat,HLAT)&&near(b2.lng,HLNG)){b2.lat=null;b2.lng=null;changed=true;}
        if(b2&&empty(b2.lat)){b2.lat=ZLAT;b2.lng=ZLNG;if(!b2.geoRadius)b2.geoRadius=150;changed=true;}
        const b1=branches.find(x=>x.id==='b1'||(x.name||'').includes('هارون الرشيد'));
        if(b1&&empty(b1.lat)){b1.lat=HLAT;b1.lng=HLNG;if(!b1.geoRadius)b1.geoRadius=150;changed=true;}
        if(changed) DB.save('branches',branches);
      }catch(e){}
    })();
  }
  Auth.init();
  if(!Auth.user){
    // مدرسة جديدة أُنشئ مديرها العام للتو — سجّلي دخوله تلقائياً دون خطوة إضافية
    const admin=DB.users().find(u=>u.role==='superadmin');
    if(admin) Auth.login(admin.username,admin.password);
  }
  App.render();
  _watchForNewBuild();
}

// ===== تحضير الموظفين الذاتي (باركود + GPS) =====
function _nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function _minsBetween(t1,t2){if(!t1||!t2)return 0;const[a,b]=t1.split(':').map(Number),[c,d]=t2.split(':').map(Number);return (c*60+d)-(a*60+b);}
function _fmtDur(min){min=Math.max(0,Math.round(+min||0));const h=Math.floor(min/60),m=min%60;return (h?h+'س ':'')+m+'د';}
// دقائق العمل الفعلية لسجل حضور (مخزّنة أو محسوبة من الدخول/الخروج)
function _recWorkedMin(a){if(!a)return 0;if(+a.workedMinutes>0)return +a.workedMinutes;if(a.checkIn&&a.checkOut)return Math.max(0,_minsBetween(a.checkIn,a.checkOut));return 0;}
// المسافة بالأمتار بين إحداثيتين (Haversine)
function _geoDistance(lat1,lng1,lat2,lng2){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLat=rad(lat2-lat1),dLng=rad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

  const pin=(document.getElementById('sc-pin')?.value||'').trim();
  const b=DB.branches().find(x=>x.id===bid);
  const emp=DB.hrEmployees().find(e=>e.id===empId);
  if(!emp){_scMsg('⚠️ اختر الموظف أولاً','err');return;}
  if(!emp.pin){_scMsg('⚠️ لا يوجد رمز سري لهذا الموظف — يضبطه المدير من ملف الموظف','err');return;}
  if(!pin){_scMsg('⚠️ أدخل الرمز السري','err');return;}
  if(String(emp.pin)!==pin){_scMsg('❌ الرمز السري غير صحيح','err');return;}
  if(!b||!b.lat||!b.lng){_scMsg('⚠️ لم يُحدَّد موقع الفرع — يضبطه المدير من إعدادات الفرع','err');return;}
  if(!navigator.geolocation||!window.isSecureContext){_scMsg('📍 خدمة الموقع غير متاحة. افتح الرابط عبر <b>https://kidsenses.today</b> واسمح بالوصول للموقع.','err');return;}
  _scMsg('📍 جارٍ تحديد موقعك...','info');
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const radius=+(b.geoRadius||150);
    const dist=_geoDistance(lat,lng,+b.lat,+b.lng);
    if(dist>radius){
      _scMsg(`❌ أنت خارج نطاق الفرع (تبعد ${dist} متر / المسموح ${radius} متر).<br>سجّل الحضور من داخل الفرع.`,'err');
      return;
    }
    _staffRecord(emp,kind,lat,lng,dist);
  },function(err){
    const msg=err.code===1?'❌ رفضت إذن الموقع. فعّل الموقع من إعدادات المتصفح ثم أعد المحاولة.':'❌ تعذّر تحديد موقعك. تأكد من تفعيل GPS.';
    _scMsg(msg,'err');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function _staffRecord(emp,kind,lat,lng,dist){
  const date=T0,now=_nowHM();
  const prev=DB.hrAttendance().find(a=>a.employeeId===emp.id&&a.date===date);
  const list=DB.hrAttendance().filter(a=>!(a.employeeId===emp.id&&a.date===date));
  if(kind==='in'){
    // بداية دوام اليوم من الجدول الأسبوعي (الدوام قد يختلف كل يوم)
    const wd=new Date().getDay(); // 0=الأحد
    const sch=(emp.schedule||[]).find(s=>s.day===wd);
    const isOff=sch?!!sch.off:false;
    const dutyStart=(sch&&!sch.off&&sch.start)?sch.start:(emp.dutyStart||'07:00');
    const grace=+(emp.graceMinutes??15);
    const lateBy=isOff?0:Math.max(0,_minsBetween(dutyStart,now)-grace);
    const status=lateBy>0?'late':'present';
    list.push({id:uid(),employeeId:emp.id,date,status,checkIn:now,checkOut:prev?.checkOut||'',lateMinutes:lateBy,dutyStart:isOff?'':dutyStart,via:'qr-gps',checkInLat:lat,checkInLng:lng,checkInDist:dist});
    DB.saveHrAttendance(list);
    _scMsg(`✅ تم تسجيل دخولك يا ${esc(emp.name)}<br>🕐 ${now} · 📍 داخل الفرع (${dist}م)${isOff?'<br>🏖️ اليوم إجازتك — سُجّل حضورك بدون احتساب تأخير':(lateBy>0?`<br>⏰ متأخر ${lateBy} دقيقة (دوامك ${dutyStart})`:' · في الوقت 👌')}`,'ok');
  } else {
    const wm=prev?.checkIn?Math.max(0,_minsBetween(prev.checkIn,now)):0;
    if(prev) list.push({...prev,checkOut:now,workedMinutes:wm,checkOutLat:lat,checkOutLng:lng});
    else list.push({id:uid(),employeeId:emp.id,date,status:'present',checkIn:'',checkOut:now,lateMinutes:0,workedMinutes:0,via:'qr-gps',checkOutLat:lat,checkOutLng:lng});
    DB.saveHrAttendance(list);
    const worked=prev?.checkIn?(_minsBetween(prev.checkIn,now)/60).toFixed(1):null;
    _scMsg(`✅ تم تسجيل خروجك يا ${esc(emp.name)}<br>🕐 ${now} · 📍 (${dist}م)${worked?`<br>⏳ ساعات العمل: ${worked} ساعة`:''}`,'ok');
  }
  const pinEl=document.getElementById('sc-pin');if(pinEl)pinEl.value='';
}

function getSubPrices(branchId){
  const cfg=DB.settings().prices||{};
  const defM=cfg.morning||{daily:150,weekly:600,monthly:1800};
  const defE=cfg.evening||{daily:70,weekly:300,monthly:900};
  const bp=branchId&&cfg.branches&&cfg.branches[branchId];
  return {morning:(bp&&bp.morning)||defM,evening:(bp&&bp.evening)||defE};
}

function calcEndDate(recalcEnd=true){
  const type=document.getElementById('sub-type')?.value;
  const start=document.getElementById('sub-start')?.value;
  const end=document.getElementById('sub-end');
  const period=document.getElementById('sub-period')?.value||'evening';
  const cdWrap=document.getElementById('sub-custom-days-wrap');
  if(cdWrap) cdWrap.style.display=type==='custom'?'block':'none';
  if(!type||!start||!end) return;
  const customDays=parseInt(document.getElementById('sub-custom-days')?.value||15);
  if(recalcEnd){
    if(type==='daily') end.value=start;
    else if(type==='weekly') end.value=addDays(start,7);
    else if(type==='monthly') end.value=addDays(start,30);
    else if(type==='custom') end.value=addDays(start,customDays);
  }
  const priceEl=document.getElementById('sub-price');
  const paidEl=document.getElementById('sub-paid');
  const baseLabel=document.getElementById('sub-base-label');
  const branchId=document.getElementById('sub-branch-id')?.value||'';
  const prices=getSubPrices(branchId)[period]||getSubPrices(branchId).evening;
  const base=type==='custom'?Math.ceil((prices.monthly||0)/30*customDays):prices[type]||0;
  const disc=parseFloat(document.getElementById('sub-disc')?.value||0);
  const final=disc>0?Math.round(base*(1-disc/100)):base;
  if(baseLabel) baseLabel.textContent=base+' ر.س';
  if(priceEl){priceEl.value=final;if(paidEl)paidEl.value=final;}
}

function calcChildSubPrice(recalcEnd=true){
  const type=document.getElementById('c-sub-type')?.value;
  const start=document.getElementById('c-sub-start')?.value;
  const period=document.getElementById('c-period')?.value||'evening';
  const endEl=document.getElementById('c-sub-end');
  const cdWrap=document.getElementById('c-custom-days-wrap');
  if(cdWrap) cdWrap.style.display=type==='custom'?'block':'none';
  const customDays=parseInt(document.getElementById('c-sub-custom-days')?.value||15);
  if(recalcEnd&&type&&start&&endEl){
    if(type==='daily') endEl.value=start;
    else if(type==='weekly') endEl.value=addDays(start,7);
    else if(type==='monthly') endEl.value=addDays(start,30);
    else if(type==='custom') endEl.value=addDays(start,customDays);
  }
  const priceEl=document.getElementById('c-sub-price');
  const paidEl=document.getElementById('c-sub-paid');
  const hintEl=document.getElementById('c-base-hint');
  if(priceEl&&type){
    const branchId=document.getElementById('c-branch')?.value||'';
    const prices=getSubPrices(branchId)[period]||getSubPrices(branchId).evening;
    const base=type==='custom'?Math.ceil((prices.monthly||0)/30*customDays):prices[type]||0;
    const disc=parseFloat(document.getElementById('c-disc')?.value||0);
    const final=disc>0?Math.round(base*(1-disc/100)):base;
    if(hintEl) hintEl.textContent=disc>0?`أصل: ${base} ر.س`:(type==='custom'?`${Math.ceil((prices.monthly||0)/30)} ر.س/يوم`:'');
    priceEl.value=final;
    if(paidEl) paidEl.value=final;
  }
}

function handleReceiptImg(input,hiddenId,previewId){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const h=document.getElementById(hiddenId);
    if(h) h.value=e.target.result;
    const p=document.getElementById(previewId);
    if(p){p.style.display='block';p.innerHTML=`<img src="${e.target.result}"><div style="font-size:11px;color:#10b981;margin-top:4px">✅ تم رفع الإيصال</div>`;}

  reader.readAsDataURL(file);
}

function handleGovDocFile(input,hiddenId,previewId){

// توليد اسم مستخدم لاتيني من الاسم العربي
const _AR2LAT={'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'z','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'h','ء':'','ئ':'y','ؤ':'w'};
function _slugFromArabic(name){
  const words=(name||'').trim().split(/\s+/).slice(0,2);
  let out=words.map(w=>w.split('').map(ch=>_AR2LAT[ch]!==undefined?_AR2LAT[ch]:(/[a-z0-9]/i.test(ch)?ch:'')).join('')).join('');
  out=out.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,18);
  return out||'staff';
}
function _uniqueUsername(base,exceptId){
  base=(base||'staff').toLowerCase();
  const taken=new Set(DB.users().filter(u=>u.id!==exceptId).map(u=>(u.username||'').toLowerCase()));
  if(!taken.has(base)) return base;
  let i=1;while(taken.has(base+i)) i++;
  return base+i;
}
function _hrSuggestUsername(){
  const u=document.getElementById('hr-username'),n=document.getElementById('hr-name');
  if(!u||!n||u.dataset.touched==='1') return;
  u.value=_uniqueUsername(_slugFromArabic(n.value),(document.getElementById('hr-id')?.value?DB.users().find(x=>x.employeeId===document.getElementById('hr-id').value)?.id:null));
}
function _hrToggleAcc(){
  const on=document.getElementById('hr-acc-enable')?.checked;
  const f=document.getElementById('hr-acc-fields');if(f)f.style.opacity=on?'1':'.45',f.style.pointerEvents=on?'auto':'none';

function saveHrEmployee(edit=false){

    graceMinutes:+(document.getElementById('hr-grace')?.value||15),

    gosiRate:+(document.getElementById('hr-gosi')?.value||9),
    phone:document.getElementById('hr-phone')?.value||'',
    bankAccount:document.getElementById('hr-bank')?.value||'',
    emergencyContact:document.getElementById('hr-ec')?.value||'',
    emergencyPhone:document.getElementById('hr-ep')?.value||'',
    status:document.getElementById('hr-status')?.value||'active',
    notes:document.getElementById('hr-notes')?.value||'',
    addedAt:edit?(DB.hrEmployees().find(e=>e.id===id)?.addedAt||T0):T0,
    userId:edit?(DB.hrEmployees().find(e=>e.id===id)?.userId||null):null,
  };
  // ===== حساب الدخول للنظام (ربط تلقائي موظف ↔ مستخدم) =====
  const accEnable=document.getElementById('hr-acc-enable')?.checked;
  if(accEnable){
    let username=(document.getElementById('hr-username')?.value||'').trim().toLowerCase();
    const password=(document.getElementById('hr-password')?.value||'123456').trim()||'123456';
    const accRole=document.getElementById('hr-acc-role')?.value||'teacher';
    const accPeriod=document.getElementById('hr-acc-period')?.value||'morning';
    const existingUser=DB.users().find(u=>u.id===obj.userId||u.employeeId===obj.id);
    if(!username) username=_uniqueUsername(_slugFromArabic(name),existingUser?.id);
    const dupe=DB.users().find(u=>(u.username||'').toLowerCase()===username&&u.id!==existingUser?.id);
    if(dupe){toast('اسم المستخدم «'+username+'» مستخدم مسبقاً — غيّريه','error');return;}
    const schoolId=DB.schools()[0]?.id||'s1';
    if(existingUser){
      DB.updateUser({...existingUser,name,username,password,role:accRole,schoolId,branchId:obj.branchId,period:accPeriod,phone:obj.phone,employeeId:obj.id});
      obj.userId=existingUser.id;
    } else {
      const nuid=uid();
      DB.addUser({id:nuid,name,username,password,role:accRole,schoolId,branchId:obj.branchId,period:accPeriod,phone:obj.phone,employeeId:obj.id});
      obj.userId=nuid;
    }
  }
  if(edit) DB.updateHrEmployee(obj); else DB.addHrEmployee(obj);
  DB.addAuditLog({action:edit?'تعديل موظف':'إضافة موظف',entity:'HR',entityId:obj.id,details:`${name} · ${jobTitle}${accEnable?' · حساب: '+(document.getElementById('hr-username')?.value||''):''}`,by:Auth.user?.name||'—'});
  toast('✅ '+(edit?'تم تحديث بيانات الموظف':'تمت إضافة الموظف')+(accEnable?' + حساب الدخول':''));
  App.closeModal();App.go('hr',{hrTab:'employees'});
}
function saveHrLeave(){
  const empId=document.getElementById('hl-emp')?.value;
  const type=document.getElementById('hl-type')?.value;
  const startDate=document.getElementById('hl-start')?.value;
  const endDate=document.getElementById('hl-end')?.value;
  const status=document.getElementById('hl-status')?.value||'approved';
  const reason=document.getElementById('hl-reason')?.value||'';
  if(!empId||!type||!startDate||!endDate){alert('يرجى تعبئة جميع الحقول المطلوبة');return;}
  if(endDate<startDate){alert('تاريخ الانتهاء يجب أن يكون بعد تاريخ البداية');return;}
  const days=diffDays(endDate,startDate)+1;
  DB.addHrLeave({id:uid(),employeeId:empId,type,startDate,endDate,days,reason,status,addedAt:T0,addedBy:Auth.user?.name||'—'});
  // تحديث حالة الموظف تلقائياً إن كانت إجازة موافق عليها تشمل اليوم

}

let _hrAttUndo=null;

  try{_hrAttUndo={label,at:(typeof _nowHM==='function'?_nowHM():''),data:JSON.parse(JSON.stringify(DB.hrAttendance()))};}catch(e){_hrAttUndo=null;}

// مسح كل حضور يوم معيّن (لتصحيح «تسجيل الكل حاضر» الخاطئ) — قابل للتراجع
function clearHrAttDay(date){
  if(!Auth.isSuperAdmin()){toast('حذف/مسح الحضور صلاحية المدير العام فقط','error');return;}
  const bid=Auth.branchId();
  const emps=DB.hrEmployees().filter(e=>e.status!=='deleted'&&(!bid||e.branchId===bid));
  const ids=new Set(emps.map(e=>e.id));
  const affected=DB.hrAttendance().filter(a=>a.date===date&&ids.has(a.employeeId));
  if(!affected.length){toast('لا يوجد حضور مسجّل لهذا اليوم','warn');return;}
  if(!confirm(`مسح حضور ${affected.length} موظف ليوم ${formatDate(date)}؟\nيمكنك التراجع مباشرة بعدها.`)) return;
  _snapHrAtt('مسح حضور '+formatDate(date));
  DB.saveHrAttendance(DB.hrAttendance().filter(a=>!(a.date===date&&ids.has(a.employeeId))));
  toast('🗑️ تم مسح حضور اليوم — اضغط «تراجع» للاستعادة');App.refresh();
}
function setHrAtt(empId,date,status){
  if(!status&&!Auth.isSuperAdmin()){toast('مسح سجل الحضور صلاحية المدير العام فقط','error');return;}
  _snapHrAtt('تغيير حالة موظف');
  // حافظ على أوقات الدخول/الخروج (باركود+GPS) عند التعديل اليدوي للحالة
  const prev=DB.hrAttendance().find(a=>a.employeeId===empId&&a.date===date)||{};
  const list=DB.hrAttendance().filter(a=>!(a.employeeId===empId&&a.date===date));
  const keep=(status==='absent'||status==='leave')?{}:{checkIn:prev.checkIn||'',checkOut:prev.checkOut||'',via:prev.via,checkInDist:prev.checkInDist};
  list.push({id:uid(),employeeId:empId,date,status,lateMinutes:prev.lateMinutes||0,...keep});
  DB.saveHrAttendance(list);App.refresh();
}
function markAllHrPresent(date){
  const bid=Auth.branchId();
  let emps=DB.hrEmployees().filter(e=>(e.status||'active')==='active'||(e.status||'active')==='on_leave');
  if(bid) emps=emps.filter(e=>e.branchId===bid);
  if(!confirm(`تسجيل ${emps.length} موظف كحاضرين ليوم ${formatDate(date)}؟\nيمكنك التراجع بزر «تراجع» إن كان بالخطأ.`)) return;

  const type=document.getElementById('lr-type')?.value;

  const reason=(document.getElementById('lr-reason')?.value||'').trim();
  if(!type||!startDate){toast('عبّي النوع والتاريخ','error');return;}
  // استئذان خلال اليوم (بالساعات)
  if(type==='permission'){

    if(!fromTime||!toTime){toast('حددي وقت الاستئذان','error');return;}
    if(toTime<=fromTime){toast('وقت النهاية بعد البداية','error');return;}
    DB.addHrLeave({id:uid(),employeeId:emp.id,type:'permission',startDate,endDate:startDate,days:0,fromTime,toTime,reason,status:'pending',attachment:_hlAttach||null,addedAt:T0,addedBy:me.name,requestedByTeacher:true});

  if(endDate<startDate){toast('تاريخ الانتهاء قبل البداية','error');return;}
  const days=diffDays(endDate,startDate)+1;
  DB.addHrLeave({id:uid(),employeeId:emp.id,type,startDate,endDate,days,reason,status:'pending',attachment:_hlAttach||null,addedAt:T0,addedBy:me.name,requestedByTeacher:true});

    discountPct:parseFloat(document.getElementById('c-disc')?.value||0),

    }

  if(App.view==='children') App.refresh(); else App.go('children');

function savePay(){
  const subId=document.getElementById('pay-sub')?.value;
  const amount=parseFloat(document.getElementById('pay-amount')?.value||0);
  const status=document.getElementById('pay-status')?.value;
  const paymentMethod=document.getElementById('pay-method')?.value||'cash';
  const note=document.getElementById('pay-note')?.value?.trim()||'';
  const orig=DB.subscriptions().find(s=>s.id===subId);
  if(!orig||amount<=0){alert('يرجى إدخال مبلغ صحيح');return}
  // استنسخ لتجنب التأثير على المرجع المخزّن في _mem قبل الحفظ
  const sub={...orig};
  sub.paidAmount=Math.min(sub.price,sub.paidAmount+amount);
  sub.paymentStatus=sub.paidAmount>=sub.price?'paid':status;
  DB.updateSub(sub);
  DB.addPayment({id:uid(),subId,childId:sub.childId,invoiceNo:sub.invoiceNo||'',amount,paymentMethod,note,addedBy:Auth.user?.name||'—',date:T0});
  DB.addAuditLog({action:'دفعة مُسجَّلة',entity:'اشتراك',entityId:subId,details:`${amount} ر.س للفاتورة ${sub.invoiceNo||subId} — طريقة: ${paymentMethod}${note?' — '+note:''}`,by:Auth.user?.name||'—'});
  toast('✅ تم تسجيل الدفعة');
  App.closeModal();
  App.refresh();
}

function saveSettingsPrices(){
  if(!Auth.isSuperAdmin()) return;
  const s=DB.settings();
  const branches=DB.branches();
  if(!s.prices) s.prices={};
  if(!s.prices.branches) s.prices.branches={};
  branches.forEach(b=>{
    s.prices.branches[b.id]={
      morning:{
        daily:+(document.getElementById(`p-${b.id}-m-daily`)?.value||150),
        weekly:+(document.getElementById(`p-${b.id}-m-weekly`)?.value||600),
        monthly:+(document.getElementById(`p-${b.id}-m-monthly`)?.value||1800),
      },
      evening:{
        daily:+(document.getElementById(`p-${b.id}-e-daily`)?.value||70),
        weekly:+(document.getElementById(`p-${b.id}-e-weekly`)?.value||300),
        monthly:+(document.getElementById(`p-${b.id}-e-monthly`)?.value||900),
      },
    };
  });
  // also keep global defaults from first branch as fallback
  if(branches.length>0){
    const fb=s.prices.branches[branches[0].id];
    s.prices.morning=fb.morning;
    s.prices.evening=fb.evening;
  }
  DB.saveSettings(s);
  _lastWrite=Date.now(); // تأكيد منع المستمع من الكتابة فوق الإعدادات المحفوظة
  showSettingsToast('✅ تم حفظ أسعار الفروع بنجاح');
}

    <p>ولي الأمر: ${esc(c.parentName||'—')} &nbsp;|&nbsp; ${esc(c.parentPhone||'')} &nbsp;|&nbsp; انضم: ${formatDate(c.joinDate)}</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val">${totalCharged.toLocaleString()}</div><div class="stat-lbl">إجمالي المستحق (ر.س)</div></div>
    <div class="stat"><div class="stat-val" style="color:#10b981">${totalPaid.toLocaleString()}</div><div class="stat-lbl">إجمالي المدفوع (ر.س)</div></div>
    <div class="stat"><div class="stat-val" style="color:${balance>0?'#ef4444':'#10b981'}">${balance.toLocaleString()}</div><div class="stat-lbl">${balance>0?'المتبقي':'رصيد دائن'} (ر.س)</div></div>

      <td style="font-weight:700">${s.price} ر.س</td>
      <td style="color:#10b981;font-weight:600">${s.paidAmount} ر.س</td>
      <td style="color:${rem>0?'#ef4444':'#10b981'};font-weight:600">${rem} ر.س</td>
      <td><span class="badge ${stateClass[ps]||'y'}">${stateLabel[ps]||ps}</span></td>

    <h3>💰 سجل الدفعات (${payments.length} دفعة)</h3>

function printBranchReport(fMonth, fBranch){
  const branches=DB.branches();
  const subs=DB.subscriptions();
  const exps=DB.expenses();
  const children=DB.children();
  const school=DB.schools()[0]||{};
  const targetBranches=fBranch==='all'?branches:branches.filter(b=>b.id===fBranch);
  const pmLbl={cash:'كاش',mada:'مدى',transfer:'حوالة'};
  const typeLbl={daily:'يومي',weekly:'أسبوعي',monthly:'٣٠ يوم',custom:'مخصص'};
  const stateLabel={paid:'مدفوع',defaulter:'متعثر',pending:'معلّق',deferred:'مؤجل'};
  const stateClass={paid:'g',defaulter:'r',pending:'y',deferred:'y'};
  const totalRev=targetBranches.reduce((a,b)=>a+subs.filter(s=>s.branchId===b.id&&(s.createdAt||s.startDate||'').startsWith(fMonth)).reduce((x,s)=>x+(+s.paidAmount||0),0),0);
  const totalExp=targetBranches.reduce((a,b)=>a+exps.filter(e=>e.branchId===b.id&&(e.date||'').startsWith(fMonth)).reduce((x,e)=>x+(+e.amount||0),0),0);
  const html=`
  <div class="header">
    <h1>📊 تقرير الفروع الشهري — ${fMonth}</h1>
    <p>${esc(school.name||'مدارك الطفل')} &nbsp;|&nbsp; ${fBranch==='all'?'جميع الفروع':branches.find(b=>b.id===fBranch)?.name||''}</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" style="color:#10b981">${totalRev.toLocaleString()}</div><div class="stat-lbl">إجمالي المحصّل (ر.س)</div></div>
    <div class="stat"><div class="stat-val" style="color:#ef4444">${totalExp.toLocaleString()}</div><div class="stat-lbl">إجمالي المصروفات (ر.س)</div></div>
    <div class="stat"><div class="stat-val" style="color:${(totalRev-totalExp)>=0?'#1d4ed8':'#ef4444'}">${(totalRev-totalExp).toLocaleString()}</div><div class="stat-lbl">${(totalRev-totalExp)>=0?'صافي الربح':'الخسارة'} (ر.س)</div></div>
  </div>
  ${targetBranches.map(b=>{
    const bSubs=subs.filter(s=>s.branchId===b.id&&(s.createdAt||s.startDate||'').startsWith(fMonth));
    const bExps=exps.filter(e=>e.branchId===b.id&&(e.date||'').startsWith(fMonth));
    const bAllSubs=subs.filter(s=>s.branchId===b.id);
    const rev=bSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);
    const exp=bExps.reduce((a,e)=>a+(+e.amount||0),0);
    const net=rev-exp;
    const defaulters=bAllSubs.filter(s=>Views._paymentState(s)==='defaulter');
    const pending=bAllSubs.filter(s=>Views._paymentState(s)==='pending');
    const activeIds=[...new Set(bAllSubs.filter(s=>s.isActive&&s.endDate>=T0).map(s=>s.childId))];
    const byPM={};bSubs.forEach(s=>{byPM[s.paymentMethod]=(byPM[s.paymentMethod]||0)+(+s.paidAmount||0);});
    return `<div class="section">
      <h2>🏢 ${esc(b.name)}</h2>
      <div class="stats">
        <div class="stat"><div class="stat-val" style="color:#10b981">${rev.toLocaleString()}</div><div class="stat-lbl">المحصّل (ر.س)</div></div>
        <div class="stat"><div class="stat-val" style="color:#ef4444">${exp.toLocaleString()}</div><div class="stat-lbl">المصروفات (ر.س)</div></div>
        <div class="stat"><div class="stat-val" style="color:${net>=0?'#1d4ed8':'#ef4444'}">${net.toLocaleString()}</div><div class="stat-lbl">${net>=0?'الربح':'الخسارة'} (ر.س)</div></div>
        <div class="stat"><div class="stat-val">${activeIds.length}</div><div class="stat-lbl">نشطون</div></div>
        <div class="stat"><div class="stat-val" style="color:#ef4444">${defaulters.length}</div><div class="stat-lbl">متعثرون</div></div>
        <div class="stat"><div class="stat-val" style="color:#f59e0b">${pending.length}</div><div class="stat-lbl">معلّقون</div></div>
      </div>
      <p style="font-size:11px;color:#64748b;margin-bottom:8px">
        الفواتير: ${bSubs.length} &nbsp;|&nbsp; ${Object.entries(byPM).map(([pm,amt])=>`${pmLbl[pm]||pm}: ${amt.toLocaleString()} ر.س`).join(' | ')||'لا توجد اشتراكات هذا الشهر'}
      </p>
      ${bSubs.length?`<table><thead><tr><th>الطفل</th><th>النوع</th><th>المبلغ</th><th>المدفوع</th><th>طريقة الدفع</th><th>الحالة</th></tr></thead>
      <tbody>${bSubs.slice(0,25).map(s=>{const c=children.find(x=>x.id===s.childId);const ps=Views._paymentState(s);return `<tr>
        <td><strong>${esc(c?.name||'—')}</strong></td>
        <td>${typeLbl[s.type]||s.type}</td>
        <td>${s.price} ر.س</td>
        <td style="color:#10b981">${s.paidAmount} ر.س</td>
        <td>${pmLbl[s.paymentMethod]||'—'}</td>
        <td><span class="badge ${stateClass[ps]||'y'}">${stateLabel[ps]||ps}</span></td>
      </tr>`;}).join('')}
      ${bSubs.length>25?`<tr><td colspan="6" style="text-align:center;color:#94a3b8;font-size:11px">... و${bSubs.length-25} فاتورة أخرى</td></tr>`:''}
      </tbody></table>`:''}
    </div>`;
  }).join('')}`;
  generateReportWindow(html, `تقرير الفروع — ${fMonth}`);
}

function toggleSaleItem(){

function fillSaleParent(){
  const childId=document.getElementById('sale-child')?.value;
  const el=document.getElementById('sale-parent-name');
  if(!childId||!el) return;
  const child=DB.children().find(c=>c.id===childId);
  if(child) el.value=child.parentName||'';
}
function saveSale(){
  const itemType=document.getElementById('sale-item-type')?.value;
  const itemName=document.getElementById('sale-item-name')?.value?.trim()||'';
  const childId=document.getElementById('sale-child')?.value||'';
  const parentName=document.getElementById('sale-parent-name')?.value?.trim()||'';
  const price=parseFloat(document.getElementById('sale-price')?.value||0);
  const paymentMethod=document.getElementById('sale-pm')?.value||'cash';
  const notes=document.getElementById('sale-notes')?.value?.trim()||'';
  if(itemType==='other'&&!itemName){alert('يرجى إدخال اسم المنتج');return;}
  if(!price||price<=0){alert('يرجى إدخال السعر');return;}
  const child=DB.children().find(c=>c.id===childId);
  const schoolId=child?.schoolId||Auth.schoolId()||DB.schools()[0]?.id||'';
  const branchId=child?.branchId||Auth.branchId()||'';
  DB.addSale({id:uid(),date:T0,childId:childId||null,parentName:parentName||child?.parentName||'',itemType,itemName:itemType==='other'?itemName:'',price,paymentMethod,notes,schoolId,branchId,createdAt:new Date().toISOString(),addedBy:Auth.user?.name||''});
  toast('✅ تم تسجيل البيع');
  App.closeModal();
  if(App.view==='sales') App.refresh(); else App.go('sales');
}
function deleteSale(id){
  if(!confirm('هل تريد حذف هذه المبيعة؟')) return;
  DB.deleteSale(id);
  toast('✅ تم الحذف');
  App.refresh();
}

  el.style.display='block';

function saveExpense(isEdit){
  if(!Auth.isSuperAdmin()){toast('صلاحية المدير العام فقط','error');return;}
  const date=document.getElementById('exp-date')?.value;
  const amount=parseFloat(document.getElementById('exp-amount')?.value||0);
  const category=document.getElementById('exp-cat')?.value;
  const description=document.getElementById('exp-desc')?.value?.trim()||'';
  const branchId=document.getElementById('exp-branch')?.value||'';
  const paymentMethod=document.getElementById('exp-pm')?.value||'cash';
  if(!date||!amount||amount<=0){alert('التاريخ والمبلغ مطلوبان');return;}
  if(isEdit){
    const id=document.getElementById('exp-id')?.value;
    const orig=DB.expenses().find(x=>x.id===id);
    if(!orig){toast('المصروف غير موجود','error');App.closeModal();return;}
    DB.updateExpense({...orig,date,amount,category,description,branchId,paymentMethod});
  } else {
    DB.addExpense({id:uid(),date,amount,category,description,branchId,paymentMethod,addedBy:Auth.user?.name||'',createdAt:new Date().toISOString()});
  }
  DB.addAuditLog({action:isEdit?'تعديل مصروف':'إضافة مصروف',entity:'مصروف',entityId:date,details:`${amount} ر.س — ${category} — ${description||'—'}`,by:Auth.user?.name||'—'});
  toast(isEdit?'✅ تم حفظ التعديلات':'✅ تم تسجيل المصروف');
  App.closeModal();
  if(App.view==='expenses') App.refresh(); else App.go('expenses');
}

function deleteExpense(id){
  if(!Auth.isSuperAdmin()) return;
  if(!confirm('هل تريد حذف هذا المصروف؟')) return;
  const exp=DB.expenses().find(e=>e.id===id);
  DB.addAuditLog({action:'حذف مصروف',entity:'مصروف',entityId:id,details:exp?`${exp.amount} ر.س — ${exp.category}`:id,by:Auth.user?.name||'—'});
  DB.deleteExpense(id);
  toast('✅ تم الحذف');
  App.refresh();
}

// Toast عالمي يظهر في أي صفحة بعد الحفظ
function toast(msg,kind='success'){
  let el=document.getElementById('global-toast');
  if(!el){
    el=document.createElement('div');
    el.id='global-toast';
    el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .3s;opacity:0';
    document.body.appendChild(el);
  }
  el.style.background=kind==='error'?'#fee2e2':kind==='warn'?'#fef3c7':'#dcfce7';
  el.style.color=kind==='error'?'#991b1b':kind==='warn'?'#92400e':'#166534';
  el.style.border='1px solid '+(kind==='error'?'#fecaca':kind==='warn'?'#fde68a':'#bbf7d0');
  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.style.opacity='0';},2500);
}

function confirmReset(){
  if(!Auth.isSuperAdmin()) return;
  const word=prompt('⚠️ تحذير خطير!\n\nهذا سيحذف جميع بيانات الأطفال والاشتراكات والحضور.\nلا يمكن التراجع عن هذا الإجراء.\n\nللتأكيد، اكتب كلمة: حذف');
  if(word!=='حذف'){alert('تم الإلغاء');return;}
  ['children','subscriptions','attendance','notifications'].forEach(k=>DB.save(k,[]));
  showSettingsToast('🗑️ تمت إعادة التعيين — جميع البيانات حُذفت');
  App.go('dashboard');

function previewImport(input){
  const file = input.files[0];
  if(!file) return;
  const isCSV = file.name.toLowerCase().endsWith('.csv');
  const reader = new FileReader();
  reader.onload = function(e){
    let rows = [];
    try{
      if(isCSV){
        rows = _parseCSV(e.target.result);
      } else {
        if(typeof XLSX === 'undefined'){
          document.getElementById('import-preview').innerHTML='<div class="alert-box alert-red">⚠️ مكتبة Excel غير محملة، استخدم ملف CSV بدلاً</div>';
          return;
        }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      }
      _showImportPreview(rows);
    } catch(err){
      document.getElementById('import-preview').innerHTML=`<div class="alert-box alert-red">⚠️ خطأ في قراءة الملف: ${err.message}</div>`;
    }
  };
  if(isCSV) reader.readAsText(file, 'UTF-8');
  else reader.readAsArrayBuffer(file);
}

function _parseCSV(text){
  return text.split('\n').filter(l=>l.trim()).map(line=>{
    const row=[]; let q=false, cell='';
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){q=!q;}
      else if(ch===','&&!q){row.push(cell.trim());cell='';}
      else cell+=ch;
    }
    row.push(cell.trim());
    return row;
  });
}

function uploadLogo(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      // إزالة الخلفية السوداء
      const data=ctx.getImageData(0,0,canvas.width,canvas.height);
      const px=data.data;
      for(let i=0;i<px.length;i+=4){
        const r=px[i],g=px[i+1],b=px[i+2];
        if(r<30&&g<30&&b<30) px[i+3]=0;
      }
      ctx.putImageData(data,0,0);
      const b64=canvas.toDataURL('image/png');
      localStorage.setItem('ccs_logo',b64);
      App.render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// تنظيف الاشتراكات المكررة — يطابق على هوية الاشتراك الأساسية (الطفل/التاريخ/النوع/المبلغ)
// ويُبقي النسخة الأكثر دفعاً ويحذف الباقي. غالباً ناتجة عن ضغط الحفظ مرتين.
function cleanDuplicateSubs(){
  if(!Auth.isSuperAdmin()){alert('هذه الأداة للمدير العام فقط');return}
  const subs=DB.subscriptions();
  const children=DB.children();
  const groups=new Map();
  subs.forEach(s=>{
    const sig=[s.childId,s.startDate,s.endDate,s.type,s.price].join('|');
    if(!groups.has(sig)) groups.set(sig,[]);
    groups.get(sig).push(s);
  });
  const toRemove=[];
  groups.forEach(arr=>{
    if(arr.length<2) return;
    // أبقِ النسخة الأكثر دفعاً (حفاظاً على أي دفعة مسجّلة) واحذف الباقي
    arr.sort((a,b)=>(b.paidAmount||0)-(a.paidAmount||0));
    toRemove.push(...arr.slice(1));
  });
  if(!toRemove.length){alert('✅ لا توجد اشتراكات مكررة');return}
  const names=toRemove.map(s=>children.find(c=>c.id===s.childId)?.name||'؟');
  const summary=[...new Set(names)].map(n=>`• ${n}`).join('\n');
  if(!confirm(`وُجد ${toRemove.length} اشتراك مكرر للأطفال التالية:\n\n${summary}\n\nسيتم حذف النسخ الزائدة فقط (إبقاء نسخة واحدة من كل اشتراك). متابعة؟`)) return;
  const removeIds=new Set(toRemove.map(s=>s.id));
  DB.save('subscriptions',subs.filter(s=>!removeIds.has(s.id)));
  DB.addAuditLog({action:'تنظيف مكررات',entity:'اشتراك',details:`حذف ${toRemove.length} اشتراك مكرر`,by:Auth.user?.name||'—'});
  toast(`✅ تم حذف ${toRemove.length} اشتراك مكرر`);
  App.refresh();
}

  if(!c){toast('الطفل غير موجود','error');return;}
  if(c.branchId===toBranch){toast('الطفل موجود في هذا الفرع أصلاً','error');return;}
  const fromBranch=DB.branches().find(b=>b.id===c.branchId);
  const toBranchObj=DB.branches().find(b=>b.id===toBranch);
  const subs=DB.subscriptions();
  const activeSubs=subs.filter(s=>s.childId===id&&s.isActive&&s.endDate>=T0);
  const paidSum=activeSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);
  // confirm
  const confirmMsg=`نقل "${c.name}" من ${fromBranch?.name||'—'} إلى ${toBranchObj?.name||'—'}\n\n`
    +(activeSubs.length?(mode==='with-fees'?`✅ مع نقل الرسوم — يبقى الاشتراك ساري المفعول (${paidSum.toLocaleString()} ر.س مدفوع)`:`🆕 بدون رسوم — سيتم إلغاء الاشتراك الحالي والمبلغ المدفوع يصبح للفرع القديم`):'');
  if(!confirm(confirmMsg+'\n\nهل تريد المتابعة؟')) return;

  // 1) Update child
  const idx=children.findIndex(x=>x.id===id);
  children[idx]={...c,branchId:toBranch};
  // إذا الفرع الجديد فيه معلمات، نُعيد تعيين المعلمة (لأنها مربوطة بالفرع القديم)
  const newBranchTeachers=DB.users().filter(u=>u.role==='teacher'&&u.branchId===toBranch);
  if(c.teacherId&&!newBranchTeachers.find(t=>t.id===c.teacherId)){
    children[idx].teacherId='';
  }
  DB.save('children',children);

  // 2) Update subscriptions according to mode
  let movedSubs=0,cancelledSubs=0;
  if(activeSubs.length){
    if(mode==='with-fees'){
      const updated=subs.map(s=>{
        if(s.childId===id&&s.isActive&&s.endDate>=T0){
          movedSubs++;
          return {...s,branchId:toBranch};
        }
        return s;
      });
      DB.save('subscriptions',updated);
    } else {
      const updated=subs.map(s=>{
        if(s.childId===id&&s.isActive&&s.endDate>=T0){
          cancelledSubs++;
          return {...s,isActive:false,cancelledAt:new Date().toISOString(),cancelReason:'نقل بدون رسوم — اشتراك مُلغى'};
        }
        return s;
      });
      DB.save('subscriptions',updated);
    }
  }

  // 3) Audit log
  const details=`نقل الطفل "${c.name}" من ${fromBranch?.name||'—'} إلى ${toBranchObj?.name||'—'} | الوضع: ${mode==='with-fees'?'مع نقل الرسوم':'بدون رسوم'}${activeSubs.length?` | اشتراكات: ${mode==='with-fees'?'نُقل '+movedSubs:'أُلغي '+cancelledSubs}`:''}${reason?` | السبب: ${reason}`:''}`;
  DB.addAuditLog({action:'نقل طفل',entity:'طفل',entityId:id,details,by:Auth.user?.name||'—'});

  // 4) Notification for new branch
  if(Auth.user){
    DB.addNotification({type:'new_child',title:'🔄 طفل مُنقول إليكم',body:`${c.name} نُقل من ${fromBranch?.name||'—'} — ${mode==='with-fees'?'مع نقل الرسوم':'بدون رسوم (يبدأ من جديد)'}`,branchId:toBranch,period:c.period,addedBy:Auth.user.name,addedById:Auth.user.id});
  }

  App.closeModal();
  toast(`✅ تم نقل "${c.name}" إلى ${toBranchObj?.name||''}`);
  App.refresh();
}

// Attendance
const pendingAtt={};
function setAtt(childId,status,date,schoolId){
  if(!pendingAtt[date]) pendingAtt[date]={};
  pendingAtt[date][childId]={childId,status,date,schoolId,checkIn:'07:30',checkOut:'14:00',takenBy:Auth.user.id,notes:''};
  // Update UI immediately
  const card=document.getElementById('att-'+childId);
  if(card){
    card.className='attendance-card '+status;
    card.querySelectorAll('button').forEach((b,i)=>{
      const statuses=['present','absent','late'];
      b.className=`btn btn-xs ${status===statuses[i]?['btn-success','btn-danger','btn-warning'][i]:''}`;
    });
  }
}

function saveAttendance(date,schoolId){
  const att=DB.attendance();
  const entries=pendingAtt[date]||{};
  const list=Object.values(entries);
  if(!list.length){toast('لم يتم تعديل أي حضور','warn');return;}
  // فهرسة لمرة واحدة بدل بحث خطي لكل إدخال (كان O(عدد الإدخالات × حجم السجل))
  const idxByKey=new Map();           // childId|date → موضع السجل
  const childrenWithAtt=new Set();    // أطفال لهم أي حضور سابق (لكشف «أول حضور»)
  att.forEach((a,i)=>{idxByKey.set(a.childId+'|'+a.date,i);childrenWithAtt.add(a.childId);});
  const firstAttIds=[];
  list.forEach(entry=>{
    const hadPrev=childrenWithAtt.has(entry.childId);
    const key=entry.childId+'|'+date;
    const idx=idxByKey.get(key);
    if(idx!==undefined) att[idx]={...att[idx],...entry};
    else{att.push({id:uid(),...entry});idxByKey.set(key,att.length-1);childrenWithAtt.add(entry.childId);}
    if(!hadPrev&&entry.status==='present'&&Auth.user) firstAttIds.push(entry.childId);
  });
  DB.saveAttendance(att);
  // إشعارات «أول حضور» تُحفظ دفعة واحدة (بدل حفظ كامل للإشعارات لكل طفل)
  if(firstAttIds.length&&Auth.user){
    const kidsById=new Map(DB.children().map(c=>[c.id,c]));
    const notifs=firstAttIds.map(cid=>kidsById.get(cid)).filter(Boolean).map(child=>({type:'first_att',title:'🌟 أول حضور',body:`${child.name} حضر لأول مرة`,branchId:child.branchId,period:child.period,addedBy:Auth.user.name,addedById:Auth.user.id}));
    DB.addNotificationsBatch(notifs);
  }
  delete pendingAtt[date]; // امسح الذاكرة المعلّقة
  toast('✅ تم حفظ الحضور بنجاح');
}

// تعليم جميع الأطفال المعروضين كحاضرين (الحضور الجماعي)
function markAllPresent(date,schoolId,gridId){

// إرسال رسالة داخلية
let _msgAttachment=null;
function handleMsgAttachment(input){
  const file=input.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){toast('حجم الملف يجب أن لا يتجاوز 5 ميجابايت','error');input.value='';return;}
  const reader=new FileReader();
  reader.onload=function(ev){
    _msgAttachment={name:file.name,data:ev.target.result,size:Math.round(file.size/1024)+'KB'};
    const nm=document.getElementById('msg-att-name');
    const cl=document.getElementById('msg-att-clear');
    if(nm) nm.textContent='📄 '+file.name;
    if(cl) cl.style.display='inline';
    toast('✅ تم رفع الملف — اضغط إرسال');
  };
  reader.readAsDataURL(file);
}
function clearMsgAttachment(){
  _msgAttachment=null;
  const inp=document.getElementById('msg-attachment');
  if(inp) inp.value='';
  const nm=document.getElementById('msg-att-name');
  const cl=document.getElementById('msg-att-clear');
  if(nm) nm.textContent='';
  if(cl) cl.style.display='none';
}
function sendInternalMessage(threadKey){
  const me=Auth.user;
  if(!me) return;
  const text=document.getElementById('msg-input')?.value?.trim();
  if(!text&&!_msgAttachment){toast('اكتب رسالة أو أرفق ملفاً','error');return;}
  if(!threadKey){toast('اختر محادثة أولاً','error');return;}
  // توافقية: قيمة قديمة (معرّف فرع فقط)
  if(!String(threadKey).includes(':')) threadKey='b:'+threadKey;
  let msg,toLabel='';
  if(threadKey.startsWith('t:')){
    const tid=threadKey.slice(2);
    const teacher=DB.users().find(u=>u.id===tid);
    toLabel=me.role==='teacher'?'الإدارة':('المعلمة '+(teacher?.name||''));
    msg={
      fromUserId:me.id,fromName:me.name,fromRole:me.role,fromBranchId:me.branchId||teacher?.branchId||null,
      toUserId:tid,toRole:'teacher',toBranchId:teacher?.branchId||null,
      tThread:tid,message:text||'',
    };
  } else {
    const bid=threadKey.replace(/^b:/,'');
    if(Auth.isSuperAdmin()){
      const branchAdmin=DB.users().find(u=>u.role==='school_admin'&&u.branchId===bid);
      toLabel=DB.branchName(bid);
      msg={fromUserId:me.id,fromName:me.name,fromRole:'superadmin',fromBranchId:null,toUserId:branchAdmin?.id||null,toRole:'school_admin',toBranchId:bid,message:text||''};
    } else {
      toLabel='المدير العام';
      msg={fromUserId:me.id,fromName:me.name,fromRole:'school_admin',fromBranchId:me.branchId,toUserId:'all_superadmins',toRole:'superadmin',toBranchId:null,message:text||''};
    }
  }
  msg.fromId=me.id;
  if(_msgAttachment) msg.attachment=_msgAttachment;
  DB.addInternalMessage(msg);
  DB.addAuditLog({action:'رسالة داخلية',entity:'رسائل',entityId:msg.fromUserId,details:`من ${me.name} إلى ${toLabel}: ${(text||'').slice(0,80)}${(text||'').length>80?'...':''}${_msgAttachment?' [مع مرفق]':''}`,by:me.name});
  const inp=document.getElementById('msg-input');
  if(inp) inp.value='';
  clearMsgAttachment();
  toast('✅ تم إرسال الرسالة');
  App.refresh();
  // إبقاء المؤشر في حقل الكتابة لمتابعة المحادثة بسلاسة + التمرير لأسفل
  setTimeout(()=>{const i=document.getElementById('msg-input');if(i)i.focus();const ml=document.getElementById('msg-list');if(ml)ml.scrollTop=ml.scrollHeight;},60);
}

  const children=DB.children().filter(c=>(!sid||c.schoolId===sid)&&(!bid||c.branchId===bid));

  const tpl=DB.settings().waTemplate||'السلام عليكم {parentName}، نُذكّركم بأن اشتراك طفلكم {name} سينتهي بتاريخ {date}. يرجى التواصل للتجديد. شكراً.';

  for(const s of expiring){
    const c=children.find(x=>x.id===s.childId);
    if(!c?.parentPhone) continue;
    const msg=tpl.replace(/{parentName}/g,c.parentName||'').replace(/{name}/g,c.name||'').replace(/{date}/g,formatDate(s.endDate)).replace(/{remaining}/g,(s.price-s.paidAmount).toString());
    const phone=c.parentPhone.replace(/^\+?/,'').replace(/^0/,'966');
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
    count++;
  }
  toast(`✅ تم فتح ${count} رسالة واتساب لتذكيرات التجديد`);
}

function formatRelTime(iso){
  if(!iso) return '';
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000),h=Math.floor(diff/3600000),d=Math.floor(diff/86400000);
  if(m<1) return 'الآن';
  if(m<60) return `منذ ${m} دقيقة`;
  if(h<24) return `منذ ${h} ساعة`;
  if(d<7) return `منذ ${d} يوم`;
  return formatDate(_ymd(new Date(iso))); // تاريخ محلي (ميلادي) بدل UTC
}

function toHijri(date){
  const d=date instanceof Date?date:new Date(date||Date.now());
  if(isNaN(d.getTime())) return '';
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const jd=Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)
           +Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)
           -Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)+day-32075;
  const l=jd-1948440+10632,n=Math.floor((l-1)/10631),l2=l-10631*n+354;
  const j=(Math.floor((10985-l2)/5316))*(Math.floor((50*l2)/17719))+(Math.floor(l2/5670))*(Math.floor((43*l2)/15238));
  const l3=l2-(Math.floor((30-j)/15))*(Math.floor((17719*j)/50))-(Math.floor(j/16))*(Math.floor((15238*j)/43))+29;
  const hm=Math.floor((24*l3)/709),hd=l3-Math.floor((709*hm)/24),hy=30*n+j-30;
  const mo=['محرم','صفر','ربيع الأول','ربيع الثاني','جمادى الأولى','جمادى الثانية','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
  return `${hd} ${mo[hm-1]||''} ${hy}هـ`;
}

function generateZATCAQR(sellerName,vatNumber,timestamp,total,vatAmount){
  function tlv(tag,val){
    const b=new TextEncoder().encode(String(val));
    const out=new Uint8Array(2+b.length);
    out[0]=tag;out[1]=b.length;out.set(b,2);return out;
  }
  const parts=[tlv(1,sellerName),tlv(2,vatNumber),tlv(3,timestamp),tlv(4,Number(total).toFixed(2)),tlv(5,Number(vatAmount).toFixed(2))];
  let len=0;for(const p of parts)len+=p.length;
  const merged=new Uint8Array(len);let off=0;for(const p of parts){merged.set(p,off);off+=p.length;}
  let bin='';for(let i=0;i<merged.length;i++)bin+=String.fromCharCode(merged[i]);
  return btoa(bin);
}

function getQRDataURL(text){
  return new Promise(resolve=>{
    if(typeof QRCode==='undefined'){resolve('');return;}
    const div=document.createElement('div');
    div.style.cssText='position:absolute;top:-9999px;left:-9999px;width:200px';
    document.body.appendChild(div);
    try{new QRCode(div,{text,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}
    catch(e){try{document.body.removeChild(div);}catch{}resolve('');return;}
    setTimeout(()=>{
      const canvas=div.querySelector('canvas');
      const img=div.querySelector('img');
      const src=canvas?.toDataURL('image/png')||img?.src||'';
      try{document.body.removeChild(div);}catch{}
      resolve(src);
    },350);
  });
}

.inv-stamp{border:3px solid #fff;border-radius:8px;padding:5px 14px;font-size:15px;font-weight:900;transform:rotate(-8deg);display:inline-block;opacity:.9;margin-top:8px}
/* BODY */
.inv-body{padding:28px 36px}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.inv-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
.inv-box h3{font-size:11px;font-weight:700;color:#0f766e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid #e0f2fe}
.inv-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;gap:8px;align-items:baseline}
.inv-row span{color:#64748b;flex-shrink:0}
.inv-row strong{color:#1e293b;text-align:left}
/* TABLE */
.inv-tbl{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:13px}
.inv-tbl thead tr{background:#0f766e}
.inv-tbl thead th{color:#fff;padding:10px 12px;font-weight:700;text-align:right}
.inv-tbl tbody td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.inv-tbl tbody tr:last-child td{border-bottom:none}
.inv-tbl tbody tr:nth-child(even){background:#f8fafc}
.num{text-align:left;direction:ltr}
/* TOTALS */
.totals-wrap{display:flex;justify-content:flex-start;margin-bottom:24px}
.totals-inner{width:360px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.tr{display:flex;justify-content:space-between;padding:10px 14px;font-size:14px;border-bottom:1px solid #f1f5f9;gap:8px}
.tr:last-child{border:none}
.tl{color:#64748b}
.tv{font-weight:700;direction:ltr}
.tr-final{background:#0f766e;color:#fff;display:flex;justify-content:space-between;padding:14px 16px;font-size:17px;font-weight:900;gap:8px}
/* FOOTER */
.inv-foot{display:flex;justify-content:space-between;align-items:flex-start;padding-top:20px;border-top:2px dashed #e2e8f0;gap:20px;flex-wrap:wrap}
.inv-qr-box{text-align:center}
.inv-qr-box .cap{font-size:10px;color:#94a3b8;margin-top:5px;line-height:1.6}
.inv-pay-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px;min-width:200px}
.inv-pay-box h3{font-size:11px;font-weight:700;color:#166534;margin-bottom:10px}
.pr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;gap:8px}
.inv-legal{font-size:11px;color:#64748b;line-height:1.9;flex:1;max-width:260px}
.inv-legal strong{color:#0f766e;font-size:12px;display:block;margin-bottom:5px}
/* PRINT BUTTON */
.print-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto;padding:13px 40px;background:#0f766e;color:#fff;border:none;border-radius:10px;font-size:16px;font-family:'Tajawal',sans-serif;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.35);transition:background .2s}
.print-btn:hover{background:#0d6560}
@media print{
  .print-btn,.no-print{display:none!important}
  body{background:#fff}
  .inv{box-shadow:none;border-radius:0}
  .page{padding:0;max-width:100%}
  @page{margin:10mm;size:A4}
}
</style>
</head>
<body>
<div class="page">
<button class="print-btn no-print" onclick="window.print()">🖨️ طباعة الفاتورة / حفظ PDF</button>
<div class="inv">

  <!-- TOP BAND -->
  <div class="inv-topband">
    <div>
      <h1>${e(school.name||'مدارك الطفل')}</h1>
      <div class="sub">
        ${e(school.address||'الرياض، المملكة العربية السعودية')}<br>
        الرقم الضريبي: <strong dir="ltr">${e(vatNo)}</strong>
        ${school.phone?' &nbsp;|&nbsp; هاتف: '+e(school.phone):''}
        ${school.email?' &nbsp;|&nbsp; '+e(school.email):''}
      </div>
    </div>
    <div class="inv-label">
      <h2>فاتورة ضريبية مبسطة</h2>
      <div class="en">Simplified Tax Invoice</div>
      <div class="uuid">${invoiceUUID}</div>
    </div>
    <div style="text-align:center">
      <div class="inv-stamp">${isPaid?'✅ مدفوعة':'⏳ جزئية'}</div>
    </div>
  </div>

  <div class="inv-body">

    <!-- INFO GRID -->
    <div class="inv-grid">
      <div class="inv-box">
        <h3>📄 بيانات الفاتورة</h3>
        <div class="inv-row"><span>رقم الفاتورة</span><strong>${e(invoiceNo)}</strong></div>
        <div class="inv-row"><span>التاريخ الميلادي</span><strong>${issueDate}</strong></div>
        <div class="inv-row"><span>التاريخ الهجري</span><strong>${hijriDate}</strong></div>
        <div class="inv-row"><span>وقت الإصدار</span><strong dir="ltr">${issueTime}</strong></div>
        <div class="inv-row"><span>نوع الاشتراك</span><strong>${tLabel} — ${pLabel}</strong></div>
      </div>
      <div class="inv-box">
        <h3>👤 بيانات العميل</h3>
        <div class="inv-row"><span>اسم الطفل</span><strong>${e(child.name||'—')}</strong></div>
        <div class="inv-row"><span>ولي الأمر</span><strong>${e(child.parentName||'—')}</strong></div>
        <div class="inv-row"><span>الهاتف</span><strong dir="ltr">${e(child.parentPhone||'—')}</strong></div>
        <div class="inv-row"><span>الفرع</span><strong>${e(branch.name||'—')}</strong></div>
        <div class="inv-row"><span>فترة الاشتراك</span><strong>${fmt(sub.startDate)} — ${fmt(sub.endDate)}</strong></div>
      </div>
    </div>

    <!-- ITEMS TABLE -->
    <table class="inv-tbl">
      <thead>
        <tr>
          <th style="width:34px;text-align:center">#</th>
          <th>البيان</th>
          <th>المدة</th>
          <th class="num">السعر قبل ض.ق.م</th>
          <th style="text-align:center">نسبة الضريبة</th>
          <th class="num">مبلغ الضريبة</th>
          <th class="num">الإجمالي شامل ض.ق.م</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="text-align:center;color:#94a3b8">1</td>
          <td><strong>اشتراك ${tLabel} ${pLabel}</strong><br><small style="color:#64748b">${e(child.name||'')}</small></td>
          <td style="font-size:12px;color:#64748b;white-space:nowrap">${fmt(sub.startDate)}<br>${fmt(sub.endDate)}</td>
          <td class="num">${sar(base)}</td>
          <td style="text-align:center">${(vr*100).toFixed(0)}%</td>
          <td class="num">${sar(vat)}</td>
          <td class="num" style="font-weight:700;color:#0f766e">${sar(total)}</td>
        </tr>
        ${disc>0?`<tr style="background:#fffbeb">
          <td></td>
          <td colspan="2" style="color:#d97706;font-size:12px">خصم ${disc}% على السعر الأساسي (${sar(sub.basePrice||0)})</td>
          <td colspan="4" class="num" style="color:#d97706;font-weight:700">- ${sar(discAmt)}</td>
        </tr>`:''}
      </tbody>
    </table>

    <!-- TOTALS -->
    <div class="totals-wrap">
      <div class="totals-inner">
        <div class="tr"><span class="tl">المجموع قبل ضريبة القيمة المضافة</span><span class="tv">${sar(base)}</span></div>
        <div class="tr"><span class="tl">ضريبة القيمة المضافة (${(vr*100).toFixed(0)}%)</span><span class="tv" style="color:#0f766e">${sar(vat)}</span></div>
        ${disc>0?`<div class="tr"><span class="tl">الخصم</span><span class="tv" style="color:#d97706">- ${sar(discAmt)}</span></div>`:''}
        <div class="tr-final"><span>الإجمالي شامل ض.ق.م</span><span dir="ltr">${sar(total)}</span></div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="inv-foot">
      <div class="inv-qr-box">
        ${qrImg}
        <div class="cap">رمز الاستجابة السريعة<br>ZATCA QR Code<br>(Phase 1)</div>
      </div>
      <div class="inv-pay-box">
        <h3>💳 معلومات الدفع</h3>
        <div class="pr"><span>طريقة الدفع</span><strong>${pmLabel}</strong></div>
        <div class="pr"><span>الإجمالي المستحق</span><strong dir="ltr">${sar(total)}</strong></div>
        <div class="pr"><span>المبلغ المدفوع</span><strong dir="ltr" style="color:#059669">${sar(paid)}</strong></div>
        ${remaining>0.005?`<div class="pr"><span>المتبقي</span><strong dir="ltr" style="color:#dc2626">${sar(remaining)}</strong></div>`:''}
      </div>
      <div class="inv-legal">
        <strong>${e(school.name||'مدارك الطفل')}</strong>
        صدرت هذه الفاتورة إلكترونياً وفق متطلبات نظام الفوترة الإلكترونية لهيئة الزكاة والضريبة والدخل — المرحلة الأولى (مرحلة الإصدار).<br><br>
        This invoice is electronically generated in compliance with ZATCA e-invoicing system — Phase 1 (Generation Phase).
      </div>
    </div>

  </div><!-- end .inv-body -->
</div><!-- end .inv -->
</div><!-- end .page -->
</body>
</html>`;

  const win=window.open('','_blank','width=940,height=1060,scrollbars=yes,resizable=yes');
  if(!win){alert('يرجى السماح بفتح النوافذ المنبثقة في إعدادات المتصفح');return;}
  win.document.write(html);
  win.document.close();
  win.focus();
}

// =========================================================
//  DATA RECOVERY TOOL
// =========================================================
function showDataRecovery(){
  if(!Auth.isSuperAdmin()){alert('هذه الأداة للمدير العام فقط');return;}
  const ls={};
  Object.keys(localStorage).filter(k=>k.startsWith('ccs_')).forEach(k=>{
    try{const v=JSON.parse(localStorage.getItem(k));ls[k.replace('ccs_','')]=(Array.isArray(v)?v.length:typeof v);}catch{ls[k]='parse error';}
  });
  const mem={};
  ['children','subscriptions','users','branches','schools','attendance','notifications'].forEach(k=>{
    const v=_mem[k];
    mem[k]=Array.isArray(v)?v.length:'—';
  });
  App.showModal(`
  <div class="modal-overlay" onclick="if(event.target===this)App.closeModal()">
  <div class="modal" style="max-width:580px">
    <div class="modal-header"><h2>🔧 أداة استرداد البيانات</h2><button class="close-btn" onclick="App.closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="alert-box ${_fbStatus==='ok'?'alert-green':'alert-red'}" style="margin-bottom:16px">
        ${_fbStatus==='ok'?'✅ Firebase متصل — البيانات تُزامَن تلقائياً':'🔴 Firebase غير متصل — البيانات محلية فقط'}
      </div>
      <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px">📊 عدد السجلات المحمّلة في الذاكرة (mem):</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${Object.entries(mem).map(([k,v])=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between"><span style="font-size:13px;color:#374151">${k}</span><span style="font-size:14px;font-weight:700;color:${v>0?'#059669':'#64748b'}">${v}</span></div>`).join('')}
      </div>
      <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px">💾 في localStorage (المتصفح):</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${Object.entries(ls).map(([k,v])=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between"><span style="font-size:13px;color:#374151">${k}</span><span style="font-size:14px;font-weight:700;color:${v>0?'#059669':'#64748b'}">${v}</span></div>`).join('')}
      </div>
      <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:14px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;color:#92400e;margin-bottom:6px">💡 لماذا قد تكون البيانات صفر؟</div>
        <div style="font-size:12px;color:#78350f;line-height:1.7">إذا كان Firebase غير متصل وأظهر 0 أطفال، فالبيانات موجودة في Firebase لكن الاتصال فشل. تحقق من: <strong>Firebase Console → Authentication → Sign-in method → Anonymous → مفعّل</strong></div>
      </div>
      <button class="btn btn-primary" onclick="exportAllData()">⬇️ تصدير جميع البيانات Excel الآن</button>
    </div>
  </div></div>`);
}

// =========================================================
//  INIT
// =========================================================
(function boot(){
  const h=(location.hash||'').replace(/^#/,'').split(/[?\/]/)[0];
  if(h==='provider'){renderProviderArea();return;}
  if(h==='attend'){document.getElementById('app').innerHTML=Views.staffCheckin();return;}
  TenantSession.init();
  if(TenantSession.token&&TenantSession.tenant){
    startAppForTenant();
  }else{
    document.getElementById('app').innerHTML=Views.platformGate('login');
  }
})();

// شريط تنبيه عائم قابل لإعادة الاستخدام — يطلب من المستخدم إعادة تحميل الصفحة
// (لا نعيد التحميل تلقائياً كي لا يُقطع على المستخدم عمله في منتصف إدخال بيانات)
let _reloadBannerShown=false;
function _showReloadBanner(msg){
  if(_reloadBannerShown) return;
  _reloadBannerShown=true;
  const banner=document.createElement('div');
  banner.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:#0f766e;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99999;display:flex;align-items:center;gap:12px;font-family:Tajawal,sans-serif;font-size:14px';
  banner.innerHTML=`<span style="flex:1">${msg}</span><button style="background:#fff;color:#0f766e;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit">تحديث الآن</button>`;
  banner.querySelector('button').onclick=()=>{location.href=location.pathname+'?r='+Date.now();};
  document.body.appendChild(banner);
}
// تنبيه عند توفر تحديث جديد للنظام — يفحص دورياً (ولا يعيد التحميل تلقائياً
// كي لا يقطع على المستخدم عمله) حتى لا تبقى علامة مفتوحة عالقة على نسخة
// قديمة تكتب على Firebase بينما بقية الأجهزة انتقلت للسيرفر الجديد
function _watchForNewBuild(){
  const check=async()=>{
    try{
      const res=await fetch(location.pathname,{cache:'no-store'});
      const html=await res.text();
      const m=html.match(/BUILD='([^']+)'/);
      if(m&&window.MADAREK_BUILD&&m[1]!==window.MADAREK_BUILD){
        _showReloadBanner('🔄 يتوفر تحديث جديد للنظام — يُفضّل التحديث الآن');
      }
    }catch(e){}
  };
  setInterval(check,120000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
}
// شفاء ذاتي: جهاز عالق على Firebase (لأن الخادم كان متعطلاً لحظة فتح الصفحة)
// يُعاد فحصه دورياً — فور توفر الخادم نطلب من المستخدم تحديثاً بسيطاً
// لإعادة الإقلاع على وضع الخادم الموثوق بدل البقاء معزولاً عن بقية الفروع
function _watchForBackendRecovery(){
  if(_storageMode==='backend') return;
  const check=async()=>{
    try{
      await _backendGetAll();
      _showReloadBanner('🔄 الاتصال بالخادم عاد — يُرجى التحديث الآن لمزامنة بياناتك مع بقية الفروع');
    }catch(e){}
  };
  setInterval(check,30000);
}

// إخفاء تنبيه اشتراك منتهي من الرئيسية (يُحفظ محلياً — يختفي تلقائياً بعد 5 أيام من الانتهاء)
function dismissSubAlert(subId){
  const key='_dismissed_alerts';
  const map=JSON.parse(localStorage.getItem(key)||'{}');
  map[subId]=T0;
  // تنظيف القديم (أكثر من 10 أيام)
  Object.keys(map).forEach(k=>{if(diffDays(T0,map[k])>10) delete map[k];});
  localStorage.setItem(key,JSON.stringify(map));
  App.refresh();
}
// ===== البحث السريع الشامل (Ctrl+K) =====
let _qsActive=-1;
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openQuickSearch();}
  if(e.key==='Escape'){closeQuickSearch();}
});
function openQuickSearch(){
  const ov=document.getElementById('quick-search-overlay');
  const inp=document.getElementById('qs-input');
  if(!ov||!inp) return;
  ov.classList.add('open');
  inp.value='';
  inp.focus();
  runQuickSearch('');
}
function closeQuickSearch(){
  document.getElementById('quick-search-overlay')?.classList.remove('open');
  _qsActive=-1;
}
function runQuickSearch(q){
  const el=document.getElementById('qs-results');
  if(!el) return;
  q=(q||'').trim();
  _qsActive=-1;
  if(!q){el.innerHTML='<div style="padding:32px;text-align:center;color:#94a3b8;font-size:14px">اكتب للبحث... أو اضغط Esc للإغلاق</div>';return;}
  const results=[];
  // بحث في الأطفال
  DB.children().filter(c=>{
    const n=(c.name||'').toLowerCase();
    const p=(c.parentName||'').toLowerCase();
    const qL=q.toLowerCase();
    return n.includes(qL)||p.includes(qL);
  }).slice(0,5).forEach(c=>{
    const sub=DB.subscriptions().find(s=>s.childId===c.id&&s.isActive);
    results.push({type:'child',icon:'👶',bg:'#dcfce7',label:c.name,sub:`${esc(c.parentName||'')} · ${DB.branchName(c.branchId)||''} · ${c.period==='morning'?'صباحي':'مسائي'}${sub?' · اشتراك فعال':' · بدون اشتراك'}`,action:()=>{App.go('children',{search:c.name});closeQuickSearch();},typeLbl:'طفل',typeCls:'background:#dcfce7;color:#166534'});
  });
  // بحث في الاشتراكات
  DB.subscriptions().filter(s=>{
    const c=DB.children().find(x=>x.id===s.childId);
    return (c?.name||'').toLowerCase().includes(q.toLowerCase())&&s.isActive;
  }).slice(0,3).forEach(s=>{
    const c=DB.children().find(x=>x.id===s.childId);
    results.push({type:'sub',icon:'📋',bg:'#dbeafe',label:`اشتراك: ${c?.name||''}`,sub:`${formatDate(s.startDate)} → ${formatDate(s.endDate)} · ${s.isActive?'فعال':'منتهي'}`,action:()=>{App.go('subscriptions',{childId:s.childId});closeQuickSearch();},typeLbl:'اشتراك',typeCls:'background:#dbeafe;color:#1e40af'});
  });
  // بحث في الموظفين
  if(Auth.isSuperAdmin()){
    DB.hrEmployees().filter(e=>e.status!=='deleted'&&((e.name||'').toLowerCase().includes(q.toLowerCase())||(e.jobTitle||'').toLowerCase().includes(q.toLowerCase()))).slice(0,4).forEach(e=>{
      results.push({type:'emp',icon:'👤',bg:'#fef3c7',label:e.name,sub:`${esc(e.jobTitle||'—')} · ${DB.branchName(e.branchId)||''} · ${(+e.basicSalary||0).toLocaleString()} ر.س`,action:()=>{closeQuickSearch();Modals.viewHrEmployee(e.id);},typeLbl:'موظف',typeCls:'background:#fef3c7;color:#92400e'});
    });
  }
  if(!results.length){el.innerHTML=`<div style="padding:32px;text-align:center;color:#94a3b8;font-size:14px">لا توجد نتائج لـ «${esc(q)}»</div>`;return;}
  el.innerHTML=results.map((r,i)=>`<div class="qs-item" data-idx="${i}" onclick="qsSelect(${i})" onmouseenter="_qsActive=${i}">
    <div class="qs-icon" style="background:${r.bg}">${r.icon}</div>
    <div style="flex:1;min-width:0">
      <div class="qs-label">${esc(r.label)}</div>
      <div class="qs-sub">${r.sub}</div>
    </div>
    <span class="qs-type" style="${r.typeCls}">${r.typeLbl}</span>
  </div>`).join('');
  window._qsResults=results;
}
function qsSelect(i){
  const r=window._qsResults?.[i];
  if(r) r.action();
}
function qsKeyNav(e){
  const items=document.querySelectorAll('.qs-item');
  if(!items.length) return;
  if(e.key==='ArrowDown'){e.preventDefault();_qsActive=Math.min(_qsActive+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();_qsActive=Math.max(_qsActive-1,0);}
  else if(e.key==='Enter'){e.preventDefault();if(_qsActive>=0) qsSelect(_qsActive);return;}
  items.forEach((el,i)=>el.style.background=i===_qsActive?'#f0fdf4':'');
  if(_qsActive>=0) items[_qsActive].scrollIntoView({block:'nearest'});
}
</script>
</body>
</html>
