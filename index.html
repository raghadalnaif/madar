      {n:8,name:'حركات حيوانات جزيرة العرب',goal:'تنمية الوعي الجسدي وتعليم أسماء الحيوانات المحلية بطريقة حركية',age:'٣-٥ سنوات',time:'٢٠ دقيقة',materials:'بطاقات صور حيوانات: جمل، نسر، ضبّ، أرنب صحراوي',steps:'١. ارفع بطاقة حيوان واطلب من الأطفال تقليده حركياً: الجمل يمشي بثقل وببطء.\n٢. النسر يمد ذراعيه ويدور ببطء.\n٣. الضبّ يزحف على الأرض.\n٤. تسرّع أو تبطّئ الإيقاع مع كل حيوان.',tips:'أضف أصوات الحيوانات إن كانت معروفة. حوّلها لمسابقة: من يقلّد الأجمل؟'},
      {n:9,name:'قطار النمل',goal:'تنمية التنسيق الحركي الجماعي والثقة بالآخرين والتعاون',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'مساحة واسعة، موسيقى إيقاعية',steps:'١. يقف الأطفال في صف، كل طفل يضع يده على كتفي من أمامه.\n٢. الطفل الأول هو القاطرة يقود المسار.\n٣. المعلمة تضع عقبات بسيطة: كرسي يلتفون حوله، دائرة يدخلونها.\n٤. تتبادل الأدوار: كل دقيقتين الأول يصبح آخر القطار.',tips:'اجعل المسار يمر عبر مناطق مختلفة القوام: بساط ناعم، أرض ملساء.'},
      {n:10,name:'لاعب السيرك الصغير',goal:'تطوير التوازن والتركيز والثقة بالنفس',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'شريط لاصق على الأرض يمثل الخط الضيق، كيس رمل صغير',steps:'١. ضع شريطاً لاصقاً مستقيماً وآخر متعرجاً.\n٢. الطفل يمشي على الخط المستقيم أولاً.\n٣. تدريجياً: امشِ على الخط المتعرج، ثم فوق رأسك كيس رمل.\n٤. من يكمل المسار دون سقوط الكيس يحصل على شهادة سيركوس.',tips:'لا تضع ضغطاً على الخاسرين، الهدف المتعة والتحدي الشخصي.'},
    ]},
    {cat:'❤️ أخلاق وقيم',catKey:'values',items:[
      {n:11,name:'صندوق الشكر اليومي',goal:'تنمية الامتنان والتعبير عن المشاعر الإيجابية',age:'٤-٦ سنوات',time:'١٥ دقيقة',materials:'صندوق مزيّن، بطاقات صغيرة، أقلام تلوين',steps:'١. في نهاية اليوم، كل طفل يرسم أو يكتب شيئاً حدث اليوم جعله سعيداً.\n٢. يضعها في صندوق الشكر.\n٣. مرة في الأسبوع، تُقرأ بطاقة عشوائية أمام المجموعة.\n٤. يتحدث الطفل عن لحظته الجميلة.',tips:'شجّع الشكر على أشياء بسيطة: شكراً لصديقي لأنه شاركني مقصّه.'},
      {n:12,name:'مسرح الدمى: قصة المشاركة',goal:'تعليم قيمة المشاركة والتعاطف عبر التمثيل',age:'٣-٥ سنوات',time:'٣٠ دقيقة',materials:'دمى من جوارب أو ورق مقوى، ديكور بسيط من الكرتون',steps:'١. ارسم قصة بسيطة: طفلان لديهما لعبة واحدة.\n٢. قدّم الموقف بالدمى: أحدهم يرفض المشاركة.\n٣. اسأل الأطفال: ماذا يجب أن يفعل؟ كيف يشعر صديقه؟\n٤. اطلب منهم إكمال القصة بنهاية إيجابية.',tips:'دع الأطفال يصنعون دماهم من الجوارب مسبقاً كنشاط مكمّل.'},
      {n:13,name:'جدار الكلمات الطيبة',goal:'تعزيز اللغة الإيجابية والثناء والتواصل اللطيف',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'لوح كبير على الحائط، بطاقات ملونة، قلم',steps:'١. اسأل كل طفل: ما أجمل كلمة تقولها لصديقك؟\n٢. اكتب الكلمة على بطاقة بخط كبير: شاطر، حبيبي، جزاك الله خير.\n٣. الطفل يعلّق بطاقته على الجدار.\n٤. في نهاية الأسبوع، اقرؤوا الجدار معاً وناقشوا لماذا هذه الكلمات تسعد.',tips:'أضف كلمات من القرآن والحديث: الكلمة الطيبة صدقة.'},
      {n:14,name:'لحظة العطاء',goal:'بناء سلوك الإيثار والكرم بشكل عملي',age:'٤-٦ سنوات',time:'١٥ دقيقة',materials:'لعبة أو شيء محبوب من حقيبة الطفل',steps:'١. قبل وقت اللعب، اطلب من كل طفل يختار لعبة يحبّها من حقيبته.\n٢. اسأله: كيف تشعر لو أعطيتها لصديقك لمدة ٥ دقائق؟\n٣. الأطفال يتبادلون الألعاب لمدة قصيرة.\n٤. بعدها ناقش: كيف شعرت حين أعطيت؟ وحين أخذت؟',tips:'الهدف ليس التخلي الدائم بل تجربة مشاعر الإعطاء. ثمّن الشجاعة على العطاء.'},
      {n:15,name:'طبيب الجار',goal:'تعزيز التعاطف والرعاية والإحساس بالمسؤولية تجاه الآخرين',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'حقيبة طب صغيرة (لعبة)، دمية مريضة، بطاقات أدوار',steps:'١. ضع سيناريو: الجار مريض ولا أحد يساعده.\n٢. وزّع الأدوار: طبيب، ممرضة، جار محب.\n٣. الأطفال يمثّلون كيف يزورون الجار ويساعدونه.\n٤. ناقش: ماذا قلت له؟ كيف جعلته يشعر بالتحسن؟',tips:'اربط بحديث: من كان في حاجة أخيه كان الله في حاجته.'},
    ]},
    {cat:'🕌 مناسبات إسلامية',catKey:'islamic',items:[
      {n:16,name:'مهندس الكعبة من الصلصال',goal:'تعزيز الانتماء الديني وتنمية المهارة اليدوية الدقيقة',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'صلصال أسود وبني، صور تفصيلية للكعبة وبابها الذهبي',steps:'١. اعرض صوراً للكعبة وتحدّث عن أجزائها: الباب الذهبي، الكسوة السوداء، الحجر الأسود.\n٢. كل طفل يشكّل مكعبه من الصلصال ويغطيه بقطعة سوداء.\n٣. يصنع الباب من صلصال ذهبي اللون.\n٤. يعرض عمله ويحكي قصته.',tips:'احرص على أن الحديث يبقى تعظيماً وليس تقليداً فنياً بحتاً. أضف دعاء زيارة المسجد الحرام.'},
      {n:17,name:'رحلة رمضان الصغيرة',goal:'تعريف الطفل بأجواء رمضان وقيمه بشكل حسّي ممتع',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'فانوس ورقي، تمر، ماء، بطاقة أذان مصغّرة',steps:'١. اصنع جواً رمضانياً: خفّت الإضاءة، فانوس مضاء.\n٢. أخبر الأطفال أن رمضان شهر الصيام والعبادة.\n٣. مثّل لحظة الإفطار: دق الطبلة أو صوت مسجّل، يأكلون تمرة.\n٤. تحدّث: لماذا نصوم؟ كيف نساعد في رمضان؟',tips:'يمكن إشراك الأطفال في تزيين ركن رمضان في الفصل مع الأهل قبل يوم.'},
      {n:18,name:'هدايا العيد بأيدينا',goal:'تنمية الإبداع اليدوي وتعزيز روح العيد والفرح المشترك',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'ورق مقوى ملون، خيط، زينة لاصقة، غراء',steps:'١. تحدّث عن عادة تبادل الهدايا في العيد.\n٢. كل طفل يصنع بطاقة عيد لشخص يحبه.\n٣. يرسم ويزيّن بالألوان والزينة اللاصقة.\n٤. يكتب أو يرسم رسالة: عيدك مبارك يا... أحبك لأنك...',tips:'التصوير عند التسليم يصنع ذكرى جميلة. اجعل كل طفل يقدم هديته بنفسه.'},
      {n:19,name:'محطات الحج',goal:'تعليم مناسك الحج بطريقة تجريبية حسّية ممتعة',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'خريطة مصورة لمناسك الحج، أشكال ورقية لكل محطة',steps:'١. ضع على الأرض بطاقات تمثّل: الكعبة، الصفا والمروة، منى، عرفة.\n٢. المعلمة دليلة الرحلة تشرح كل محطة بجملة واحدة.\n٣. الأطفال ينتقلون من محطة لمحطة سيراً.\n٤. عند كل محطة نشاط صغير: الطواف = الدوران، السعي = المشي السريع.',tips:'هذا النشاط مثالي قبل عيد الأضحى. وثّقه بصور وأرسله للأهل.'},
      {n:20,name:'فانوسي أنا',goal:'تنمية التعبير الفني وتعزيز أجواء شهر رمضان',age:'٣-٦ سنوات',time:'٤٠ دقيقة',materials:'علبة حليب فارغة أو كوب ورقي، أوراق شفافة ملونة، مقص، غراء',steps:'١. اعرض فوانيس رمضان الجميلة كمرجع.\n٢. كل طفل يصنع فانوسه الخاص بقصّ وصقّ الأوراق الملونة على العلبة.\n٣. أضف مصدر ضوء آمن (شمعة LED).\n٤. أطفال يحملون فوانيسهم ويسيرون في المركز.',tips:'يمكن كتابة اسم الطفل على فانوسه. هدية منزلية رائعة.'},
      {n:21,name:'رسّام الأذان',goal:'تنمية الحس الروحي والتعبير الفني وتأمل الصوت',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق كبير أبيض، ألوان مائية أو تلوين',steps:'١. اطلب من الأطفال يغمضون أعينهم ويستمعون لتسجيل أذان.\n٢. اسأل: ماذا شعرت؟ رأيت في خيالك؟\n٣. بعد الاستماع، كل طفل يرسم ما أحسّ به.\n٤. كل طفل يحكي عن رسمته.',tips:'لا توجّه الرسم، دع الطفل يعبّر بحرية. القيمة في الشعور والتأمل.'},
    ]},
    {cat:'🌱 مهارات حياتية',catKey:'life',items:[
      {n:22,name:'طاهي اليوم',goal:'تنمية الاستقلالية والمهارة اليدوية والوعي الغذائي',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'فواكه طازجة، مقص بلاستيكي آمن، طاسة، ملعقة خلط',steps:'١. أعدّ فواكه مقطّعة مسبقاً بأشكال مناسبة.\n٢. كل طفل يرتب طبق فاكهة بطريقته الخاصة.\n٣. يضيف عصير ليمون وشوية عسل (المعلمة تساعد).\n٤. يقدّم طبقه لصديقه ويشاركون الأكل.',tips:'تحدث عن كل فاكهة: اسمها، فائدتها، لونها. شجّع التذوق الواعي.'},
      {n:23,name:'مرتّب الملابس',goal:'تنمية الاعتماد على النفس والقدرة على الترتيب والتصنيف',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ملابس صغيرة نظيفة: قمصان صغيرة، جوارب، بنطال',steps:'١. اعمل حبل غسيل في الفصل بمشابك.\n٢. وزّع الملابس وعلّم الطفل كيف يطوي القميص.\n٣. كل طفل يعلّق قطعة على الحبل بالمشبك وحده.\n٤. أخيراً يصنّف الملابس: شتاء/صيف، ألوان.',tips:'ألبس الدمية كتطبيق تدريبي أول. أثنِ على كل محاولة.'},
      {n:24,name:'بستاني الصغير',goal:'تعليم الاهتمام بالبيئة والصبر والمسؤولية',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'أكواب بلاستيكية، تربة، بذور سهلة كالبقدونس أو الريحان',steps:'١. كل طفل يملأ كوبه بالتربة.\n٢. يزرع بذرة واحدة أو اثنتين بأصبعه.\n٣. يكتب اسمه على الكوب.\n٤. يسقي نباتته يومياً ويراقب النمو.',tips:'سجّل التغيير بصور أسبوعية. ناقش: لماذا تحتاج النباتات للماء والشمس؟'},
      {n:25,name:'مستشفى الدمى',goal:'تعريف الطفل بمفاهيم الإسعافات الأولى والرعاية بلغة اللعب',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'دمى، لفافات شاش، لاصق طبي، مجموعة طبيب ألعاب',steps:'١. أعدّ مستشفى في ركن الفصل بستائر بسيطة.\n٢. كل طفل يأتي بمريض (دمية) بها إصابة.\n٣. الطفل يفحص ويضمّد ويشخّص.\n٤. ناقش: كيف نتصرف لو انجرحنا؟ من نتصل به؟',tips:'علّم رقم الإسعاف ١٩١١ بشكل مبسّط وممتع.'},
      {n:26,name:'دكّاننا الصغير',goal:'تعليم المفاهيم الأساسية للنقود والبيع والشراء والعدّ',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'عملات معدنية فعلية أو من الورق المقوى، بضاعة من ألعاب وبطاقات أثمان',steps:'١. رتّب دكّاناً في الفصل مع علامات أسعار مبسّطة.\n٢. وزّع نقوداً ورقية على الأطفال (المشترين) وعيّن بائعاً.\n٣. المشتري يختار سلعة ويدفع ثمنها.\n٤. البائع يعطي الباقي (أسئلة: كم الثمن؟ كم تبقّى؟)',tips:'ادرج كلمات اجتماعية: من فضلك، شكراً، تفضّل.'},
    ]},
    {cat:'🗣️ اللغة والتعبير',catKey:'language',items:[
      {n:27,name:'مذيع نشرة الأطفال',goal:'تنمية الطلاقة اللغوية والثقة في التحدث أمام الآخرين',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ميكروفون ورقي أو لعبة، كاميرا (موبايل)، كرسي استوديو',steps:'١. قدّم للأطفال مفهوم المذيع: شخص يحكي الأخبار للناس.\n٢. كل طفل يجلس على كرسي الاستوديو ويحكي خبراً: ماذا فعل اليوم؟ ما أكثر شيء أحبّه؟\n٣. الأطفال الآخرون الجمهور يصفّقون.\n٤. سجّل لقطات قصيرة لترسلها للأهل.',tips:'لا تصحّح أثناء التحدث، انتظر إنهاءه ثم أثنِ وأضف كلمة واحدة فقط.'},
      {n:28,name:'الكيس الغامض',goal:'تطوير مفردات الوصف والتخمين والحوار',age:'٣-٥ سنوات',time:'٢٠ دقيقة',materials:'كيس قماشي، أشياء مألوفة: تفاحة، سيارة صغيرة، قلم',steps:'١. ضع شيئاً في الكيس دون أن يرى الأطفال.\n٢. طفل يضع يده بالكيس ويصف ما يحسّه دون أن ينظر.\n٣. الأطفال يخمّنون ما هو.\n٤. يُخرج الشيء ونناقش: لماذا قلت هذا الوصف؟',tips:'ابدأ بأشكال واضحة جداً وزد التعقيد تدريجياً. احرص على دور لكل طفل.'},
      {n:29,name:'شاعر صغير',goal:'تنمية حس الإيقاع والقافية والتعبير الأدبي',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات بها شطر شعري ناقص، مرجع مصور',steps:'١. اقرأ شطراً بسيطاً: نمت نميرة ونامت...\n٢. اطلب من الأطفال اقتراح كلمة تكمّل القافية.\n٣. اكتب الكلمات المقترحة على اللوح.\n٤. اقرؤوا القصيدة الجماعية معاً بصوت عالٍ.',tips:'استخدم أسماء الأطفال أنفسهم في الشطر، يحفّز الحماس الشديد.'},
      {n:30,name:'مسرح الكتاب',goal:'تعزيز الفهم القرائي والتعبير الجسدي والانغماس في الأدب',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'كتاب مصوّر بشخصيات واضحة، ملابس بسيطة للأدوار',steps:'١. اقرأ القصة كاملة أمام الأطفال بتعبير.\n٢. ناقش: من بطل القصة؟ ماذا حدث؟\n٣. وزّع الأدوار وأعد قراءة القصة بينما يمثّل الأطفال.\n٤. التصوير والعرض الختامي.',tips:'دع الأطفال يغيّروا نهاية القصة: ماذا لو...'},
      {n:31,name:'لغة الجسد',goal:'تنمية الوعي بالتعبير غير اللفظي والمشاعر',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات مشاعر مصورة: فرح، حزن، دهشة، خوف',steps:'١. ارفع بطاقة وأنت تمثّل الشعور بوجهك وجسدك.\n٢. الأطفال يخمّنون الشعور.\n٣. كل طفل بدوره يسحب بطاقة ويمثّل الشعور أمام زملائه.\n٤. ناقش: متى تشعر بهذا؟ كيف تعبّر عنه بالكلام؟',tips:'نشاط ممتاز للكشف المبكر عن صعوبات في التعبير العاطفي.'},
    ]},
    {cat:'💛 الذكاء العاطفي والاجتماعي',catKey:'emotional',items:[
      {n:32,name:'عداد المشاعر',goal:'تنمية الوعي العاطفي والتعرف على الحالات المزاجية وتسميتها',age:'٣-٦ سنوات',time:'١٠ دقائق',materials:'لوحة بها وجوه تعبيرية ٥: سعيد، حزين، غاضب، متحمس، خائف',steps:'١. في بداية كل يوم، كل طفل يضع مغناطيساً أو ملصقاً على الوجه الذي يعبّر عن حاله.\n٢. المعلمة تمشي وتسأل: لماذا اخترت هذا الوجه؟\n٣. في نهاية اليوم: هل تغيّر شعورك؟ لماذا؟',tips:'التكرار اليومي يبني عادة التأمل الذاتي. لا تحكم على الاختيار.'},
      {n:33,name:'صندوق المشكلات',goal:'تعليم مهارة حل المشكلات الاجتماعية بالحوار',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'صندوق صغير، بطاقات بها مواقف مصوّرة',steps:'١. يسحب طفل بطاقة من الصندوق: صديقك كسر لعبتك بالخطأ، ماذا تفعل؟\n٢. الطفل يقترح حلاً.\n٣. الأطفال الآخرون يقيّمون: هل هذا الحل عادل؟\n٤. اقترح حلاً بديلاً مع التعليل.',tips:'ابدأ بمواقف بسيطة وزد التعقيد تدريجياً. الهدف التفكير لا الإجابة الصحيحة.'},
      {n:34,name:'بطل اليوم',goal:'تعزيز الثقة بالنفس والاعتراف بالإيجابيات لدى كل طفل',age:'٣-٦ سنوات',time:'١٥ دقيقة',materials:'تاج ورقي، لوح صغير',steps:'١. كل يوم يُختار طفل بطل اليوم بالتناوب.\n٢. كل زميل يقول جملة إطراء حقيقية: أحب أن تشاركني لعبك.\n٣. المعلمة تكتبها على لوح يأخذه الطفل للبيت.\n٤. البطل يلبس التاج طوال اليوم.',tips:'تأكّد أن الثناء محدد وصادق وليس مجرد إنت حلو.'},
      {n:35,name:'مرآة المشاعر',goal:'تنمية التعاطف من خلال محاكاة التعبيرات العاطفية',age:'٣-٥ سنوات',time:'١٥ دقيقة',materials:'مرآة كبيرة أو شاشة موبايل للتصوير الذاتي',steps:'١. الأطفال يقفون أمام المرآة.\n٢. المعلمة تقول: أرني وجه شخص سعيد جداً، يمثّلون.\n٣. أرني غضباناً بدون صراخ، خائفاً في الظلام.\n٤. بعدها: ماذا تشعر حين ترى وجه صديق حزين؟',tips:'هذا النشاط يطوّر التعاطف الوجداني ومهارة قراءة مشاعر الآخرين.'},
      {n:36,name:'خريطة الصداقة',goal:'تعزيز التواصل الاجتماعي وبناء الانتماء للمجموعة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'ورقة كبيرة، صور لكل طفل أو رسوم، خيوط ملونة',steps:'١. ضع صور الأطفال في دائرة كبيرة على الورقة.\n٢. اسأل كل طفل: من صديقك المفضل؟ من يساعدك؟\n٣. اربط بخيط ملون بين الأسماء.\n٤. انظروا للخريطة معاً: الجميع مرتبط بالجميع!',tips:'ناقش: لماذا نحتاج للأصدقاء؟ ماذا يحدث لو ابتعدنا؟'},
    ]},
    {cat:'☀️ إبداعي وصيفي',catKey:'summer',items:[
      {n:37,name:'ورشة ألوان الصحراء',goal:'تنمية الإبداع البصري بمواد طبيعية محلية',age:'٣-٦ سنوات',time:'٤٥ دقيقة',materials:'رمل صحراوي، حجارة ملونة طبيعية، ورق أبيض كبير، غراء',steps:'١. اجلبوا رملاً من الحديقة أو الخارج.\n٢. الأطفال يضعون الغراء على مساحة الورقة بأصابعهم.\n٣. يرشّون الرمل فوق الغراء ثم ينفخون الزائد.\n٤. يضيفون حجارة وبذور لإضافة تفاصيل.',tips:'شجّع الطفل على تسمية لوحته: ما اسم قصة هذه اللوحة؟'},
      {n:38,name:'موسيقى الطبيعة',goal:'تطوير الحس الإيقاعي والإبداع الصوتي وربط الطفل بالبيئة',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'علب فارغة، حجارة صغيرة، أوراق شجر جافة، أعواد',steps:'١. اطلب من الأطفال جمع مواد طبيعية من الحديقة.\n٢. كل طفل يصنع آلته: علبة مليئة بالرمل = طبلة، أعواد تُطرق ببعض = إيقاع.\n٣. المعلمة تقود أوركسترا الطبيعة.\n٤. عزفوا أغنية مشتركة.',tips:'سجّل الأداء وأرسله للأهل. عزّز فكرة: الفن موجود في كل مكان.'},
      {n:39,name:'حديقتي في الرمل',goal:'تنمية الخيال الإبداعي والاهتمام بالبيئة والتخطيط',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'صينية رمل لكل طفل، حجارة، عيدان، أوراق، قطع ملونة',steps:'١. تحدّث عن تصميم الحدائق: ماذا تريد في حديقتك؟\n٢. كل طفل يصمم حديقة رمل باستخدام العناصر.\n٣. يزوّر أصحابه ويشرح تصميمه.\n٤. أضف ماء قليلاً لتكتمل البيئة.',tips:'السؤال الأروع: لو كنت نملة تمشي في حديقتك، ماذا سترى؟'},
      {n:40,name:'مسرح الظلال الصيفي',goal:'تحفيز الخيال وتطوير مهارة الحكاية والتعبير الجسدي',age:'٤-٦ سنوات',time:'٤٥ دقيقة',materials:'شبشب أبيض، مصدر ضوء قوي، شخصيات ورقية على أعواد',steps:'١. علّق شبشباً بيضاء بين كرسيين.\n٢. ضع مصدر ضوء خلف الشاشة.\n٣. الأطفال يتناوبون على إدارة الشخصيات خلف الشاشة.\n٤. يرتجلون قصصاً قصيرة لزملائهم المشاهدين.',tips:'في الخارج (صيفاً بعد الغروب) يصبح العرض أكثر سحراً وإثارة.'},
    ]},
    {cat:'🇸🇦 الهوية الوطنية',catKey:'national',items:[
      {n:41,name:'مصمم الزي الوطني',goal:'تعزيز الفخر بالهوية الوطنية وتنمية الإبداع الفني',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'صور لباس تراثي سعودي، دمى ورقية، ألوان وزخارف',steps:'١. اعرض صوراً للزي الوطني السعودي للذكور والإناث.\n٢. كل طفل يحصل على دمية ورقية ويصمم ملابسها.\n٣. يضيف النقوش والألوان التراثية.\n٤. عرض مجموعي: أسبوع الزي الوطني.',tips:'اربطه بيوم الوطني السعودي (٢٣ سبتمبر) أو يوم تراث خاص بالمركز.'},
      {n:42,name:'أطعمة بلادي',goal:'تعزيز الانتماء الثقافي وتنمية الذاكرة الحسية للهوية',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'صور أو عيّنات أطعمة: تمر، قهوة عربية، مضروبة، خبز تنور',steps:'١. ضع على الطاولة عيّنات صغيرة من أطعمة تراثية سعودية.\n٢. الأطفال يشمّون ويتذوّقون ويخمّنون الاسم.\n٣. كل طفل يحكي هل يأكل هذا في بيته.\n٤. اصنع لوحة مطبخ بلادي بصور الأطعمة.',tips:'اطلب من الأهل إرسال وصفة بيتية تراثية تشارك في يوم الإرث.'},
      {n:43,name:'خريطة وطني',goal:'تعريف الطفل بمناطق المملكة وموقعها الجغرافي بطريقة ممتعة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'خريطة المملكة مكبّرة، ملصقات، صور مناطق بارزة',steps:'١. اعرض خريطة المملكة على الحائط.\n٢. اسأل: هل تعرف أين مكة؟ المدينة؟ الرياض؟\n٣. كل طفل يضع ملصقاً على المنطقة التي سافر إليها أو يعرفها.\n٤. ناقش: ماذا في هذه المنطقة؟ حرّ أم بارد؟',tips:'استخدم صور بصرية واضحة: الحرم، نخيل المدينة، الصحراء، البحر.'},
      {n:44,name:'حكاية الجدة',goal:'الحفاظ على التراث الشفهي وتعزيز الرابط بين الأجيال',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'ركن مريح بالوسائد، صور قديمة اختيارية',steps:'١. اطلب من الأطفال إحضار قصة سمعوها من جدتهم أو والدتهم.\n٢. كل طفل يحكي قصته أمام المجموعة.\n٣. المعلمة تسجّل القصص.\n٤. اصنع كتيّب قصص جدتنا يحمله الأطفال للبيت.',tips:'شجّع الأهل على مشاركة قصة واحدة في الأسبوع عبر تسجيل صوتي.'},
    ]},
    {cat:'🌍 الوعي البيئي والاستدامة',catKey:'eco',items:[
      {n:45,name:'مصنع التدوير الصغير',goal:'تعزيز الوعي البيئي وتنمية التفكير الإبداعي في إعادة الاستخدام',age:'٤-٦ سنوات',time:'٤٥ دقيقة',materials:'علب فارغة، أوراق مجلات قديمة، بلاستيك غير مستخدم، غراء',steps:'١. اجمع مواد معاد تدويرها من البيت.\n٢. اعرض فيديو قصير: ماذا يحدث للقمامة في المحيط؟\n٣. كل طفل يحوّل علبة فارغة لشيء مفيد: وعاء أقلام، ديكور.\n٤. معرض صنعت من القمامة.',tips:'الخطوة الأهم: ربط الفعل بالأثر البيئي. حوّلنا قمامة إلى فن.'},
      {n:46,name:'صديق الماء',goal:'تعليم ترشيد استهلاك الماء وتعزيز المسؤولية البيئية',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'كوب قياس، صور لمصادر الماء، ملصقات تعهد',steps:'١. اسأل: كم كوباً من الماء تحتاج الشجرة في اليوم؟ ماذا لو لم يكن هناك ماء؟\n٢. جرّبوا معاً: ماء للشرب، ماء للزرع، ماء للتنظيف، أيهما أكثر؟\n٣. كل طفل يلوّن تعهد الماء: أنا لا أترك الصنبور مفتوحاً.\n٤. يعلّق التعهد في البيت.',tips:'استخدم تجارب حسية: من يملأ كوبه دون إهدار قطرة؟'},
      {n:47,name:'حارس الشجرة',goal:'تعزيز الرعاية البيئية والمسؤولية الفردية',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'شجرة أو نبتة في حديقة المركز، لوح اسم لكل طفل',steps:'١. كل طفل يختار شجرة أو نبتة يتبنّاها.\n٢. يضع لوحة باسمه عليها.\n٣. هو المسؤول عن سقيها وإزالة الأوراق الميتة.\n٤. مرة في الأسبوع يقيس ارتفاعها أو يرسمها.',tips:'اجعل اجتماع الحرّاس أسبوعياً: كيف نباتتي؟ ماذا تحتاج؟'},
    ]},
    {cat:'🫧 استرخاء وتنفس واعٍ',catKey:'relax',items:[
      {n:48,name:'فقاعة الهدوء',goal:'تعليم تقنيات الاسترخاء وضبط النفس عند الانفعال',age:'٣-٦ سنوات',time:'١٠ دقائق',materials:'أنبوب نفخ، ماء وصابون، موسيقى هادئة اختيارية',steps:'١. اجلس الأطفال في دائرة هادئة.\n٢. كل طفل ينفخ فقاعة ببطء: أنا أنفخ كل قلقي في الفقاعة.\n٣. يراقبون الفقاعة تطير ثم تنفجر: ذهب القلق!\n٤. تكرّر ٣ مرات، ثم شهيق عميق وزفير بطيء.',tips:'يمكن استخدام هذه التقنية في أي وقت يصبح فيه الطفل مُضطرباً.'},
      {n:49,name:'جسدي على الأرض',goal:'تنمية الوعي الجسدي والقدرة على الاسترخاء الواعي',age:'٤-٦ سنوات',time:'١٥ دقيقة',materials:'سجادة أو بساط لكل طفل، موسيقى هادئة',steps:'١. الأطفال يستلقون على ظهورهم في مساحة مريحة.\n٢. المعلمة تقود بصوت هادئ: اشعر بقدميك على الأرض... ارخِ كتفيك... تنفّس ببطء...\n٣. قف على كل جزء من الجسم ببطء من القدمين للرأس.\n٤. بعد الانتهاء، الطفل يستيقظ ببطء ويشارك كيف يشعر.',tips:'ممتاز كنشاط بعد الغداء أو بعد نشاط صاخب.'},
      {n:50,name:'رحلة الخيال',goal:'تنمية الخيال والتخيّل الإيجابي وتعزيز الهدوء الذهني',age:'٤-٦ سنوات',time:'١٥ دقيقة',materials:'موسيقى طبيعة هادئة، إضاءة خافتة',steps:'١. الأطفال يجلسون أو يستلقون بعيون مغمضة.\n٢. المعلمة تقود بصوت دافئ: أنت الآن في حديقة جميلة... ترى الأشجار... تسمع الماء...\n٣. تدريجياً تدخل معالم محبوبة: بيت الجدة، شاطئ البحر، حديقة مكة.\n٤. بعد الرحلة كل طفل يرسم ما رآه في خياله.',tips:'رحلة مخصصة للنوم الهادئ أو الهدوء بعد الإجهاد. الرسم لاحقاً يطوّر التعبير.'},
    ]},
    {cat:'🎁 اصنع وخذ للبيت',catKey:'handmade',items:[
      {n:51,name:'شمعتي الملونة',goal:'تنمية الصبر والإبداع اليدوي وصنع هدية ذات قيمة بالأيدي',age:'٥-٦ سنوات',time:'٤٥ دقيقة',materials:'شمع باراغين مبشور أو شموع قديمة، أصباغ شموع أو كريون ملون، خيط قطني، أكواب ورقية كقوالب، زيت عطري رخيص',steps:'١. المعلمة تذيب الشمع في حمام مائي (مسؤوليتها الكاملة).\n٢. الطفل يختار لونه ويضيف قطرة عطر إلى الشمع المذاب.\n٣. يضع الخيط في مركز الكوب الورقي.\n٤. المعلمة تصبّ الشمع، الطفل يُثبّت الخيط بعيداً عن الحرارة.\n٥. بعد التصلب الكامل يُقشر الكوب ويزيّن الشمعة بخيوط ملونة.',tips:'الاحتياط الكامل من الشمع الساخن ضروري. الطفل يُشارك في كل خطوة ما عدا السكب المباشر.'},
      {n:52,name:'عطري الخاص',goal:'تطوير الحواس الشمّية والإبداع في تركيب رائحة شخصية مميزة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'زجاجات بلاستيكية صغيرة فارغة، ماء مقطر أو ماء ورد، زيوت عطرية رخيصة (لافندر أو برتقال أو نعناع من محلات الأعشاب)، بطاقة تسمية صغيرة',steps:'١. قدّم للأطفال ٣ زيوت مختلفة ليشمّوها ويصفون كل رائحة.\n٢. كل طفل يختار رائحتين يحبهما.\n٣. يضيف ٤-٥ قطرات من كل زيت في زجاجته.\n٤. يملأ الزجاجة بماء الورد ويغلقها.\n٥. يرجّها برفق، يكتب اسمه على البطاقة ويصمّم غلافه.',tips:'ناقش: لماذا اخترت هذه الرائحة؟ تذكّرك بماذا؟ الروائح ترتبط بالذكريات والمشاعر.'},
      {n:53,name:'سلايم السحر',goal:'تنمية الفضول العلمي والإدراك الحسّي عبر تجربة كيميائية بسيطة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'غراء شفاف PVA، صودا الخبز، محلول ملامسات العدسات، ألوان طعام، أكياس إغلاق صغيرة',steps:'١. يسكب الطفل نصف علبة الغراء في كوب.\n٢. يضيف قطرات من لون الطعام ويخلط جيداً.\n٣. يضيف ملعقة صغيرة صودا خبز ويقلّب.\n٤. يضيف محلول العدسات ملعقة ملعقة مع التقليب حتى يتماسك ويصير مطاطاً.\n٥. يعجنه بيديه حتى يصبح ناعماً، ثم يحفظه في الكيس ويأخذه للبيت.',tips:'اشرح التفاعل بلغة بسيطة: الغراء والمحلول يتعانقان ويصنعان شيئاً جديداً لم يكن موجوداً!'},
      {n:54,name:'صابوني الجلسرين',goal:'التعرف على مواد التنظيف الطبيعية وصنع منتج عناية شخصي حقيقي',age:'٥-٦ سنوات',time:'٤٠ دقيقة',materials:'قوالب صابون جلسرين شفافة (متوفرة في الصيدليات بسعر رخيص)، ألوان صابون أو طعام، زيت عطري، قوالب سيليكون صغيرة',steps:'١. المعلمة تقطّع وتذيب الجلسرين في الميكروويف ٣٠ ثانية.\n٢. الطفل يضيف اللون المفضل وقطرة عطر ويقلّب برفق.\n٣. يسكب المزيج في قالب السيليكون.\n٤. ينتظر ٢٠ دقيقة للتصلب الكامل.\n٥. يُخرج الصابونة ويغلّفها بورق شفاف ويربطها بشريط.',tips:'الطفل يأخذ صابونته للبيت ليستخدمها هو فعلاً — يجعله يحرص على غسل يديه بفرح!'},
      {n:55,name:'معجون الملح والرسم',goal:'تنمية المهارة اليدوية الدقيقة وصنع مجسّم ثلاثي الأبعاد يدوم',age:'٣-٦ سنوات',time:'٣٥ دقيقة',materials:'كوبان دقيق أبيض، كوب ملح، ٣/٤ كوب ماء، ألوان أكريليك، فرشاة تلوين',steps:'١. يخلط الطفل الدقيق والملح والماء معاً حتى يتشكّل عجين متماسك.\n٢. كل طفل يشكّل ما يريد: حيوان، قلب، حروف اسمه.\n٣. المعلمة تضع الأشكال في الفرن ١٠٠ درجة لمدة ٣٠ دقيقة.\n٤. بعد التبريد يلوّن الطفل مجسّمه بالأكريليك.\n٥. طبقة ورنيش شفاف للحماية والثبات.',tips:'المجسّم الجاهز هدية رائعة للأهل. دع الطفل يقرر بحرية ماذا يصنع.'},
      {n:56,name:'أسورة الصداقة',goal:'تنمية التنسيق الحركي الدقيق والتعبير عن الصداقة والهوية بالألوان',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'خيط مطاطي شفاف، خرز بلاستيكي ملون رخيص، خرزات بأحرف أو قلوب اختيارية',steps:'١. كل طفل يختار ألواناً تعبّر عنه شخصياً.\n٢. يُمرّر الخرز على الخيط برتيب لوني من اختياره.\n٣. يربط الطرفين بعقدة متينة.\n٤. اختياري: يصنع أسورة ثانية هدية لصديقه أو والدته.',tips:'ناقش معاني الألوان: لماذا اخترت الأزرق؟ لأنه يجعلني هادئاً. الألوان لها مشاعر.'},
      {n:57,name:'معجون الرسم الآمن',goal:'الإبداع في صنع مواد الرسم الخاصة والاعتزاز بالصنع من الصفر',age:'٣-٥ سنوات',time:'٢٠ دقيقة',materials:'ملعقتان نشا ذرة، كوب ماء، ملعقتان ملح، ألوان طعام، علب صغيرة للتعبئة',steps:'١. المعلمة تطهو مزيج النشا والماء والملح مع التقليب حتى يتكثّف.\n٢. تُقسّم المزيج في أكواب صغيرة أمام الأطفال.\n٣. الطفل يضيف قطرات من ألوان الطعام ويقلّب ليصنع لونه الخاص.\n٤. يستخدم المعجون فوراً للرسم بأصابعه على الورق.\n٥. يحفظ الباقي في علبة مغلقة يأخذها للبيت.',tips:'يدوم أسبوعاً في الثلاجة. أضف قليلاً من الزيت لمنع الجفاف.'},
      {n:58,name:'مجسّم الطين الطبيعي',goal:'الانتماء للطبيعة وتطوير التشكيل الثلاثي الأبعاد والإبداع الحر',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'طين هوائي رخيص (Air-dry clay)، أعواد صغيرة، بذور، أوراق شجر طازجة',steps:'١. أعطِ كل طفل كرة طين ناعمة.\n٢. يشكّل حيواناً أو نبتة أو أي شكل من خياله.\n٣. يضغط ورقة حقيقية على الطين لتترك بصمتها الجميلة.\n٤. يُضيف أعواداً وبذوراً للتزيين.\n٥. يُترك للجفاف في الهواء ١٢-٢٤ ساعة.',tips:'الطين الهوائي متوفر في محلات الأدوات المدرسية بسعر رخيص جداً. لا يحتاج فرناً.'},
      {n:59,name:'كتيّب قصتي',goal:'الإبداع القصصي وبناء كتاب حقيقي بالأيدي وتعزيز الثقة بالنفس',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'٣ أوراق A4، ستابلة، أقلام تلوين، مقص',steps:'١. تطوى ٣ أوراق معاً من المنتصف ثم تُثبّت بالستابلة.\n٢. الغلاف: يرسم الطفل ويكتب عنوان قصته.\n٣. كل صفحة داخلية تمثّل مشهداً من القصة (٦-٨ مشاهد).\n٤. الصفحة الأخيرة: رسم المؤلف واسمه وعمره.\n٥. المعلمة تكتب الجمل إن احتاج الطفل للمساعدة.',tips:'القراءة الختامية: كل طفل يُقدّم كتابه للمجموعة. فرحة لا توصف حين يقول أنا كتبت هذا الكتاب!'},
      {n:60,name:'لوحة بصمتي',goal:'الاعتزاز بالهوية الفردية الفريدة والتعبير الفني الحر',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'ألوان غواش أو مائية آمنة، ورق أبيض كبير، قماش للتنظيف',steps:'١. كل طفل يطبع يده أو أصابعه بألوان مختلفة على الورق.\n٢. يُحوّل البصمات لأشكال: بصمة الإبهام تصير جسم طير، بصمة الراحة تصير قطة.\n٣. يُضيف تفاصيل بالقلم.\n٤. يكتب اسمه على اللوحة بخط جميل.',tips:'اصنع من لوحات الفصل كلها جدارية مشتركة: كل الأيدي لوحة واحدة جميلة.'},
      {n:61,name:'معطّر البرتقال والقرنفل',goal:'صنع هدية طبيعية وتطوير الحس الشمّي والمهارة اليدوية',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'برتقالة متوسطة، حبات قرنفل كاملة (cloves)، خيط ملون، شريط زينة',steps:'١. أعطِ كل طفل برتقالة وعدداً من حبات القرنفل.\n٢. يضغط القرنفل في قشرة البرتقالة بأصابعه (رأس القرنفل يدخل بسهولة).\n٣. يكوّن نمطاً جميلاً: خطوط، دوائر، حروف اسمه.\n٤. يُربط بخيط ملون ويُعلّق في الهواء.\n٥. الرائحة العطرة تدوم أسابيع كاملة.',tips:'هذا التقليد الطبيعي يعطّر الهواء. اربطه بمفهوم أن الطبيعة صديقتنا المجانية.'},
      {n:62,name:'لوحة المناديل الملونة',goal:'الإبداع الفني بمواد بسيطة رخيصة وتنمية الصبر والتفاصيل',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'مناديل ورقية ملونة، غراء أبيض، ورقة سوداء أو بيضاء كبيرة',steps:'١. قطّع المناديل لمربعات صغيرة أو دع الأطفال يمزّقونها بأيديهم.\n٢. كل طفل يُكرّش المربعات ببطء بأصابعه لتصبح كرات صغيرة.\n٣. يلصق الكرات على الورقة ليرسم شكلاً من اختياره: شجرة، قلب، كعبة.\n٤. يملأ الأماكن الفارغة بألوان مناديل أخرى.',tips:'يمكن بلّ المناديل الملونة بالماء لنقل لونها وصنع رسمة بالطبع المائي.'},
      {n:63,name:'حجارة التأمل المزخرفة',goal:'الاسترخاء عبر الفن الدقيق وصنع تحفة طبيعية تدوم',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'حجارة نهرية ملساء (من الحديقة أو رخيصة)، ألوان أكريليك، فرش رفيعة، ورنيش شفاف',steps:'١. اجمع الأطفال لغسيل الحجارة وتجفيفها معاً.\n٢. كل طفل يُفكّر: ماذا أرسم؟ كلمة؟ وجه؟ حيوان؟\n٣. يرسم على حجرته بعناية ودقة.\n٤. بعد الجفاف تُطلى بطبقة ورنيش للثبات والبريق.\n٥. الطفل يُقرر: هل يحتفظ بها أم يُهديها؟',tips:'ناقش: من ستُهدي حجرتك؟ ماذا ستكتب عليها لتجعله يبتسم؟'},
      {n:64,name:'عصا الحكايات',goal:'الإبداع في صنع أداة للعب الدرامي وتحفيز الخيال والتعبير',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'عصا خشبية أو عصا جيلاتي مطوّلة، خيوط صوفية ملونة، ريش خفيف، نجوم لاصقة',steps:'١. يلفّ الطفل الخيط الملون حول العصا من الأسفل للأعلى بإحكام.\n٢. يُضيف ريشاً في طرف العصا.\n٣. يزيّن بالنجوم اللاصقة والخيوط.\n٤. يُسمّي عصاه: هذه عصا الخيال السحري للحكايات!',tips:'في الجلسة الختامية كل طفل يحكي حكايته وبيده عصاه. العصا تُضفي ثقة وشخصية.'},
      {n:65,name:'شنطة الرسم الخاصة',goal:'التعبير الفني على القماش وامتلاك حقيبة صنعتها يداي بنفسي',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'حقيبة قماشية بيضاء رخيصة، أقلام تلوين قماش أو طلاء أقمشة',steps:'١. ضع ورقة مقوّاة داخل الحقيبة لتثبيت الشكل أثناء الرسم.\n٢. الطفل يرسم على الحقيبة ما يُعبّر عنه: اسمه، صورة ذاتية، حيوانه المفضل.\n٣. المعلمة تُثبّت الألوان بالمكواة من الداخل (بقطعة قماش بينهما).\n٤. الحقيبة الجاهزة يستخدمها الطفل يومياً.',tips:'الحقيبة تُصبح حقيبة المركز أو المدرسة. كل يوم يراها يتذكر أنه صنعها بيديه!'},
      {n:66,name:'علبة كنوزي',goal:'صنع وعاء شخصي مزيّن وتنمية الاهتمام بالنظام والحفاظ على الذكريات',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'علبة كرتون صغيرة، طلاء ملون، صور مقصوصة من مجلات قديمة، غراء، لمعة لاصقة',steps:'١. يطلي الطفل العلبة بلونه المفضل ويتركها تجف.\n٢. يقصّ صوراً يحبها من المجلات.\n٣. يلصقها على العلبة بأسلوب الكولاج.\n٤. يُضيف لمعة وزخارف.\n٥. يُسمّي علبته ويضع فيها كنوزه الصغيرة.',tips:'اسأل: ما أثمن شيء ستضعه في علبة كنوزك؟ إجاباتهم ستدهشك وتُخبرك بالكثير.'},
      {n:67,name:'قلادة الصلصال',goal:'الإبداع في صنع مجوهرات شخصية والاعتزاز بها',age:'٤-٦ سنوات',time:'٤٠ دقيقة (مع ٢٤ ساعة تجفيف)',materials:'صلصال هوائي خفيف، ألوان أكريليك، خيط مشمّع ملون، عود سيخ لعمل الثقب',steps:'١. كل طفل يشكّل قطعة صغيرة من الصلصال: قلب، نجمة، حيوان، حرف اسمه.\n٢. يثقبها بالسيخ قبل الجفاف.\n٣. يتركها تجفّ في الهواء ٢٤ ساعة.\n٤. في اليوم التالي يلوّنها بالأكريليك.\n٥. يُعلّقها على خيط مشمّع ملون.',tips:'نشاط ممتد على يومين. لحظة سعيدة في اليوم الثاني حين يرى مجسّمه اكتمل.'},
      {n:68,name:'كيس عطر الأعشاب',goal:'الحس الشمّي والمعرفة بأعشاب البيئة المحلية وصنع هدية طبيعية',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'قطعة قماش شاش أو تول صغيرة، قرفة وقرنفل وخزامى مجففة (من محل البهارات)، خيط ملون',steps:'١. شمّ كل طفل الأعشاب وتحدّث عن كل رائحة: هذه القرفة، هذه الخزامى.\n٢. الطفل يختار ٢-٣ أعشاب يحبها.\n٣. يضعها في مركز قطعة القماش.\n٤. يجمع الأطراف ويربطها بالخيط الملون بإحكام.\n٥. يُزيّن بشريط أو وردة جافة.',tips:'الكيس يعطّر الدولاب أو الحقيبة لأسابيع. علّمهم اسم كل عشبة بالعربي.'},
      {n:69,name:'أقراص الشوفان الطبيعية',goal:'الوعي بالعناية الطبيعية بالجسم وصنع منتج تجميلي حقيقي',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'شوفان ناعم مطحون، ملح خشن، زيت زيتون، عسل طبيعي، قوالب سيليكون أو قالب ثلج',steps:'١. يخلط الطفل في وعاء: ٣ ملاعق شوفان + ملعقة ملح + ملعقتان زيت زيتون + ملعقة عسل.\n٢. يعجن المزيج بيديه حتى يتماسك.\n٣. يضغطه في القالب بشكل قلب أو نجمة.\n٤. يُبرّد في الثلاجة ساعة حتى يتصلب.\n٥. يُخرجه ويُغلّفه بورق شفاف.',tips:'هذا الخلط فعلاً ممتاز لتنظيف اليدين بلطف. الطفل يشعر بالفخر لصنع منتج تجميلي حقيقي!'},
      {n:70,name:'إطار الذكريات',goal:'صنع إطار صورة من مواد بسيطة وتعزيز الذاكرة الجميلة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'عصي جيلاتي (ice cream sticks)، طلاء ملون، غراء قوي، أصداف أو حجارة صغيرة، صورة مطبوعة للطفل',steps:'١. يلوّن الطفل عصيّ الجيلاتي بألوانه المفضلة.\n٢. يُرتّب ٤ عصي في مربع ويُثبّتها بالغراء.\n٣. يُضيف صفاً ثانياً لزيادة السُمك.\n٤. يُزيّن بأصداف أو حجارة صغيرة ملونة.\n٥. يضع صورته داخل الإطار.',tips:'المعلمة تطبع صورة كل طفل مسبقاً. الإطار هدية رائعة للأم في عيد الأم.'},
    ]},
    {cat:'🧠 الإدراك والذكاء العاطفي',catKey:'mind_heart',items:[
      {n:71,name:'خريطة مشاعري الملونة',goal:'تطوير الوعي العاطفي وربط المشاعر بالألوان والتعبير البصري',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورقة بيضاء كبيرة، ألوان تلوين متنوعة',steps:'١. اسأل: لو كان الفرح لوناً ما هو لونك الخاص له؟ والحزن؟ والخوف؟\n٢. كل طفل يرسم دوائر بالألوان التي يخصصها هو لمشاعره.\n٣. داخل كل دائرة يرسم وجهاً أو رمزاً يعبّر عن ذلك الشعور.\n٤. يحكي عن خريطة مشاعره لصديقه.',tips:'لا توجد إجابة صحيحة للون. الفرح ليس بالضرورة أصفر لكل طفل. الهدف التعبير الشخصي.'},
      {n:72,name:'قصة قلبي',goal:'بناء الوعي الذاتي من خلال السرد القصصي الشخصي',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'ورق أبيض، أقلام تلوين',steps:'١. اسأل: ما أسعد يوم في حياتك حتى الآن؟\n٢. كل طفل يرسم قصته في ٤ مشاهد.\n٣. يحكي قصته أمام المجموعة.\n٤. المعلمة تطرح: كيف شعرت في كل مشهد؟ ماذا تعلّمت؟',tips:'ركّز على المشاعر لا على الأحداث. الهدف التعبير عن الداخل لا رسم قصة خارجية.'},
      {n:73,name:'بوصلة جسمي ومشاعري',goal:'ربط المشاعر بأحاسيس الجسم وتنمية الوعي الجسدي العاطفي',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورقة بها رسم جسد بشري مبسّط، ألوان',steps:'١. اسأل: حين تكون خائفاً أين تشعر بذلك في جسمك؟ بطنك؟ صدرك؟ يدك؟\n٢. كل طفل يلوّن المنطقة التي يشعر بها عند كل حالة: خوف، فرح، غضب.\n٣. ناقش: لماذا يتألم بطنك حين تحزن؟ جسدنا يُخبرنا بمشاعرنا.\n٤. علّم: حين يضرب قلبك بسرعة توقّف وتنفّس ثلاث مرات.',tips:'يساعد في الكشف المبكر عن القلق والضغط النفسي لدى الأطفال.'},
      {n:74,name:'بناء الأبراج بالاستراتيجية',goal:'تطوير التفكير المنطقي والإدراك المكاني وضبط النفس عند الفشل',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'مكعبات خشبية أو بلاستيكية، بطاقات تحديات مصورة',steps:'١. قدّم بطاقة تحدي: ابنِ برجاً بـ١٠ قطع دون أن يسقط.\n٢. الطفل يجرب بتركيز.\n٣. إن سقط: ناقش لماذا سقط؟ ماذا ستغيّر في مرتك القادمة؟\n٤. يحاول مجدداً بتعديل الخطة.\n٥. زد التحدي تدريجياً: ابنِ بشكل هرم، بشكل حرف L.',tips:'الهدف الأعمق: تعلّم الصبر على الفشل وإعادة المحاولة. هذه قيمة أعظم من برج ناجح.'},
      {n:75,name:'لعبة الذاكرة المصورة',goal:'تطوير الذاكرة البصرية والتركيز والتفكير الاستراتيجي',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'بطاقات مصورة بأزواج متطابقة (يمكن صنعها من مجلات قديمة)',steps:'١. ضع البطاقات مقلوبة على الطاولة.\n٢. كل طفل يقلب بطاقتين في دوره.\n٣. إن تطابقتا يأخذهما وله دور آخر.\n٤. يفوز من جمع أكثر الأزواج.',tips:'ابدأ بـ٨ أزواج وزد تدريجياً. ناقش: كيف تتذكر أين البطاقة؟ هل لديك استراتيجية خاصة؟'},
      {n:76,name:'ألغاز الأنماط',goal:'تنمية التفكير المنطقي والقدرة على التنبؤ والإكمال',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات بها أنماط متسلسلة من الأشكال والألوان',steps:'١. اعرض نمطاً بسيطاً: أحمر، أزرق، أحمر، أزرق، ماذا يأتي بعد؟\n٢. الطفل يُكمّل النمط.\n٣. زد التعقيد تدريجياً: نمط ثلاثي أو رباعي.\n٤. الطفل يصنع نمطه الخاص ليحله زميله.',tips:'الأنماط هي أساس الرياضيات والبرمجة. أخبر الطفل: أنت تفكر الآن مثل المبرمجين!'},
      {n:77,name:'سلّم ماذا لو؟',goal:'تطوير التفكير النقدي والإبداعي والقدرة على التخيّل المنطقي',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات أسئلة مصورة ومكتوبة',steps:'١. اسأل: ماذا لو كانت الشمس خضراء اللون؟\n٢. الطفل يُجيب ثم يُكمل السلسلة: إذن النباتات ستصبح...\n٣. نتابع معاً: وإذا النباتات تغيّرت فالحيوانات...\n٤. نصل معاً لنهاية منطقية خيالية.',tips:'لا جواب خاطئ. الهدف بناء سلسلة منطقية متسلسلة. كل إجابة صحيحة ما دام لها علاقة.'},
      {n:78,name:'اكتشف الاختلاف',goal:'تطوير التركيز والملاحظة الدقيقة والتحليل البصري',age:'٣-٦ سنوات',time:'١٥ دقيقة',materials:'بطاقات بها صورتان متشابهتان مع فروق دقيقة',steps:'١. اعرض الصورتين جنباً إلى جنب.\n٢. اطلب: اجد ٥ فروق بينهما.\n٣. الطفل يُشير ويشرح كل فرق.\n٤. انتقل لصور بفروق أصعب.',tips:'يمكن صنع هذه البطاقات ذاتياً بالرسم على ورقتين متشابهتين مع إضافة تغييرات صغيرة.'},
      {n:79,name:'نهاية من اختياري',goal:'تنمية الإبداع والتفكير السردي وبناء الثقة بالرأي الشخصي',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'كتاب قصص أو قصة مقروءة، ورق وأقلام',steps:'١. اقرأ قصة حتى المنتصف ثم توقّف.\n٢. اسأل: ماذا تتوقع أن يحدث؟\n٣. كل طفل يرسم أو يحكي نهايته الخاصة.\n٤. اقرأ النهاية الحقيقية.\n٥. قارنوا: أيّ النهايات أجمل؟ لماذا؟',tips:'أحياناً نهاية الطفل أجمل من الأصل. ثمّن ذلك بصدق واحتفل به.'},
      {n:80,name:'مسرح حل المشكلات',goal:'تطوير التفكير الإبداعي في مواجهة العقبات وتنمية الذكاء الاجتماعي',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'بطاقات مواقف مصورة',steps:'١. اسحب بطاقة موقف: نسيت وجبتك والجميع يأكل — ماذا تفعل؟\n٢. مجموعة صغيرة تُمثّل الموقف وحلوله المختلفة.\n٣. المشاهدون يُقيّمون: هذا الحل أفضل لماذا؟\n٤. جرّبوا أكثر من حل لنفس الموقف.',tips:'كرّر: هناك دائماً أكثر من حل. أهم مهارة في الحياة ليست الذكاء بل القدرة على حل المشكلات.'},
      {n:81,name:'رسم المشاعر بالألوان الحرة',goal:'التعبير العاطفي غير اللفظي وتحرير المشاعر بطريقة آمنة وصحية',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'ألوان مائية، ورق كبير، موسيقى هادئة اختيارية',steps:'١. شغّل موسيقى هادئة في الخلفية.\n٢. اطلب: ارسم كيف تشعر الآن — لا شجرة ولا بيت، فقط ألوان وأشكال حرة.\n٣. دع الطفل يرسم بحرية كاملة دون توجيه.\n٤. بعدها اسأل: ما اسم لوحتك؟ كيف تشعر الآن؟',tips:'لا تتدخل في الرسم ولا توجّه. اللوحة مرآة المشاعر الداخلية لا عمل فني للتقييم.'},
      {n:82,name:'تأمل الشجرة الراسخة',goal:'تنمية الإدراك الجسدي والهدوء الداخلي والثبات الانفعالي',age:'٤-٦ سنوات',time:'١٥ دقيقة',materials:'موسيقى طبيعة خفيفة',steps:'١. قف مع الأطفال في دائرة.\n٢. قل: نحن الآن أشجار عملاقة. جذورنا في الأرض. لا رياح تحرّكنا.\n٣. كل طفل يمدّ ذراعيه كأغصان ويتنفس ببطء.\n٤. قل بصوت هادئ: الريح تهب... (يتمايلون قليلاً) لكن جذورنا ثابتة... (يعودون للاستقامة).\n٥. تنفّس عميق ثلاث مرات جماعياً.',tips:'مثالي في بداية اليوم أو بعد موقف مُربك. الاستعارة تُعطي الطفل صورة ذهنية للثبات.'},
      {n:83,name:'قصة الصور المتسلسلة',goal:'تطوير التفكير المنطقي والترتيب الزمني وبناء السرد',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'بطاقات مصورة بأحداث قصة مرتّبة بشكل مختلط (٤-٦ صور)',steps:'١. بدّل ترتيب بطاقات القصة وضعها أمام الطفل.\n٢. الطفل يُعيد ترتيبها بالتسلسل المنطقي الصحيح.\n٣. يحكي القصة معتمداً على الصور.\n٤. انتقل لقصص بـ٦-٨ صور لزيادة التحدي.',tips:'من يرتّب الأحداث يفهم علاقة السبب والنتيجة — أساس التفكير الناضج والناقد.'},
      {n:84,name:'محادثة النعمة',goal:'بناء التفكير الإيجابي والامتنان وتنمية الوعي الذاتي بالنعم',age:'٤-٦ سنوات',time:'١٥ دقيقة',materials:'لا شيء سوى الدائرة الصباحية',steps:'١. في دائرة الصباح، كل طفل يُكمل: اليوم أنا ممتنّ لـ...\n٢. المعلمة تُدوّن الإجابات على ورقة.\n٣. في نهاية الأسبوع تُقرأ أجمل الإجابات بصوت عالٍ.\n٤. اسأل: ماذا لو لم تكن هذه النعمة موجودة في حياتك؟',tips:'التكرار اليومي يبني عادة التأمل والامتنان. هذا تدريب يغيّر طريقة التفكير للأبد.'},
      {n:85,name:'افعل لا تقل فقط',goal:'ترجمة المشاعر والنوايا الجيدة إلى أفعال حقيقية لا مجرد كلام',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات مواقف مصورة',steps:'١. اسحب بطاقة: صديقك حزين لأنه فقد لعبته — ماذا تفعل (لا تقل فقط)؟\n٢. الطفل يُمثّل الفعل الحقيقي: يعانقه، يعطيه لعبته، يجلس بجانبه.\n٣. الزملاء يُقيّمون: هل فعل شيئاً حقيقياً ومفيداً؟\n٤. ناقش: الكلام جميل لكن الفعل أجمل وأقوى.',tips:'يبني الفجوة بين معرفة القيمة الحسنة وتطبيقها فعلاً في الحياة اليومية.'},
    ]},
    {cat:'🤝 التواصل والمهارات الاجتماعية',catKey:'social',items:[
      {n:86,name:'مفاوض صغير',goal:'تطوير مهارة التفاوض والإقناع والوصول لحل وسط مُرضٍ',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'سيناريوهات مصورة بمواقف يومية',steps:'١. ضع سيناريو: عندكم لعبة واحدة وطفلان يريدانها في نفس الوقت.\n٢. الطفلان يتفاوضان: من يلعب أولاً؟ كم الوقت؟\n٣. المعلمة تراقب دون تدخل أول ٣ دقائق.\n٤. إن لم يتفقا تُعلّم قواعد التفاوض: استمع، اقترح، احترم الرأي الآخر.',tips:'الهدف الوصول لحل وسط بأنفسهما. الفوز ليس الهدف — الاتفاق هو الفوز الحقيقي.'},
      {n:87,name:'أسمع بعيني وأذني وقلبي',goal:'تطوير مهارة الاستماع النشط والتواصل الحقيقي العميق',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'لا شيء',steps:'١. علّم قواعد الاستماع الحقيقي: توقّف عن الكلام، انظر للمتحدث، فكّر في كلامه.\n٢. بالأزواج: طفل يحكي حدثاً مهماً له لمدة دقيقة.\n٣. المستمع يُعيد ما سمعه: قلت إنك...\n٤. المتحدث يُقيّم: هل استمع إليّ بشكل صحيح؟',tips:'أصعب مهارة اجتماعية. طوّرها مبكراً تُغيّر علاقات الطفل مع الآخرين طوال حياته.'},
      {n:88,name:'دائرة الكلام المُرتَّب',goal:'تنمية آداب الحوار والقدرة على التعبير المنظّم أمام الآخرين',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'كرة صغيرة',steps:'١. يجلس الأطفال في دائرة.\n٢. موضوع الحوار: ما أجمل شيء رأيته في حياتك؟\n٣. فقط من بيده الكرة يتكلم، والبقية يستمعون باحترام.\n٤. بعد كلامه يُمرّر الكرة لمن يرفع يده.',tips:'نمّذج القواعد: لا مقاطعة، لا سخرية، كل كلام محترم. هذه هي مهارات الاجتماعات الناجحة.'},
      {n:89,name:'المهمة المشتركة',goal:'بناء مهارة التعاون والتخطيط الجماعي لتحقيق هدف مشترك',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'مكعبات بناء أو مواد فن',steps:'١. المهمة: بناء جسر يستطيع حمل لعبة صغيرة بين مكانين.\n٢. المجموعة تخطط معاً: من يبني القاعدة؟ من يضع الجسر؟ من يختبره؟\n٣. ينفذون خطتهم معاً.\n٤. يختبرون: هل يحمل الجسر؟\n٥. إن فشل يُعيدون التخطيط مع التحليل.',tips:'التخطيط أهم من النتيجة. اسأل دائماً: كيف قسّمتم العمل؟ هل استمع كل واحد للآخر؟'},
      {n:90,name:'قائد وتابع',goal:'تطوير مهارة القيادة والإنصات والثقة المتبادلة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'مناديل لعصب العيون، مساحة واسعة',steps:'١. بالأزواج: قائد وتابع (أعين التابع معصوبة).\n٢. القائد يوجّه التابع بالكلام فقط: خطوتان للأمام، اتجه يساراً بخطوة واحدة.\n٣. يُبدلان الأدوار.\n٤. ناقش: كيف شعرت كقائد مسؤول؟ كيف شعرت حين اتّبعت ووثقت؟',tips:'يكشف عن الأطفال الطبيعيين في القيادة. ويعلّم أن القيادة مسؤولية لا سلطة.'},
      {n:91,name:'جسر الكلمات',goal:'تنمية التعبير اللغوي الدقيق والقدرة على الشرح والإيصال',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'أشياء موجودة في الفصل',steps:'١. طفل يختار شيئاً في الفصل سراً.\n٢. يصفه بثلاث جمل دون قول اسمه: هو مستدير، صغير، نقفز به.\n٣. الأطفال يخمّنون ما هو.\n٤. من يصف الشيء الأصعب ويُخمّنه زملاؤه يفوز.',tips:'يطوّر مهارة الوصف الدقيق — مهارة أساسية في التواصل والكتابة والتعبير.'},
      {n:92,name:'مرسال السلام',goal:'تنمية التواصل الإيجابي وحل النزاعات عبر الرسالة والكلمة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق ملون، أقلام، ظروف صغيرة',steps:'١. اسأل: هل تذكر موقفاً اختلفت فيه مع صديقك أو أحزنته؟\n٢. كل طفل يرسم أو يُملّي رسالة اعتذار أو تحية دافئة.\n٣. المعلمة تُساعد في كتابة الكلمات.\n٤. المستقبل يقرأ الرسالة ويرد بكلمة.',tips:'علّم أن الاعتذار قوة لا ضعف. من يعتذر أولاً هو الأشجع والأذكى.'},
      {n:93,name:'التعاون بالحبل',goal:'بناء مهارة التنسيق الجسدي الجماعي والإحساس الحقيقي بالفريق',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'حبل متوسط الطول، كرة أو هدف',steps:'١. كل الأطفال يمسكون الحبل بمسافات متساوية بينهم.\n٢. المهمة: تحريك الحبل معاً لإيصال الكرة من نقطة لأخرى.\n٣. إن تسرّع أحدهم عن الآخرين ينقطع التنسيق.\n٤. يتدربون على الإيقاع المشترك.',tips:'استعارة حية للعمل الجماعي: إذا تسرّع أحدنا أو تأخّر تعثّر الجميع معه.'},
      {n:94,name:'رسالة الشكر',goal:'تعزيز التواصل الإيجابي والاعتراف بجميل الآخرين',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق ملون، أقلام، ظروف مزيّنة',steps:'١. كل طفل يُفكّر: من فعل لي شيئاً جميلاً هذا الأسبوع؟\n٢. يرسم أو يُملّي رسالة شكر له.\n٣. يضعها في ظرف مزيّن.\n٤. يُسلّمها بيده لمن كتبها إليه في وقت الدائرة.',tips:'لحظة التسليم أمام المجموعة لحظة لا تُنسى لكليهما. سجّلها بصورة إن أمكن.'},
      {n:95,name:'لغة الصمت',goal:'تطوير التواصل غير اللفظي وفهم الرسائل بدون كلمات',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات بها رسائل بسيطة مصورة',steps:'١. أعلن القاعدة: لا صوت من الآن.\n٢. كل طفل يُبلّغ رسالة لزميله بالإشارات والوجه والأيدي فقط.\n٣. المستقبل يُخمّن الرسالة.\n٤. ناقشوا: ما الصعب في التواصل بلا كلمات؟ متى نستخدم هذه المهارة؟',tips:'يُدرّب الطفل على قراءة الرسائل غير اللفظية — أساس التعاطف والفهم العميق للآخرين.'},
      {n:96,name:'مجلس أطفالنا',goal:'بناء مهارة الحوار الجماعي وإبداء الرأي واتخاذ القرار الجماعي',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'مقاعد بشكل دائرة',steps:'١. أعلن موضوع المجلس: ماذا نفعل في اليوم الحر القادم؟\n٢. كل طفل يقترح فكرة واحدة دون انتقاد أي فكرة.\n٣. تُكتب الأفكار كلها على اللوح.\n٤. التصويت: كل طفل يضع علامة على فكرته المفضلة.\n٥. الفكرة الفائزة تُنفَّذ فعلاً.',tips:'صوت الطفل يُحسَب ويُحترَم. هذا يبني الشعور بالمسؤولية والانتماء الحقيقي للمجموعة.'},
      {n:97,name:'منافسة التعاون',goal:'إثبات عملياً أن التعاون أكثر فاعلية من المنافسة الفردية',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'مهمة بناء أو رسم محددة',steps:'١. المرحلة الأولى: كل طفل يعمل وحده لإنجاز المهمة.\n٢. المرحلة الثانية: مجموعات ٣ أطفال تُنجز نفس المهمة.\n٣. قارنوا النتائج: أيها أجمل؟ أيها أسرع؟\n٤. ناقش: لماذا العمل الجماعي أقوى أحياناً؟',tips:'التجربة تُقنع أكثر من الكلام. دع النتائج المرئية تتحدث بدلاً منك.'},
      {n:98,name:'رفيقي الجديد',goal:'بناء مهارة التعارف وكسر الحاجز مع من لا نعرفه وتوسيع دائرة الصداقة',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات بها أسئلة تعارف مصورة',steps:'١. كل طفل يُقرن بزميل لا يلعب معه عادة.\n٢. كل منهما يسأل الآخر ٣ أسئلة: ما اسمك؟ ما ألوانك المفضلة؟ ما حيوانك المفضل؟\n٣. كل طفل يُعرّف رفيقه الجديد أمام المجموعة.\n٤. يُهديه رسمة صغيرة كهدية ترحيب.',tips:'أحياناً أعمق الصداقات تكون مع من لم نقترب منه أول يوم. افتح القلب دائماً.'},
      {n:99,name:'مسرح التعاطف',goal:'تعميق التعاطف من خلال تجربة حياة الآخر وعيش مشاعره فعلاً',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'بطاقات شخصيات بأحوال مختلفة',steps:'١. كل طفل يسحب بطاقة شخصية: طفل لا يتحدث لغتنا، طفل ضعيف البصر، طفل بطيء الحركة.\n٢. لمدة ١٠ دقائق يُمثّل هذه الشخصية في أنشطة الفصل.\n٣. يعود لنفسه ويحكي: كيف شعرت؟ ما الصعب في حياة هذا الشخص؟\n٤. ناقش: كيف نساعد هؤلاء في حياتنا الحقيقية؟',tips:'التعاطف لا يُعلَّم بالكلام بل بالتجربة المحاكية. هذا النشاط يُغيّر القلوب.'},
      {n:100,name:'احتفالنا الجماعي',goal:'ختم تجربة التعلم الجماعي بالاحتفاء بكل فرد وبالفريق ككل',age:'٣-٦ سنوات',time:'٤٥ دقيقة',materials:'ورق ملون، أقلام، موسيقى مبهجة',steps:'١. كل طفل يكتب أو يرسم أجمل شيء تعلّمه هذا الموسم.\n٢. كل طفل يقف ويقول جملة امتنان لزميل محدد بالاسم.\n٣. نصنع لوحة احتفالية جماعية: كل طفل يترك بصمته عليها.\n٤. موسيقى مبهجة ورقص وفرح مشترك.\n٥. كل طفل يأخذ لوحته ورسائل التقدير إلى البيت.',tips:'الختام بأهمية البداية. اصنع ذكرى جميلة تدوم في قلب كل طفل.'},
    ]},
  ];
  // build global index so publishActivity() can look up act data by number
  window._actsIndex={};
  ACTS.forEach(cat=>cat.items.forEach(act=>{_actsIndex[act.n]={...act,cat:cat.cat,catKey:act.catKey};}));

  const isSA=Auth.isSuperAdmin();
  const isTeacher=Auth.user?.role==='teacher';
  const catColors={cognitive:'#6366f1',motor:'#f59e0b',values:'#ec4899',islamic:'#10b981',life:'#f97316',language:'#3b82f6',emotional:'#eab308',summer:'#f43f5e',national:'#14b8a6',eco:'#22c55e',relax:'#a855f7',handmade:'#e11d48',mind_heart:'#8b5cf6',social:'#0ea5e9',custom:'#0d9488'};
  // خزّن الفهرس عالمياً لاستخدامه عند الإرسال
  window._actsIndex=window._actsIndex||{};ACTS.forEach(cat=>cat.items.forEach(a=>{window._actsIndex[a.n]={...a,cat:cat.cat};}));

  // ===== واجهة المعلمة: الأنشطة المُسندة لها =====

  // مكتبة موحّدة: الجاهزة + المخصّصة

  const filtered=selCat==='all'?libCats:libCats.filter(c=>c.catKey===selCat);

      <summary style="background:${catColors[catKey]||'#6366f1'}11;border-bottom:2px solid ${catColors[catKey]||'#6366f1'}33;padding:14px 16px;cursor:pointer;list-style:none;outline:none">

            <span style="font-weight:700;font-size:14px;color:#1e293b">${esc(act.name)}</span>
          </div>
          <div onclick="event.stopPropagation()" style="flex-shrink:0;display:flex;gap:4px">
            <button onclick="Modals.sendActivity('${act.key}')" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">📤 إرسال للمعلمات</button>
            ${(act.custom&&isSA)?`<button onclick="deleteCustomActivity('${act.id}')" style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🗑️</button>`:''}
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;margin-right:38px;flex-wrap:wrap">
          <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:12px;font-size:11px">⏱ ${esc(act.time||'—')}</span>
          <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:12px;font-size:11px">👶 ${esc(act.age||'—')}</span>
          ${act.custom?`<span style="background:#ccfbf1;color:#0f766e;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700">✍️ مضاف</span>`:''}
        </div>
      </summary>
      <div style="padding:16px">
        ${act.image?`<img src="${act.image}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:12px">`:''}
        <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">الهدف</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(act.goal||'—')}</div></div>
        <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">المواد المطلوبة</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(act.materials||'—')}</div></div>
        <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:6px">خطوات التنفيذ</div><div style="font-size:13px;color:#334155;line-height:1.9;white-space:pre-line">${esc(act.steps||'—')}</div></div>
        ${act.tips?`<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:3px">💡 نصيحة للمعلمة</div><div style="font-size:12px;color:#78350f;line-height:1.7">${esc(act.tips)}</div></div>`:''}
        ${act.attachment?`<a href="${act.attachment.data}" download="${esc(act.attachment.name)}" style="display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;text-decoration:none">📎 ${esc(act.attachment.name)} (${act.attachment.size||''})</a>`:''}
      </div>
    </details>`;
  return `
  <div style="padding:20px">
    <div style="background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;border-radius:16px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden">

      <p style="margin:0 0 14px;opacity:.85;font-size:14px">${totalStatic} نشاط جاهز + ${custom.length} نشاط مضاف — قابلة للتوسّع وجاهزة للإرسال للمعلمات</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" style="background:#fff;color:#4f46e5;font-weight:800;border:none" onclick="Modals.createActivity()">➕ إنشاء نشاط جديد</button>
        <button class="btn" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:700" onclick="App.go('activities',{actTab:'track'})">📊 متابعة التنفيذ</button>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">

      ${libCats.map(c=>`<span class="chip ${selCat===c.catKey?'active':''}" style="font-size:12px;padding:6px 12px" onclick="App.go('activities',{actCat:'${c.catKey}'})">${c.cat.replace(/ \(.*/,'')} (${c.items.length})</span>`).join('')}
    </div>
    ${filtered.map(cat=>`
      <div style="margin-bottom:28px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">
          ${cat.items.map(act=>actCardAdmin(act,cat.catKey)).join('')}
        </div>
      </div>`).join('')}
  </div>`;
},

// ===== واجهة المعلمة: الأنشطة المُسندة لها + تعليم التنفيذ =====
_teacherActivities(catColors){
  const me=Auth.user;
  const assigns=DB.activityAssignments().filter(a=>
    a.scope==='all'||(a.scope==='branch'&&a.branchId===me.branchId)||(a.scope==='teacher'&&a.teacherId===me.id)
  ).sort((a,b)=>(b.sentAt||'').localeCompare(a.sentAt||''));
  const reports=DB.activityReports();
  const myRep=(aid)=>reports.find(r=>r.assignmentId===aid&&r.teacherId===me.id);
  const doneCnt=assigns.filter(a=>myRep(a.id)?.done===true).length;
  return `
  <div style="padding:20px">
    <div style="background:linear-gradient(135deg,#16a34a 0%,#059669 100%);color:#fff;border-radius:16px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden">
      <div style="position:absolute;top:-20px;left:-20px;font-size:120px;opacity:.07">🎯</div>
      <h2 style="margin:0 0 6px;font-size:22px;font-weight:800">🎯 أنشطتي</h2>
      <p style="margin:0 0 12px;opacity:.9;font-size:14px">الأنشطة المُرسلة لك من الإدارة — علّمي كل نشاط بعد تنفيذه</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="background:rgba(255,255,255,.18);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700">📋 ${assigns.length} نشاط</div>
        <div style="background:rgba(255,255,255,.18);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700">✅ ${doneCnt} منفّذ</div>
      </div>
    </div>
    ${assigns.length===0?`<div style="text-align:center;padding:60px 20px;color:#94a3b8"><div style="font-size:56px;margin-bottom:16px">📭</div><div style="font-size:18px;font-weight:700;color:#64748b">لا توجد أنشطة مُرسلة لك بعد</div><div style="font-size:14px;margin-top:6px">ستظهر هنا الأنشطة التي ترسلها الإدارة</div></div>`:
    assigns.map(a=>{
      const r=myRep(a.id);
      const cc=catColors[a.catKey]||'#16a34a';
      const done=r?.done===true, notDone=r?.done===false;
      return `<div style="background:#fff;border-radius:12px;border:2px solid ${done?'#86efac':notDone?'#fca5a5':'#e2e8f0'};overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px">
        <div style="background:${cc}11;border-bottom:2px solid ${cc}33;padding:14px 16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <span style="font-weight:800;font-size:16px;color:#1e293b">${esc(a.name)}</span>
            ${done?'<span class="badge badge-green">✅ نُفّذ</span>':notDone?'<span class="badge badge-red">❌ لم يُنفّذ</span>':'<span class="badge badge-yellow">⏳ بانتظار التنفيذ</span>'}
          </div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:12px;font-size:11px">⏱ ${esc(a.time||'—')}</span>
            <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:12px;font-size:11px">👶 ${esc(a.age||'—')}</span>
            <span style="background:#eef2ff;color:#4338ca;padding:2px 8px;border-radius:12px;font-size:11px">👤 من: ${esc(a.sentByName||'الإدارة')}</span>
          </div>
        </div>
        <div style="padding:16px">
          ${a.image?`<img src="${a.image}" style="width:100%;max-height:260px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:12px">`:''}
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">الهدف</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(a.goal||'—')}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">المواد المطلوبة</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(a.materials||'—')}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:6px">خطوات التنفيذ</div><div style="font-size:13px;color:#334155;line-height:1.9;white-space:pre-line">${esc(a.steps||'—')}</div></div>
          ${a.tips?`<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:3px">💡 نصيحة</div><div style="font-size:12px;color:#78350f;line-height:1.7">${esc(a.tips)}</div></div>`:''}
          ${a.attachment?`<a href="${a.attachment.data}" download="${esc(a.attachment.name)}" style="display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;text-decoration:none;margin-bottom:14px">📎 ${esc(a.attachment.name)} (${a.attachment.size||''})</a>`:''}
          <div style="border-top:1px solid #e2e8f0;padding-top:14px">
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:8px">هل نفّذتِ النشاط؟ <span style="color:#dc2626">(الصورة إلزامية للتنفيذ)</span></div>
            <textarea id="actnote-${a.id}" class="input" rows="2" placeholder="ملاحظة (اختياري): كيف تم التنفيذ، عدد الأطفال..." style="resize:none;margin-bottom:8px">${esc(r?.note||'')}</textarea>
            <label style="cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:9px 12px;border:1.5px ${r?.photo?'solid #86efac':'dashed #f59e0b'};border-radius:8px;background:${r?.photo?'#f0fdf4':'#fffbeb'};color:${r?.photo?'#166534':'#92400e'};margin-bottom:10px">
              ${r?.photo?'✅ تم إرفاق الصورة — اضغطي لتغييرها':'📷 أرفقي صورة التنفيذ (إلزامية) *'}
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="teacherActivityPhoto('${a.id}',this)">
            </label>
            ${r?.photo?`<div style="margin-bottom:10px"><a href="${r.photo}" target="_blank"><img src="${r.photo}" style="max-height:90px;border-radius:8px;border:1px solid #e2e8f0"></a></div>`:''}

              <button class="btn ${done?'btn-success':'btn-secondary'}" onclick="teacherReportActivity('${a.id}',true)">✅ تم التنفيذ</button>
              <button class="btn ${notDone?'btn-danger':'btn-secondary'}" onclick="teacherReportActivity('${a.id}',false)">❌ لم يُنفّذ</button>
            </div>
            ${r?`<div style="font-size:11px;color:#94a3b8;margin-top:8px">آخر تحديث: ${formatRelTime(r.at)}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
},

// ===== متابعة تنفيذ الأنشطة (للإدارة) =====
_activityTracking(catColors){
  const bid=Auth.branchId();
  let assigns=DB.activityAssignments();
  if(bid) assigns=assigns.filter(a=>a.scope==='all'||a.branchId===bid);
  assigns=assigns.sort((a,b)=>(b.sentAt||'').localeCompare(a.sentAt||''));
  const reports=DB.activityReports();
  const teachers=DB.users().filter(u=>u.role==='teacher');
  const targetTeachers=(a)=>{
    if(a.scope==='teacher') return teachers.filter(t=>t.id===a.teacherId);
    if(a.scope==='branch') return teachers.filter(t=>t.branchId===a.branchId);
    return teachers; // all
  };
  return `
  <div style="padding:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px">
      <h2 style="margin:0;font-size:20px;font-weight:800;color:#4f46e5">📊 متابعة تنفيذ الأنشطة</h2>
      <button class="btn btn-secondary" onclick="App.go('activities')">← رجوع للمكتبة</button>
    </div>
    ${assigns.length===0?`<div class="empty-state"><div class="es-icon">📊</div><p>لم تُرسل أي أنشطة للمعلمات بعد</p></div>`:
    assigns.map(a=>{
      const tt=targetTeachers(a);
      const recs=tt.map(t=>({t,r:reports.find(r=>r.assignmentId===a.id&&r.teacherId===t.id)}));
      const doneN=recs.filter(x=>x.r?.done===true).length;
      const cc=catColors[a.catKey]||'#4f46e5';
      const scopeLbl=a.scope==='all'?'كل المعلمات':a.scope==='branch'?('فرع: '+DB.branchName(a.branchId)):('معلمة: '+esc(a.teacherName||'—'));
      return `<div class="card" style="border-right:5px solid ${cc}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <div><span style="font-size:16px;font-weight:800">${esc(a.name)}</span><div style="font-size:12px;color:#64748b;margin-top:2px">🎯 ${esc(scopeLbl)} · أُرسل ${formatRelTime(a.sentAt)} · من ${esc(a.sentByName||'—')}</div></div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="badge badge-green">✅ ${doneN}/${tt.length}</span>

// ---------- ACCOUNTING (super admin only) ----------
accounting(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const subs=DB.subscriptions();
  const children=DB.children();
  const branches=DB.branches();
  const pmLbl={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'};
  const typeLbl={daily:'يومي',weekly:'أسبوعي',monthly:'٣٠ يوم',custom:'مخصص'};
  const filterBranch=App.params.accBranch||'all';
  const filterPeriod=App.params.accPeriod||'all';
  const filterPay=App.params.accPay||'all';
  const dateFrom=App.params.accFrom||'';
  const dateTo=App.params.accTo||'';
  const searchQ=(App.params.accQ||'').toLowerCase();

  let filtered=subs;
  if(filterBranch!=='all') filtered=filtered.filter(s=>s.branchId===filterBranch);
  if(filterPeriod!=='all') filtered=filtered.filter(s=>s.period===filterPeriod);
  // فلتر الفترة الزمنية: يطابق إذا تقاطع نطاق الاشتراك مع النطاق المحدد
  if(dateFrom) filtered=filtered.filter(s=>(s.endDate||'')>=dateFrom);
  if(dateTo)   filtered=filtered.filter(s=>(s.startDate||'')<=dateTo);
  // فلتر حالة الدفع — استخدم الدالة المشتركة
  if(filterPay==='paid')      filtered=filtered.filter(s=>Views._paymentState(s)==='paid');
  else if(filterPay==='pending')   filtered=filtered.filter(s=>Views._paymentState(s)==='pending');
  else if(filterPay==='defaulter') filtered=filtered.filter(s=>Views._paymentState(s)==='defaulter');
  else if(filterPay==='deferred')  filtered=filtered.filter(s=>s.paymentStatus==='deferred');
  if(searchQ) filtered=filtered.filter(s=>{const c=children.find(x=>x.id===s.childId);return c&&(c.name.toLowerCase().includes(searchQ)||c.parentName.toLowerCase().includes(searchQ));});
  filtered.sort((a,b)=>(b.createdAt||b.startDate||'').localeCompare(a.createdAt||a.startDate||''));

  // إحصائيات الحالات الثلاث (تُحسَب من جميع الاشتراكات لا المفلترة)

// ===== الإقفال المحاسبي الشهري =====
// يحسب أرقام شهر معيّن (إيرادات الاشتراكات + المبيعات − المصروفات − الرواتب) موزّعة على الفروع
_monthFinance(monthKey){
  const subs=DB.subscriptions().filter(s=>(s.createdAt||s.startDate||'').startsWith(monthKey));
  const sales=DB.sales().filter(s=>(s.date||'').startsWith(monthKey));
  const exps=DB.expenses().filter(e=>(e.date||'').startsWith(monthKey));
  const pays=(DB.hrPayroll?DB.hrPayroll():[]).filter(p=>p.month===monthKey);
  const subRevenue=subs.reduce((a,s)=>a+(+s.paidAmount||0),0);
  const salesRevenue=sales.reduce((a,s)=>a+(+s.price||0),0);
  const expenses=exps.reduce((a,e)=>a+(+e.amount||0),0);
  const payroll=pays.reduce((a,p)=>a+(+p.netSalary||0),0);
  const income=subRevenue+salesRevenue;
  const net=income-expenses-payroll;
  const byBranch=DB.branches().map(b=>{
    const bi=subs.filter(s=>s.branchId===b.id).reduce((a,s)=>a+(+s.paidAmount||0),0)
            +sales.filter(s=>s.branchId===b.id).reduce((a,s)=>a+(+s.price||0),0);
    const bx=exps.filter(e=>e.branchId===b.id).reduce((a,e)=>a+(+e.amount||0),0);
    const bp=pays.filter(p=>{const emp=(DB.hrEmployees?DB.hrEmployees():[]).find(e=>e.id===p.employeeId);return emp&&emp.branchId===b.id;}).reduce((a,p)=>a+(+p.netSalary||0),0);
    return {branchId:b.id,name:b.name,income:bi,expenses:bx,payroll:bp,net:bi-bx-bp};
  });
  return {month:monthKey,subRevenue,salesRevenue,expenses,payroll,income,net,byBranch,
    counts:{subs:subs.length,sales:sales.length,expenses:exps.length,pays:pays.length}};
},
_monthLabel(m){
  if(!m) return '';
  const [y,mo]=m.split('-');
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${String(+mo).padStart(2,'0')}/${y} (${names[(+mo||1)-1]})`;
},
monthlyClose(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const month=App.params.mcMonth||T0.slice(0,7);
  const f=Views._monthFinance(month);
  const closings=DB.monthlyClosings();
  const closed=closings.find(c=>c.month===month);
  const isCurrent=month===T0.slice(0,7);
  const lbl=Views._monthLabel(month);
  const money=(n)=>(+n||0).toLocaleString();

// ---------- EXPENSES ----------
expenses(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const isSA=Auth.isSuperAdmin();
  const bid=Auth.branchId();
  const exps=DB.expenses();
  const branches=DB.branches();
  const fMonth=App.params.expMonth||T0.slice(0,7); // YYYY-MM
  const fCat=App.params.expCat||'all';
  const fBranch=bid||(App.params.expBranch||'all');
  const catLbl={salary:'👩‍🏫 رواتب',rent:'🏢 إيجار',utilities:'💡 فواتير (كهرباء/ماء/نت)',supplies:'📦 مستلزمات',maintenance:'🔧 صيانة',transport:'🚗 مواصلات',marketing:'📢 تسويق',food:'🍽️ مأكولات',other:'📋 أخرى'};
  const pmLbl={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',cheque:'📃 شيك',qurrah:'🟣 قُرّة'};
  let filtered=exps;
  if(fMonth) filtered=filtered.filter(e=>(e.date||'').startsWith(fMonth));
  if(fCat!=='all') filtered=filtered.filter(e=>e.category===fCat);
  if(fBranch!=='all') filtered=filtered.filter(e=>e.branchId===fBranch);
  filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  // إحصائيات الشهر
  const monthTotal=filtered.reduce((a,e)=>a+(+e.amount||0),0);
  const byCat={};
  filtered.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+(+e.amount||0);});
  const topCat=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  // إيرادات نفس الشهر (الدفعات المستلمة) — مع فلترة الفرع إن وجد
  const monthSubs=DB.subscriptions().filter(s=>(s.createdAt||s.startDate||'').startsWith(fMonth)&&(fBranch==='all'||s.branchId===fBranch));
  const monthRevenue=monthSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);
  const monthSales=DB.sales().filter(s=>(s.date||'').startsWith(fMonth)&&(fBranch==='all'||!s.branchId||s.branchId===fBranch)).reduce((a,s)=>a+(+s.price||0),0);
  const totalIncome=monthRevenue+monthSales;
  const netProfit=totalIncome-monthTotal;

  return `
  <div class="stats-grid">
    ${isSA?`<div class="stat-card green"><div class="stat-val">${totalIncome.toLocaleString()}</div><div class="stat-lbl">📈 إيرادات الشهر (ر.س)</div></div>`:''}
    <div class="stat-card red"><div class="stat-val">${monthTotal.toLocaleString()}</div><div class="stat-lbl">📉 مصروفات الشهر (ر.س)</div></div>
    ${isSA?`<div class="stat-card ${netProfit>=0?'blue':'red'}"><div class="stat-val">${netProfit.toLocaleString()}</div><div class="stat-lbl">${netProfit>=0?'💎 صافي الربح':'⚠️ خسارة'} (ر.س)</div></div>`:''}
    <div class="stat-card yellow"><div class="stat-val">${topCat?catLbl[topCat[0]]?.split(' ')[1]||'—':'—'}</div><div class="stat-lbl">${topCat?'أعلى بند ('+topCat[1].toLocaleString()+' ر.س)':'لا يوجد'}</div></div>
  </div>
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">📅 الشهر</label>
        <input class="input" type="month" value="${fMonth}" onchange="expSet('expMonth',this.value)">
      </div>
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">🏷️ الفئة</label>
        <select class="input" onchange="expSet('expCat',this.value)">
          <option value="all">الكل</option>
          ${Object.entries(catLbl).map(([k,l])=>`<option value="${k}" ${fCat===k?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      ${!bid?`<div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px">🏢 الفرع</label>
        <select class="input" onchange="expSet('expBranch',this.value)">
          <option value="all">الكل</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>`:`<div class="input-group" style="margin:0"><label style="font-size:12px">🏢 الفرع</label><div class="input" style="background:#f8fafc;color:#0f766e;font-weight:700">${esc(DB.branchName(bid))}</div></div>`}
      <button class="btn btn-primary btn-sm" onclick="Modals.addExpense()">+ تسجيل مصروف</button>
      <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('exp-table','مصروفات-'+'${fMonth}')">📊 CSV</button>
      ${(fCat!=='all'||(!bid&&fBranch!=='all'))?`<button class="btn btn-secondary btn-sm" onclick="App.go('expenses',{expMonth:'${fMonth}'})">✕ مسح</button>`:''}
    </div>
  </div>
  <div class="card">
    <div class="card-title">💸 مصروفات ${fMonth} (${filtered.length})</div>
    <div class="table-wrap"><table id="exp-table">
      <thead><tr><th>التاريخ</th><th>الفئة</th><th>الوصف</th><th>الفرع</th><th>المبلغ</th><th>طريقة الدفع</th><th>أضافها</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(e=>`<tr>
          <td style="font-size:13px">${formatDate(e.date)}</td>
          <td>${catLbl[e.category]||e.category||'—'}</td>
          <td>${esc(e.description||'—')}</td>
          <td>${e.branchId?`<span class="badge badge-blue" style="font-size:10px">${DB.branchName(e.branchId)}</span>`:'<span style="color:#94a3b8">—</span>'}</td>
          <td style="color:#ef4444;font-weight:700">${(+e.amount||0).toLocaleString()} ر.س</td>
          <td style="font-size:12px">${pmLbl[e.paymentMethod]||'—'}</td>
          <td style="font-size:12px;color:#64748b">${esc(e.addedBy||'—')}</td>
          <td>
            <button class="btn btn-secondary btn-xs" onclick="Modals.editExpense('${e.id}')">✏️</button>
            <button class="btn btn-danger btn-xs" onclick="deleteExpense('${e.id}')">🗑</button>
          </td>
        </tr>`).join(''):`<tr><td colspan="8"><div class="empty-state"><div class="es-icon">💸</div><p>لا توجد مصروفات لهذا الشهر</p></div></td></tr>`}
      </tbody>
    </table></div>
  </div>`;
},

// ---------- الوثائق الحكومية (سجل تجاري، دفاع مدني...) ----------
govDocs(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const branches=DB.branches();
  const docs=DB.govDocs();
  const fBranch=App.params.gdBranch||'all';
  const fStatus=App.params.gdStatus||'all';
  let filtered=docs;
  if(fBranch!=='all') filtered=filtered.filter(d=>d.branchId===fBranch);
  if(fStatus!=='all') filtered=filtered.filter(d=>{
    const st=DB.govDocStatus(d);
    if(fStatus==='expired') return st==='expired';
    if(fStatus==='soon') return st==='soon7'||st==='soon30';
    if(fStatus==='active') return st==='active';
    return true;
  });
  filtered=[...filtered].sort((a,b)=>(a.expiryDate||'').localeCompare(b.expiryDate||''));

  const expiredCnt=docs.filter(d=>DB.govDocStatus(d)==='expired').length;
  const soonCnt=docs.filter(d=>['soon7','soon30'].includes(DB.govDocStatus(d))).length;
  const activeCnt=docs.filter(d=>DB.govDocStatus(d)==='active').length;

  const statusBadge=(st)=>{
    const map={expired:['badge-red','🔴 منتهية'],soon7:['badge-red','🟠 تنتهي خلال 7 أيام'],soon30:['badge-yellow','🟡 تنتهي خلال 30 يوم'],active:['badge-green','🟢 سارية'],none:['badge-gray','—']};
    const [c,l]=map[st]||map.none;
    return `<span class="badge ${c}">${l}</span>`;
  };
  const attachCell=(d)=>{
    if(!d.fileData) return '<span style="color:#94a3b8">—</span>';
    if((d.fileType||'').startsWith('image/')) return `<a href="${d.fileData}" target="_blank"><img src="${d.fileData}" style="max-width:48px;max-height:48px;border-radius:6px;border:1px solid #e2e8f0;object-fit:cover"></a>`;
    return `<a href="${d.fileData}" target="_blank" download="${esc(d.fileName||'document')}" class="btn btn-secondary btn-xs">📄 فتح</a>`;
  };

  return `
  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-val">${docs.length}</div><div class="stat-lbl">🏛️ إجمالي الوثائق</div></div>
    <div class="stat-card red"><div class="stat-val">${expiredCnt}</div><div class="stat-lbl">🔴 منتهية</div></div>
    <div class="stat-card yellow"><div class="stat-val">${soonCnt}</div><div class="stat-lbl">🟠 تنتهي قريباً (≤30 يوم)</div></div>
    <div class="stat-card green"><div class="stat-val">${activeCnt}</div><div class="stat-lbl">🟢 سارية</div></div>
  </div>
  <div class="print-cover">
    <h1>🏛️ الوثائق الحكومية</h1>
    <p>${fBranch==='all'?'كل الفروع':esc(DB.branchName(fBranch))} · تاريخ الطباعة: ${formatDate(T0)}</p>
  </div>
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">🏢 الفرع</label>
        <select class="input" onchange="gdSet('gdBranch',this.value)">
          <option value="all" ${fBranch==='all'?'selected':''}>الكل</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">📌 الحالة</label>
        <select class="input" onchange="gdSet('gdStatus',this.value)">
          <option value="all" ${fStatus==='all'?'selected':''}>الكل</option>
          <option value="expired" ${fStatus==='expired'?'selected':''}>منتهية</option>
          <option value="soon" ${fStatus==='soon'?'selected':''}>تنتهي قريباً</option>
          <option value="active" ${fStatus==='active'?'selected':''}>سارية</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="Modals.addGovDoc()">+ إضافة وثيقة</button>
      <button class="btn btn-secondary btn-sm" onclick="printAllGovDocs()">🖨️ طباعة الكل / PDF</button>
      <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('gd-table','الوثائق-الحكومية')">📊 CSV</button>
      ${(fBranch!=='all'||fStatus!=='all')?`<button class="btn btn-secondary btn-sm" onclick="App.go('govDocs')">✕ مسح</button>`:''}
    </div>
  </div>
  <div class="card">
    <div class="card-title">🏛️ الوثائق (${filtered.length})</div>
    <div class="table-wrap"><table id="gd-table">
      <thead><tr><th>الفرع</th><th>نوع الوثيقة</th><th>رقم الوثيقة</th><th>تاريخ الانتهاء</th><th>الحالة</th><th>المرفق</th><th>أضافها</th><th class="no-print">إجراءات</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(d=>`<tr>
          <td><span class="badge badge-blue" style="font-size:10px">🏢 ${esc(DB.branchName(d.branchId))}</span></td>
          <td>${esc(d.type==='other'?(d.customType||'أخرى'):Views._govDocTypeLabel(d.type))}</td>
          <td style="font-size:13px">${esc(d.docNumber||'—')}</td>
          <td style="font-size:13px">${formatDate(d.expiryDate)}</td>
          <td>${statusBadge(DB.govDocStatus(d))}</td>
          <td>${attachCell(d)}</td>
          <td style="font-size:12px;color:#64748b">${esc(d.addedBy||'—')}</td>
          <td class="no-print">
            <button class="btn btn-secondary btn-xs" onclick="Modals.editGovDoc('${d.id}')">✏️</button>
            <button class="btn btn-danger btn-xs" onclick="deleteGovDoc('${d.id}')">🗑</button>
          </td>
        </tr>`).join(''):`<tr><td colspan="8"><div class="empty-state"><div class="es-icon">🏛️</div><p>لا توجد وثائق مسجّلة${fBranch!=='all'||fStatus!=='all'?' بهذه الفلاتر':''}</p></div></td></tr>`}
      </tbody>
    </table></div>
  </div>`;
},

// ---------- DAILY TASKS (super admin only) ----------
tasks(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const subs=DB.subscriptions();
  const children=DB.children();
  const today=T0;
  const in7=addDays(today,7);

  const defaulters=subs.filter(s=>Views._paymentState(s)==='defaulter')
    .sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const pending=subs.filter(s=>Views._paymentState(s)==='pending')
    .sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const expiringSoon=subs.filter(s=>s.isActive&&s.endDate>=today&&s.endDate<=in7)
    .sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const expiringToday=subs.filter(s=>s.endDate===today&&s.isActive);

  const renderRow=(s,extra)=>{
    const c=children.find(x=>x.id===s.childId);
    const remaining=s.price-s.paidAmount;
    return `<tr>
      <td><strong>${esc(c?.name||'—')}</strong><br><small style="color:#64748b">${esc(c?.parentName||'')}</small></td>
      <td><a href="tel:${c?.parentPhone||''}" style="color:#0f766e;font-weight:600">${c?.parentPhone||'—'}</a></td>
      <td>${formatDate(s.endDate)}</td>
      <td>${extra}</td>
      <td style="white-space:nowrap">
        ${c?.parentPhone?`<a href="https://wa.me/${c.parentPhone.replace(/^\+?/,'').replace(/^0/,'966')}?text=${encodeURIComponent('السلام عليكم، '+(c.parentName||'')+' بخصوص اشتراك '+(c.name||'')+'...')}" target="_blank" class="btn btn-success btn-xs">💬 واتساب</a>`:''}
        ${remaining>0?`<button class="btn btn-primary btn-xs" onclick="Modals.pay('${s.id}')">💰 سداد</button>`:''}
        <button class="btn btn-secondary btn-xs" onclick="App.go('statement',{childId:'${s.childId}'})">📄 كشف</button>
      </td>
    </tr>`;
  };

  return `
  <div class="stats-grid">
    <div class="stat-card red"><div class="stat-val">${defaulters.length}</div><div class="stat-lbl">🔴 متعثرون ${infoIcon('defaulter')} — تحصيل فوري</div></div>
    <div class="stat-card yellow"><div class="stat-val">${pending.length}</div><div class="stat-lbl">🟠 معلّقون ${infoIcon('pending')} — متابعة سداد</div></div>
    <div class="stat-card orange" style="border-color:#f59e0b"><div class="stat-val">${expiringSoon.length}</div><div class="stat-lbl">⏰ تنتهي خلال 7 أيام</div></div>
    <div class="stat-card blue"><div class="stat-val">${expiringToday.length}</div><div class="stat-lbl">📅 تنتهي اليوم</div></div>
  </div>

  ${(defaulters.length||pending.length)?`
  <div class="card no-print" style="padding:14px;background:#f0fdf4;border:1px solid #bbf7d0">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:14px;font-weight:700;color:#166534">💬 إرسال تذكيرات واتساب جماعية</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">إرسال رسالة تذكير لجميع المتعثرين أو المعلّقين دفعةً واحدة</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${defaulters.length?`<button class="btn btn-danger btn-sm" onclick="Modals.bulkWhatsApp('defaulters')">🔴 تذكيرات المتعثرين (${defaulters.length})</button>`:''}

// ---------- BRANCH COLLECTION TASKS (school admin) ----------
branchTasks(){
  if(!Auth.isSchoolAdmin()&&!Auth.isSuperAdmin()) return Views._forbidden();
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const subs=DB.subscriptions().filter(s=>(!sid||s.schoolId===sid)&&(!bid||s.branchId===bid));
  const children=DB.children().filter(c=>(!sid||c.schoolId===sid)&&(!bid||c.branchId===bid));
  const today=T0;
  const in7=addDays(today,7);
  const defaulters=subs.filter(s=>Views._paymentState(s)==='defaulter').sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const pending=subs.filter(s=>Views._paymentState(s)==='pending').sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const expiringSoon=subs.filter(s=>s.isActive&&s.endDate>=today&&s.endDate<=in7).sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const defAmount=defaulters.reduce((a,s)=>a+(s.price-s.paidAmount),0);
  const pendAmount=pending.reduce((a,s)=>a+(s.price-s.paidAmount),0);
  const branchName=bid?DB.branchName(bid):'كل الفروع';

  const renderRow=(s,extra)=>{
    const c=children.find(x=>x.id===s.childId);
    const remaining=s.price-s.paidAmount;
    return `<tr>
      <td><strong>${esc(c?.name||'—')}</strong><br><small style="color:#64748b">${esc(c?.parentName||'')}</small></td>
      <td><a href="tel:${c?.parentPhone||''}" style="color:#0f766e;font-weight:600">${c?.parentPhone||'—'}</a></td>
      <td>${formatDate(s.endDate)}</td>
      <td>${extra}</td>
      <td style="white-space:nowrap">
        ${c?.parentPhone?`<a href="https://wa.me/${c.parentPhone.replace(/^\+?/,'').replace(/^0/,'966')}?text=${encodeURIComponent('السلام عليكم '+(c.parentName||'')+'، بخصوص اشتراك '+(c.name||'')+' المتبقي '+remaining+' ر.س.')}" target="_blank" class="btn btn-success btn-xs">💬 واتساب</a>`:''}
        ${remaining>0?`<button class="btn btn-primary btn-xs" onclick="Modals.pay('${s.id}')">💰 سداد</button>`:''}
      </td>
    </tr>`;
  };

  return `
