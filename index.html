    <p style="opacity:.9;font-size:13px;margin-top:4px">تابع المتعثرين والمعلّقين في فرعك. كل مبلغ تحصّله = ربح للمركز.</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card red"><div class="stat-val">${defaulters.length}</div><div class="stat-lbl">🔴 متعثرون ${infoIcon('defaulter')}</div></div>
    <div class="stat-card red"><div class="stat-val">${defAmount.toLocaleString()}</div><div class="stat-lbl">💸 مبلغ المتعثرين (ر.س)</div></div>
    <div class="stat-card yellow"><div class="stat-val">${pending.length}</div><div class="stat-lbl">🟠 معلّقون ${infoIcon('pending')}</div></div>
    <div class="stat-card yellow"><div class="stat-val">${pendAmount.toLocaleString()}</div><div class="stat-lbl">💰 مبلغ المعلّقين (ر.س)</div></div>
  </div>

  ${(defaulters.length||pending.length)?`
  <div class="card no-print" style="padding:14px;background:#f0fdf4;border:1px solid #bbf7d0">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:14px;font-weight:700;color:#166534">💬 إرسال تذكيرات واتساب جماعية</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">رسالة جاهزة لكل ولي أمر بضغطة زر</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${defaulters.length?`<button class="btn btn-danger btn-sm" onclick="Modals.bulkWhatsApp('defaulters')">🔴 المتعثرون (${defaulters.length})</button>`:''}
        ${pending.length?`<button class="btn btn-warning btn-sm" onclick="Modals.bulkWhatsApp('pending')">🟠 المعلّقون (${pending.length})</button>`:''}
      </div>
    </div>
  </div>`:''}

  <div class="card" style="border-right:6px solid #ef4444">
    <div class="card-title" style="color:#991b1b">🔴 متعثرون بالسداد ${infoIcon('defaulter')} (${defaulters.length}) — أولوية قصوى</div>
    <p style="font-size:13px;color:#64748b;margin:-8px 0 14px">انتهى اشتراكهم وعليهم مبلغ متبقي. تحصيل فوري مطلوب.</p>
    ${defaulters.length?`<div class="table-wrap"><table>
      <thead><tr><th>الطفل / ولي الأمر</th><th>الهاتف</th><th>انتهى في</th><th>المتبقي</th><th>إجراء</th></tr></thead>
      <tbody>${defaulters.map(s=>renderRow(s,`<span style="color:#ef4444;font-weight:700">${(s.price-s.paidAmount).toLocaleString()} ر.س</span>`)).join('')}</tbody>

  <div class="card" style="border-right:6px solid #f59e0b">

    <p style="font-size:13px;color:#64748b;margin:-8px 0 14px">اشتراكهم نشط لكن عليهم مبلغ متبقي. ذكّريهم قبل ما يصبحوا متعثرين.</p>
    ${pending.length?`<div class="table-wrap"><table>
      <thead><tr><th>الطفل / ولي الأمر</th><th>الهاتف</th><th>ينتهي في</th><th>المتبقي</th><th>إجراء</th></tr></thead>
      <tbody>${pending.map(s=>renderRow(s,`<span style="color:#f59e0b;font-weight:700">${(s.price-s.paidAmount).toLocaleString()} ر.س</span>`)).join('')}</tbody>
    </table></div>`:`<div class="empty-state"><div class="es-icon">✅</div><p>لا يوجد معلّقون</p></div>`}
  </div>

  ${expiringSoon.length?`
  <div class="card no-print" style="padding:14px;background:#eff6ff;border:1px solid #bfdbfe;margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:14px;font-weight:700;color:#1e40af">🔔 تذكيرات التجديد التلقائية</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">${expiringSoon.length} اشتراك تنتهي خلال 7 أيام — أرسلي تذكيرات التجديد الآن بضغطة زر</div>

// ---------- DAILY CASH CLOSING ----------
cashClosing(){
  if(!Auth.isSchoolAdmin()&&!Auth.isSuperAdmin()) return Views._forbidden();
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const fDate=App.params.ccDate||T0;
  const branches=DB.branches();
  const fBranch=Auth.isSuperAdmin()?(App.params.ccBranch||(bid||'all')):bid;

  // الدفعات المسجلة لهذا اليوم
  const allPayments=DB.payments().filter(p=>(p.date||'').startsWith(fDate));
  const allSales=DB.sales().filter(s=>(s.date||'').startsWith(fDate));
  // فلتر بالفرع
  const childInBranch=(childId)=>{const c=DB.children().find(x=>x.id===childId);return c&&(fBranch==='all'||c.branchId===fBranch);};
  const payments=allPayments.filter(p=>fBranch==='all'?true:childInBranch(p.childId));
  const sales=allSales.filter(s=>fBranch==='all'?true:(!s.branchId||s.branchId===fBranch));

  const byPM={cash:0,mada:0,transfer:0,qurrah:0};
  payments.forEach(p=>{const pm=p.paymentMethod||'cash';byPM[pm]=(byPM[pm]||0)+(+p.amount||0);});
  sales.forEach(s=>{const pm=s.paymentMethod||'cash';byPM[pm]=(byPM[pm]||0)+(+s.price||0);});
  const total=byPM.cash+byPM.mada+byPM.transfer+byPM.qurrah;

  // السجل السابق لهذا اليوم/الفرع (إن وجد)
  const closings=DB.cashClosings();
  const existing=closings.find(c=>c.date===fDate&&c.branchId===(fBranch==='all'?'all':fBranch));

  // سجل آخر 10 تقفيلات
  const recent=closings.filter(c=>!bid||c.branchId===bid||c.branchId==='all').slice(0,10);

  return `
  <div class="card no-print" style="padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff">
    <div style="font-size:18px;font-weight:800">💰 تقفيل الصندوق اليومي</div>
    <p style="opacity:.9;font-size:13px;margin-top:4px">طابق الكاش الفعلي بالدرج مع المسجّل في النظام. أي فرق سيُسجّل للمحاسب.</p>
  </div>

  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">📅 التاريخ</label>
        <input class="input" type="date" value="${fDate}" max="${T0}" onchange="App.go('cashClosing',{...App.params,ccDate:this.value})">
      </div>
      ${Auth.isSuperAdmin()?`<div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">🏢 الفرع</label>
        <select class="input" onchange="App.go('cashClosing',{...App.params,ccBranch:this.value})">
          <option value="all" ${fBranch==='all'?'selected':''}>كل الفروع</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>`:''}
    </div>
  </div>

  ${existing?`<div class="alert-box alert-green" style="margin-bottom:16px">
    <div>
      <strong>✅ تم تقفيل ${formatDate(fDate)}</strong><br>
      <span style="font-size:12px">بواسطة ${esc(existing.closedBy||'—')} في ${new Date(existing.at).toLocaleString('ar-SA')} — الفعلي: ${(+existing.actualCash||0).toLocaleString()} ر.س | الفرق: <strong style="color:${existing.diff===0?'#10b981':existing.diff>0?'#3b82f6':'#ef4444'}">${existing.diff>=0?'+':''}${(+existing.diff||0).toLocaleString()} ر.س</strong>
      ${existing.notes?'<br><em>ملاحظة: '+esc(existing.notes)+'</em>':''}
    </div>
  </div>`:''}

  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-val">${byPM.cash.toLocaleString()}</div><div class="stat-lbl">💵 كاش</div></div>
    <div class="stat-card blue"><div class="stat-val">${byPM.mada.toLocaleString()}</div><div class="stat-lbl">💳 مدى/شبكة</div></div>
    <div class="stat-card yellow"><div class="stat-val">${byPM.transfer.toLocaleString()}</div><div class="stat-lbl">🏦 حوالة</div></div>
    <div class="stat-card" style="border-color:#9333ea"><div class="stat-val" style="color:#9333ea">${byPM.qurrah.toLocaleString()}</div><div class="stat-lbl">🟣 قُرّة (دعم)</div></div>
    <div class="stat-card red" style="border-color:#0f766e"><div class="stat-val" style="color:#0f766e">${total.toLocaleString()}</div><div class="stat-lbl">📊 إجمالي اليوم (ر.س)</div></div>
  </div>

  <div class="card">
    <div class="card-title">📝 تفاصيل اليوم — ${formatDate(fDate)}</div>
    ${(payments.length+sales.length)?`<div class="table-wrap"><table>
      <thead><tr><th>الوقت</th><th>النوع</th><th>الطفل</th><th>المبلغ</th><th>طريقة الدفع</th><th>أضافها</th></tr></thead>
      <tbody>
        ${payments.map(p=>{const c=DB.children().find(x=>x.id===p.childId);return `<tr>
          <td style="font-size:12px">دفعة اشتراك</td>
          <td><span class="badge badge-green" style="font-size:10px">💰 دفعة</span></td>
          <td>${esc(c?.name||'—')}</td>
          <td style="color:#10b981;font-weight:700">${(+p.amount||0).toLocaleString()} ر.س</td>
          <td style="font-size:12px">${({cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'})[p.paymentMethod]||p.paymentMethod}</td>
          <td style="font-size:12px;color:#64748b">${esc(p.addedBy||'—')}</td>
        </tr>`;}).join('')}
        ${sales.map(s=>`<tr>
          <td style="font-size:12px">مبيعات</td>
          <td><span class="badge badge-blue" style="font-size:10px">🛍️ بيع</span></td>
          <td>${esc(s.childName||DB.childName(s.childId)||'—')}</td>
          <td style="color:#3b82f6;font-weight:700">${(+s.price||0).toLocaleString()} ر.س</td>
          <td style="font-size:12px">${({cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'})[s.paymentMethod]||s.paymentMethod}</td>
          <td style="font-size:12px;color:#64748b">${esc(s.addedBy||'—')}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`:`<div class="empty-state"><div class="es-icon">📭</div><p>لا توجد دفعات أو مبيعات مسجّلة لهذا اليوم</p></div>`}
  </div>

  ${total>0&&!existing?`<div class="card" style="border-right:6px solid #0f766e">
    <div class="card-title">🔒 إقفال اليوم</div>
    <p style="font-size:13px;color:#64748b;margin-bottom:14px">عدّ الكاش الفعلي بالدرج وأدخله أدناه. سيُسجَّل أي فرق للمحاسب.</p>
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1e40af">
      💵 الكاش المتوقع حسب النظام: <strong>${byPM.cash.toLocaleString()} ر.س</strong>
    </div>
    <div class="input-group">
      <label>💵 الكاش الفعلي في الدرج (ر.س)</label>
      <input class="input" id="cc-actual" type="number" value="${byPM.cash}" min="0" oninput="document.getElementById('cc-diff').textContent=((+this.value||0)-${byPM.cash}).toLocaleString();const d=(+this.value||0)-${byPM.cash};document.getElementById('cc-diff-wrap').style.color=d===0?'#10b981':d>0?'#3b82f6':'#ef4444'">
    </div>
    <div class="input-group" id="cc-diff-wrap" style="color:#10b981;font-weight:700">
      الفرق: <span id="cc-diff">0</span> ر.س
    </div>
    <div class="input-group">
      <label>📝 ملاحظات (اختياري)</label>
      <textarea class="input" id="cc-notes" rows="2" placeholder="مثال: نقص 50 ر.س لشراء بطارية ميزان..." style="resize:vertical"></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveCashClosing('${fDate}','${fBranch}',${byPM.cash},${byPM.mada},${byPM.transfer})">🔒 تأكيد التقفيل</button>
  </div>`:''}

  <div class="card">
    <div class="card-title">📋 سجل التقفيلات السابقة</div>
    ${recent.length?`<div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>الفرع</th><th>المتوقع</th><th>الفعلي</th><th>الفرق</th><th>بواسطة</th><th>ملاحظات</th></tr></thead>
      <tbody>${recent.map(c=>`<tr>
        <td style="font-weight:600">${formatDate(c.date)}</td>
        <td style="font-size:12px">${c.branchId==='all'?'كل الفروع':DB.branchName(c.branchId)}</td>
        <td>${(+c.expectedCash||0).toLocaleString()} ر.س</td>
        <td>${(+c.actualCash||0).toLocaleString()} ر.س</td>
        <td style="color:${c.diff===0?'#10b981':c.diff>0?'#3b82f6':'#ef4444'};font-weight:700">${c.diff>=0?'+':''}${(+c.diff||0).toLocaleString()} ر.س</td>
        <td style="font-size:12px;color:#64748b">${esc(c.closedBy||'—')}</td>
        <td style="font-size:12px;color:#64748b">${esc(c.notes||'—')}</td>
      </tr>`).join('')}</tbody>
    </table></div>`:`<div class="empty-state"><div class="es-icon">📂</div><p>لا توجد تقفيلات سابقة</p></div>`}
  </div>`;
},

// ---------- CHILD STATEMENT (super admin only) ----------
statement(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const childId=App.params.childId;
  const children=DB.children();
  if(!childId){
    return `<div class="card">
      <div class="card-title">📄 كشف حساب طفل</div>
      <p style="color:#64748b;margin-bottom:14px">اختاري الطفل لعرض كشف حسابه الكامل (الاشتراكات، الدفعات، المبيعات، الحضور).</p>

        ${children.slice(0,12).map(c=>`<button class="btn btn-secondary btn-sm" onclick="App.go('statement',{childId:'${c.id}'})">${esc(c.name)}</button>`).join('')}
      </div>
    </div>`;

  const c=children.find(x=>x.id===childId);
  if(!c) return `<div class="card"><p>الطفل غير موجود.</p><button class="btn btn-primary" onclick="App.go('statement')">رجوع</button></div>`;
  const subs=DB.subscriptions().filter(s=>s.childId===childId).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  const sales=DB.sales().filter(s=>s.childId===childId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const att=DB.attendance().filter(a=>a.childId===childId);
  const totalCharged=subs.reduce((a,s)=>a+(+s.price||0),0)+sales.reduce((a,s)=>a+(+s.price||0),0);
  const totalPaid=subs.reduce((a,s)=>a+(+s.paidAmount||0),0)+sales.reduce((a,s)=>a+(+s.price||0),0); // sales تدفع كاملة
  const balance=totalCharged-totalPaid;
  const presentDays=att.filter(a=>a.status==='present').length;
  const absentDays=att.filter(a=>a.status==='absent').length;
  const lateDays=att.filter(a=>a.status==='late').length;
  const pmLbl={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'};
  const typeLbl={daily:'يومي',weekly:'أسبوعي',monthly:'٣٠ يوم',custom:'مخصص'};

  return `
  <div class="card no-print" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" onclick="App.go('statement')">← رجوع للبحث</button>

    <span style="font-size:13px;color:#64748b">تاريخ الطباعة: ${formatDate(T0)}</span>
  </div>

  <div class="card" style="background:linear-gradient(135deg,#0f766e 0%,#065f46 100%);color:#fff;border:0">
    <h2 style="margin:0 0 6px;font-size:22px;font-weight:800">📄 كشف حساب — ${esc(c.name)}</h2>
    <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.95">
      <span>👤 ولي الأمر: <strong>${esc(c.parentName||'')}</strong></span>
      <span>📞 ${esc(c.parentPhone||'')}</span>
      <span>🏢 ${DB.branchName(c.branchId)}</span>
      <span>${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
      <span>📅 منذ: ${formatDate(c.joinDate)}</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-val">${totalCharged.toLocaleString()}</div><div class="stat-lbl">📋 إجمالي المستحق (ر.س)</div></div>
    <div class="stat-card green"><div class="stat-val">${totalPaid.toLocaleString()}</div><div class="stat-lbl">✅ إجمالي المدفوع (ر.س)</div></div>
    <div class="stat-card ${balance>0?'red':'green'}"><div class="stat-val">${balance.toLocaleString()}</div><div class="stat-lbl">${balance>0?'⚠️ المتبقي':'✅ الرصيد'} (ر.س)</div></div>
    <div class="stat-card yellow"><div class="stat-val">${presentDays}</div><div class="stat-lbl">📅 أيام حضور (غياب: ${absentDays}، تأخر: ${lateDays})</div></div>
  </div>

  <div class="card">
    <div class="card-title">📋 الاشتراكات (${subs.length})</div>
    ${subs.length?`<div class="table-wrap"><table>
      <thead><tr><th>الفاتورة</th><th>النوع</th><th>من</th><th>إلى</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th></tr></thead>
      <tbody>${subs.map(s=>{
        const r=s.price-s.paidAmount;
        const ps=Views._paymentState(s);
        return `<tr>
          <td style="font-size:12px;font-weight:700;color:#0f766e">${esc(s.invoiceNo||'—')}</td>

          <td style="color:#10b981">${s.paidAmount} ر.س</td>
          <td style="color:${r>0?'#ef4444':'#10b981'};font-weight:700">${r} ر.س</td>
          <td>${ps==='defaulter'?Views._defaulterBadge():ps==='pending'?Views._pendingBadge():Views._payBadge(s)}</td>

  const actionColor={

// ---------- BRANCH MONTHLY REPORT ----------
branchReport(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const isSA=Auth.isSuperAdmin();
  const bid=Auth.branchId();
  const fMonth=App.params.brMonth||T0.slice(0,7);
  const fBranch=bid||(App.params.brBranch||'all');
  const branches=DB.branches();
  const subs=DB.subscriptions();
  const exps=DB.expenses();
  const children=DB.children();
  const pmLbl={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'};
  const targetBranches=fBranch==='all'?branches:branches.filter(b=>b.id===fBranch);

  const branchData=targetBranches.map(b=>{
    const bSubs=subs.filter(s=>s.branchId===b.id&&(s.createdAt||s.startDate||'').startsWith(fMonth));
    const bAllSubs=subs.filter(s=>s.branchId===b.id);
    const bExps=exps.filter(e=>e.branchId===b.id&&(e.date||'').startsWith(fMonth));
    const activeChildIds=[...new Set(bAllSubs.filter(s=>s.isActive&&s.endDate>=T0).map(s=>s.childId))];
    const rev=bSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);
    const charged=bSubs.reduce((a,s)=>a+(+s.price||0),0);
    const exp=bExps.reduce((a,e)=>a+(+e.amount||0),0);
    const net=rev-exp;
    const defaulters=bAllSubs.filter(s=>Views._paymentState(s)==='defaulter');
    const pending=bAllSubs.filter(s=>Views._paymentState(s)==='pending');
    const byPM={};
    bSubs.forEach(s=>{byPM[s.paymentMethod]=(byPM[s.paymentMethod]||0)+(+s.paidAmount||0);});
    return {b,bSubs,rev,charged,exp,net,defaulters,pending,activeChildIds,byPM};
  });

  const totalRev=branchData.reduce((a,d)=>a+d.rev,0);
  const totalExp=branchData.reduce((a,d)=>a+d.exp,0);
  const totalNet=totalRev-totalExp;
  const totalActive=branchData.reduce((a,d)=>a+d.activeChildIds.length,0);

  return `
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">📅 الشهر</label>
        <input class="input" type="month" value="${fMonth}" onchange="App.go('branchReport',{...App.params,brMonth:this.value})">
      </div>
      ${!bid?`<div class="input-group" style="margin:0;min-width:180px">
        <label style="font-size:12px">🏢 الفرع</label>
        <select class="input" onchange="App.go('branchReport',{...App.params,brBranch:this.value})">
          <option value="all">جميع الفروع</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>`:`<div class="input-group" style="margin:0"><label style="font-size:12px">🏢 الفرع</label><div class="input" style="background:#f8fafc;color:#0f766e;font-weight:700">${esc(DB.branchName(bid))}</div></div>`}
      <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ طباعة</button>
      ${isSA?`<button class="btn btn-primary btn-sm" onclick="printBranchReport('${fMonth}','${fBranch}')">📄 تصدير PDF</button>`:''}
    </div>
  </div>

  <div class="stats-grid">
    ${isSA?`<div class="stat-card green"><div class="stat-val">${totalRev.toLocaleString()}</div><div class="stat-lbl">💰 إجمالي المحصّل (ر.س)</div></div>
    <div class="stat-card red"><div class="stat-val">${totalExp.toLocaleString()}</div><div class="stat-lbl">📉 إجمالي المصروفات (ر.س)</div></div>
    <div class="stat-card ${totalNet>=0?'blue':'red'}"><div class="stat-val" style="color:${totalNet>=0?'#1d4ed8':'#ef4444'}">${totalNet.toLocaleString()}</div><div class="stat-lbl">${totalNet>=0?'💎 صافي الربح':'⚠️ خسارة'} (ر.س)</div></div>`:''}

      <div class="stat-card ${net>=0?'blue':'red'}" style="padding:14px"><div class="stat-val" style="font-size:22px;color:${net>=0?'#1d4ed8':'#ef4444'}">${net.toLocaleString()}</div><div class="stat-lbl">${net>=0?'💎 الربح':'⚠️ الخسارة'} (ر.س)</div></div>`:''}
      <div class="stat-card yellow" style="padding:14px"><div class="stat-val" style="font-size:22px">${activeChildIds.length}</div><div class="stat-lbl">👶 نشطون</div></div>

      <div class="stat-card yellow" style="padding:14px;border-color:#f59e0b"><div class="stat-val" style="font-size:22px;color:#f59e0b">${pending.length}</div><div class="stat-lbl">🟠 معلّقون</div></div>

    ${isSA?`<div style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:6px">💳 توزيع طريقة الدفع (هذا الشهر)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${Object.entries(byPM).length
          ? Object.entries(byPM).map(([pm,amt])=>`<span class="badge badge-blue">${pmLbl[pm]||pm}: ${amt.toLocaleString()} ر.س</span>`).join('')

      </div>

    ${bSubs.length?`
    <div style="font-size:12px;color:#64748b;border-top:1px solid #f1f5f9;padding-top:10px">
      عدد الفواتير: ${bSubs.length}${isSA?` | إجمالي مستحق: ${charged.toLocaleString()} ر.س | نسبة التحصيل: <strong>${charged?Math.round(rev/charged*100):0}%</strong>`:''}
    </div>
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th>الطفل</th><th>نوع الاشتراك</th><th>المبلغ</th><th>المدفوع</th><th>طريقة الدفع</th><th>الحالة</th></tr></thead>
      <tbody>${bSubs.slice(0,15).map(s=>{const c=children.find(x=>x.id===s.childId);const ps=Views._paymentState(s);return `<tr>
        <td><strong>${esc(c?.name||'—')}</strong><br><small style="color:#64748b">${esc(c?.parentName||'')}</small></td>
        <td>${{daily:'يومي',weekly:'أسبوعي',monthly:'٣٠ يوم',custom:'مخصص'}[s.type]||s.type}</td>
        <td>${s.price} ر.س</td>
        <td style="color:#10b981;font-weight:600">${s.paidAmount} ر.س</td>
        <td style="font-size:12px">${pmLbl[s.paymentMethod]||'—'}</td>
        <td>${Views._payBadge(s)}</td>
      </tr>`;}).join('')}
      ${bSubs.length>15?`<tr><td colspan="6" style="text-align:center;color:#94a3b8;font-size:12px">... و${bSubs.length-15} فاتورة أخرى</td></tr>`:''}
      </tbody>
    </table></div>`:''}
  </div>`).join('')}`;
},

// ---------- CHILD NOTES ----------
childNotes(){
  if(!Auth.isSchoolAdmin()&&!Auth.isSuperAdmin()) return Views._forbidden();
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const allNotes=DB.childNotes().filter(n=>(!sid||n.schoolId===sid)&&(!bid||n.branchId===bid));
  const children=DB.children().filter(c=>(!sid||c.schoolId===sid)&&(!bid||c.branchId===bid));
  const fDate=App.params.cnDate||'';
  const fType=App.params.cnType||'all';
  const fChild=App.params.cnChild||'';
  let filtered=allNotes;
  if(fDate) filtered=filtered.filter(n=>n.date===fDate);
  if(fType!=='all') filtered=filtered.filter(n=>n.type===fType);
  if(fChild) filtered=filtered.filter(n=>n.childId===fChild);
  const typeLbl={parent:'📤 لولي الأمر',internal:'🔒 داخلية'};
  const todayCount=allNotes.filter(n=>n.date===T0).length;
  const parentCount=allNotes.filter(n=>n.type==='parent').length;
  return `
  <div class="card no-print" style="padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:18px;font-weight:800">📝 ملاحظات الأطفال اليومية</div>
        <p style="opacity:.9;font-size:13px;margin-top:4px">سجّلي ملاحظات لكل طفل — للإدارة أو لإرسالها لولي الأمر عبر واتساب</p>
      </div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)" onclick="openChildNoteModal('','${T0}')">+ إضافة ملاحظة</button>
    </div>
  </div>

  <div class="stats-grid" style="margin-bottom:16px">
    <div class="stat-card blue"><div class="stat-val">${allNotes.length}</div><div class="stat-lbl">📝 إجمالي الملاحظات</div></div>
    <div class="stat-card green"><div class="stat-val">${todayCount}</div><div class="stat-lbl">📅 ملاحظات اليوم</div></div>
    <div class="stat-card yellow"><div class="stat-val">${parentCount}</div><div class="stat-lbl">📤 مُرسَلة لأولياء الأمور</div></div>
    <div class="stat-card blue"><div class="stat-val">${allNotes.length-parentCount}</div><div class="stat-lbl">🔒 ملاحظات داخلية</div></div>
  </div>

  <div class="card" style="padding:14px;margin-bottom:14px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:150px">
        <label style="font-size:12px">📅 التاريخ</label>
        <input class="input" type="date" value="${fDate}" onchange="App.go('childNotes',{...App.params,cnDate:this.value})">
      </div>
      <div class="input-group" style="margin:0;min-width:150px">
        <label style="font-size:12px">🔖 النوع</label>
        <select class="input" onchange="App.go('childNotes',{...App.params,cnType:this.value})">
          <option value="all" ${fType==='all'?'selected':''}>الكل</option>
          <option value="parent" ${fType==='parent'?'selected':''}>📤 لولي الأمر</option>
          <option value="internal" ${fType==='internal'?'selected':''}>🔒 داخلية</option>
        </select>
      </div>
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px">👶 الطفل</label>
        <select class="input" onchange="App.go('childNotes',{...App.params,cnChild:this.value})">
          <option value="">كل الأطفال</option>
          ${children.map(c=>`<option value="${c.id}" ${fChild===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      ${(fDate||fType!=='all'||fChild)?`<button class="btn btn-secondary btn-sm" onclick="App.go('childNotes')">✕ مسح الفلاتر</button>`:''}
    </div>
  </div>

  <div class="card">
    <div class="card-title">📋 الملاحظات المسجّلة (${filtered.length})</div>
    ${filtered.length===0?`<div class="empty-state"><div class="es-icon">📝</div><p>لا توجد ملاحظات${fDate?' لهذا اليوم':fChild?' لهذا الطفل':''}</p><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="openChildNoteModal('${fChild}','${fDate||T0}')">+ إضافة أول ملاحظة</button></div>`:`
    <div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>الطفل</th><th>الملاحظة</th><th>النوع</th><th>بواسطة</th><th>إجراء</th></tr></thead>
      <tbody>${filtered.map(n=>{
        const c=children.find(x=>x.id===n.childId);
        return `<tr>
          <td style="white-space:nowrap;font-size:13px">${formatDate(n.date)}</td>
          <td><strong>${esc(c?.name||'—')}</strong><br><small style="color:#64748b">${esc(c?.parentName||'')}</small></td>
          <td style="max-width:260px;font-size:13px;line-height:1.5">${esc(n.note)}</td>
          <td><span class="badge ${n.type==='parent'?'badge-green':'badge-blue'}">${typeLbl[n.type]||n.type}</span></td>
          <td style="font-size:12px;color:#64748b">${esc(n.by||'—')}</td>
          <td style="white-space:nowrap">
            ${n.type==='parent'&&c?.parentPhone?`<button class="btn btn-success btn-xs" onclick="sendNoteToParent('${n.id}')">💬 واتساب</button>`:''}
            <button class="btn btn-danger btn-xs" onclick="deleteChildNote('${n.id}')">🗑️</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`}
  </div>`;
},

// ---------- INTERNAL MESSAGES ----------
messages(){
  const me=Auth.user;
  const role=me?.role;
  if(role!=='superadmin'&&role!=='school_admin'&&role!=='teacher') return Views._forbidden();
  const isSA=role==='superadmin';
  const isTeacher=role==='teacher';
  const myBid=Auth.branchId();
  const allMsgs=DB.internalMessages();
  const branches=DB.branches();
  const teachers=DB.users().filter(u=>u.role==='teacher');

  const branchColor=(bid)=>{
    if(!bid) return {bg:'#f1f5f9',fg:'#475569',light:'#fff'};
    const idx=branches.findIndex(b=>b.id===bid);
    const cols=[{bg:'#dbeafe',fg:'#1e40af',light:'#eff6ff'},{bg:'#dcfce7',fg:'#166534',light:'#f0fdf4'},{bg:'#fef3c7',fg:'#92400e',light:'#fffbeb'},{bg:'#fce7f3',fg:'#9f1239',light:'#fdf2f8'}];
    return cols[idx>=0?idx%cols.length:0];
  };

  // بناء قائمة المحادثات حسب الدور
  let threads=[];
  if(isTeacher){
    threads=[{key:'t:'+me.id,label:'الإدارة',type:'teacher',tid:me.id,bid:me.branchId}];
  } else if(role==='school_admin'){
    threads=[{key:'b:'+myBid,label:'👔 المدير العام',type:'branch',bid:myBid}];
    teachers.filter(t=>t.branchId===myBid).forEach(t=>threads.push({key:'t:'+t.id,label:'👩‍🏫 '+t.name,type:'teacher',tid:t.id,bid:myBid}));
  } else { // superadmin
    branches.forEach(b=>threads.push({key:'b:'+b.id,label:'🏢 '+(b.name.split(' - ')[0]||b.name),type:'branch',bid:b.id}));
    teachers.forEach(t=>threads.push({key:'t:'+t.id,label:'👩‍🏫 '+t.name+' — '+((DB.branchName(t.branchId)||'').split(' - ')[0]||''),type:'teacher',tid:t.id,bid:t.branchId}));
  }
  // ترقية قيمة thread القديمة (معرّف فرع) إلى صيغة b:
  let activeKey=App.params.thread||'';
  if(activeKey&&!activeKey.includes(':')) activeKey='b:'+activeKey;
  const active=threads.find(t=>t.key===activeKey)||threads[0];
  const activeThread=active?active.key:'';

  const inThread=(m,t)=>{
    if(!t) return false;
    if(t.type==='teacher') return m.tThread===t.tid;
    return !m.tThread&&(m.fromBranchId===t.bid||m.toBranchId===t.bid)&&m.fromRole!=='teacher';
  };
  let threadMsgs=allMsgs.filter(m=>inThread(m,active)).sort((a,b)=>(a.at||'').localeCompare(b.at||''));
  const toMark=threadMsgs.filter(m=>!(m.readBy||[]).includes(me.id)&&m.fromUserId!==me.id).map(m=>m.id);
  if(toMark.length) setTimeout(()=>DB.markInternalRead(toMark,me.id),300);

  const sidebar=threads.map(t=>{
    const c=branchColor(t.bid);
    const tMsgs=allMsgs.filter(m=>inThread(m,t));
    const unread=tMsgs.filter(m=>!m.recalled&&m.fromUserId!==me.id&&!(m.readBy||[]).includes(me.id)).length;
    const last=[...tMsgs].sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
    const lastPreview=last?(last.recalled?'🚫 رسالة مُسترجَعة':(last.message||'📎 مرفق').slice(0,36)):'';
    const on=t.key===activeThread;
    return `<div onclick="App.go('messages',{thread:'${t.key}'})" style="cursor:pointer;padding:12px 14px;border-bottom:1px solid #e2e8f0;background:${on?c.light:'#fff'};border-right:4px solid ${on?c.fg:'transparent'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
        <strong style="color:${c.fg};font-size:13px">${esc(t.label)}</strong>
        ${unread>0?`<span style="background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px">${unread}</span>`:''}
      </div>
      <div style="font-size:11px;color:#64748b;line-height:1.4">${esc(lastPreview)||'لا توجد رسائل بعد'}</div>
      ${last?`<div style="font-size:10px;color:#94a3b8;margin-top:2px">${formatRelTime(last.at)}</div>`:''}
    </div>`;
  }).join('');

  const showSidebar=!isTeacher;
  const activeColor=branchColor(active?active.bid:null);
  const headerLabel=active?('💬 '+esc(active.label)):'💬 اختر محادثة';
  const subHint='رسائل داخلية آمنة — لا تُرسل عبر واتساب';

  return `
  <div class="card no-print msg-intro" style="padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#0f766e,#065f46);color:#fff">
    <div style="font-size:18px;font-weight:800">💬 الرسائل الداخلية</div>
    <p style="opacity:.9;font-size:13px;margin-top:4px">قناة تواصل مباشرة وآمنة بين المدير العام ومديرات الفروع — للملاحظات الإدارية والاستفسارات اليومية</p>
  </div>

  <div class="msg-layout ${showSidebar?'':'solo'}">
    ${showSidebar?`<div class="card" style="padding:0;overflow:hidden">
      <div style="padding:12px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:700;color:#1e293b">📥 المحادثات</div>
      <div class="msg-conv">${sidebar||'<div style="padding:32px;text-align:center;color:#94a3b8">لا توجد محادثات</div>'}</div>
    </div>`:''}

    <div class="card msg-thread" style="padding:0">
      <div style="padding:14px 16px;background:${activeColor.light};border-bottom:1px solid ${activeColor.fg}33">
        <div style="font-size:14px;font-weight:700;color:${activeColor.fg}">${headerLabel}</div>
        <div style="font-size:11px;color:#64748b;margin-top:2px">${subHint}</div>
      </div>
      <div id="msg-list" class="msg-list">
        ${threadMsgs.length===0?`<div style="text-align:center;color:#94a3b8;padding:60px 20px;font-size:14px">
          <div style="font-size:42px;margin-bottom:10px">💬</div>
          <div>لا توجد رسائل بعد</div>
          <div style="font-size:12px;margin-top:6px">ابدأ المحادثة بكتابة رسالة في الأسفل</div>
        </div>`:threadMsgs.map(m=>{
          const mine=m.fromUserId===me.id;
          const fromBranch=branches.find(b=>b.id===m.fromBranchId);
          const c=branchColor(m.fromBranchId);
          // رسالة مُسترجَعة → فقاعة رمادية محايدة بتنبيه «تم استرجاع الرسالة»
          if(m.recalled){
            return `<div style="display:flex;${mine?'justify-content:flex-end':'justify-content:flex-start'}">
              <div class="msg-bubble" style="background:#f1f5f9;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:14px;padding:9px 14px">
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-style:italic">🚫 تم استرجاع الرسالة</div>
                <div style="font-size:10px;color:#cbd5e1;margin-top:4px;text-align:left">${formatRelTime(m.recalledAt||m.at)}</div>
              </div>
            </div>`;
          }
          const bgColor=mine?'#0f766e':(m.fromRole==='superadmin'?'#f5f3ff':c.light);
          const fgColor=mine?'#fff':'#1e293b';
          const borderC=mine?'#0f766e':(m.fromRole==='superadmin'?'#a78bfa':c.fg);
          return `<div style="display:flex;${mine?'justify-content:flex-end':'justify-content:flex-start'}">
            <div class="msg-bubble" style="position:relative;background:${bgColor};color:${fgColor};border:1px solid ${borderC}33;border-radius:14px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;${mine?'color:rgba(255,255,255,.85)':'color:#64748b'};font-weight:700">
                ${m.fromRole==='superadmin'?'👔':'🏢'} ${esc(m.fromName||'—')}
                ${fromBranch&&!mine&&m.fromRole!=='superadmin'?`<span style="background:${c.bg};color:${c.fg};padding:1px 6px;border-radius:6px;font-size:10px">${esc(fromBranch.name.split(' - ')[0]||fromBranch.name)}</span>`:''}
                ${mine?`<button onclick="recallMessage('${m.id}')" title="استرجاع الرسالة للطرفين" style="margin-right:auto;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:6px;font-size:11px;padding:1px 7px;cursor:pointer;font-family:inherit">↩︎ استرجاع</button>`:''}
              </div>
              <div style="font-size:13px;line-height:1.6;white-space:pre-wrap">${esc(m.message)}</div>
              ${m.attachment?`<div style="margin-top:6px;padding:6px 10px;background:${mine?'rgba(255,255,255,.15)':'#f1f5f9'};border-radius:8px;display:flex;align-items:center;gap:8px">
                <span style="font-size:14px">📎</span>
                <a href="${m.attachment.data}" download="${esc(m.attachment.name||'مرفق.pdf')}" style="font-size:12px;color:${mine?'#fff':'#1d4ed8'};text-decoration:underline;font-weight:600">${esc(m.attachment.name||'مرفق.pdf')}</a>
                <span style="font-size:11px;color:${mine?'rgba(255,255,255,.6)':'#94a3b8'}">(${m.attachment.size||''})</span>
              </div>`:''}
              <div style="font-size:10px;${mine?'color:rgba(255,255,255,.7)':'color:#94a3b8'};margin-top:5px;text-align:left">
                ${formatRelTime(m.at)} ${mine&&(m.readBy||[]).length>1?'· ✓✓ مقروء':mine?'· ✓ مُرسَلة':''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${!active?'':`<div class="msg-composer" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;align-items:flex-end">
          <textarea id="msg-input" class="input" rows="1" placeholder="اكتب رسالتك... (Enter للإرسال · Shift+Enter سطر جديد)" style="flex:1;resize:none;font-family:inherit;max-height:120px" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendInternalMessage('${activeThread}');}"></textarea>
          <button class="btn btn-primary" style="flex-shrink:0" onclick="sendInternalMessage('${activeThread}')"><span class="msg-send-lbl">📤 إرسال</span><span class="msg-send-ic">📤</span></button>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label style="cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;padding:6px 10px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc">
            📎 إرفاق PDF
            <input type="file" id="msg-attachment" accept=".pdf,.PDF" style="display:none" onchange="handleMsgAttachment(this)">
          </label>
          <span id="msg-att-name" style="font-size:12px;color:#0f766e"></span>
          <span id="msg-att-clear" style="display:none;font-size:12px;color:#ef4444;cursor:pointer" onclick="clearMsgAttachment()">✕ إلغاء المرفق</span>
        </div>
      </div>`}
    </div>
  </div>
  <img src="__none__" style="display:none" onerror="(function(){const ml=document.getElementById('msg-list');if(ml) ml.scrollTop=ml.scrollHeight;})()">
  `;
},

// ---------- SETTINGS (super admin only) ----------
settings(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const tab=App.params?.tab||'prices';
  const s=DB.settings();
  const school=DB.schools()[0]||{};
  const sa=DB.users().find(u=>u.role==='superadmin')||{};
  const tabs=[
    {k:'prices',icon:'💰',label:'الأسعار'},
    {k:'center',icon:'🏢',label:'المركز'},
    {k:'account',icon:'👤',label:'حسابي'},
    {k:'invoice',icon:'📄',label:'الفواتير'},
    {k:'reminders',icon:'🔔',label:'التذكيرات'},
    {k:'data',icon:'🗄️',label:'البيانات'},
  ];
  let content='';
  if(tab==='prices'){
    const p=s.prices||{};
    const branches=DB.branches();
    const defM=p.morning||{daily:150,weekly:600,monthly:1800};
    const defE=p.evening||{daily:70,weekly:300,monthly:900};
    const branchCards=branches.map(b=>{
      const bp=(p.branches&&p.branches[b.id])||{};
      const bm=bp.morning||defM;
      const be=bp.evening||defE;
      return `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title" style="background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:10px;padding:10px 16px;margin-bottom:16px">🏢 ${esc(b.name)}</div>
        <div style="margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px;padding:6px 12px;background:#eff6ff;border-radius:8px">🌅 الفترة الصباحية</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
            <div class="input-group"><label>يومي (ر.س)</label><input class="input" id="p-${b.id}-m-daily" type="number" min="0" value="${bm.daily}"></div>
            <div class="input-group"><label>أسبوعي (ر.س)</label><input class="input" id="p-${b.id}-m-weekly" type="number" min="0" value="${bm.weekly}"></div>
            <div class="input-group"><label>٣٠ يوم (ر.س)</label><input class="input" id="p-${b.id}-m-monthly" type="number" min="0" value="${bm.monthly}"></div>
          </div>
        </div>
        <div>
          <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px;padding:6px 12px;background:#fef3c7;border-radius:8px">🌙 الفترة المسائية</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
            <div class="input-group"><label>يومي (ر.س)</label><input class="input" id="p-${b.id}-e-daily" type="number" min="0" value="${be.daily}"></div>
            <div class="input-group"><label>أسبوعي (ر.س)</label><input class="input" id="p-${b.id}-e-weekly" type="number" min="0" value="${be.weekly}"></div>
            <div class="input-group"><label>٣٠ يوم (ر.س)</label><input class="input" id="p-${b.id}-e-monthly" type="number" min="0" value="${be.monthly}"></div>
          </div>
        </div>
      </div>`;
    }).join('');
    content=`
    <div>
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#166534">✅ يمكن تحديد أسعار مختلفة لكل فرع — الأسعار تُطبَّق تلقائياً عند إنشاء كل اشتراك جديد</div>
      ${branchCards}
      <button class="btn btn-primary" onclick="saveSettingsPrices()">💾 حفظ أسعار جميع الفروع</button>
    </div>`;
  } else if(tab==='center'){
    content=`
    <div class="card" style="max-width:640px">
      <div class="card-title">🏢 معلومات المركز</div>
      <div class="input-group">
        <label>شعار المدرسة</label>
        <div style="display:flex;align-items:center;gap:14px">
          <img id="sc-logo-preview" src="${esc(school.logoDataUrl||'logo.png')}" style="width:64px;height:64px;object-fit:contain;border:1px solid #e2e8f0;border-radius:10px;background:#fff" onerror="this.style.visibility='hidden'">
          <div>
            <input type="file" id="sc-logo-file" accept="image/*" onchange="_scLogoPick(this)">
            <div style="font-size:11px;color:#94a3b8;margin-top:4px">صورة مربّعة تقريباً، أقل من 2 ميجابايت. يظهر هذا الشعار بدل شعار مدار الافتراضي في القائمة الجانبية وشاشة الدخول.</div>
            ${school.logoDataUrl?`<button type="button" class="btn btn-secondary btn-xs" style="margin-top:6px" onclick="_scLogoClear()">إزالة الشعار والعودة للافتراضي</button>`:''}
          </div>
        </div>
      </div>
      <div class="input-group"><label>اسم المركز</label><input class="input" id="sc-name" value="${esc(school.name||'')}"></div>
      <div class="input-group"><label>المسؤول / جهة الاتصال</label><input class="input" id="sc-contact" value="${esc(school.contactPerson||'')}"></div>
      <div class="input-group"><label>الهاتف</label><input class="input" id="sc-phone" value="${esc(school.phone||'')}"></div>
      <div class="input-group"><label>البريد الإلكتروني</label><input class="input" id="sc-email" value="${esc(school.email||'')}"></div>
      <div class="input-group"><label>الرقم الضريبي</label><input class="input" id="sc-vat" value="${esc(school.vatNumber||'')}"></div>
      <div class="input-group"><label>العنوان</label><input class="input" id="sc-address" value="${esc(school.address||'')}"></div>
      <button class="btn btn-primary" onclick="saveSettingsCenter()">💾 حفظ معلومات المركز</button>
    </div>`;
  } else if(tab==='account'){
    content=`
    <div class="card" style="max-width:500px">
      <div class="card-title">👤 حساب المدير العام</div>
      <div class="alert-box alert-yellow" style="margin-bottom:16px">⚠️ تغيير بيانات الحساب يؤثر على تسجيل الدخول مباشرة</div>
      <div class="input-group"><label>الاسم الكامل</label><input class="input" id="sa-name" value="${esc(sa.name||'')}"></div>
      <div class="input-group"><label>اسم المستخدم</label><input class="input" id="sa-username" value="${esc(sa.username||'')}"></div>
      <div class="input-group"><label>رقم الهاتف</label><input class="input" id="sa-phone" value="${esc(sa.phone||'')}"></div>
      <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:12px">🔑 تغيير كلمة المرور</div>
        <div class="input-group"><label>كلمة المرور الحالية</label><input class="input" type="password" id="sa-old-pass" placeholder="أدخل كلمة المرور الحالية للتحقق"></div>
        <div class="input-group"><label>كلمة المرور الجديدة</label><input class="input" type="password" id="sa-new-pass" placeholder="اتركه فارغاً للإبقاء على الحالية"></div>
        <div class="input-group"><label>تأكيد كلمة المرور الجديدة</label><input class="input" type="password" id="sa-confirm-pass" placeholder="أعد كتابة كلمة المرور الجديدة"></div>
      </div>
      <button class="btn btn-primary" onclick="saveSettingsAccount()">💾 حفظ الحساب</button>
    </div>`;
  } else if(tab==='invoice'){
    const prefix=esc(s.invoicePrefix||'INV');
    const warnDays=(s.alertDays||{}).warn||7;
    const urgentDays=(s.alertDays||{}).urgent||3;
    content=`
    <div class="card" style="max-width:580px">
      <div class="card-title">📄 إعدادات الفواتير والتنبيهات</div>
      <div style="margin-bottom:20px">
        <div style="font-size:14px;font-weight:700;color:#1e293b;margin-bottom:12px">🧾 الفواتير</div>
        <div class="input-group">
          <label>بادئة رقم الفاتورة</label>
          <input class="input" id="inv-prefix" value="${prefix}" placeholder="مثال: INV أو MAD" oninput="document.getElementById('inv-preview').textContent=this.value+'-0001'">
          <small style="color:#64748b;font-size:12px">معاينة: <strong id="inv-preview">${prefix}-0001</strong></small>
        </div>
      </div>
      <div style="margin-bottom:20px">
        <div style="font-size:14px;font-weight:700;color:#1e293b;margin-bottom:12px">🧮 ضريبة القيمة المضافة (ض.ق.م)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="input-group">
            <label>نسبة الضريبة (%)</label>
            <input class="input" id="vat-rate" type="number" value="${s.vatRate||15}" min="0" max="100" step="0.01">
            <small style="color:#64748b;font-size:12px">النسبة الحالية في السعودية: 15%</small>
          </div>
          <div class="input-group">
            <label>احتساب السعر</label>
            <select class="input" id="vat-inclusive">
              <option value="1" ${s.vatInclusive!==false?'selected':''}>السعر شامل الضريبة</option>
              <option value="0" ${s.vatInclusive===false?'selected':''}>الضريبة تُضاف فوق السعر</option>
            </select>
            <small style="color:#64748b;font-size:12px">يؤثر على احتساب الفاتورة الضريبية</small>
          </div>
        </div>
      </div>
      <div style="margin-bottom:20px">
        <div style="font-size:14px;font-weight:700;color:#1e293b;margin-bottom:12px">🔔 تنبيهات انتهاء الاشتراك</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="input-group">
            <label>تنبيه مبكر (أيام)</label>
            <input class="input" id="alert-warn" type="number" value="${warnDays}" min="1" max="30">
            <small style="color:#64748b;font-size:12px">يظهر باللون الأصفر</small>
          </div>
          <div class="input-group">
            <label>تنبيه عاجل (أيام)</label>
            <input class="input" id="alert-urgent" type="number" value="${urgentDays}" min="1" max="14">
            <small style="color:#64748b;font-size:12px">يظهر باللون البرتقالي</small>
          </div>
        </div>
      </div>
      <div style="margin-bottom:20px">
        <div style="font-size:14px;font-weight:700;color:#1e293b;margin-bottom:12px">💬 نموذج رسالة واتساب للتجديد</div>
        <div class="input-group">
          <label>نص الرسالة</label>
          <textarea class="input" id="wa-tmpl" rows="4" placeholder="استخدم {name} لاسم الطفل و {date} لتاريخ الانتهاء" style="resize:vertical">${esc(s.waTemplate||'مرحباً {name}، اشتراك طفلك ينتهي بتاريخ {date}. يرجى التواصل للتجديد.')}</textarea>
          <small style="color:#64748b;font-size:12px">المتغيرات: <code>{name}</code> = اسم الطفل، <code>{date}</code> = تاريخ انتهاء الاشتراك</small>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveSettingsInvoice()">💾 حفظ الإعدادات</button>
    </div>`;
  } else if(tab==='data'){
    const mem={};
    ['children','subscriptions','users','branches','schools','attendance','notifications'].forEach(k=>{const v=_mem[k];mem[k]=Array.isArray(v)?v.length:'—';});
    content=`
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">📡 حالة الاتصال والمزامنة</div>
        ${(()=>{
          const mode=_storageMode;
          const sseState=_sse?_sse.readyState:-1;
          const ok=mode==='backend'&&sseState===1;
          const warn=mode==='backend'&&sseState!==1;
          const modeLabel=mode==='backend'?'☁️ الخادم الخاص (وضع مكتمل)':'🔌 Firebase (وضع احتياطي — لا تزامن بين الفروع)';
          const sseLabel=['⏳ جاري الاتصال...','✅ متصل ويستقبل التحديثات','❌ منقطع (جارٍ إعادة الاتصال)'][sseState]||'—';
          const syncAgo=_lastResync>0?Math.round((Date.now()-_lastResync)/1000)+'ث':('—');
          const u=Auth.user||{};
          const roleDisplay=u.role==='superadmin'?'مدير عام':u.role==='school_admin'?'مدير فرع':u.role==='teacher'?'معلمة':'—';
          return `
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
            <div style="background:${ok?'#f0fdf4':warn?'#fffbeb':'#fef2f2'};border:1px solid ${ok?'#bbf7d0':warn?'#fde68a':'#fecaca'};border-radius:10px;padding:12px 16px">
              <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px">وضع التخزين</div>
              <div style="font-size:13px;font-weight:600">${modeLabel}</div>
            </div>
            ${mode==='backend'?`
            <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 16px">
              <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px">اتصال البث اللحظي (SSE)</div>
              <div style="font-size:13px;font-weight:600">${sseLabel}</div>
              <div style="font-size:11px;color:#64748b;margin-top:4px">آخر مزامنة: قبل ${syncAgo} · ClientId: ${_clientId.slice(0,8)}...</div>
            </div>`:'<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 16px;font-size:13px;color:#c2410c">⚠️ هذا الجهاز في الوضع الاحتياطي — بياناته لا تصل لأجهزة أخرى. تأكد من الاتصال بالإنترنت ثم اضغط «تحديث» أدناه.</div>'}
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px">
              <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px">الحساب الحالي</div>
              <div style="font-size:13px;font-weight:600">${esc(u.name||'—')} · <span style="color:${u.role==='superadmin'?'#059669':'#0284c7'}">${roleDisplay}</span></div>
              ${u.role!=='superadmin'&&u.branchId?`<div style="font-size:11px;color:#64748b;margin-top:2px">الفرع: ${esc(DB.branches().find(b=>b.id===u.branchId)?.name||u.branchId)} · الفترة: ${u.period==='morning'?'صباحي':'مسائي'}</div>`:''}
              ${u.role==='superadmin'?'<div style="font-size:11px;color:#059669;margin-top:2px">✅ مدير عام — يرى جميع الفروع والبيانات</div>':'<div style="font-size:11px;color:#0284c7;margin-top:2px">ℹ️ مدير فرع — يرى فرعه فقط. للوصول الكامل استخدم حساب المدير العام (username: admin)</div>'}
            </div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="_resyncFromServer().then(()=>{toast('✅ تم تحديث البيانات من الخادم');App.go('settings',{tab:'data'})})">🔄 مزامنة الآن من الخادم</button>
          `;
        })()}
        <div style="margin-top:12px">
        <div class="card-title" style="font-size:13px;margin-bottom:8px">🗄️ سجل البيانات المحلية</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          ${Object.entries(mem).map(([k,v])=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between"><span style="font-size:13px;color:#374151">${k}</span><span style="font-size:14px;font-weight:700;color:${v>0?'#059669':'#64748b'}">${v}</span></div>`).join('')}
        </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">⬇️ تصدير البيانات</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="exportAllData()">⬇️ تصدير الكل (Excel)</button>
          <button class="btn btn-secondary" onclick="showDataRecovery()">🔧 أداة الاسترداد</button>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">🧹 تنظيف الاشتراكات المكررة</div>
        <div style="font-size:13px;color:#64748b;margin-bottom:12px">يبحث عن اشتراكات مكررة بالكامل لنفس الطفل (نفس التاريخ والمبلغ ونوع الاشتراك وطريقة الدفع) — غالباً ناتجة عن ضغط زر الحفظ مرتين، ويحذف النسخ الزائدة مع إبقاء نسخة واحدة فقط.</div>
        <button class="btn btn-secondary" onclick="cleanDuplicateSubs()">🧹 افحص ونظّف الاشتراكات المكررة</button>
      </div>
      <div class="card">
        <div class="card-title" style="color:#ef4444">⚠️ إعادة تعيين</div>
        <div class="alert-box alert-red" style="margin-bottom:16px">خطر: تحذف جميع بيانات الأطفال والاشتراكات والحضور نهائياً ولا يمكن التراجع</div>
        <button class="btn" style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5" onclick="confirmReset()">🗑️ إعادة تعيين البيانات</button>
      </div>
    </div>`;
  } else if(tab==='reminders'){
    const warnDays=(s.alertDays||{}).warn||7;
    const urgentDays=(s.alertDays||{}).urgent||3;
    const varHint=`<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
      <span style="font-size:11px;color:#64748b;align-self:center">المتغيرات:</span>
      <code onclick="insertVar(event,'{name}')" style="background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:5px;font-size:11px;cursor:pointer" title="انقر للنسخ">{name} اسم الطفل</code>
      <code onclick="insertVar(event,'{parentName}')" style="background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:5px;font-size:11px;cursor:pointer" title="انقر للنسخ">{parentName} ولي الأمر</code>
      <code onclick="insertVar(event,'{date}')" style="background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:5px;font-size:11px;cursor:pointer" title="انقر للنسخ">{date} التاريخ</code>
      <code onclick="insertVar(event,'{remaining}')" style="background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:5px;font-size:11px;cursor:pointer" title="انقر للنسخ">{remaining} المتبقي</code>
      <code onclick="insertVar(event,'{branch}')" style="background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:5px;font-size:11px;cursor:pointer" title="انقر للنسخ">{branch} الفرع</code>
    </div>`;
    const mkPreview=(id,previewId,color)=>`
      <div style="margin-top:10px">
        <div style="font-size:11px;color:#64748b;margin-bottom:4px">👁 معاينة الرسالة:</div>
        <div id="${previewId}" style="background:${color};border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;color:#1e293b;white-space:pre-wrap;min-height:40px;border:1px solid rgba(0,0,0,.06)"></div>
      </div>`;
    content=`
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">⏰ توقيت التنبيهات</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="input-group">
            <label>تنبيه مبكر (قبل الانتهاء بـ)</label>
            <div style="display:flex;align-items:center;gap:8px">
              <input class="input" id="alert-warn" type="number" value="${warnDays}" min="1" max="30" style="width:80px">
              <span style="font-size:13px;color:#475569">يوم — يظهر تنبيه أصفر</span>
            </div>
          </div>
          <div class="input-group">
            <label>تنبيه عاجل (قبل الانتهاء بـ)</label>
            <div style="display:flex;align-items:center;gap:8px">
              <input class="input" id="alert-urgent" type="number" value="${urgentDays}" min="1" max="14" style="width:80px">
              <span style="font-size:13px;color:#475569">يوم — يظهر تنبيه برتقالي</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;border-right:4px solid #25d366">
        <div class="card-title">💬 رسالة تذكير التجديد <span style="font-size:12px;font-weight:400;color:#64748b">(ترسل قبل انتهاء الاشتراك)</span></div>
        <div class="input-group">
          <textarea class="input" id="wa-expiry-tmpl" rows="4" style="resize:vertical;line-height:1.7" oninput="previewWaMsg('wa-expiry-tmpl','prev-expiry')">${esc(s.waTemplate||'')}</textarea>
          ${varHint}
        </div>
        ${mkPreview('wa-expiry-tmpl','prev-expiry','#dcfce7')}
      </div>

      <div class="card" style="margin-bottom:16px;border-right:4px solid #ef4444">
        <div class="card-title" style="color:#991b1b">🔴 رسالة المتعثر <span style="font-size:12px;font-weight:400;color:#64748b">(انتهى الاشتراك + مبلغ متبقي)</span></div>
        <div class="input-group">
          <textarea class="input" id="wa-defaulter-tmpl" rows="4" style="resize:vertical;line-height:1.7" oninput="previewWaMsg('wa-defaulter-tmpl','prev-defaulter')">${esc(s.waTemplateDefaulter||'')}</textarea>
          ${varHint}
        </div>
        ${mkPreview('wa-defaulter-tmpl','prev-defaulter','#fee2e2')}
      </div>

      <div class="card" style="margin-bottom:16px;border-right:4px solid #f59e0b">

// ---------- SALES ----------
sales(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const isSA=Auth.isSuperAdmin();
  const sid=Auth.isSuperAdmin()?null:Auth.schoolId();
  const bid=Auth.branchId();
  let allSales=DB.sales();
  if(sid) allSales=allSales.filter(s=>s.schoolId===sid);
  if(bid) allSales=allSales.filter(s=>s.branchId===bid);
  const todaySales=allSales.filter(s=>s.date===T0);
  const totalToday=todaySales.reduce((a,s)=>a+(s.price||0),0);
  const totalAll=allSales.reduce((a,s)=>a+(s.price||0),0);
  const itemLabel={'exit_card':'🪪 بطاقة خروج','uniform':'👕 زي رسمي','other':'📦 أخرى'};
  const pmLabel={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'};
  const rows=[...allSales].reverse().map(s=>{
    const child=DB.children().find(c=>c.id===s.childId);
    const who=child?esc(child.name):esc(s.parentName||'—');
    const whoSub=child&&child.parentName?`<br><small style="color:#94a3b8">${esc(child.parentName)}</small>`:'';
    return `<tr>
      <td>${formatDate(s.date)}</td>
      <td>${who}${whoSub}</td>
      <td>
        <span class="badge badge-blue">${itemLabel[s.itemType]||s.itemType}</span>
        ${s.itemName?`<br><small style="color:#374151">${esc(s.itemName)}</small>`:''}
      </td>
      <td style="font-weight:700;color:#059669">${(s.price||0).toLocaleString()} ر.س</td>
      <td>${pmLabel[s.paymentMethod]||'—'}</td>
      ${Auth.isSuperAdmin()?`<td><small style="color:#64748b">${DB.branchName(s.branchId)}</small></td>`:''}
      <td>${s.notes?`<small style="color:#64748b">${esc(s.notes)}</small>`:'—'}</td>
      <td><button class="btn btn-xs" style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5" onclick="deleteSale('${s.id}')">🗑️</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="section-header">
    <h2>🛍️ المبيعات</h2>
    <button class="btn btn-primary" onclick="Modals.addSale()">+ إضافة مبيعة</button>
  </div>
  <div class="stats-grid" style="margin-bottom:20px">
    ${isSA?`<div class="stat-card green"><div class="stat-val">${totalToday.toLocaleString()} ر.س</div><div class="stat-lbl">💰 مبيعات اليوم</div></div>`:''}
    <div class="stat-card blue"><div class="stat-val">${todaySales.length}</div><div class="stat-lbl">📦 سجلات اليوم</div></div>
    ${isSA?`<div class="stat-card green"><div class="stat-val">${totalAll.toLocaleString()} ر.س</div><div class="stat-lbl">💵 إجمالي المبيعات</div></div>`:''}
    <div class="stat-card blue"><div class="stat-val">${allSales.length}</div><div class="stat-lbl">📋 إجمالي السجلات</div></div>
  </div>
  ${allSales.length===0?`
    <div class="empty-state"><div class="es-icon">🛍️</div><p>لا توجد مبيعات مسجلة بعد</p>
    <button class="btn btn-primary" onclick="Modals.addSale()">+ إضافة أول مبيعة</button></div>
  `:`
  <div class="card">
    <table>
      <thead><tr>
        <th>التاريخ</th><th>الطفل / ولي الأمر</th><th>المنتج</th>
        <th>السعر</th><th>الدفع</th>
        ${Auth.isSuperAdmin()?'<th>الفرع</th>':''}
        <th>ملاحظات</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`}`;
},

    {k:'attendance',icon:'✅',label:'الحضور'},

  ]:[
    {k:'employees',icon:'👥',label:'الموظفون'},
    {k:'attendance',icon:'✅',label:'الحضور'},

    const fields=[{label:'الإقامة',d:e.iqamaExpiry},{label:'العقد',d:e.contractEnd},{label:'الصحية',d:e.healthCertExpiry}];
    let alerts=[];

      else if(st==='soon60') alerts.push(`<span style="color:#f59e0b;font-size:11px">⏳ ${f.label}: ${days} يوم</span>`);
    });

  };
  // رصيد الإجازة السنوية (نظام العمل السعودي: أقل من 5 سنوات 21 يوم، 5 سنوات فأكثر 30 يوم)
  const annualBalance=(e)=>Views._annualBalance(e); // رصيد تراكمي موحّد
  let content='';

    const q=(App.params.hrQ||'').trim();

    const hrSort=App.params.hrSort||'name';

    else if(hrSort==='hire_old') list.sort((a,b)=>(a.contractStart||'').localeCompare(b.contractStart||''));
    else if(hrSort==='salary_high') list.sort((a,b)=>(+b.basicSalary||0)-(+a.basicSalary||0));
    else if(hrSort==='salary_low') list.sort((a,b)=>(+a.basicSalary||0)-(+b.basicSalary||0));
    else if(hrSort==='contract') list.sort((a,b)=>{const da=a.contractEnd||'9999';const db=b.contractEnd||'9999';return da.localeCompare(db);});
    else if(hrSort==='branch') list.sort((a,b)=>(branches.find(x=>x.id===a.branchId)?.name||'').localeCompare(branches.find(x=>x.id===b.branchId)?.name||'','ar'));
    const alertCount=emps.filter(e=>{

              </td>

          </tbody>

      </div>

  } else if(tab==='attendance'){

          <thead><tr><th>الموظف</th><th>المسمى</th><th>الحالة</th><th>دخول</th><th>خروج</th><th>ساعات</th><th>دقائق التأخر</th><th>خصم التأخر (ر.س)</th></tr></thead>

          ${activeEmps.map(e=>{
            const a=attMap[e.id]||{};

            const stLabel={present:'✅ حاضر',absent:'❌ غائب',late:'⏰ متأخر',leave:'🏖️ إجازة'}[st]||'—';
            const lateMin=+(a.lateMinutes||0);
            const dailyRate=(+e.basicSalary||0)/workingDays;
            const lateDeduct=st==='late'?Math.round(lateMin/(8*60)*dailyRate*100)/100:0;
            const wMin=(a.checkIn&&a.checkOut)?((()=>{const[a1,b1]=a.checkIn.split(':').map(Number),[a2,b2]=a.checkOut.split(':').map(Number);return (a2*60+b2)-(a1*60+b1);})()):0;
            return `<tr>
              <td><strong>${esc(e.name)}</strong>${a.via==='qr-gps'?' <span style="color:#166534;font-size:10px">📷GPS</span>':''}</td>
              <td>${esc(e.jobTitle||'—')}</td>
              <td style="font-weight:600">${stLabel}</td>
              <td style="text-align:center;color:#166534">${a.checkIn||'—'}</td>
              <td style="text-align:center;color:#991b1b">${a.checkOut||'—'}</td>
              <td style="text-align:center;font-weight:600">${wMin>0?(wMin/60).toFixed(1):'—'}</td>
              <td style="text-align:center">${st==='late'?lateMin+' دقيقة':'—'}</td>
              <td style="color:#ef4444">${st==='late'&&lateDeduct>0?lateDeduct.toLocaleString()+' ر.س':'—'}</td>

          }).join('')}
          </tbody>
        </table></div>
        <div style="margin-top:12px;padding:10px 14px;background:#fef3c7;border-radius:8px;font-size:13px">
          <strong>حاسبة التأخر:</strong> كل دقيقة تأخر = راتب يومي ÷ (8 ساعات × 60 دقيقة). الراتب اليومي = الأساسي ÷ 26 يوم عمل.
        </div>
      </div>`:''}
      ${App.params.hrHours?(()=>{
        const month=date.slice(0,7);
        const monthRecs=DB.hrAttendance().filter(a=>(a.date||'').startsWith(month)&&activeEmps.some(e=>e.id===a.employeeId));
        const byEmp={};
        monthRecs.forEach(a=>{if(!byEmp[a.employeeId])byEmp[a.employeeId]={min:0,days:0,late:0};byEmp[a.employeeId].min+=_recWorkedMin(a);if(a.status==='present'||a.status==='late')byEmp[a.employeeId].days++;byEmp[a.employeeId].late+=(+a.lateMinutes||0);});
        const grand=Object.values(byEmp).reduce((s,b)=>s+b.min,0);
        return `<div class="card">
          <div class="card-title">⏱️ إجمالي ساعات العمل لكل موظف — ${Views._monthLabel(month)}</div>
          <div class="table-wrap"><table>
            <thead><tr><th>الموظف</th><th>أيام الحضور</th><th>إجمالي ساعات العمل</th><th>المتوسط/يوم</th><th>إجمالي التأخر</th></tr></thead>
            <tbody>
              ${activeEmps.map(e=>{const b=byEmp[e.id]||{min:0,days:0,late:0};return `<tr>
                <td><strong>${esc(e.name)}</strong></td>
                <td style="text-align:center">${b.days}</td>
                <td style="text-align:center;font-weight:700;color:#0f766e">${b.min?_fmtDur(b.min):'—'}</td>
                <td style="text-align:center">${b.days?_fmtDur(Math.round(b.min/b.days)):'—'}</td>
                <td style="text-align:center;color:${b.late?'#dc2626':'#94a3b8'}">${b.late?b.late+' دقيقة':'—'}</td>
              </tr>`;}).join('')}
              <tr style="background:#f0fdf4;font-weight:800"><td>الإجمالي</td><td></td><td style="text-align:center;color:#0f766e">${_fmtDur(grand)}</td><td></td><td></td></tr>
            </tbody>
          </table></div>
          <div style="margin-top:10px;font-size:12px;color:#64748b">تُحسب ساعات العمل من وقت الدخول حتى الخروج لكل يوم (باركود/GPS أو يدوي).</div>
        </div>`;
      })():''}
      <div class="card">
        <div style="display:flex;flex-direction:column;gap:8px">
          ${activeEmps.length===0?'<p style="color:#94a3b8;text-align:center;padding:32px">لا يوجد موظفون نشطون</p>':''}
          ${activeEmps.map(e=>{
            const a=attMap[e.id]||{status:''};
            const st=a.status||'';
            const lateMin=+(a.lateMinutes||0);
            const dailyRate=(+e.basicSalary||0)/workingDays;
            const lateDeduct=lateMin>0?Math.round(lateMin/(8*60)*dailyRate*100)/100:0;
            const workedMin=(a.checkIn&&a.checkOut)?((h,m)=>{const[a1,b1]=a.checkIn.split(':').map(Number),[a2,b2]=a.checkOut.split(':').map(Number);return (a2*60+b2)-(a1*60+b1);})():0;
            const opts=[['present','حاضر','#10b981'],['late','متأخر','#f59e0b'],['absent','غائب','#ef4444'],['leave','إجازة','#8b5cf6']];
            const stColor={present:'#10b981',late:'#f59e0b',absent:'#ef4444',leave:'#8b5cf6'}[st]||'#e2e8f0';
            return `<div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;border-right:4px solid ${stColor};padding:10px 14px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                <div style="flex:1;min-width:140px;font-size:14px;font-weight:600">${esc(e.name)}<span style="font-size:11px;color:#64748b;font-weight:400;margin-right:8px">${esc(e.jobTitle||'')}</span>
                  ${(()=>{const p=_empPeriod(e);return p==='morning'?'<span style="background:#fef3c7;color:#92400e;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:6px">🌅 صباحي</span>':p==='evening'?'<span style="background:#e0e7ff;color:#3730a3;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:6px">🌙 مسائي</span>':'';})()}
                  ${a.via==='qr-gps'?`<span style="background:#dcfce7;color:#166534;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:6px">📷 باركود+GPS${a.checkInDist!=null?` ${a.checkInDist}م`:''}</span>`:''}
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${opts.map(([v,l,c])=>`<button class="btn btn-xs" style="background:${st===v?c:'#fff'};color:${st===v?'#fff':c};border:2px solid ${c};font-size:12px" onclick="setHrAtt('${e.id}','${date}','${v}')">${l}</button>`).join('')}
                </div>
              </div>
              ${(a.checkIn||a.checkOut)?`<div style="display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:12px">
                <span style="color:#166534;font-weight:600">🟢 دخول: ${a.checkIn||'—'}</span>
                <span style="color:#991b1b;font-weight:600">🔴 خروج: ${a.checkOut||'—'}</span>
                ${workedMin>0?`<span style="background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-weight:700">⏳ ${(workedMin/60).toFixed(1)} ساعة</span>`:''}
              </div>`:''}
              ${st==='late'?`<div style="display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid #fde68a;flex-wrap:wrap">
                <span style="font-size:12px;color:#92400e;font-weight:600">⏱️ دقائق التأخر:</span>
                <input type="number" min="0" max="480" class="input" style="width:80px;padding:4px 8px;font-size:13px" value="${lateMin}" oninput="setHrLateMin('${e.id}','${date}',this.value)" placeholder="0">
                ${lateDeduct>0?`<span style="font-size:12px;color:#dc2626;font-weight:600">خصم: ${lateDeduct.toLocaleString()} ر.س</span>`:'<span style="font-size:12px;color:#94a3b8">تُحسب تلقائياً عند تسجيل الدخول</span>'}
              </div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  } else if(tab==='leaves'){
    const empFilter=App.params.hrLeaveEmp||'all';
    const typeFilter=App.params.hrLeaveType||'all';
    let leaves=DB.hrLeaves();
    if(bid){const myEmpIds=new Set(emps.map(e=>e.id));leaves=leaves.filter(l=>myEmpIds.has(l.employeeId));}
    if(empFilter!=='all') leaves=leaves.filter(l=>l.employeeId===empFilter);
    if(typeFilter!=='all') leaves=leaves.filter(l=>l.type===typeFilter);
    leaves.sort((a,b)=>b.startDate>a.startDate?1:-1);
    const typeLabel={annual:'سنوية',sick:'مرضية',haj:'حج',maternity:'أمومة',emergency:'طارئة',unpaid:'بدون راتب',official:'إذن رسمي',permission:'⏰ استئذان'};
    const typeColor={annual:'#059669',sick:'#ef4444',haj:'#0284c7',maternity:'#c026d3',emergency:'#f59e0b',unpaid:'#64748b',official:'#8b5cf6'};
    content=`
    <div>
      <div class="actions-bar">
        <select class="input" style="width:auto" onchange="App.go('hr',{hrTab:'leaves',hrLeaveEmp:this.value,hrLeaveType:'${typeFilter}'})">
          <option value="all">كل الموظفين</option>
          ${emps.map(e=>`<option value="${e.id}" ${empFilter===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
        </select>
        <select class="input" style="width:auto" onchange="App.go('hr',{hrTab:'leaves',hrLeaveEmp:'${empFilter}',hrLeaveType:this.value})">
          <option value="all">كل الأنواع</option>
          ${Object.entries(typeLabel).map(([k,v])=>`<option value="${k}" ${typeFilter===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <button class="btn btn-primary" onclick="Modals.addHrLeave()">+ إضافة إجازة</button>
      </div>
      ${(()=>{const pend=leaves.filter(l=>l.status==='pending').length;return pend?`<div class="alert-box alert-yellow" style="margin-bottom:12px">⏳ <div><strong>${pend} طلب إجازة بانتظار موافقتك</strong></div></div>`:'';})()}
      <div class="card">
        <div class="table-wrap"><table>
          <thead><tr><th>الموظف</th><th>الرصيد السنوي</th><th>نوع الإجازة</th><th>من</th><th>إلى</th><th>أيام</th><th>حالة</th><th>السبب</th><th>إجراءات</th></tr></thead>
          <tbody>
          ${leaves.length===0?`<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:32px">لا توجد إجازات</td></tr>`:''}
          ${leaves.map(l=>{
            const emp=emps.find(e=>e.id===l.employeeId)||DB.hrEmployees().find(e=>e.id===l.employeeId);
            const stBadge=l.status==='approved'?'<span class="badge badge-green">موافق</span>':l.status==='rejected'?'<span class="badge badge-red">مرفوض</span>':'<span class="badge badge-yellow">⏳ معلق</span>';
            const tc=typeColor[l.type]||'#475569';
            const bal=emp?annualBalance(emp):{remaining:'—',accrued:''};
            return `<tr style="${l.status==='pending'?'background:#fffdf5':''}">
              <td><strong>${esc(emp?.name||'—')}</strong></td>
              <td style="text-align:center;font-size:12px" title="متبقٍ من أصل ${bal.accrued} تراكمي"><b style="color:${(+bal.remaining||0)<0?'#dc2626':'#059669'}">${bal.remaining}</b><span style="color:#94a3b8">/${bal.accrued}</span></td>
              <td><span style="color:${tc};font-weight:600;font-size:12px">${typeLabel[l.type]||l.type}</span></td>
              <td>${formatDate(l.startDate)}</td>
              <td>${l.type==='permission'?'—':formatDate(l.endDate)}</td>
              <td style="font-weight:700;text-align:center">${l.type==='permission'?`⏰ ${l.fromTime||''}–${l.toTime||''}`:l.days}</td>
              <td>${stBadge}</td>
              <td style="font-size:12px;color:#64748b;max-width:150px">${esc(l.reason||'—')}${l.decidedBy?`<br><small style="color:#94a3b8">${l.status==='approved'?'وافق':'رفض'}: ${esc(l.decidedBy)}</small>`:''}</td>
              <td style="white-space:nowrap">
                ${l.status==='pending'?`<button class="btn btn-xs" style="background:#dcfce7;color:#166534;border:1px solid #86efac" onclick="approveLeave('${l.id}')">✅ قبول</button>
                <button class="btn btn-xs" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a" onclick="rejectLeave('${l.id}')">❌ رفض</button>`:''}
                ${l.attachment?`<a href="${l.attachment.data}" download="${esc(l.attachment.name)}" class="btn btn-xs" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;text-decoration:none" title="${esc(l.attachment.name)}">📎</a>`:''}
                <button class="btn btn-xs" style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5" onclick="deleteHrLeave('${l.id}')">🗑️</button>
              </td>
            </tr>`;
          }).join('')}
          </tbody>
        </table></div>
      </div>
    </div>`;
  } else if(tab==='payroll'){
    const month=App.params.hrMonth||(T0.slice(0,7));
    let payList=DB.hrPayroll().filter(p=>p.month===month);
    if(bid){const myEmpIds=new Set(emps.map(e=>e.id));payList=payList.filter(p=>myEmpIds.has(p.employeeId));}
    const totalNet=payList.reduce((a,p)=>a+(+p.netSalary||0),0);
    const paidCount=payList.filter(p=>p.paymentStatus==='paid').length;
    // أيام العمل في الشهر (استثناء أيام الإجازة الرسمية — حساب تقريبي على أساس 26 يوم عمل/شهر)
    const ym=month;
    const daysInMonth=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
    content=`
    <div>
      <div class="actions-bar">
        <input type="month" class="input" style="width:180px" value="${month}" onchange="App.go('hr',{hrTab:'payroll',hrMonth:this.value})">
        <button class="btn btn-primary" onclick="Modals.runPayroll('${month}')">⚙️ إنشاء مسير الشهر</button>
      </div>
      <div class="stats-grid" style="margin-bottom:16px">
        <div class="stat-card green"><div class="stat-val">${totalNet.toLocaleString()}</div><div class="stat-lbl">ر.س إجمالي الصرف</div></div>
        <div class="stat-card blue"><div class="stat-val">${paidCount}/${payList.length}</div><div class="stat-lbl">تم الصرف</div></div>
        <div class="stat-card yellow"><div class="stat-val">${daysInMonth}</div><div class="stat-lbl">أيام الشهر</div></div>
      </div>
      <div class="card">
        <div class="table-wrap"><table>
          <thead><tr><th>الموظف</th><th>الأساسي</th><th>البدلات</th><th>الغياب (أيام)</th><th>الخصومات</th><th>صافي الراتب</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody>
          ${payList.length===0?`<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:32px">لا يوجد مسير لهذا الشهر — اضغط «إنشاء مسير الشهر» لتوليده تلقائياً</td></tr>`:''}
          ${payList.map(p=>{
            const emp=DB.hrEmployees().find(e=>e.id===p.employeeId);
            const allowances=(+p.housingAllowance||0)+(+p.transportAllowance||0)+(+p.otherAllowances||0)+(+p.bonus||0);
            const deductions=(+p.absenceDeduction||0)+(+p.loanDeduction||0)+(+p.otherDeductions||0)+(+p.gosiDeduction||0);
            const stBadge=p.paymentStatus==='paid'?'<span class="badge badge-green">مُصرَّف</span>':'<span class="badge badge-yellow">معلق</span>';
            return `<tr>
              <td><strong>${esc(emp?.name||'—')}</strong></td>
              <td style="font-weight:600">${(+p.basicSalary||0).toLocaleString()}</td>
              <td style="color:#059669">${allowances.toLocaleString()}</td>
              <td style="color:#ef4444;text-align:center">${p.absenceDays||0}</td>
              <td style="color:#ef4444">${deductions.toLocaleString()}</td>
              <td style="font-weight:700;color:#0f766e;font-size:15px">${(+p.netSalary||0).toLocaleString()} ر.س</td>
              <td>${stBadge}</td>
              <td style="display:flex;gap:4px;flex-wrap:wrap">
                <button class="btn btn-secondary btn-xs" onclick="Modals.viewPayslip('${p.id}')">📄 كشف</button>
                ${p.paymentStatus!=='paid'?`<button class="btn btn-xs" style="background:#dcfce7;color:#166534;border:1px solid #86efac" onclick="markHrPaid('${p.id}')">✅ صُرِّف</button>`:''}
                <button class="btn btn-xs" style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5" onclick="DB.deleteHrPayroll('${p.id}');App.refresh()">🗑️</button>
              </td>
            </tr>`;
          }).join('')}
          </tbody>
        </table></div>
      </div>
    </div>`;
  }
  return `
  <div class="tabs no-print">
    ${tabs.map(t=>`<div class="tab ${tab===t.k?'active':''}" onclick="App.go('hr',{hrTab:'${t.k}'})">${t.icon} ${t.label}</div>`).join('')}
  </div>
  ${content}`;
},
};// end Views

const Modals = {
  _branchGeoFields(b){
    return `
      <div style="background:#f0fdf4;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;font-weight:600;margin-bottom:10px">📍 موقع الفرع (لتحضير الموظفين بالباركود + GPS)</div>

      <div class="input-group"><label>نطاق السماح للتحضير (متر)</label><input class="input" id="br-radius" type="number" min="30" max="1000" value="${b?.geoRadius||150}">
        <small style="font-size:11px;color:#64748b;margin-top:2px;display:block">المسافة المسموحة من موقع الفرع لقبول تحضير الموظف</small>
      </div>`;
  },
  // طلب إجازة من المعلمة (يُرفع للإدارة قيد المراجعة)
