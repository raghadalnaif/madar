(function(){

})();

<body>
<div id="quick-search-overlay" onclick="if(event.target===this)closeQuickSearch()">
  <div id="qs-box">
    <input id="qs-input" placeholder="🔍 ابحث عن طفل، موظف، اشتراك..." autocomplete="off" oninput="runQuickSearch(this.value)" onkeydown="qsKeyNav(event)">
    <div id="qs-results"><div style="padding:32px;text-align:center;color:#94a3b8;font-size:14px">اكتب للبحث... أو اضغط Esc للإغلاق</div></div>
  </div>
</div>
<div id="app"></div>

<script>
// =========================================================
//  HELPERS
// =========================================================
// صيغة YYYY-MM-DD بالتوقيت المحلي (مو UTC) — يمنع اختفاء الحضور عند منتصف ليل UTC
const _ymd = (d) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => _ymd(new Date());
const addDays = (date, n) => {
  const d = new Date(date + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return _ymd(d);
};
const diffDays = (d1, d2) => Math.round((new Date(d1) - new Date(d2)) / 86400000);
const formatDate = d => {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const T0 = today();

// =========================================================
//  SEED DATA
// =========================================================
// ملاحظة: لم تعد هذه القيم تُستخدم كبيانات افتراضية مشتركة لكل المدارس —
// كل مدرسة جديدة (Tenant) تبدأ ببيانات فارغة، ويُنشأ مديرها العام وسجلّها
// من بيانات التسجيل الفعلية (انظر DB.init() ودالة _seedFreshTenant).
const SEED = {
  branches: [
    {id:'b1',name:'الفرع الرئيسي',location:''},
  ],
  users: [],
  schools: [],
  children: [],
  subscriptions: [],
  attendance: [],
  notifications: [],
  weekly_activities: [],
  sales: [],
  govDocs: [],
  settings: {prices:{morning:{daily:150,weekly:600,monthly:1800},evening:{daily:70,weekly:300,monthly:900}},invoicePrefix:'INV',alertDays:{warn:7,urgent:3},waTemplate:'مرحباً {name}، اشتراك طفلك ينتهي بتاريخ {date}. يرجى التواصل للتجديد. مع تحياتنا 🌟',vatRate:15,vatInclusive:true},
};

// =========================================================
//  FIREBASE
// =========================================================
const firebaseConfig={
  apiKey:'AIzaSyBEjf1Xrz-YbRHt92ifjeedmbudFy14VJ4',
  authDomain:'madarkkids.firebaseapp.com',
  databaseURL:'https://madarkkids-default-rtdb.firebaseio.com',
  projectId:'madarkkids',
  storageBucket:'madarkkids.firebasestorage.app',
  messagingSenderId:'621052089307',
  appId:'1:621052089307:web:bf5d23b9b54ec40cf38dfe'
};
let _fdb=null;
let _lastWrite=0;
let _fbStatus='connecting'; // 'connecting' | 'ok' | 'error'
const _mem={};
const _pendingEcho={}; // key→snapshot لقيمة كتبناها مؤخراً (لتجاهل صدى ذاتي فقط، لا تأخير لتحديثات الأجهزة الأخرى)
const _writeFails={}; // key→count محاولات فشلت
const _keyListeners=new Set(); // المفاتيح التي رُبط لها مستمع منفصل
let _renderScheduled=false;

// مستمع منفصل لكل مفتاح بدل مستمع واحد على كامل الشجرة —
// فحفظ مفتاح واحد لا يعيد تنزيل/معالجة بقية المجموعات (الإيصالات/الملفات base64)
function _ensureKeyListener(k){
  if(!_fdb||_fbStatus!=='ok'||_keyListeners.has(k)) return;
  _keyListeners.add(k);
  _fdb.ref('ccs/'+k).on('value',snap=>_onKeyValue(k,snap.val()));
}
function _onKeyValue(k,val){
  if(val===null||val===undefined) return;
  let incoming; try{incoming=JSON.stringify(val);}catch{return;}
  // صدى ذاتي لقيمة كتبناها نحن — تجاهله
  if(_pendingEcho[k]===incoming){delete _pendingEcho[k];return;}
  let current; try{current=JSON.stringify(_mem[k]);}catch{current=undefined;}
  if(current===incoming) return;
  // إشعار جديد وصل من جهاز آخر (مديرة فرع) → نبّه المستخدم الحالي بصرياً
  if(k==='notifications'&&Array.isArray(val)){
    const oldLen=Array.isArray(_mem[k])?_mem[k].length:0;
    if(val.length>oldLen&&Auth.user&&(Auth.user.role==='superadmin'||Auth.user.role==='school_admin')){
      const newest=val[0];
      if(newest&&typeof toast==='function'){
        setTimeout(()=>toast('🔔 '+(newest.title||'إشعار جديد')+(newest.body?' — '+newest.body:'')),120);
      }
    }
  }
  // رسالة داخلية جديدة وصلت من جهاز آخر → تنبيه فوري (صوت + اهتزاز + toast)
  if(k==='internalMessages'&&Array.isArray(val)&&Auth.user){
    const me=Auth.user;
    const oldIds=new Set((Array.isArray(_mem[k])?_mem[k]:[]).map(m=>m.id));
    const tBranch={};(_mem.users||[]).filter(u=>u&&u.role==='teacher').forEach(t=>{tBranch[t.id]=t.branchId;});
    const forMe=val.filter(m=>m&&!oldIds.has(m.id)&&m.fromUserId!==me.id&&(
      me.role==='teacher'?m.tThread===me.id:
      me.role==='superadmin'?(m.tThread?true:m.toRole==='superadmin'):
      me.role==='school_admin'?(m.tThread?tBranch[m.tThread]===me.branchId:((m.toBranchId===me.branchId||m.toUserId===me.id)&&m.fromRole!=='teacher')):false
    ));
    if(forMe.length){
      const newest=forMe[0];
      _msgPing();
      if(typeof toast==='function') setTimeout(()=>toast('💬 رسالة من '+(newest.fromName||'')+': '+((newest.message||'').slice(0,50)||'📎 مرفق')),100);
    }
  }
  // حماية من مسح الحضور: تجاهل مزامنة فارغة تحاول استبدال حضور موجود محلياً
  if((k==='attendance'||k==='hr_attendance')&&Array.isArray(val)&&val.length===0){
    const cur=Array.isArray(_mem[k])?_mem[k]:[];
    if(cur.length>0){console.warn('[sync] تم تجاهل مزامنة فارغة لـ'+k+' لحماية '+cur.length+' سجل');return;}
  }
  _mem[k]=val;
  try{localStorage.setItem('ccs_'+k,incoming);}catch{}
  _backupData(k,val); // نسخ احتياطي للحضور القادم من المزامنة أيضاً
  // ضمان تحديث بيانات المستخدم الحالي إن تغيّر المستخدمون
  if(k==='users'&&Auth.user&&Auth.user.id){
    const fresh=val.find(u=>u.id===Auth.user.id);
    if(fresh){Auth.user=fresh;try{sessionStorage.setItem('ccs_user',JSON.stringify(fresh));}catch{}}
  }
  _scheduleRender();
}
// ===== نسخ احتياطي دوري للحضور (حماية من الفقدان) =====
function _backupData(k,v){
  if(k!=='attendance'&&k!=='hr_attendance') return;
  if(!Array.isArray(v)||v.length===0) return; // لا نحفظ نسخة فارغة
  try{
    const key='ccs_bak_'+k;
    let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]');}catch{}
    // تجنّب حفظ نسخ متطابقة متتالية
    if(arr[0]&&arr[0].n===v.length&&(Date.now()-arr[0].t)<120000) return;
    arr.unshift({t:Date.now(),n:v.length,d:v});
    if(arr.length>6) arr=arr.slice(0,6);
    localStorage.setItem(key,JSON.stringify(arr));
  }catch(e){/* تجاوز حد التخزين — نُبقي النسخ القديمة */}
}
// استرجاع الحضور من نسخة احتياطية (دمج — لا يخسر أي سجل موجود)
function restoreAttBackup(kind){
  if(!Auth.isSuperAdmin()){toast('الاسترجاع للمدير العام فقط','error');return;}
  let arr=[];try{arr=JSON.parse(localStorage.getItem('ccs_bak_'+kind)||'[]');}catch{}
  if(!arr.length){alert('لا توجد نسخ احتياطية على هذا الجهاز بعد.');return;}
  const curArr=DB.get(kind)||[];
  const list=arr.map((b,i)=>`${i}: ${new Date(b.t).toLocaleString('en-GB')} — ${b.n} سجل`).join('\n');
  const pick=prompt(`النسخ الاحتياطية للحضور (الحالي: ${curArr.length} سجل):\n\n${list}\n\nاكتبي رقم النسخة للاسترجاع (دمج آمن):`,'0');
  if(pick===null) return;
  const b=arr[+pick]; if(!b||!Array.isArray(b.d)){alert('رقم غير صحيح');return;}
  const keyOf=(a)=>kind==='hr_attendance'?((a.employeeId||'')+'|'+(a.date||'')):((a.childId||'')+'|'+(a.date||''));
  const map=new Map();
  curArr.forEach(a=>{if(a)map.set(keyOf(a),a);});
  let added=0;
  b.d.forEach(a=>{if(a&&!map.has(keyOf(a))){map.set(keyOf(a),a);added++;}});
  if(!confirm(`النسخة تحتوي ${b.n} سجل. سيُضاف ${added} سجل مفقود للموجود (${curArr.length}) بدون حذف أي شيء. متابعة؟`)) return;
  const merged=Array.from(map.values());
  if(kind==='hr_attendance') DB.saveHrAttendance(merged); else DB.saveAttendance(merged);
  DB.addAuditLog({action:'استرجاع نسخة حضور',entity:kind,entityId:'backup',details:`أُضيف ${added} سجل`,by:Auth.user?.name||'—'});
  toast(`🛟 تم استرجاع ودمج ${added} سجل`);App.refresh();
}
// تحديث شارة الجرس ونقطة المزامنة في الشريط العلوي مباشرة عند وصول بيانات جديدة
function _refreshNotifBadge(){
  const btn=document.getElementById('notif-btn');
  if(btn){const unread=DB.unreadCount();btn.innerHTML='🔔'+(unread>0?`<span class="notif-badge">${unread>9?'9+':unread}</span>`:'');}
  const dot=document.getElementById('sync-dot');
  if(dot){
    const sseState=_sse?_sse.readyState:-1;
    const ok=_storageMode==='backend'&&sseState===1;
    const warn=_storageMode==='backend'&&sseState!==1;
    dot.style.background=ok?'#10b981':warn?'#f59e0b':'#ef4444';
    dot.title=_storageMode==='firebase'?'وضع احتياطي — لا تزامن مع الفروع الأخرى':ok?'متصل بالسيرفر':'اتصال بالسيرفر منقطع — إعادة محاولة...';
  }
}
// تحديث نقطة الرسائل غير المقروءة في القائمة الجانبية فوراً (بدون إعادة رسم كامل)
function _refreshMsgNav(){
  if(!Auth.user) return;
  const item=document.querySelector('.nav-item[data-v="messages"]');
  if(!item) return;
  let unread=0;
  try{unread=DB.unreadInternalCount(Auth.user.id,Auth.user.role,Auth.branchId());}catch{}
  let dot=item.querySelector('.nav-msg-dot');
  if(unread>0&&!dot){const s=document.createElement('span');s.className='nav-msg-dot';s.title=unread+' رسالة غير مقروءة';item.appendChild(s);}
  else if(unread<=0&&dot){dot.remove();}
}
// تنبيه صوتي قصير + اهتزاز عند وصول رسالة جديدة (تنبيه فوري وسريع)
let _audioCtx=null;
function _msgPing(){
  try{
    _audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const ctx=_audioCtx;if(ctx.state==='suspended')ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.setValueAtTime(1175,ctx.currentTime+0.09);
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.28);
    o.start();o.stop(ctx.currentTime+0.3);
  }catch{}
  try{if(navigator.vibrate)navigator.vibrate([40,30,40]);}catch{}
}
// تجميع إعادات الرسم — عدة تحديثات متتالية تُنتج إعادة رسم واحدة فقط
function _scheduleRender(){
  if(_renderScheduled) return;
  _renderScheduled=true;
  requestAnimationFrame(()=>{
    _renderScheduled=false;
    if(!Auth.user) return;
    _refreshNotifBadge(); // شارة الجرس تتحدّث دائماً ولو كنا في الإعدادات أو نافذة مفتوحة
    _refreshMsgNav();     // نقطة الرسائل في القائمة الجانبية تتحدّث فوراً
    if(App.modal||App.view==='settings') return;
    const el=document.getElementById('content');
    if(!el) return;
    const saved={};
    el.querySelectorAll('input[id],select[id]').forEach(inp=>{saved[inp.id]=inp.value;});
    el.innerHTML=App.currentView();
    Object.entries(saved).forEach(([id,val])=>{const f=document.getElementById(id);if(f&&val!==undefined)f.value=val;});
  });
}

// =========================================================
//  TRANSPORT: خادم التخزين (يحل محل Firebase) + SSE
// =========================================================
const API_BASE=(typeof window!=='undefined'&&window.MADAREK_API_BASE)||'/api';
// كل مدرسة (Tenant) لها توكن جلسة خاص بها، يُضبط بعد تسجيل دخول المدرسة —
// لم يعد هناك سرّ عام واحد مضمّن في الصفحة (api-config.js لم يعد يُستخدم للتوثيق
// لأن الصفحة أصبحت عامة يزورها زوّار لتسجيل مدارس جديدة).
let API_TOKEN='';
let _storageMode='backend'; // 'backend' فقط الآن — لا يوجد بديل مشترك بين المدارس
let _sse=null;
let _lastResync=0; // وقت آخر مزامنة ناجحة مع الخادم (Unix ms)
let _clientId=(()=>{try{return localStorage.getItem('ccs_clientId')||'';}catch{return '';}})();
if(!_clientId){
  _clientId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
  try{localStorage.setItem('ccs_clientId',_clientId);}catch{}
}
function _apiHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+API_TOKEN,'X-Client-Id':_clientId};}
async function _backendGetAll(){
  const r=await fetch(API_BASE+'/data',{headers:_apiHeaders()});
  if(r.status===401||r.status===403){
    let body=null; try{body=await r.json();}catch(e){}
    const err=new Error(body&&body.error||'auth');
    err.code=(r.status===403)?'subscription_inactive':'unauthorized';
    err.tenantInfo=body&&body.tenant||null;
    throw err;
  }
  if(!r.ok) throw new Error('backend GET '+r.status);
  return await r.json();
}
async function _backendBulk(obj){
  const r=await fetch(API_BASE+'/bulk',{method:'POST',headers:_apiHeaders(),body:JSON.stringify(obj)});
  if(!r.ok) throw new Error('bulk '+r.status);
  return await r.json();
}
function _backendPut(k,serialized){
  return fetch(API_BASE+'/data/'+encodeURIComponent(k),{method:'PUT',headers:_apiHeaders(),body:serialized});
}
function _openSSE(){
  try{
    if(_sse){try{_sse.close();}catch{}}
    const url=API_BASE+'/stream?clientId='+encodeURIComponent(_clientId)+'&token='+encodeURIComponent(API_TOKEN);
    _sse=new EventSource(url);
    _sse.onmessage=(ev)=>{
      try{const m=JSON.parse(ev.data);if(m&&m.key!==undefined)_onKeyValue(m.key,m.value);}catch(e){}
    };
    // EventSource يعيد الاتصال تلقائياً عند الانقطاع
  }catch(e){console.error('[SSE]',e);}
}
// مزامنة احتياطية بالسحب (pull) — لا نعتمد على SSE وحده للوصول. بعض الأجهزة
// (خصوصاً الجوال عند تعليق المتصفح بالخلفية أو تبديل الشبكة) تُسقط الاتصال
// اللحظي بصمت دون أن يُعيد EventSource فتحه فعلياً، فتبقى بيانات الجهاز
// قديمة (لا تصل إشعارات/حضور/تقارير من فروع أخرى) دون أي خطأ ظاهر للمستخدم.
async function _resyncFromServer(){
  if(_storageMode!=='backend') return;
  try{
    const fresh=await _backendGetAll();
    Object.entries(fresh).forEach(([k,v])=>_onKeyValue(k,v));
    _lastResync=Date.now();
  }catch(e){}
}
function _ensureSSEAlive(){
  if(_storageMode!=='backend') return;
  if(!_sse||_sse.readyState===2) _openSSE(); // 2 = CLOSED
}
function _startSyncWatchdog(){
  // عند عودة التبويب للواجهة، أو عودة الاتصال بالشبكة: تأكد من حيوية SSE واسحب أحدث نسخة فوراً
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){_ensureSSEAlive();_resyncFromServer();}
  });
  window.addEventListener('online',()=>{_ensureSSEAlive();_resyncFromServer();});
  window.addEventListener('pageshow',()=>{_ensureSSEAlive();_resyncFromServer();});
  // فحص دوري احتياطي حتى لو لم يتغيّر ظهور التبويب أو الشبكة صراحةً
  setInterval(()=>{
    // انتهى اليوم والصفحة مفتوحة (جهاز الاستقبال) → أعد التحميل لتحديث «تاريخ اليوم»
    if(typeof today==='function'&&today()!==T0){location.reload();return;}
    if(document.visibilityState!=='visible') return;
    _ensureSSEAlive();
    _resyncFromServer();
  },60000);
}

const DB = {
  get(k){
    if(_mem.hasOwnProperty(k)) return _mem[k];
    try{return JSON.parse(localStorage.getItem('ccs_'+k))}catch{return null}
  },
  set(k,v){
    _mem[k]=v;
    // تحويل النص مرة واحدة فقط — يُستخدم للتخزين المحلي ولكشف الصدى الذاتي
    let serialized=null;
    try{serialized=JSON.stringify(v);}catch{}
    try{if(serialized!==null)localStorage.setItem('ccs_'+k,serialized)}catch{}
    _backupData(k,v); // نسخ احتياطي دوري للحضور (حماية من الفقدان)
    // وضع التخزين على الخادم (الأساسي)
    if(_storageMode==='backend'){
      if(serialized===null) return;
      const attempt=(n)=>{
        _backendPut(k,serialized)
          .then(r=>{if(!r.ok)throw new Error('http '+r.status);_writeFails[k]=0;})
          .catch(err=>{
            if(n<4){setTimeout(()=>attempt(n+1),1000*n);}
            else{
              _writeFails[k]=(_writeFails[k]||0)+1;
              console.error('[DB] فشل حفظ '+k+':',err?.message||err);
              if(typeof toast==='function') toast('⚠️ تعذّر حفظ "'+k+'" — تحقق من الاتصال','error');
            }
          });
      };
      attempt(1);
      return;
    }
    // وضع Firebase (احتياطي)
    if(_fdb&&_fbStatus==='ok'){
      _lastWrite=Date.now();
      // خزّن قيمة ما كتبنا — المستمع يقارن لرفض الصدى الذاتي فقط
      _pendingEcho[k]=serialized;
      _ensureKeyListener(k); // ربط مستمع لو كان مفتاحاً جديداً
      // نظّف بعد 60 ثانية لتجنب نمو الذاكرة
      setTimeout(()=>{delete _pendingEcho[k];},60000);
      const attempt=(n)=>{
        _fdb.ref('ccs/'+k).set(_mem[k])
          .then(()=>{_writeFails[k]=0;})
          .catch(err=>{
            if(n<4){
              setTimeout(()=>attempt(n+1),1000*n);
            } else {
              _writeFails[k]=(_writeFails[k]||0)+1;
              console.error('[DB] فشل حفظ '+k+':',err?.message||err);
              if(typeof toast==='function') toast('⚠️ تعذّر مزامنة "'+k+'" — احفظ مرة أخرى','error');
            }
          });
      };
      attempt(1);
    }
  },
  // التهيئة: تحميل بيانات المدرسة الحالية (Tenant) من الخادم فقط.
  // قد ترمي خطأ برمز 'subscription_inactive' أو 'unauthorized' — يتولّى المستدعي (startAppForTenant) عرض الشاشة المناسبة.
  async initStorage(){
    const backendData=await _backendGetAll();

  },
  // قراءة بيانات Firebase مرة واحدة (للنقل فقط — بدون مستمعات ولا كتابة)
  async _loadFirebaseRaw(){
    if(typeof firebase==='undefined') return null;

    try{
      if(typeof firebase==='undefined') throw new Error('Firebase SDK not loaded — check network/CDN');
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      _fdb=firebase.database();
      _fbStatus='ok';
      // تحميل البيانات من RTDB
      const snap=await _fdb.ref('ccs').get();

      if(fbData&&Object.keys(fbData).length){
        Object.assign(_mem,fbData);
      } else {
        // نقل بيانات localStorage إلى Firebase (مرة واحدة)
        const keys=Object.keys(SEED);
        const toMigrate={};
        keys.forEach(k=>{
          const raw=localStorage.getItem('ccs_'+k);
          if(raw){try{toMigrate[k]=JSON.parse(raw);_mem[k]=toMigrate[k];}catch{}}

      }
      // مستمعات منفصلة لكل مفتاح — حفظ مجموعة واحدة لا يعيد تنزيل/معالجة الباقي
      const listenKeys=new Set([...Object.keys(SEED),...Object.keys(fbData||{})]);

      _fdb=null; // أهم سطر: امنع DB.init() من الكتابة على Firebase بعد فشل القراءة

    const s=this.get('settings');
    return s?{...def,...s,prices:{...def.prices,...(s.prices||{})},alertDays:{...def.alertDays,...(s.alertDays||{})}}:def;
  },
  saveSettings(s){this.save('settings',s);},
  sales(){return this.get('sales')||[]},
  addSale(s){const a=this.sales();a.push(s);this.save('sales',a)},
  deleteSale(id){this.save('sales',this.sales().filter(x=>x.id!==id))},
  // ===== مكتبة الأنشطة القابلة للتوسّع =====
  // أنشطة تكتبها الإدارة وتُحفظ دائماً وتُنشر لكل الفروع (مشتركة)
  customActivities(){return this.get('custom_activities')||[]},
  addCustomActivity(a){const l=this.customActivities();l.unshift({...a,id:uid(),createdAt:new Date().toISOString()});this.save('custom_activities',l);},
  updateCustomActivity(a){const l=this.customActivities();const i=l.findIndex(x=>x.id===a.id);if(i>=0)l[i]={...l[i],...a};this.save('custom_activities',l);},
  deleteCustomActivity(id){this.save('custom_activities',this.customActivities().filter(x=>x.id!==id));},
  // إرسال نشاط للمعلمات (كل/فرع/معلمة) — كل إرسال سجل مستقل
  activityAssignments(){return this.get('activity_assignments')||[]},
  addActivityAssignment(a){const l=this.activityAssignments();l.unshift({...a,id:uid(),sentAt:new Date().toISOString()});this.save('activity_assignments',l);},
  deleteActivityAssignment(id){
    this.save('activity_assignments',this.activityAssignments().filter(x=>x.id!==id));
    this.save('activity_reports',this.activityReports().filter(r=>r.assignmentId!==id));
  },
  // تنفيذ المعلمة للنشاط (تم/لم يتم + ملاحظة + صورة)
  activityReports(){return this.get('activity_reports')||[]},
  setActivityReport(r){
    const l=this.activityReports();
    const i=l.findIndex(x=>x.assignmentId===r.assignmentId&&x.teacherId===r.teacherId);
    if(i>=0) l[i]={...l[i],...r,at:new Date().toISOString()};
    else l.unshift({...r,id:uid(),at:new Date().toISOString()});
    this.save('activity_reports',l);
  },
  weeklyActivities(){return this.get('weekly_activities')||[]},
  toggleWeeklyActivity(act){
    const list=this.weeklyActivities();
    const idx=list.findIndex(a=>a.n===act.n);
    if(idx>=0) list.splice(idx,1);
    else list.push({n:act.n,name:act.name,catKey:act.catKey,cat:act.cat,publishedAt:today(),goal:act.goal,time:act.time,age:act.age,materials:act.materials,steps:act.steps,tips:act.tips});
    this.save('weekly_activities',list);
  },
  unreadCount(){return this.notifications().filter(n=>!n.isRead).length;},
  // get active subscription for child (latest by endDate)
  activeSub(childId){
    return this.subscriptions().filter(s=>s.childId===childId&&s.isActive).sort((a,b)=>b.endDate>a.endDate?1:-1)[0]||null;
  },
  subStatus(sub){
    if(!sub) return 'none';
    const d=diffDays(sub.endDate,T0);
    if(d<0) return 'expired';
    if(d===0) return 'today';
    const al=DB.settings().alertDays||{warn:7,urgent:3};
    if(d<=(al.urgent||3)) return 'soon3';
    if(d<=(al.warn||7)) return 'soon7';
    return 'active';
  },
  alerts(schoolId=null,branchId=null){
    let subs=this.subscriptions();
    if(schoolId) subs=subs.filter(s=>s.schoolId===schoolId);
    if(branchId) subs=subs.filter(s=>s.branchId===branchId);
    subs=subs.filter(s=>s.isActive);
    return {
      expired:subs.filter(s=>diffDays(s.endDate,T0)<0),
      today:subs.filter(s=>s.endDate===T0),
      in3:subs.filter(s=>diffDays(s.endDate,T0)>0&&diffDays(s.endDate,T0)<=3),
      in7:subs.filter(s=>diffDays(s.endDate,T0)>3&&diffDays(s.endDate,T0)<=7),
    };
  },
  // حالة الوثيقة الحكومية: نافذة تنبيه أطول من الاشتراكات (تجديد رخص يحتاج وقت أطول)
  govDocStatus(d){
    if(!d?.expiryDate) return 'none';
    const dd=diffDays(d.expiryDate,T0);
    if(dd<0) return 'expired';
    if(dd<=7) return 'soon7';
    if(dd<=30) return 'soon30';
    return 'active';
  },
  childName(id){return this.children().find(c=>c.id===id)?.name||id},
  schoolName(id){return this.schools().find(s=>s.id===id)?.name||id},
  branchName(id){return this.branches().find(b=>b.id===id)?.name||'—'},
  addBranch(b){const a=this.branches();a.push(b);this.set('branches',a)},
  updateBranch(b){const a=this.branches();const i=a.findIndex(x=>x.id===b.id);if(i>=0)a[i]=b;else a.push(b);this.set('branches',a)},
};

async function tenantApiCall(path,opts={}){
  const r=await fetch(API_BASE+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});
  let body=null; try{body=await r.json();}catch(e){}
  if(!r.ok){const err=new Error(body&&body.error||('http '+r.status));err.code=body&&body.error;err.tenantInfo=body&&body.tenant;throw err;}
  return body;
}

  showModal(html){
    App.modal=html;

    const root=document.getElementById('app');
    if(root&&Auth.user){
      let modalLayer=document.getElementById('modal-layer');
      if(!modalLayer){
        modalLayer=document.createElement('div');
        modalLayer.id='modal-layer';
        root.appendChild(modalLayer);
      }
      modalLayer.innerHTML=html;
    } else App.render();
  },
  closeModal(){
    App.modal=null;
    const modalLayer=document.getElementById('modal-layer');
    if(modalLayer) modalLayer.innerHTML='';
    else App.render();
  },
};

// ---------- شاشة حالة الاشتراك (قيد المراجعة / موقوفة / منتهية) ----------
subscriptionStatus(tenant){
  const status=tenant?.status||'pending';
  const expired=status==='active'&&tenant?.subEnd&&tenant.subEnd<today();
  let title='طلبكم قيد المراجعة',msg='تم استلام طلب تسجيل مدرستكم بنجاح، وسيقوم مزوّد الخدمة بمراجعته وتفعيل الحساب خلال وقت قصير.';
  if(status==='suspended'){title='الحساب موقوف حالياً';msg='تم إيقاف حساب مدرستكم من قبل مزوّد الخدمة. يرجى التواصل معه لمعرفة السبب وإعادة التفعيل.';}
  else if(expired){title='انتهى الاشتراك';msg='انتهت مدة اشتراك مدرستكم بتاريخ '+formatDate(tenant.subEnd)+'. يرجى التواصل مع مزوّد الخدمة لتجديد الاشتراك.';}
  return `
  <div class="login-page">
    <div class="login-card" style="max-width:440px">
      <div class="login-form" style="padding-top:36px;text-align:center">
        <h2 style="font-size:19px;font-weight:800;color:#1e293b;margin-bottom:10px">${title}</h2>
        <p style="font-size:14px;color:#64748b;line-height:1.9;margin-bottom:20px">${msg}</p>
        ${tenant?`<div class="card" style="background:#f8fafc;text-align:right;padding:14px 16px;margin-bottom:18px">
          <div style="font-size:13px;color:#475569"><strong>المدرسة:</strong> ${esc(tenant.name)}</div>
          <div style="font-size:13px;color:#475569;margin-top:4px"><strong>نوع العضوية:</strong> ${MEMBERSHIP_LABELS[tenant.membershipType]||tenant.membershipType||'—'}</div>
          ${tenant.subEnd?`<div style="font-size:13px;color:#475569;margin-top:4px"><strong>نهاية الاشتراك:</strong> ${formatDate(tenant.subEnd)}</div>`:''}
        </div>`:''}
        <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="logoutTenant()">تسجيل خروج</button>
      </div>
    </div>
  </div>`;
},

// مُولّد موحّد لصناديق التنبيه: أيقونة + عنوان + عدّاد، وقائمة أسماء كـ chips تُطوى تلقائياً إذا طالت
_alert(cls,icon,title,items,opts={}){
  const n=items.length;
  if(!n) return '';
  const preview=opts.preview??3;
  const note=opts.note?`<div class="alert-note">${opts.note}</div>`:'';
  const head=`<span class="alert-head">${title}</span><span class="alert-count">${n}</span>`;
  const chips=`<div class="alert-chips">${items.map(t=>`<span class="alert-chip">${t}</span>`).join('')}</div>`;
  if(n>preview){
    return `<details class="alert-box ${cls}"><summary><span class="alert-ic">${icon}</span><span style="flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${head}</span><span class="alert-toggle">▾</span></summary>${note}${chips}</details>`;
  }
  const click=opts.onclick?` onclick="${opts.onclick}" style="cursor:pointer"`:'';
  return `<div class="alert-box ${cls}"${click}><span class="alert-ic">${icon}</span><div style="flex:1">${head?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${head}</div>`:''}${note}${chips}</div></div>`;
},

// مركز التنبيهات الموحّد — يجمع الاشتراكات + وثائق الموظفين + الوثائق الحكومية في صندوق واحد منظّم
_alertCenter(al,schoolId=null){
  const parts=[
    Views._alertBanners(al,schoolId),
    Views._hrDocAlertBanner(),
    Auth.isSuperAdmin()?Views._govDocAlertBanner():''
  ].filter(Boolean).join('');
  if(!parts) return '';
  return `<div class="alert-center"><div class="alert-center-head">🔔 مركز التنبيهات</div>${parts}</div>`;
},

_alertBanners(al,schoolId=null){
  const children=DB.children();
  const getName=(sub)=>{
    const c=children.find(x=>x.id===sub.childId);
    return c?c.name:sub.childId;
  };
  // الاشتراكات المنتهية: تظهر فقط إذا انتهت خلال آخر 5 أيام
  const dismissedAlerts=JSON.parse(localStorage.getItem('_dismissed_alerts')||'{}');
  const recentExpired=al.expired.filter(s=>diffDays(T0,s.endDate)<=5&&!dismissedAlerts[s.id]);
  const hiddenCount=al.expired.length-recentExpired.length;
  let html='';
  if(recentExpired.length){
    const items=recentExpired.map(s=>`${getName(s)} <span style="opacity:.7">· ${diffDays(T0,s.endDate)}ي</span> <button onclick="event.stopPropagation();dismissSubAlert('${s.id}')" class="alert-x" title="إخفاء">✕</button>`);
    const title='اشتراكات منتهية'+(hiddenCount>0?` <span style="font-weight:400;font-size:11px;opacity:.7">(${hiddenCount} مخفية)</span>`:'');
    html+=Views._alert('alert-red','🔴',title,items,{preview:3});
  }
  if(al.today.length){
    html+=Views._alert('alert-yellow','🟡','تنتهي اليوم',al.today.map(s=>getName(s)),{preview:4});
  }
  if(al.in3.length){
    html+=Views._alert('alert-orange','🟠','تنتهي خلال 3 أيام',al.in3.map(s=>`${getName(s)} — ${formatDate(s.endDate)}`),{preview:3});
  }
  if(al.in7.length){
    html+=Views._alert('alert-blue','🔵','تنتهي خلال أسبوع',al.in7.map(s=>`${getName(s)} — ${formatDate(s.endDate)}`),{preview:3});
  }
  return html;
},

// تنبيهات وثائق الموظفين (إقامة / عقد / صحية) — مبني على نظام العمل السعودي
_hrDocAlertBanner(){
  const bid=Auth.branchId();
  let emps=DB.hrEmployees().filter(e=>(e.status||'active')==='active');
  if(bid) emps=emps.filter(e=>e.branchId===bid);
  const fields=[{k:'iqamaExpiry',lbl:'إقامة'},{k:'contractEnd',lbl:'عقد'},{k:'healthCertExpiry',lbl:'شهادة صحية'}];
  const expired=[],urgent=[],warn=[];
  emps.forEach(e=>{
    fields.forEach(f=>{
      if(!e[f.k]) return;
      const st=DB.hrDocStatus(e[f.k]);
      const days=diffDays(e[f.k],T0);
      if(st==='expired') expired.push(`${esc(e.name)} <span style="opacity:.7">(${f.lbl})</span>`);
      else if(st==='soon7') urgent.push(`${esc(e.name)} <span style="opacity:.7">${f.lbl} · ${days}ي</span>`);
      else if(st==='soon60') warn.push(`${esc(e.name)} <span style="opacity:.7">${f.lbl} · ${days}ي</span>`);
    });
  });
  if(!expired.length&&!urgent.length&&!warn.length) return '';
  let html='';
  if(expired.length) html+=Views._alert('alert-red','👷','وثائق موظفين منتهية',expired,{onclick:"App.go('hr',{hrTab:'employees'})",preview:3});
  if(urgent.length) html+=Views._alert('alert-red','🚨','أسبوع أخير لوثائق موظفين',urgent,{onclick:"App.go('hr',{hrTab:'employees'})",preview:3});
  if(warn.length) html+=Views._alert('alert-orange','⏳','وثائق موظفين تنتهي قريباً',warn,{onclick:"App.go('hr',{hrTab:'employees'})",preview:3,note:'العد التنازلي لشهرين قبل انتهاء العقود (نظام العمل السعودي المادة 75)'});
  return html;
},
_govDocAlertBanner(){
  const docs=DB.govDocs();
  const expired=docs.filter(d=>DB.govDocStatus(d)==='expired');
  const soon=docs.filter(d=>['soon7','soon30'].includes(DB.govDocStatus(d)));
  if(!expired.length&&!soon.length) return '';
  const label=(d)=>`${esc(d.type==='other'?(d.customType||'وثيقة'):this._govDocTypeLabel(d.type))} <span style="opacity:.7">${esc(DB.branchName(d.branchId))} · ${formatDate(d.expiryDate)}</span>`;
  let html='';
  if(expired.length) html+=Views._alert('alert-red','🏛️','وثائق حكومية منتهية',expired.map(label),{onclick:"App.go('govDocs')",preview:3});
  if(soon.length) html+=Views._alert('alert-orange','🏛️','وثائق حكومية تنتهي قريباً',soon.map(label),{onclick:"App.go('govDocs')",preview:3});
  return html;
},

_govDocTypeLabel(type){
  const labels={commercial_reg:'📜 السجل التجاري',civil_defense:'🧯 رخصة الدفاع المدني',municipality:'🏙️ رخصة البلدية',health_cert:'🩺 الشهادة الصحية',chamber_cert:'🏢 شهادة الغرفة التجارية',lease:'📃 عقد الإيجار',other:'📋 أخرى'};
  return labels[type]||type;
},

_payBadge(sub){
  const map={paid:['badge-green','مدفوع'],partial:['badge-yellow','جزئي'],deferred:['badge-orange','مؤجل']};
  const [bc,bl]=map[sub.paymentStatus]||['badge-gray','—'];
  return `<span class="badge ${bc}">${bl} ${sub.paidAmount}/${sub.price}</span>`;
},

// حالة الدفع الموسّعة: paid | deferred | pending (نشط+متبقي) | defaulter (انتهى+متبقي)
_paymentState(sub){
  if(!sub) return 'none';
  const remaining=(sub.price||0)-(sub.paidAmount||0);
  if(remaining<=0) return 'paid';
  if(sub.endDate&&sub.endDate<T0) return 'defaulter';
  if(sub.paymentStatus==='deferred') return 'deferred';
  return 'pending';
},

// هل الطفل عليه أي اشتراك انتهى + متبقي؟ (يستخدم لإظهار بادج "متعثر" بجانب الاسم)
_hasDefaultedDebt(childId){
  return DB.subscriptions().some(s=>s.childId===childId&&s.endDate<T0&&(s.price-s.paidAmount)>0);

// ---------- CHILDREN ----------
children(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const uPeriod=Auth.period();
  const branches=DB.branches();
  let kids=DB.children();
  if(sid) kids=kids.filter(c=>c.schoolId===sid);
  if(bid) kids=kids.filter(c=>c.branchId===bid);
  if(uPeriod) kids=kids.filter(c=>c.period===uPeriod);
  const schools=DB.schools();
  const q=(App.params.q||'').toLowerCase();
  const bFilter=App.params.branch||'all';
  const pFilter=App.params.period||'all';
  if(q) kids=kids.filter(c=>(c.name||'').includes(q)||(c.parentName||'').toLowerCase().includes(q)||(c.parentPhone||'').includes(q));
  if(!bid&&bFilter!=='all') kids=kids.filter(c=>c.branchId===bFilter);
  if(!uPeriod&&pFilter!=='all') kids=kids.filter(c=>c.period===pFilter);
  // إخفاء الأطفال غير المشتركين (اختياري — لمدير الفرع والمدير العام)
  const hideNoSub=App.params.hideNoSub==='1';
  const noSubCount=kids.filter(c=>!DB.activeSub(c.id)).length;
  if(hideNoSub) kids=kids.filter(c=>DB.activeSub(c.id));
  const childSort=App.params.childSort||'name';
  kids=[...kids];
  if(childSort==='name') kids.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  else if(childSort==='sub_end') kids.sort((a,b)=>{const sa=DB.activeSub(a.id);const sb=DB.activeSub(b.id);const da=sa?.endDate||'9999';const db=sb?.endDate||'9999';return da.localeCompare(db);});
  else if(childSort==='reg_new') kids.sort((a,b)=>(b.createdAt||b.id||'').localeCompare(a.createdAt||a.id||''));
  else if(childSort==='reg_old') kids.sort((a,b)=>(a.createdAt||a.id||'').localeCompare(b.createdAt||b.id||''));
  else if(childSort==='status'){const order={today:0,soon3:1,soon7:2,active:3,none:4,expired:5};kids.sort((a,b)=>(order[DB.subStatus(DB.activeSub(a.id))]??9)-(order[DB.subStatus(DB.activeSub(b.id))]??9));}
  else if(childSort==='period') kids.sort((a,b)=>(a.period||'').localeCompare(b.period||''));
  else if(childSort==='branch') kids.sort((a,b)=>(branches.find(x=>x.id===a.branchId)?.name||'').localeCompare(branches.find(x=>x.id===b.branchId)?.name||'','ar'));
  const branchColors=['badge-blue','badge-green','badge-orange','badge-red'];
  return `
  <div class="actions-bar" style="flex-wrap:wrap">
    <button class="btn btn-primary btn-sm" onclick="Modals.addChild()">+ إضافة طفل</button>
    <button class="btn btn-secondary btn-sm" onclick="Modals.importChildren()">📥 استيراد Excel</button>
    <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('kids-table','الأطفال')">📊 تصدير</button>
    <button class="btn btn-sm" style="background:#0f766e;color:#fff" onclick="printAllPickupCards()" title="طباعة بطاقة خروج لكل طفل">🪪 بطاقات الخروج</button>
    ${(noSubCount>0||hideNoSub)?`<button class="btn btn-sm ${hideNoSub?'btn-warning':'btn-secondary'}" onclick="App.go('children',{...App.params,hideNoSub:'${hideNoSub?'0':'1'}'})" title="إظهار/إخفاء الأطفال غير المشتركين">${hideNoSub?'👁️ إظهار الكل':`🙈 إخفاء غير المشتركين (${noSubCount})`}</button>`:''}
    <div class="search-bar" style="flex:1;max-width:300px;margin:0">
      <span class="search-icon">🔍</span>
      <input id="search-children" class="input" placeholder="بحث بالاسم أو ولي الأمر أو الهاتف..." value="${esc(App.params.q||'')}" oninput="App.liveSearch('children',{...App.params,q:this.value},this)">
    </div>
    <select class="input" style="width:auto" onchange="App.go('children',{...App.params,childSort:this.value})">
      <option value="name" ${childSort==='name'?'selected':''}>↕ الاسم</option>
      <option value="sub_end" ${childSort==='sub_end'?'selected':''}>⏳ انتهاء الاشتراك</option>
      <option value="reg_new" ${childSort==='reg_new'?'selected':''}>📅 أحدث تسجيلاً</option>
      <option value="reg_old" ${childSort==='reg_old'?'selected':''}>📅 أقدم تسجيلاً</option>
      <option value="status" ${childSort==='status'?'selected':''}>🔴 حالة الاشتراك</option>
      <option value="period" ${childSort==='period'?'selected':''}>⏰ الفترة</option>
      <option value="branch" ${childSort==='branch'?'selected':''}>🏢 الفرع</option>
    </select>
  </div>
  ${(!bid||!uPeriod)?`<div class="card" style="padding:12px;margin-bottom:12px">
    ${!bid?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600;color:#64748b">🏢 الفرع:</span>
      <span class="chip ${bFilter==='all'?'active':''}" onclick="App.go('children',{...App.params,branch:'all'})">الكل</span>
      ${branches.map(b=>`<span class="chip ${bFilter===b.id?'active':''}" onclick="App.go('children',{...App.params,branch:'${b.id}'})">${esc(b.name)}</span>`).join('')}
    </div>`:''}
    ${!uPeriod?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${!bid?'border-top:1px solid #f1f5f9;padding-top:8px':''}">
      <span style="font-size:13px;font-weight:600;color:#64748b">⏰ الفترة:</span>
      <span class="chip ${pFilter==='all'?'active':''}" onclick="App.go('children',{...App.params,period:'all'})">الكل</span>
      <span class="chip ${pFilter==='morning'?'active':''}" onclick="App.go('children',{...App.params,period:'morning'})">🌅 صباحي</span>
      <span class="chip ${pFilter==='evening'?'active':''}" onclick="App.go('children',{...App.params,period:'evening'})">🌙 مسائي</span>
    </div>`:''}

  <div class="card"><div class="table-wrap">
    <table id="kids-table">
      <thead><tr>${Auth.isSuperAdmin()?'<th>المدرسة</th>':''}<th>الفرع / الفترة</th><th>اسم الطفل</th><th>المعلمة</th><th>ولي الأمر</th><th>الهاتف</th><th>الاشتراك الحالي</th><th>حالة الدفع</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${kids.length?kids.map(c=>{
          const sub=DB.activeSub(c.id);
          const st=DB.subStatus(sub);
          const stMap={active:'badge-green',today:'badge-yellow',soon3:'badge-orange',soon7:'badge-blue',expired:'badge-red',none:'badge-gray'};

// ---------- SUBSCRIPTIONS ----------
subscriptions(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const uPeriod=Auth.period();
  const branches=DB.branches();
  let subs=DB.subscriptions();
  if(sid) subs=subs.filter(s=>s.schoolId===sid);
  if(bid) subs=subs.filter(s=>s.branchId===bid);
  if(uPeriod) subs=subs.filter(s=>s.period===uPeriod);
  const sBranch=App.params.sBranch||'all';
  const sPeriod=App.params.sPeriod||'all';
  if(!bid&&sBranch!=='all') subs=subs.filter(s=>s.branchId===sBranch);
  if(!uPeriod&&sPeriod!=='all') subs=subs.filter(s=>s.period===sPeriod);
  const filter=App.params.filter||'all';
  const subQ=(App.params.subQ||'').trim();
  const allChildren=DB.children();
  let filtered=subs;
  if(filter==='active') filtered=subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0);
  if(filter==='expired') filtered=subs.filter(s=>diffDays(s.endDate,T0)<0);
  if(filter==='expiring') filtered=subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0&&diffDays(s.endDate,T0)<=7);
  if(filter==='unpaid') filtered=subs.filter(s=>s.paymentStatus!=='paid');
  if(subQ) filtered=filtered.filter(s=>{const c=allChildren.find(x=>x.id===s.childId);return c&&c.name.includes(subQ)});
  filtered.sort((a,b)=>a.endDate>b.endDate?1:-1);
  const chips=[['all','الكل'],['active','فعالة'],['expiring','تنتهي قريباً'],['expired','منتهية'],['unpaid','غير مدفوعة']];
  // ملخص مالي للطالب المبحوث
  let studentSummary='';
  if(subQ&&filtered.length){
    const totalBilled=filtered.reduce((a,s)=>a+s.price,0);
    const totalPaid=filtered.reduce((a,s)=>a+s.paidAmount,0);
    const totalDue=totalBilled-totalPaid;
    studentSummary=`<div class="alert-box alert-blue" style="margin-bottom:14px">
      📊 <div style="display:flex;gap:24px;flex-wrap:wrap">
        <span>نتائج: <strong>${filtered.length}</strong> اشتراك</span>
        <span>إجمالي الفواتير: <strong>${totalBilled} ر.س</strong></span>
        <span style="color:#10b981">المدفوع: <strong>${totalPaid} ر.س</strong></span>
        <span style="color:${totalDue>0?'#ef4444':'#10b981'}">المتبقي: <strong>${totalDue} ر.س</strong></span>
      </div>
    </div>`;
  }
  const _sp={subQ:esc(subQ),filter,sBranch,sPeriod};
  return `
  <div class="actions-bar" style="gap:10px;align-items:center;flex-wrap:wrap">
    <div class="search-bar" style="position:relative;flex:1;max-width:280px;margin:0">
      <span class="search-icon">🔍</span>
      <input id="search-subs" class="input" style="padding-right:34px" placeholder="بحث باسم الطالب..." value="${esc(subQ)}"
        oninput="App.liveSearch('subscriptions',{filter:'${filter}',subQ:this.value,sBranch:'${sBranch}',sPeriod:'${sPeriod}'},this)">
    </div>
    ${chips.map(([v,l])=>`<span class="chip ${filter===v?'active':''}" onclick="App.go('subscriptions',{filter:'${v}',subQ:'${_sp.subQ}',sBranch:'${sBranch}',sPeriod:'${sPeriod}'})">${l}</span>`).join('')}
    <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('subs-table','الاشتراكات')">📊 تصدير</button>
  </div>
  ${(!bid||!uPeriod)?`<div class="card" style="padding:12px;margin-bottom:12px">
    ${!bid?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600;color:#64748b">🏢 الفرع:</span>
      <span class="chip ${sBranch==='all'?'active':''}" onclick="App.go('subscriptions',{...App.params,sBranch:'all'})">الكل</span>
      ${branches.map(b=>`<span class="chip ${sBranch===b.id?'active':''}" onclick="App.go('subscriptions',{...App.params,sBranch:'${b.id}'})">${esc(b.name)}</span>`).join('')}
    </div>`:''}
    ${!uPeriod?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${!bid?'border-top:1px solid #f1f5f9;padding-top:8px':''}">
      <span style="font-size:13px;font-weight:600;color:#64748b">⏰ الفترة:</span>
      <span class="chip ${sPeriod==='all'?'active':''}" onclick="App.go('subscriptions',{...App.params,sPeriod:'all'})">الكل</span>
      <span class="chip ${sPeriod==='morning'?'active':''}" onclick="App.go('subscriptions',{...App.params,sPeriod:'morning'})">🌅 صباحي</span>
      <span class="chip ${sPeriod==='evening'?'active':''}" onclick="App.go('subscriptions',{...App.params,sPeriod:'evening'})">🌙 مسائي</span>
    </div>`:''}
  </div>`:''}
  ${studentSummary}
  <div class="card"><div class="table-wrap">
    <table id="subs-table">
      <thead><tr><th>الطفل</th><th>النوع</th><th>يبدأ</th><th>ينتهي</th><th>المبلغ</th><th>طريقة الدفع</th><th>حالة الدفع</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(s=>{
          const child=DB.children().find(c=>c.id===s.childId);

          const daysLeft=diffDays(s.endDate,T0);

          const typeMap={daily:'يومي',weekly:'أسبوعي',monthly:'٣٠ يوم',custom:'مخصص'};
          const pmLabel={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة',qurrah:'🟣 قُرّة'}[s.paymentMethod]||'—';
          const _payState=Views._paymentState(s);
          return `<tr>

      </tbody>

// ---------- ATTENDANCE ----------
attendance(){
  const u=Auth.user;
  const isTeacher=u.role==='teacher';
  const isAdmin=u.role==='school_admin'||u.role==='superadmin';
  const sid=Auth.schoolId()||App.params.schoolId;
  const date=App.params.date||T0;
  const allSubs=DB.subscriptions();

  // فهرسة لمرة واحدة (O(عدد الاشتراكات)) بدل البحث الخطي لكل طفل — يسرّع عرض صفحة الحضور
  // يُعتبر الطفل «له اشتراك» إذا عنده أي اشتراك فعّال غير منتهٍ (endDate>=اليوم)،
  // فيظهر فوراً عند التجديد حتى لو بدأ الاشتراك الجديد بتاريخ لاحق.
  const subActiveChildIds=new Set();
  allSubs.forEach(s=>{if(s.isActive&&s.endDate>=date)subActiveChildIds.add(s.childId);});
  const hasActiveSub=(childId)=>subActiveChildIds.has(childId);

  let kids=DB.children();
  if(sid) kids=kids.filter(c=>c.schoolId===sid);

  // المعلمة: جميع أطفال فرعها ونفس فترتها (بدون شرط اشتراك)
  if(isTeacher){
    kids=kids.filter(c=>c.branchId===u.branchId&&c.period===u.period);
  } else {
    const bid=Auth.branchId();
    if(bid){
      // مديرة الفرع: فقط أطفال فرعها — مع إتاحة فلتر فترة وبحث
      kids=kids.filter(c=>c.branchId===bid);
      if(App.params.periodFilter) kids=kids.filter(c=>c.period===App.params.periodFilter);
    } else {
      // المدير العام: فلترة بالفرع / فلترة بالفترة / فلترة بالمعلمة
      const teacherFilter=App.params.teacherFilter||'';
      if(teacherFilter){
        const tf=DB.users().find(t=>t.id===teacherFilter);
        if(tf) kids=kids.filter(c=>c.branchId===tf.branchId&&c.period===tf.period);
      }
      if(App.params.branchFilter) kids=kids.filter(c=>c.branchId===App.params.branchFilter);
      if(App.params.periodFilter) kids=kids.filter(c=>c.period===App.params.periodFilter);
    }
  }
  // بحث عام بالاسم لجميع المستخدمين
  const attQ=(App.params.attQ||'').trim().toLowerCase();
  if(attQ) kids=kids.filter(c=>(c.name||'').toLowerCase().includes(attQ)||(c.parentName||'').toLowerCase().includes(attQ));

  // افتراضياً نعرض جميع الأطفال في التحضير (حتى بدون اشتراك) — مع خيار إخفاء غير المشتركين
  const showNoSub=App.params.showNoSub!=='0';
  const hiddenNoSub=kids.filter(c=>!hasActiveSub(c.id)).length;
  if(!showNoSub) kids=kids.filter(c=>hasActiveSub(c.id));

  const attList=DB.attendance();
  const todayAtt=attList.filter(a=>a.date===date&&(sid?a.schoolId===sid:true));
  const attMap={};
  todayAtt.forEach(a=>{attMap[a.childId]=a});
  const isToday=date===T0;

  const renderCard=(c)=>{
    const a=attMap[c.id];
    const status=a?.status||'';
    const teacher=isAdmin?DB.users().find(t=>t.id===c.teacherId):null;
    const noSub=!hasActiveSub(c.id);
    return `<div class="attendance-card ${status}" id="att-${c.id}" style="${noSub?'opacity:0.78;border:1px dashed #fbbf24;':''}">
      <div style="font-weight:700;font-size:14px">${esc(c.name)}</div>
      <div style="font-size:11px;color:#64748b;margin-top:2px">${c.grade||''} — ${esc(c.parentName)}</div>
      ${teacher?`<div style="font-size:11px;color:#0f766e;margin-top:3px">👩‍🏫 ${esc(teacher.name)}</div>`:''}
      <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
        <span class="badge badge-blue" style="font-size:10px">🏢 ${DB.branchName(c.branchId)}</span>
        <span class="badge ${c.period==='morning'?'badge-blue':'badge-orange'}" style="font-size:10px">${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
        ${noSub?`<span class="badge badge-yellow" style="font-size:10px">⚠️ بدون اشتراك</span>`:''}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn btn-xs ${status==='present'?'btn-success':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','present','${date}','${c.schoolId}')">✅ حاضر</button>
        <button class="btn btn-xs ${status==='absent'?'btn-danger':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','absent','${date}','${c.schoolId}')">❌ غائب</button>
        <button class="btn btn-xs ${status==='late'?'btn-warning':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','late','${date}','${c.schoolId}')">⏰ متأخر</button>
      </div>
      ${a?`<div style="font-size:11px;margin-top:6px;color:#64748b">دخول: ${a.checkIn||'—'} · خروج: ${a.checkOut||'—'}</div>`:''}
      ${status==='absent'&&c.parentPhone?`<button class="btn btn-wa btn-xs" style="width:100%;margin-top:6px;justify-content:center" onclick="notifyAbsentParent('${c.id}','${date}')">💬 إبلاغ ولي الأمر بالغياب</button>`:''}
      <button class="btn btn-secondary btn-xs" style="width:100%;margin-top:4px;justify-content:center;font-size:11px" onclick="openChildNoteModal('${c.id}','${date}')">📝 إضافة ملاحظة</button>
    </div>`;
  };

  // قائمة المعلمات للفلترة (للإدارة فقط)
  const teachers=isAdmin?DB.users().filter(t=>t.role==='teacher'&&(!sid||t.schoolId===sid)):[];
  const teacherFilter=App.params.teacherFilter||'';
  const branchFilter=App.params.branchFilter||'';
  const periodFilter=App.params.periodFilter||'';

  const bidScope=Auth.branchId();
  return `
  <div class="actions-bar" style="flex-wrap:wrap;gap:10px">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-weight:600;font-size:14px">التاريخ:</label>
      <input type="date" class="input" style="width:160px" value="${date}" onchange="App.go('attendance',{...App.params,date:this.value,schoolId:'${sid||''}'})" max="${T0}">
    </div>
    <input id="search-attendance" class="input" placeholder="🔍 بحث بالاسم..." value="${esc(App.params.attQ||'')}" style="width:200px" oninput="App.liveSearch('attendance',{...App.params,attQ:this.value},this)">
    <button class="btn btn-primary btn-sm" onclick="saveAttendance('${date}','${sid||''}')">💾 حفظ الحضور</button>
    <button class="btn btn-success btn-sm" onclick="markAllPresent('${date}','${sid||''}','att-all')">✅ الكل حاضر</button>
    <button class="btn btn-secondary btn-sm" onclick="printAttendanceSheet('${date}','${sid||''}')" title="طباعة ورقة الحضور">🖨️ طباعة</button>
    ${Auth.isSuperAdmin()?`<button class="btn btn-secondary btn-sm" onclick="restoreAttBackup('attendance')" title="استرجاع الحضور من نسخة احتياطية">🛟 استرجاع</button>`:''}
    ${hiddenNoSub>0?`<button class="btn ${!showNoSub?'btn-warning':'btn-secondary'} btn-sm" onclick="App.go('attendance',{...App.params,showNoSub:'${showNoSub?'0':'1'}'})" title="الأطفال بدون اشتراك فعال أو منتهي">${showNoSub?`🙈 إخفاء غير المشتركين (${hiddenNoSub})`:'👁️ إظهار الكل'}</button>`:''}
    <div style="margin-right:auto;display:flex;gap:8px">
      <span class="badge badge-green">✅ ${Object.values(attMap).filter(a=>a.status==='present').length} حاضر</span>
      <span class="badge badge-red">❌ ${Object.values(attMap).filter(a=>a.status==='absent').length} غائب</span>
      <span class="badge badge-yellow">⏰ ${Object.values(attMap).filter(a=>a.status==='late').length} متأخر</span>
    </div>
  </div>

  ${(isAdmin||bidScope)?`
  <div class="card" style="padding:12px;margin-bottom:12px">
    ${!bidScope?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">🏢 الفرع:</span>
      <span class="chip ${!branchFilter?'active':''}" onclick="App.go('attendance',{...App.params,branchFilter:''})">الكل</span>
      ${DB.branches().map(b=>`<span class="chip ${branchFilter===b.id?'active':''}" onclick="App.go('attendance',{...App.params,branchFilter:'${b.id}'})">${esc(b.name)}</span>`).join('')}
    </div>`:''}
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${!bidScope?'border-top:1px solid #f1f5f9;padding-top:10px;':''}margin-bottom:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">⏰ الفترة:</span>
      <span class="chip ${!periodFilter?'active':''}" onclick="App.go('attendance',{...App.params,periodFilter:''})">الكل</span>
      <span class="chip ${periodFilter==='morning'?'active':''}" onclick="App.go('attendance',{...App.params,periodFilter:'morning'})">🌅 صباحي</span>
      <span class="chip ${periodFilter==='evening'?'active':''}" onclick="App.go('attendance',{...App.params,periodFilter:'evening'})">🌙 مسائي</span>
    </div>
    ${!bidScope?`<div style="border-top:1px solid #f1f5f9;padding-top:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">👩‍🏫 الفصل:</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <span class="chip ${!teacherFilter?'active':''}" onclick="App.go('attendance',{...App.params,teacherFilter:''})">جميع الفصول</span>
        ${teachers.map(t=>`<span class="chip ${teacherFilter===t.id?'active':''}" onclick="App.go('attendance',{...App.params,teacherFilter:'${t.id}'})">${esc(t.name)}</span>`).join('')}
      </div>
    </div>`:''}
  </div>`:''}

  ${kids.length===0?`<div class="card"><div class="empty-state"><div class="es-icon">👶</div><p>${(hiddenNoSub>0&&!showNoSub)?`جميع الأطفال هنا بدون اشتراك فعال ومخفيون من التحضير`:(isTeacher?'لا يوجد أطفال مسجلون في فرعك وفترتك':'لا يوجد أطفال مسجلون في هذا الفرع')}</p>${(hiddenNoSub>0&&!showNoSub)?`<button class="btn btn-warning btn-sm" style="margin-top:10px" onclick="App.go('attendance',{...App.params,showNoSub:'1'})">👁️ إظهار ${hiddenNoSub} طفل بدون اشتراك</button>`:''}</div></div>`:`
  <div id="att-all">
    ${(()=>{
      const section=(pk,label,icon,badgeCls)=>{
        const group=kids.filter(c=>(c.period||'evening')===pk);
        if(!group.length) return '';
        const pres=group.filter(c=>attMap[c.id]?.status==='present').length;
        const gid='att-grid-'+pk;
        return `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 10px;padding:10px 14px;background:${pk==='morning'?'#eff6ff':'#fff7ed'};border-radius:10px;border:1px solid ${pk==='morning'?'#bfdbfe':'#fed7aa'}">
          <h3 style="font-size:16px;font-weight:800;color:#0f766e;margin:0">${icon} الفترة ${label}</h3>
          <span class="badge ${badgeCls}">${group.length} طفل</span>
          <span class="badge badge-green">✅ ${pres} حاضر</span>
          <button class="btn btn-success btn-xs no-print" style="margin-right:auto" onclick="markAllPresent('${date}','${sid||''}','${gid}')">✅ حضّر كل ${label}</button>
        </div>
        <div class="attendance-grid" id="${gid}">${group.map(c=>renderCard(c)).join('')}</div>`;
      };
      return section('morning','الصباحية','🌅','badge-blue')+section('evening','المسائية','🌙','badge-orange');
    })()}
  </div>`}
  `;
},

// ---------- REPORTS ----------
reports(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const uPeriod=Auth.period();
  const branches=DB.branches();
  const rBranch=App.params.rBranch||'all';
  const rPeriod=App.params.rPeriod||'all';
  let children=DB.children();
  let subs=DB.subscriptions();
  let attList=DB.attendance();
  if(sid){
    children=children.filter(c=>c.schoolId===sid);
    subs=subs.filter(s=>s.schoolId===sid);
    attList=attList.filter(a=>a.schoolId===sid);
  }
  if(bid){
    const branchChildIds=new Set(children.filter(c=>c.branchId===bid).map(c=>c.id));
    children=children.filter(c=>c.branchId===bid);
    subs=subs.filter(s=>branchChildIds.has(s.childId));
    attList=attList.filter(a=>branchChildIds.has(a.childId));
  }
  if(uPeriod) children=children.filter(c=>c.period===uPeriod);
  if(!bid&&rBranch!=='all') children=children.filter(c=>c.branchId===rBranch);
  if(!uPeriod&&rPeriod!=='all') children=children.filter(c=>c.period===rPeriod);
  const childIds=new Set(children.map(c=>c.id));
  subs=subs.filter(s=>childIds.has(s.childId));
  attList=attList.filter(a=>childIds.has(a.childId));
  const totalRev=subs.reduce((a,s)=>a+s.paidAmount,0);
  const pendingRev=subs.reduce((a,s)=>a+(s.price-s.paidAmount),0);
  const monthlyCount=subs.filter(s=>s.type==='monthly').length;
  const weeklyCount=subs.filter(s=>s.type==='weekly').length;
  const dailyCount=subs.filter(s=>s.type==='daily').length;
  const isAdmin=Auth.isSchoolAdmin();
  const isSA=Auth.isSuperAdmin();
  // school_admin يرى فقط الحضور + تقرير الطالب
  const defaultTab=isSA?'financial':'attendance';
  const tab=App.params.tab||defaultTab;
  const tabLabel={financial:'التقرير المالي',attendance:'تقرير الحضور',subscriptions:'تقرير الاشتراكات',student:'تقرير طالب'};
  const tabId={financial:'rpt-financial',attendance:'rpt-attendance',subscriptions:'rpt-subscriptions',student:'rpt-student'};
  // بحث تقرير الطالب
  const stQ=(App.params.stQ||'').trim();
  const stId=App.params.stId||'';
  const stChild=stId?children.find(c=>c.id===stId):null;
  return `
  <div class="print-cover">
    <h1>🌱 مدارك الطفل</h1>
    <p>${tabLabel[tab]||''}${stChild?' — '+stChild.name:''} — تاريخ الطباعة: ${formatDate(T0)}</p>
  </div>
  <div class="tabs no-print">
    ${isSA?`<div class="tab ${tab==='financial'?'active':''}" onclick="App.go('reports',{tab:'financial',rBranch:'${rBranch}',rPeriod:'${rPeriod}'})">💰 المالي</div>`:''}
    <div class="tab ${tab==='attendance'?'active':''}" onclick="App.go('reports',{tab:'attendance',rBranch:'${rBranch}',rPeriod:'${rPeriod}'})">✅ الحضور</div>
    ${isSA?`<div class="tab ${tab==='subscriptions'?'active':''}" onclick="App.go('reports',{tab:'subscriptions',rBranch:'${rBranch}',rPeriod:'${rPeriod}'})">📋 الاشتراكات</div>`:''}
    <div class="tab ${tab==='student'?'active':''}" onclick="App.go('reports',{tab:'student',rBranch:'${rBranch}',rPeriod:'${rPeriod}'})">👤 تقرير طالب</div>
  </div>
  ${!bid?`<div class="card no-print" style="padding:12px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600;color:#64748b">🏢 الفرع:</span>
      <span class="chip ${rBranch==='all'?'active':''}" onclick="App.go('reports',{tab:'${tab}',rBranch:'all',rPeriod:'${rPeriod}'})">الكل</span>
      ${branches.map(b=>`<span class="chip ${rBranch===b.id?'active':''}" onclick="App.go('reports',{tab:'${tab}',rBranch:'${b.id}',rPeriod:'${rPeriod}'})">${esc(b.name)}</span>`).join('')}
    </div>
    ${!uPeriod?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #f1f5f9;padding-top:8px">
      <span style="font-size:13px;font-weight:600;color:#64748b">⏰ الفترة:</span>
      <span class="chip ${rPeriod==='all'?'active':''}" onclick="App.go('reports',{tab:'${tab}',rBranch:'${rBranch}',rPeriod:'all'})">الكل</span>
      <span class="chip ${rPeriod==='morning'?'active':''}" onclick="App.go('reports',{tab:'${tab}',rBranch:'${rBranch}',rPeriod:'morning'})">🌅 صباحي</span>
      <span class="chip ${rPeriod==='evening'?'active':''}" onclick="App.go('reports',{tab:'${tab}',rBranch:'${rBranch}',rPeriod:'evening'})">🌙 مسائي</span>
    </div>`:''}
  </div>`:''}
  <div class="rpt-bar no-print">
    <span class="rpt-bar-title">${tabLabel[tab]||''}</span>
    <div class="rpt-bar-btns">
      <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ طباعة / PDF</button>
      ${tab!=='student'?`<button class="btn btn-secondary btn-sm" onclick="exportTableCSV('${tabId[tab]}','${tabLabel[tab]}')">📊 CSV</button>`:''}
    </div>
  </div>

  ${tab==='financial'&&isSA?`
  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-val">${totalRev.toLocaleString()}</div><div class="stat-lbl">ر.س إجمالي محصّل</div></div>
    <div class="stat-card red"><div class="stat-val">${pendingRev.toLocaleString()}</div><div class="stat-lbl">ر.س مبالغ معلقة</div></div>
    <div class="stat-card blue"><div class="stat-val">${monthlyCount}</div><div class="stat-lbl">اشتراكات شهرية</div></div>
    <div class="stat-card yellow"><div class="stat-val">${weeklyCount}</div><div class="stat-lbl">اشتراكات أسبوعية</div></div>
    <div class="stat-card green"><div class="stat-val">${dailyCount}</div><div class="stat-lbl">اشتراكات يومية</div></div>
    <div class="stat-card yellow"><div class="stat-val">${subs.filter(s=>s.paymentStatus==='deferred').length}</div><div class="stat-lbl">مبالغ مؤجلة ${infoIcon('deferred')}</div></div>
  </div>
  <div class="card">
    <div class="card-title">تفاصيل المدفوعات لكل طفل</div>
    <div class="table-wrap"><table id="rpt-financial">
      <thead><tr><th>الطفل</th><th>نوع الاشتراك</th><th>المبلغ الكلي</th><th>المدفوع</th><th>المتبقي</th><th>حالة الدفع</th></tr></thead>
      <tbody>
        ${subs.map(s=>{
          const c=children.find(x=>x.id===s.childId)||DB.children().find(x=>x.id===s.childId);
          return `<tr>
            <td>${esc(c?.name||'—')}</td>
            <td>${{daily:'يومي',weekly:'أسبوعي',monthly:'٣٠ يوم',custom:'مخصص'}[s.type]||s.type}</td>
            <td>${s.price} ر.س</td>
            <td style="color:#10b981;font-weight:600">${s.paidAmount} ر.س</td>
            <td style="color:${s.price-s.paidAmount>0?'#ef4444':'#10b981'};font-weight:600">${s.price-s.paidAmount} ر.س</td>
            <td>${Views._payBadge(s)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`:''}

  ${tab==='attendance'?`
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;flex:1;min-width:180px">
        <label style="font-size:12px">🔍 بحث باسم الطفل</label>
        <input class="input" id="att-search" placeholder="اكتب الاسم..." value="${esc(App.params.attQ||'')}" oninput="App.liveSearch('reports',{tab:'attendance',attQ:this.value,attFrom:document.getElementById('att-from')?.value||'',attTo:document.getElementById('att-to')?.value||''},this)">
      </div>
      <div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px">📅 من تاريخ</label>
        <input class="input" id="att-from" type="date" value="${App.params.attFrom||''}" onchange="App.go('reports',{tab:'attendance',attQ:document.getElementById('att-search')?.value||'',attFrom:this.value,attTo:document.getElementById('att-to')?.value||''})">
      </div>
      <div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px">📅 إلى تاريخ</label>
        <input class="input" id="att-to" type="date" value="${App.params.attTo||''}" onchange="App.go('reports',{tab:'attendance',attQ:document.getElementById('att-search')?.value||'',attFrom:document.getElementById('att-from')?.value||'',attTo:this.value})">
      </div>
      ${(App.params.attQ||App.params.attFrom||App.params.attTo)?`<button class="btn btn-secondary btn-sm" onclick="App.go('reports',{tab:'attendance'})">✕ مسح</button>`:''}
    </div>
  </div>
  <div class="card">
    <div class="card-title">تقرير حضور الأطفال${App.params.attFrom||App.params.attTo?` (${formatDate(App.params.attFrom)||'البداية'} — ${formatDate(App.params.attTo)||'اليوم'})`:''}</div>
    <div class="table-wrap"><table id="rpt-attendance">
      <thead><tr><th>الطفل</th><th>الفرع / الفترة</th><th>حضور</th><th>غياب</th><th>تأخر</th><th>الأيام</th><th>النسبة</th><th>آخر غياب</th></tr></thead>
      <tbody>
        ${children.filter(c=>!App.params.attQ||c.name.includes(App.params.attQ)).map(c=>{
          let cAtt=attList.filter(a=>a.childId===c.id);
          if(App.params.attFrom) cAtt=cAtt.filter(a=>a.date>=App.params.attFrom);
          if(App.params.attTo) cAtt=cAtt.filter(a=>a.date<=App.params.attTo);
          const present=cAtt.filter(a=>a.status==='present').length;
          const absent=cAtt.filter(a=>a.status==='absent').length;
          const late=cAtt.filter(a=>a.status==='late').length;
          const total=cAtt.length||1;
          const pct=Math.round((present+late)/total*100);
          const lastAbs=cAtt.filter(a=>a.status==='absent').sort((a,b)=>b.date.localeCompare(a.date))[0];
          return `<tr>
            <td><strong>${esc(c.name)}</strong><br><small style="color:#94a3b8">${esc(c.parentName)}</small></td>
            <td>
              <span class="badge badge-blue" style="font-size:10px">🏢 ${DB.branchName(c.branchId)}</span><br>
              <span class="badge ${c.period==='morning'?'badge-blue':'badge-orange'}" style="font-size:10px;margin-top:2px">${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
            </td>
            <td style="color:#10b981;font-weight:700">${present}</td>
            <td style="color:#ef4444;font-weight:700">${absent}</td>
            <td style="color:#f59e0b;font-weight:700">${late}</td>
            <td style="color:#64748b">${cAtt.length}</td>
            <td><div style="display:flex;align-items:center;gap:6px">
              <div class="progress-bar" style="width:55px"><div class="progress-fill" style="width:${pct}%;background:${pct>80?'#10b981':pct>60?'#f59e0b':'#ef4444'}"></div></div>
              <span style="font-size:12px;font-weight:700">${pct}%</span>
            </div></td>
            <td style="font-size:11px;color:#94a3b8">${lastAbs?formatDate(lastAbs.date):'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`:''}

  ${tab==='subscriptions'&&isSA?`

// ---------- USERS ----------
users(){
  const branches=DB.branches();
  const roleMap={superadmin:'مدير عام',school_admin:'مديرة فرع',teacher:'معلمة'};
  const emps=DB.hrEmployees().filter(e=>e.status!=='deleted');
  const linkedEmp=(u)=>emps.find(e=>e.id===u.employeeId||e.userId===u.id);
  // ترتيب: مدير عام ← مدراء فروع ← معلمات، ثم بالفرع، ثم بالاسم
  const roleOrder={superadmin:0,school_admin:1,teacher:2};
  const bName=(id)=>branches.find(x=>x.id===id)?.name||'';
  const users=[...DB.users()].sort((a,b)=>{
    const r=(roleOrder[a.role]??9)-(roleOrder[b.role]??9);if(r)return r;
    const bn=bName(a.branchId).localeCompare(bName(b.branchId),'ar');if(bn)return bn;
    return (a.name||'').localeCompare(b.name||'','ar');
  });
  const unlinkedTeachers=users.filter(u=>(u.role==='teacher'||u.role==='school_admin')&&!linkedEmp(u)).length;
  return `
  <div class="section-header">
    <h2>إدارة المستخدمين (${users.length})</h2>
    <button class="btn btn-primary btn-sm" onclick="Modals.addUser()">+ إضافة مستخدم</button>
  </div>
  ${unlinkedTeachers?`<div class="alert-box alert-yellow" style="margin-bottom:12px">🔗 <div><strong>${unlinkedTeachers} حساب غير مربوط بموظف</strong> — اربطيه من زر «🔗 ربط» ليعمل سجل الحضور والإجازات.</div></div>`:''}
  <div class="card">
    <div class="table-wrap"><table>
      <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th><th>الدور</th><th>الفرع</th><th>🔗 الموظف المرتبط</th><th>الهاتف</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${users.map(u=>{
          const branch=branches.find(b=>b.id===u.branchId);
          const branchLabel=(u.role==='school_admin'||u.role==='teacher')
            ? (branch?`<span class="badge badge-blue">🏢 ${esc(branch.name.split(' - ')[0]||branch.name)}</span>`:`<span class="badge badge-red">⚠️ بدون فرع</span>`)
            : '—';
          const le=linkedEmp(u);
          const linkCell=le?`<span class="badge badge-green">🔗 ${esc(le.name)}</span>`
            :(u.role==='teacher'||u.role==='school_admin')?`<button class="btn btn-xs" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe" onclick="Modals.editUser('${u.id}')">🔗 ربط بموظف</button>`:'—';
          return `<tr>
          <td><strong>${esc(u.name)}</strong></td>
          <td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px">${esc(u.username)}</code></td>
          <td><code style="background:#fef9c3;padding:2px 8px;border-radius:4px;font-size:13px;letter-spacing:1px">${esc(u.password||'—')}</code></td>
          <td><span class="badge ${u.role==='superadmin'?'badge-red':u.role==='school_admin'?'badge-blue':'badge-green'}">${roleMap[u.role]||u.role}</span></td>
          <td>${branchLabel}</td>
          <td>${linkCell}</td>
          <td>${u.phone||'—'}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-secondary btn-xs" onclick="Modals.editUser('${u.id}')">تعديل</button>
            ${u.id!=='sa1'?`<button class="btn btn-danger btn-xs" onclick="deleteUser('${u.id}')">حذف</button>`:''}
          </td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>
  </div>`;
},

whatsapp(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const al=DB.alerts(sid,bid);
  let children=DB.children();
  let subs=DB.subscriptions();
  if(sid){children=children.filter(c=>c.schoolId===sid);subs=subs.filter(s=>s.schoolId===sid);}
  if(bid){children=children.filter(c=>c.branchId===bid);subs=subs.filter(s=>s.branchId===bid);}
  const buildMsg=(sub,days)=>{
    const c=children.find(x=>x.id===sub.childId);
    if(!c) return null;
    const msgs={
      expired:`السلام عليكم 🌟\nنود إشعاركم بأن اشتراك الطفل ${c.name} في مدارك الطفل قد انتهى بتاريخ ${formatDate(sub.endDate)}.\nيسعدنا التواصل معكم لتجديد الاشتراك.\nشكراً لثقتكم 🌺`,

    };

    const phone='966'+c.parentPhone.slice(1);

_teacherEmployee(u){
  u=u||Auth.user;if(!u)return null;

  if(u.employeeId){const byId=emps.find(e=>e.id===u.employeeId);if(byId)return byId;}

  return emps.find(e=>(e.name||'').trim()===nm)||null;
},
// رصيد الإجازة السنوية التراكمي (نظام العمل السعودي: 21 يوم/سنة أول 5 سنوات، ثم 30 يوم/سنة)
// يُحسب المستحق عن كل سنوات الخدمة منذ التعيين، ناقص كل الإجازات السنوية المستخدمة (كل السنوات)
_annualBalance(e){
  if(!e||!e.contractStart) return {entitled:21,accrued:21,used:0,remaining:21,years:0};
  const start=new Date(e.contractStart+'T00:00:00'), now=new Date(T0+'T00:00:00');
  const years=Math.max(0,(now-start)/31557600000);
  const fullYears=Math.floor(years);
  let accrued=0;
  for(let i=0;i<fullYears;i++) accrued += (i>=5?30:21);       // سنوات كاملة
  accrued += (fullYears>=5?30:21)*(years-fullYears);           // جزء السنة الحالية
  accrued=Math.round(accrued);
  const used=DB.hrLeaves().filter(l=>l.employeeId===e.id&&l.type==='annual'&&l.status==='approved').reduce((a,l)=>a+(+l.days||0),0);
  const entitled=years>=5?30:21; // استحقاق السنة الحالية (للعرض)
  return {entitled,accrued,used,remaining:accrued-used,years:Math.round(years*10)/10};
},
