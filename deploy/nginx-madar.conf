# إعداد nginx لموقع مدار + واجهة برمجة التخزين (API)
# المسار: /etc/nginx/sites-available/ma-dar
# بعد التعديل: nginx -t && systemctl reload nginx
# ملاحظة: certbot يضيف كتل HTTPS (443) تلقائياً — هذه القاعدة لمنفذ 80،
# وعند تفعيل HTTPS انسخ كتلتي location داخل خادم 443 أيضاً.

server {
    listen 80;
    server_name ma-dar.solutions www.ma-dar.solutions;
    root /var/www/madar-new;
    index index.html;

    # واجهة التخزين العامة
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # مسار البث اللحظي (SSE) — يجب تعطيل الحجز
    location = /api/stream {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
