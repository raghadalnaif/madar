    {cat:'<i class="ic ic-handshake"></i> التواصل والمهارات الاجتماعية',catKey:'social',items:[
      {n:86,name:'مفاوض صغير',goal:'تطوير مهارة التفاوض والإقناع والوصول لحل وسط مُرضٍ',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'سيناريوهات مصورة بمواقف يومية',steps:'١. ضع سيناريو: عندكم لعبة واحدة وطفلان يريدانها في نفس الوقت.\n٢. الطفلان يتفاوضان: من يلعب أولاً؟ كم الوقت؟\n٣. المعلمة تراقب دون تدخل أول ٣ دقائق.\n٤. إن لم يتفقا تُعلّم قواعد التفاوض: استمع، اقترح، احترم الرأي الآخر.',tips:'الهدف الوصول لحل وسط بأنفسهما. الفوز ليس الهدف — الاتفاق هو الفوز الحقيقي.'},
      {n:87,name:'أسمع بعيني وأذني وقلبي',goal:'تطوير مهارة الاستماع النشط والتواصل الحقيقي العميق',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'لا شيء',steps:'١. علّم قواعد الاستماع الحقيقي: توقّف عن الكلام، انظر للمتحدث، فكّر في كلامه.\n٢. بالأزواج: طفل يحكي حدثاً مهماً له لمدة دقيقة.\n٣. المستمع يُعيد ما سمعه: قلت إنك...\n٤. المتحدث يُقيّم: هل استمع إليّ بشكل صحيح؟',tips:'أصعب مهارة اجتماعية. طوّرها مبكراً تُغيّر علاقات الطفل مع الآخرين طوال حياته.'},
      {n:88,name:'دائرة الكلام المُرتَّب',goal:'تنمية آداب الحوار والقدرة على التعبير المنظّم أمام الآخرين',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'كرة صغيرة',steps:'١. يجلس الأطفال في دائرة.\n٢. موضوع الحوار: ما أجمل شيء رأيته في حياتك؟\n٣. فقط من بيده الكرة يتكلم، والبقية يستمعون باحترام.\n٤. بعد كلامه يُمرّر الكرة لمن يرفع يده.',tips:'نمّذج القواعد: لا مقاطعة، لا سخرية، كل كلام محترم. هذه هي مهارات الاجتماعات الناجحة.'},
      {n:89,name:'المهمة المشتركة',goal:'بناء مهارة التعاون والتخطيط الجماعي لتحقيق هدف مشترك',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'مكعبات بناء أو مواد فن',steps:'١. المهمة: بناء جسر يستطيع حمل لعبة صغيرة بين مكانين.\n٢. المجموعة تخطط معاً: من يبني القاعدة؟ من يضع الجسر؟ من يختبره؟\n٣. ينفذون خطتهم معاً.\n٤. يختبرون: هل يحمل الجسر؟\n٥. إن فشل يُعيدون التخطيط مع التحليل.',tips:'التخطيط أهم من النتيجة. اسأل دائماً: كيف قسّمتم العمل؟ هل استمع كل واحد للآخر؟'},
      {n:90,name:'قائد وتابع',goal:'تطوير مهارة القيادة والإنصات والثقة المتبادلة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'مناديل لعصب العيون، مساحة واسعة',steps:'١. بالأزواج: قائد وتابع (أعين التابع معصوبة).\n٢. القائد يوجّه التابع بالكلام فقط: خطوتان للأمام، اتجه يساراً بخطوة واحدة.\n٣. يُبدلان الأدوار.\n٤. ناقش: كيف شعرت كقائد مسؤول؟ كيف شعرت حين اتّبعت ووثقت؟',tips:'يكشف عن الأطفال الطبيعيين في القيادة. ويعلّم أن القيادة مسؤولية لا سلطة.'},
      {n:91,name:'جسر الكلمات',goal:'تنمية التعبير اللغوي الدقيق والقدرة على الشرح والإيصال',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'أشياء موجودة في الفصل',steps:'١. طفل يختار شيئاً في الفصل سراً.\n٢. يصفه بثلاث جمل دون قول اسمه: هو مستدير، صغير، نقفز به.\n٣. الأطفال يخمّنون ما هو.\n٤. من يصف الشيء الأصعب ويُخمّنه زملاؤه يفوز.',tips:'يطوّر مهارة الوصف الدقيق — مهارة أساسية في التواصل والكتابة والتعبير.'},
      {n:92,name:'مرسال السلام',goal:'تنمية التواصل الإيجابي وحل النزاعات عبر الرسالة والكلمة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق ملون، أقلام، ظروف صغيرة',steps:'١. اسأل: هل تذكر موقفاً اختلفت فيه مع صديقك أو أحزنته؟\n٢. كل طفل يرسم أو يُملّي رسالة اعتذار أو تحية دافئة.\n٣. المعلمة تُساعد في كتابة الكلمات.\n٤. المستقبل يقرأ الرسالة ويرد بكلمة.',tips:'علّم أن الاعتذار قوة لا ضعف. من يعتذر أولاً هو الأشجع والأذكى.'},
      {n:93,name:'التعاون بالحبل',goal:'بناء مهارة التنسيق الجسدي الجماعي والإحساس الحقيقي بالفريق',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'حبل متوسط الطول، كرة أو هدف',steps:'١. كل الأطفال يمسكون الحبل بمسافات متساوية بينهم.\n٢. المهمة: تحريك الحبل معاً لإيصال الكرة من نقطة لأخرى.\n٣. إن تسرّع أحدهم عن الآخرين ينقطع التنسيق.\n٤. يتدربون على الإيقاع المشترك.',tips:'استعارة حية للعمل الجماعي: إذا تسرّع أحدنا أو تأخّر تعثّر الجميع معه.'},
      {n:94,name:'رسالة الشكر',goal:'تعزيز التواصل الإيجابي والاعتراف بجميل الآخرين',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق ملون، أقلام، ظروف مزيّنة',steps:'١. كل طفل يُفكّر: من فعل لي شيئاً جميلاً هذا الأسبوع؟\n٢. يرسم أو يُملّي رسالة شكر له.\n٣. يضعها في ظرف مزيّن.\n٤. يُسلّمها بيده لمن كتبها إليه في وقت الدائرة.',tips:'لحظة التسليم أمام المجموعة لحظة لا تُنسى لكليهما. سجّلها بصورة إن أمكن.'},
      {n:95,name:'لغة الصمت',goal:'تطوير التواصل غير اللفظي وفهم الرسائل بدون كلمات',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات بها رسائل بسيطة مصورة',steps:'١. أعلن القاعدة: لا صوت من الآن.\n٢. كل طفل يُبلّغ رسالة لزميله بالإشارات والوجه والأيدي فقط.\n٣. المستقبل يُخمّن الرسالة.\n٤. ناقشوا: ما الصعب في التواصل بلا كلمات؟ متى نستخدم هذه المهارة؟',tips:'يُدرّب الطفل على قراءة الرسائل غير اللفظية — أساس التعاطف والفهم العميق للآخرين.'},
      {n:96,name:'مجلس أطفالنا',goal:'بناء مهارة الحوار الجماعي وإبداء الرأي واتخاذ القرار الجماعي',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'مقاعد بشكل دائرة',steps:'١. أعلن موضوع المجلس: ماذا نفعل في اليوم الحر القادم؟\n٢. كل طفل يقترح فكرة واحدة دون انتقاد أي فكرة.\n٣. تُكتب الأفكار كلها على اللوح.\n٤. التصويت: كل طفل يضع علامة على فكرته المفضلة.\n٥. الفكرة الفائزة تُنفَّذ فعلاً.',tips:'صوت الطفل يُحسَب ويُحترَم. هذا يبني الشعور بالمسؤولية والانتماء الحقيقي للمجموعة.'},
      {n:97,name:'منافسة التعاون',goal:'إثبات عملياً أن التعاون أكثر فاعلية من المنافسة الفردية',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'مهمة بناء أو رسم محددة',steps:'١. المرحلة الأولى: كل طفل يعمل وحده لإنجاز المهمة.\n٢. المرحلة الثانية: مجموعات ٣ أطفال تُنجز نفس المهمة.\n٣. قارنوا النتائج: أيها أجمل؟ أيها أسرع؟\n٤. ناقش: لماذا العمل الجماعي أقوى أحياناً؟',tips:'التجربة تُقنع أكثر من الكلام. دع النتائج المرئية تتحدث بدلاً منك.'},
      {n:98,name:'رفيقي الجديد',goal:'بناء مهارة التعارف وكسر الحاجز مع من لا نعرفه وتوسيع دائرة الصداقة',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'بطاقات بها أسئلة تعارف مصورة',steps:'١. كل طفل يُقرن بزميل لا يلعب معه عادة.\n٢. كل منهما يسأل الآخر ٣ أسئلة: ما اسمك؟ ما ألوانك المفضلة؟ ما حيوانك المفضل؟\n٣. كل طفل يُعرّف رفيقه الجديد أمام المجموعة.\n٤. يُهديه رسمة صغيرة كهدية ترحيب.',tips:'أحياناً أعمق الصداقات تكون مع من لم نقترب منه أول يوم. افتح القلب دائماً.'},
      {n:99,name:'مسرح التعاطف',goal:'تعميق التعاطف من خلال تجربة حياة الآخر وعيش مشاعره فعلاً',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'بطاقات شخصيات بأحوال مختلفة',steps:'١. كل طفل يسحب بطاقة شخصية: طفل لا يتحدث لغتنا، طفل ضعيف البصر، طفل بطيء الحركة.\n٢. لمدة ١٠ دقائق يُمثّل هذه الشخصية في أنشطة الفصل.\n٣. يعود لنفسه ويحكي: كيف شعرت؟ ما الصعب في حياة هذا الشخص؟\n٤. ناقش: كيف نساعد هؤلاء في حياتنا الحقيقية؟',tips:'التعاطف لا يُعلَّم بالكلام بل بالتجربة المحاكية. هذا النشاط يُغيّر القلوب.'},
      {n:100,name:'احتفالنا الجماعي',goal:'ختم تجربة التعلم الجماعي بالاحتفاء بكل فرد وبالفريق ككل',age:'٣-٦ سنوات',time:'٤٥ دقيقة',materials:'ورق ملون، أقلام، موسيقى مبهجة',steps:'١. كل طفل يكتب أو يرسم أجمل شيء تعلّمه هذا الموسم.\n٢. كل طفل يقف ويقول جملة امتنان لزميل محدد بالاسم.\n٣. نصنع لوحة احتفالية جماعية: كل طفل يترك بصمته عليها.\n٤. موسيقى مبهجة ورقص وفرح مشترك.\n٥. كل طفل يأخذ لوحته ورسائل التقدير إلى البيت.',tips:'الختام بأهمية البداية. اصنع ذكرى جميلة تدوم في قلب كل طفل.'},
    ]},
    {cat:'<i class="ic ic-file"></i> أشغال ورقية',catKey:'paper',items:[
      {n:101,name:'فراشة المناديل الملونة',goal:'تنمية التآزر البصري الحركي ومهارة الطي والربط',age:'٣-٥ سنوات',time:'٢٠ دقيقة',materials:'مناديل ورقية ملونة، ماصّة شرب، خيط أو سلك زينة، ألوان مائية',steps:'١. لوّن منديلين بالألوان المائية واتركهما حتى يجفّا.\n٢. اطوِ كل منديل طيّات مروحة بعرض إصبع.\n٣. ضع المنديلين فوق بعض واربطهما من المنتصف بالسلك.\n٤. افرد الأجنحة الأربعة، ولفّ طرفَي السلك ليصيرا قرنَي استشعار.',tips:'علّق الفراشات بخيوط من سقف الفصل لتصنع سماء متحركة. اسأل: كم جناحاً للفراشة؟',hands:true},
      {n:102,name:'سلسلة الورق المتصلة',goal:'تعليم التماثل والقصّ الدقيق ومفهوم التكرار',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق A4، مقص أطفال آمن، أقلام تلوين',steps:'١. اطوِ الورقة طيّات أكورديون بعرض ٥ سم.\n٢. ارسم نصف شكل إنسان على الطيّة العليا بحيث تلمس اليدان الحافتين.\n٣. قصّ الشكل دون قصّ موضع اليدين.\n٤. افرد الورقة فتظهر سلسلة أطفال ممسكين بأيديهم، ولوّن كل واحد.',tips:'اجعل كل طفل يلوّن شخصاً باسم صديق له. رسالة جميلة عن الترابط.',hands:true},
      {n:103,name:'مروحة الصيف المزخرفة',goal:'تقوية عضلات اليد الدقيقة وتعليم نمط الطي المنتظم',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق مقوى ملون، ملصقات، غراء، خافض لسان خشبي',steps:'١. زيّن الورقة بالملصقات والرسم أولاً وهي مفرودة.\n٢. اطوها طيّات متساوية ذهاباً وإياباً.\n٣. اضغط الطيّات من الأسفل والصقها على الخافض الخشبي.\n٤. افرد الأعلى على شكل نصف دائرة.',tips:'قِس مع الأطفال: هل الطيّات متساوية؟ مفهوم رياضي مبكر بلا مسطرة.',hands:true},
      {n:104,name:'قبعة الورق الكبيرة',goal:'تنمية إدراك الأبعاد والثقة بالنفس عبر ارتداء ما صنعته',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق جرائد أو ورق كبير، ألوان، ملصقات',steps:'١. اطوِ الورقة الكبيرة من المنتصف.\n٢. اطوِ الزاويتين العلويتين للداخل حتى تلتقيا في الوسط.\n٣. اطوِ الشريط السفلي لأعلى من الجهتين.\n٤. افتح القبعة وزيّنها باسم الطفل ورسومه.',tips:'اصنعوا موكب قبعات في الفناء. صوّر كل طفل بقبعته وأرسلها للأهل.',hands:true},
      {n:105,name:'زهرة الورق ثلاثية الأبعاد',goal:'تعليم مفهوم البعد الثالث والتركيب من أجزاء',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'ورق ملون، مقص، غراء، ماصّة خضراء، ورق أخضر للأوراق',steps:'١. قصّ ست دوائر متساوية من الورق الملون.\n٢. اطوِ كل دائرة نصفين ثم افتحها قليلاً.\n٣. الصق نصف كل دائرة بنصف التالية حتى تكتمل الزهرة.\n٤. ثبّتها على الماصّة والصق ورقتين خضراوين.',tips:'اصنعوا باقة للمدرسة أو هدية لأم كل طفل. اربطها بدرس عن أجزاء النبات.',hands:true},
      {n:106,name:'علبة الورق المربعة',goal:'تعليم الأشكال الهندسية وتحويل المسطح إلى مجسّم',age:'٥-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق مربع مقوى، مقص، غراء',steps:'١. اطوِ المربع نصفين أفقياً ثم افرده، وعمودياً ثم افرده.\n٢. اطوِ الزوايا الأربع إلى المركز.\n٣. اطوِ كل حافة إلى المركز واضغط جيداً.\n٤. افتح الجوانب لأعلى فتتشكل العلبة، وثبّت الأركان بالغراء.',tips:'استخدموها لحفظ الأقلام أو كهدية صغيرة. تحدّث عن المربع والمكعب.',hands:true},
      {n:107,name:'لوحة القصّ والتركيب',goal:'تنمية التركيز والصبر ومهارة الملاحظة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'صورة مطبوعة كبيرة، مقص، ورق مقوى، غراء',steps:'١. اعطِ كل طفل صورة واضحة وبسيطة.\n٢. اطلب منه قصّها إلى ٦ أو ٨ قطع بخطوط يرسمها بنفسه.\n٣. اخلط القطع ثم أعِد تركيبها على الورق المقوى.\n٤. الصق القطع بالترتيب الصحيح.',tips:'ابدأ بـ٤ قطع للصغار. تبادلوا الأحاجي بين الأطفال لزيادة التحدي.',hands:true},
      {n:108,name:'طائر الورق المتأرجح',goal:'تجربة التوازن ومركز الثقل بشكل محسوس',age:'٥-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق مقوى، عملتان معدنيتان أو مشبكان، ألوان',steps:'١. ارسم طائراً بجناحين مفرودين وقصّه.\n٢. لوّنه من الوجهين.\n٣. ثبّت عملة صغيرة تحت طرف كل جناح.\n٤. ضع منقاره على طرف إصبعك فيتوازن ولا يقع.',tips:'اسأل: لماذا لم يقع؟ جرّبوا نزع عملة واحدة وشاهدوا الفرق.',hands:true},
      {n:109,name:'بطاقة تنبثق عند الفتح',goal:'تنمية الإبداع والتخطيط المسبق ومهارة القصّ الدقيق',age:'٥-٦ سنوات',time:'٣٠ دقيقة',materials:'ورق مقوى، مقص، غراء، ألوان',steps:'١. اطوِ الورقة نصفين.\n٢. من جهة الطي، قصّ شقّين متوازيين بطول ٣ سم.\n٣. ادفع اللسان الناتج للداخل واطوِه ليصير منصة.\n٤. الصق رسماً على المنصة، فيقفز عند فتح البطاقة.',tips:'مناسبة جداً كهدية عيد أو يوم المعلم. دع الطفل يكتب رسالته بنفسه.',hands:true},
      {n:110,name:'مدينتي من أسطوانات الورق',goal:'تنمية التخطيط المكاني والعمل الجماعي',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'أسطوانات ورق المناديل، ورق ملون، غراء، أقلام، لوح كرتون كبير',steps:'١. كل طفل يغلّف أسطوانة بورق ملون ليصنع مبنى.\n٢. يرسم عليها نوافذ وباباً.\n٣. ثبّتوا المباني معاً على لوح الكرتون.\n٤. ارسموا الشوارع بينها بالأقلام.',tips:'أضيفوا مسجداً ومدرسة ومستشفى وتحدثوا عن دور كل مبنى في الحي.',hands:true},
    ]},
    {cat:'<i class="ic ic-refresh"></i> إعادة تدوير وصنع من الخامات',catKey:'recycle',items:[
      {n:111,name:'مزهرية القارورة الملونة',goal:'غرس ثقافة إعادة التدوير وتنمية الحس الجمالي',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'قوارير بلاستيك فارغة، خيوط صوف ملونة، غراء، مقص',steps:'١. قصّ القارورة من المنتصف (المعلمة تتولى القصّ).\n٢. ضع خطاً من الغراء حول القاعدة.\n٣. لفّ خيط الصوف حول القارورة صفاً فوق صف بألوان متبادلة.\n٤. ضع فيها زهرة حقيقية أو ورقية.',tips:'تحدّث: كانت هذه قمامة، ماذا صارت؟ رسالة بيئية عملية لا تُنسى.',hands:true},
      {n:112,name:'روبوت العلب المعدنية',goal:'تنمية الخيال والتركيب والتوازن',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'علب فارغة نظيفة بأحجام مختلفة، ورق ألمنيوم، أغطية زجاجات، غراء قوي',steps:'١. رتّب العلب: كبيرة للجسم، صغيرة للرأس.\n٢. غلّفها بورق الألمنيوم.\n٣. الصق أغطية الزجاجات كعيون وأزرار.\n٤. أضف ذراعين من ماصّات أو أسلاك زينة.',tips:'تأكّد من عدم وجود حواف حادة. كل طفل يسمّي روبوته ويحكي ما يفعله.',hands:true},
      {n:113,name:'طبل العلبة والبالون',goal:'اكتشاف الصوت والاهتزاز وصنع آلة موسيقية',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'علبة معدنية أو بلاستيكية فارغة، بالون، مطاط، ورق لاصق ملون',steps:'١. قصّ عنق البالون.\n٢. شدّ البالون فوق فوهة العلبة.\n٣. ثبّته بالمطاط بإحكام.\n٤. زيّن جوانب العلبة، ثم اطرق عليه بأصابعك.',tips:'جرّبوا علباً بأحجام مختلفة: أيّها صوته أعمق؟ درس فيزياء مبسّط.',hands:true},
      {n:114,name:'سيارة الكرتون المتدحرجة',goal:'فهم الحركة والعجلات وتنمية التركيب',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'علبة كرتون صغيرة، أربعة أغطية زجاجات، ماصّتان، مسامير خشبية أو أعواد، ألوان',steps:'١. لوّن العلبة كهيكل السيارة.\n٢. ثبّت الماصّتين تحت العلبة بشكل عرضي.\n٣. أدخل العودين في الماصّتين.\n٤. ثبّت الأغطية في أطراف العودين كعجلات.',tips:'سباق في الفناء: أي سيارة تسير أبعد؟ ناقشوا لماذا.',hands:true},
      {n:115,name:'لوحة أغطية الزجاجات',goal:'تنمية التصنيف اللوني والصبر والتناسق',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'أغطية زجاجات ملونة كثيرة، لوح خشب أو كرتون سميك، غراء قوي',steps:'١. ارسم شكلاً بسيطاً على اللوح: زهرة، سمكة، شمس.\n٢. صنّف الأغطية حسب اللون في أطباق.\n٣. الصق الأغطية داخل الشكل بلون واحد لكل جزء.\n٤. اترك اللوحة تجفّ ثم علّقها.',tips:'مشروع جماعي رائع لمدخل المدرسة. اجمعوا الأغطية من الأهالي مسبقاً.',hands:true},
      {n:116,name:'قلم من الجريدة الملفوفة',goal:'تحويل النفايات لأداة نافعة وتنمية الدقة',age:'٥-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق جرائد، غراء، عبوة قلم حبر، ورق ملون للزينة',steps:'١. قصّ الجريدة شريطاً بعرض ١٥ سم.\n٢. ضع عبوة القلم على الحافة ولفّ الورق حولها بإحكام.\n٣. ضع غراء على الحافة الأخيرة والصقها.\n٤. غلّف القلم بورق ملون واكتب اسمك.',tips:'هدية عملية يأخذها الطفل للبيت ويستخدمها فعلاً.',hands:true},
      {n:117,name:'بيت الطيور من علبة الحليب',goal:'تنمية الرحمة بالحيوان والمسؤولية البيئية',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'علبة حليب كرتونية فارغة، مقص، ألوان أكريليك، عود خشبي، خيط',steps:'١. اغسل العلبة وجفّفها جيداً.\n٢. قصّ فتحة دائرية في أحد الجوانب (المعلمة).\n٣. لوّن العلبة من الخارج بالأكريليك.\n٤. ثبّت العود تحت الفتحة كمجثم، وعلّقها بالخيط في الفناء.',tips:'ضعوا فيها حبوباً وراقبوا الطيور أسبوعياً. سجّلوا ما رأيتم في دفتر.',hands:true},
      {n:118,name:'سجادة الأكياس المجدولة',goal:'تعليم الجدل والنسج وتقوية اليدين',age:'٥-٦ سنوات',time:'٤٠ دقيقة',materials:'أكياس بلاستيك نظيفة ملونة، مقص',steps:'١. قصّ الأكياس شرائط بعرض ٣ سم.\n٢. اربط ثلاث شرائط من طرف واحد.\n٣. اجدلها كضفيرة الشعر حتى النهاية.\n٤. لفّ الجديلة على شكل حلزوني والصقها لتصير قاعدة صغيرة.',tips:'نشاط ممتاز لتقوية عضلات الأصابع قبل الكتابة.',hands:true},
      {n:119,name:'مجسّم الجمل من الكرتون',goal:'ربط إعادة التدوير بالهوية المحلية',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'كرتون سميك، مقص، ألوان بنية، صوف بني، غراء',steps:'١. ارسم شكل الجمل من الجانب على الكرتون وقصّه (المعلمة تساعد).\n٢. لوّنه بالبني وحدّد السنام.\n٣. الصق خصلات صوف على الرقبة والسنام.\n٤. ثبّت قاعدة كرتون ليقف عليها.',tips:'تحدّثوا عن سفينة الصحراء ولماذا يخزّن الماء والدهن في سنامه.',hands:true},
      {n:120,name:'فانوس العلبة المثقوبة',goal:'اكتشاف الضوء والظل بطريقة آمنة وجميلة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'علبة معدنية فارغة، مسمار وشاكوش صغير (المعلمة فقط)، شمعة LED، سلك للتعليق',steps:'١. ارسم نمطاً من النقاط على ورقة والصقها حول العلبة.\n٢. املأ العلبة ماءً وجمّدها ليسهل الثقب دون انبعاج.\n٣. المعلمة تثقب النقاط بالمسمار.\n٤. ضع شمعة LED بالداخل وأطفئ الإضاءة.',tips:'الثقب للمعلمة حصراً. شاهدوا النقاط المضيئة على الجدار وتحدثوا عن الضوء.',hands:true},
    ]},
    {cat:'<i class="ic ic-leaf"></i> عجائن وطين وصلصال',catKey:'dough',items:[
      {n:121,name:'عجينة الملح بأيدينا',goal:'تجربة القياس والخلط وتنمية الحس اللمسي',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'كوبا دقيق، كوب ملح، كوب ماء، ملون طعام، وعاء خلط',steps:'١. كل طفل يقيس بنفسه: كوبا دقيق وكوب ملح في الوعاء.\n٢. يضيف الماء تدريجياً ويعجن بيديه.\n٣. يضيف قطرات ملون الطعام ويعجن حتى يتوزع اللون.\n٤. يشكّل ما يريد ويترك القطعة تجفّ يومين.',tips:'القياس بالكوب درس رياضيات حسّي. احفظ العجين بكيس محكم لأسبوع.',hands:true},
      {n:122,name:'بصمة يدي المحفوظة',goal:'صنع ذكرى ملموسة وتنمية الوعي بالذات',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'عجينة ملح، شوبك، ماصّة، ألوان أكريليك، شريط',steps:'١. افرد العجينة بسمك ١ سم.\n٢. اضغط كف الطفل في المنتصف بقوة كافية.\n٣. اثقب فتحة بالماصّة للتعليق قبل الجفاف.\n٤. بعد الجفاف لوّنها واكتب الاسم والتاريخ.',tips:'هدية مؤثرة جداً للأهل. اكتب عمر الطفل ليقارن بعد سنوات.',hands:true},
      {n:123,name:'حروفي بالصلصال',goal:'ترسيخ شكل الحرف حركياً قبل الكتابة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'صلصال ملون، بطاقات حروف كبيرة، لوح صغير',steps:'١. اعرض بطاقة حرف واضح.\n٢. الطفل يدحرج الصلصال ليصير حبلاً رفيعاً.\n٣. يشكّل الحبل على شكل الحرف فوق البطاقة.\n٤. ينطق الحرف ويذكر كلمة تبدأ به.',tips:'الأثر الحركي يثبّت شكل الحرف أفضل من التكرار الكتابي في هذا العمر.',hands:true},
      {n:124,name:'كائنات الطين البحرية',goal:'تنمية الخيال والمهارة الدقيقة والتعرف على البحر',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'طين أو صلصال أزرق وأخضر، أصداف صغيرة، خرز، أعواد',steps:'١. تحدّث عن كائنات البحر: السمكة، النجمة، السلحفاة.\n٢. كل طفل يختار كائناً ويشكّله.\n٣. يغرس الأصداف والخرز كتفاصيل.\n٤. ضعوا الأعمال معاً لتشكّل قاع بحر جماعي.',tips:'أضف رمالاً حقيقية في صينية كخلفية. اربطه بحديث عن نظافة البحر.',hands:true},
      {n:125,name:'كعك العيد من العجين',goal:'محاكاة عمل الكبار وتنمية التسلسل والصبر',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'عجينة ملح ملونة، قوالب كعك بلاستيكية، شوبك، صينية',steps:'١. افرد العجينة بالشوبك.\n٢. اضغط القوالب لتقطيع الأشكال.\n٣. رتّب القطع في الصينية كأنها مخبز.\n٤. زيّنوا محل الكعك ولعبوا البيع والشراء.',tips:'يدمج المهارة اليدوية مع اللعب التمثيلي والمفاهيم الحسابية.',hands:true},
      {n:126,name:'جبل بركاني يثور',goal:'تجربة علمية محسوسة عن التفاعل الكيميائي',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'طين أو عجينة، كوب صغير، بيكربونات الصوديوم، خل، ملون أحمر، صينية',steps:'١. شكّل جبلاً من الطين حول الكوب واترك فوهته مفتوحة.\n٢. ضع ملعقتَي بيكربونات وقطرات ملون أحمر في الكوب.\n٣. ضع الجبل في صينية عميقة.\n٤. صبّ الخل وشاهدوا الثوران.',tips:'اسأل قبل التجربة: ماذا تتوقعون؟ ثم قارنوا التوقع بالنتيجة.',hands:true},
      {n:127,name:'خرز العجين الملون',goal:'تنمية الدقة والتسلسل والتصنيف',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'عجينة ملح ملونة، ماصّة، خيط، ألوان',steps:'١. دحرج كرات صغيرة متساوية من العجين.\n٢. اثقب كل كرة بالماصّة.\n٣. اتركها تجفّ يوماً كاملاً.\n٤. انظمها في خيط بنمط متكرر: أحمر أزرق أحمر أزرق.',tips:'النمط المتكرر مفهوم رياضي أساسي. اطلب من الطفل توقّع الخرزة التالية.',hands:true},
      {n:128,name:'أحفوريات الديناصورات',goal:'ربط اللعب بالاكتشاف العلمي والملاحظة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'عجينة ملح، مجسّمات ديناصورات صغيرة، فرشاة صغيرة',steps:'١. افرد أقراصاً من العجين.\n٢. اضغط مجسّم الديناصور في العجين ثم ارفعه.\n٣. اترك الأثر يجفّ.\n٤. نظّف الأثر بالفرشاة كما يفعل علماء الآثار.',tips:'تحدّث: كيف عرف العلماء شكل الديناصورات؟ من آثارها في الصخر.',hands:true},
      {n:129,name:'لوحة الطين البارز',goal:'تنمية الإحساس بالملمس والفن التشكيلي',age:'٥-٦ سنوات',time:'٤٠ دقيقة',materials:'طين، لوح خشب أو كرتون سميك، أدوات نقش بسيطة، ألوان',steps:'١. افرد طبقة طين على اللوح بسمك ١ سم.\n٢. ارسم بالعود شكلاً بسيطاً.\n٣. أضف طيناً فوق الخطوط ليبرز الشكل.\n٤. بعد الجفاف لوّنه.',tips:'اربطه بالنقوش على الجدران القديمة في العلا ومدائن صالح.',hands:true},
      {n:130,name:'مطبخ العجين الحسّي',goal:'إشباع الحاجة الحسّية وتنمية اللعب التمثيلي',age:'٣-٥ سنوات',time:'٣٠ دقيقة',materials:'عجينة بألوان متعددة، أدوات مطبخ بلاستيكية، أطباق، شوك بلاستيك',steps:'١. جهّز ركن مطبخ بالعجين والأدوات.\n٢. اطلب من كل طفل تحضير وجبة من خياله.\n٣. يقدّمها لصديقه ويصفها: هذا أرز وهذا لحم.\n٤. يتبادلون أدوار الطاهي والزبون.',tips:'نشاط ممتاز للأطفال الذين يحتاجون تفريغاً حسّياً أو تهدئة.',hands:true},
    ]},
    {cat:'<i class="ic ic-image"></i> رسم وطباعة وتلوين',catKey:'paint',items:[
      {n:131,name:'طباعة بالخضروات',goal:'اكتشاف الأشكال المخفية في الطبيعة وتنمية الملاحظة',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'بامية، جزر، بطاطس، فلفل حلو، ألوان مائية، ورق أبيض، أطباق',steps:'١. قطّع الخضروات عرضياً (المعلمة).\n٢. اغمس المقطع في اللون واطبعه على الورق.\n٣. لاحظوا: البامية تعطي نجمة، الفلفل يعطي زهرة.\n٤. كوّن لوحة من الأشكال المطبوعة.',tips:'لحظة الدهشة حين يرى الطفل النجمة داخل البامية لا تُنسى.',hands:true},
      {n:132,name:'الرسم بالخيط',goal:'تجربة الصدفة الفنية وتنمية التخيل',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'خيط سميك، ألوان سائلة، ورق مطوي نصفين',steps:'١. اغمس الخيط في اللون.\n٢. ضعه بشكل عشوائي داخل الورقة المطوية.\n٣. أغلق الورقة واضغط، واسحب الخيط للخارج.\n٤. افتح الورقة وتأمّل الشكل الناتج.',tips:'اسأل: ماذا يشبه هذا الشكل؟ نشاط ممتاز لتنمية الخيال الحر.',hands:true},
      {n:133,name:'رسم الفقاعات',goal:'دمج المتعة بالتجربة العلمية عن الهواء',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'صابون سائل، ماء، ملون طعام، ماصّات، ورق مقوى، أكواب',steps:'١. اخلط ماءً وصابوناً وملوناً في كوب.\n٢. انفخ بالماصّة داخل الكوب حتى ترتفع الفقاعات فوق الحافة.\n٣. ضع الورقة فوق الفقاعات برفق.\n٤. كرّر بألوان مختلفة على نفس الورقة.',tips:'تحذير مهم: علّم الأطفال النفخ لا الشفط. جرّبها معهم أولاً.',hands:true},
      {n:134,name:'لوحة البصمات الحيوانية',goal:'تنمية الخيال وتحويل البصمة لصورة',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'أحبار ملونة آمنة، ورق أبيض، أقلام سوداء رفيعة',steps:'١. اطبع بصمة إبهامك على الورق.\n٢. فكّر: هذه البصمة يمكن أن تصير دبّاً أو سمكة.\n٣. أضف بالقلم أذنين وعينين وأرجلاً.\n٤. اصنع قصة من مجموعة البصمات.',tips:'تحدّث عن أن بصمة كل إنسان مختلفة عن غيره — درس عن التفرّد.',hands:true},
      {n:135,name:'الرسم على الرمل الملون',goal:'تنمية التركيز والتهدئة والفن الزائل',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'صينية عميقة، رمل ناعم نظيف، أعواد خشبية، طباشير ملون مسحوق',steps:'١. اخلط الرمل مع مسحوق الطباشير الملون.\n٢. افرده في الصينية بسمك ١ سم.\n٣. ارسم بإصبعك أو العود.\n٤. هزّ الصينية وابدأ من جديد.',tips:'نشاط مهدّئ ممتاز قبل النوم أو بعد نشاط حركي عالي الطاقة.',hands:true},
      {n:136,name:'طباعة الأوراق الطبيعية',goal:'التعرف على تفاصيل النبات بالملاحظة الدقيقة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'أوراق شجر بأحجام مختلفة، ألوان أكريليك، فرشاة، ورق',steps:'١. اجمعوا أوراق شجر من الفناء.\n٢. لوّن الوجه الخلفي للورقة حيث العروق بارزة.\n٣. اقلبها على الورق واضغط برفق.\n٤. ارفعها فتظهر العروق بوضوح.',tips:'استخدم عدسة مكبّرة لملاحظة العروق. اربطه بدرس كيف تتنفس النباتات.',hands:true},
      {n:137,name:'لوحة الملح اللامعة',goal:'تجربة امتصاص اللون وتنمية الدهشة العلمية',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'غراء أبيض، ملح خشن، ألوان مائية سائلة، فرشاة رفيعة، ورق مقوى',steps:'١. ارسم شكلاً بالغراء مباشرة على الورق المقوى.\n٢. رشّ الملح بغزارة فوق الغراء ثم انفض الزائد.\n٣. المس الملح بفرشاة مبلولة باللون.\n٤. شاهدوا اللون يجري في الملح كالسحر.',tips:'لحظة سحرية حقيقية. اسأل: كيف انتقل اللون؟ الملح يمتصّ الماء.',hands:true},
      {n:138,name:'الرسم بالثلج الملون',goal:'دمج الحس واللون والحالة الفيزيائية',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'قوالب ثلج، ماء، ملون طعام، أعواد خشبية، ورق مقوى سميك',steps:'١. اخلط الماء بالملون واسكبه في القوالب.\n٢. ضع عوداً في كل قالب وجمّدها.\n٣. ارسم بمكعب الثلج الملون على الورق.\n٤. لاحظوا ذوبان المكعب أثناء الرسم.',tips:'درس مبسّط عن الحالات: صلب يذوب فيصير سائلاً. مثالي للصيف.',hands:true},
      {n:139,name:'مرايا التماثل بالألوان',goal:'تعليم مفهوم التماثل بشكل بصري ممتع',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق مطوي نصفين، ألوان سائلة، ملاعق صغيرة',steps:'١. افتح الورقة وضع نقاط ألوان على نصف واحد فقط.\n٢. اطوِ الورقة واضغط بيدك من المنتصف للخارج.\n٣. افتحها وشاهدوا الشكل المتماثل.\n٤. اسأل: هل النصفان متشابهان؟',tips:'اربطه بالتماثل في الطبيعة: الفراشة، وجه الإنسان، ورقة الشجر.',hands:true},
      {n:140,name:'جدارية الفصل الجماعية',goal:'تعزيز العمل الجماعي والانتماء للمجموعة',age:'٤-٦ سنوات',time:'٤٥ دقيقة',materials:'ورق لفّة كبير، ألوان متعددة، فرش بأحجام مختلفة، إسفنج',steps:'١. افرد الورق على الأرض أو الجدار.\n٢. حدّد موضوعاً: حديقتنا، مدينتي، البحر.\n٣. كل طفل يرسم في مساحته الخاصة.\n٤. اربطوا الرسوم ببعضها بخطوط وطرق.',tips:'علّق الجدارية في ممر المدرسة باسم كل طفل. فخر جماعي حقيقي.',hands:true},
    ]},
    {cat:'<i class="ic ic-paperclip"></i> خيط ونسيج وخرز',catKey:'sew',items:[
      {n:141,name:'بطاقة التخريم بالخيط',goal:'تدريب اليد على مسار الكتابة وتقوية الأصابع',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق مقوى، خرّامة، خيط سميك ملون، شريط لاصق لتقوية طرف الخيط',steps:'١. ارسم شكلاً بسيطاً على الكرتون: قلب، نجمة، سمكة.\n٢. اثقب على محيط الشكل ثقوباً متساوية.\n٣. لفّ طرف الخيط بلاصق ليصير كالإبرة.\n٤. الطفل يخيط داخل وخارج الثقوب حتى يكمل الشكل.',tips:'أفضل تمرين لتهيئة اليد للكتابة. ابدأ بأشكال ذات ٦ ثقوب فقط.',hands:true},
      {n:142,name:'نسج على شوكة الكرتون',goal:'تعليم مبدأ النسيج بشكل مبسّط',age:'٥-٦ سنوات',time:'٣٥ دقيقة',materials:'كرتون مستطيل، مقص، خيوط صوف ملونة',steps:'١. قصّ شقوقاً متساوية في طرفَي الكرتون.\n٢. لفّ خيطاً طولياً بين الشقوق ليصير سداة.\n٣. مرّر خيطاً آخر عرضياً: فوق، تحت، فوق، تحت.\n٤. بدّل الألوان لتظهر خطوط.',tips:'اربطه بالسدو السعودي واعرض صوراً له. تراث بأيدي الأطفال.',hands:true},
      {n:143,name:'سوار الصداقة بالخرز',goal:'تنمية النمط والدقة وقيمة الصداقة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'خرز كبير ملون، خيط مطاطي، حروف خرزية إن توفرت',steps:'١. اختر ألوان خرزك.\n٢. انظمها في الخيط بنمط تختاره.\n٣. اجعل الطول مناسباً للمعصم.\n٤. اربط الطرفين، ثم أهدِه لصديق.',tips:'الخرز الكبير للأعمار الصغيرة تفادياً للابتلاع. راقب الأطفال دائماً.',hands:true},
      {n:144,name:'دمية الجورب',goal:'تنمية الخيال واللعب التمثيلي والمهارة اليدوية',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'جوارب قديمة نظيفة، أزرار، خيوط صوف، غراء قماش، مقص',steps:'١. ألبس الجورب على يدك وحدّد موضع العينين والفم.\n٢. الصق زرّين كعينين.\n٣. الصق خيوط الصوف كشعر.\n٤. حرّك يدك ودع الدمية تتكلم وتعرّف بنفسها.',tips:'استخدموا الدمى في مسرح قصصي. ممتاز للأطفال الخجولين.',hands:true},
      {n:145,name:'لوحة الأزرار الملونة',goal:'تنمية التصنيف اللوني والحجمي والدقة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'أزرار متنوعة، لوح كرتون، غراء، قلم',steps:'١. ارسم شكلاً على اللوح: شجرة، فراشة، قوس قزح.\n٢. صنّف الأزرار حسب اللون والحجم.\n٣. الصق الأزرار داخل الشكل.\n٤. املأ الفراغات بأزرار أصغر.',tips:'التصنيف قبل اللصق هو التعلّم الحقيقي هنا. لا تستعجل هذه الخطوة.',hands:true},
      {n:146,name:'عقد المعكرونة الملون',goal:'دمج التلوين بالنظم وتقوية الأصابع',age:'٣-٥ سنوات',time:'٣٠ دقيقة',materials:'معكرونة أنبوبية، ملون طعام، خل، أكياس، خيط',steps:'١. ضع المعكرونة في كيس مع ملعقة خل وقطرات ملون.\n٢. رجّ الكيس حتى يتوزع اللون، ثم انشرها لتجفّ.\n٣. انظم القطع الملونة في الخيط.\n٤. اربط العقد والبسه.',tips:'التلوين نشاط مستقل ممتع بحد ذاته. حضّره في اليوم السابق.',hands:true},
      {n:147,name:'كرة الصوف الملفوفة',goal:'تقوية قبضة اليد وتنمية الصبر',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'بالون صغير منفوخ، خيط صوف، غراء أبيض مخفف بالماء، وعاء',steps:'١. انفخ البالون بحجم صغير.\n٢. اغمس الخيط في الغراء المخفف.\n٣. لفّ الخيط حول البالون في كل الاتجاهات.\n٤. اترك ليجفّ يوماً ثم افقأ البالون واسحبه.',tips:'النتيجة كرة شبكية جميلة تُعلّق. لحظة فقء البالون مبهجة جداً.',hands:true},
      {n:148,name:'مفرش الشعر المضفور',goal:'تعليم الجدل ثلاثي الخيوط بدقة',age:'٥-٦ سنوات',time:'٣٠ دقيقة',materials:'ثلاثة خيوط صوف سميكة بألوان مختلفة، مشبك تثبيت',steps:'١. اربط الخيوط الثلاثة من طرف وثبّتها بمشبك.\n٢. اجدل: اليمين فوق الوسط، اليسار فوق الوسط.\n٣. كرّر حتى النهاية واربط الطرف.\n٤. استخدمها كسوار أو علامة كتاب.',tips:'الجدل مهارة تحتاج تنسيق اليدين معاً — ممتاز لنمو الدماغ.',hands:true},
      {n:149,name:'خيمة الصوف الصغيرة',goal:'ربط العمل اليدوي بالتراث السعودي',age:'٥-٦ سنوات',time:'٤٠ دقيقة',materials:'قماش أو خيش، أعواد خشبية، خيط، إبرة بلاستيكية كبيرة',steps:'١. قصّ القماش مستطيلاً.\n٢. اخرز حوافه بغرزة بسيطة بالإبرة البلاستيكية.\n٣. ثبّته على أربعة أعواد كخيمة.\n٤. زيّنها بنقوش سدو بالألوان.',tips:'تحدّثوا عن بيت الشعر وحياة البادية. أضيفوا مجسّم جمل بجانبها.',hands:true},
      {n:150,name:'علاقة المفاتيح المطرزة',goal:'صنع هدية شخصية وتنمية الدقة العالية',age:'٥-٦ سنوات',time:'٣٥ دقيقة',materials:'قطعتا لباد، خيط تطريز، إبرة بلاستيكية، حلقة مفاتيح، حشو قطني',steps:'١. قصّ شكلين متطابقين من اللباد.\n٢. خِط حوافهما معاً بغرزة بسيطة واترك فتحة.\n٣. احشُ القطن ثم أغلق الفتحة.\n٤. ثبّت حلقة المفاتيح.',tips:'هدية عيد الأم أو يوم المعلم. الطفل يفخر بشيء صنعه بنفسه.',hands:true},
    ]},
    {cat:'<i class="ic ic-leaf"></i> أشغال من الطبيعة',catKey:'nature',items:[
      {n:151,name:'لوحة الحصى المرسومة',goal:'الربط بين الفن والطبيعة وتنمية الملاحظة',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'حصى أملس نظيف بأحجام متوسطة، ألوان أكريليك، فرش رفيعة، ورنيش اختياري',steps:'١. اغسلوا الحصى وجفّفوه جيداً.\n٢. كل طفل يتأمّل حصاته: ماذا تشبه؟\n٣. يلوّنها لتصير دعسوقة أو سمكة أو وجهاً.\n٤. بعد الجفاف ضعوها في حديقة المدرسة.',tips:'لحظة التأمل قبل الرسم مهمة — تعلّم الطفل أن يرى الأشكال في الأشياء.',hands:true},
      {n:152,name:'إكليل أوراق الخريف',goal:'التعرف على الفصول وتنمية التصنيف',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'أوراق شجر متساقطة، طبق ورقي مفرّغ الوسط، غراء، خيط',steps:'١. اجمعوا أوراقاً بألوان وأحجام مختلفة من الفناء.\n٢. صنّفوها: كبيرة وصغيرة، فاتحة وداكنة.\n٣. الصقوها حول حلقة الطبق متداخلة.\n٤. علّقوا الإكليل على باب الفصل.',tips:'تحدّثوا: لماذا تسقط الأوراق؟ ماذا يحدث للشجرة في كل فصل؟',hands:true},
      {n:153,name:'فرشاة من أغصان الطبيعة',goal:'اكتشاف أدوات بديلة وتنمية الابتكار',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'أغصان صغيرة، أوراق، ريش، عشب، مطاط، ألوان، ورق',steps:'١. كل طفل يجمع مواد طبيعية.\n٢. يربطها بمطاط في طرف غصن ليصنع فرشاته.\n٣. يغمسها في اللون ويرسم.\n٤. قارنوا: أي فرشاة تعطي أثراً أجمل؟',tips:'درس رائع في الابتكار: الأداة لا يشترط أن تُشترى.',hands:true},
      {n:154,name:'مجسّم من الأصداف',goal:'التعرف على البيئة البحرية وتنمية التركيب',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'أصداف بأحجام مختلفة، غراء قوي، قاعدة كرتون، ألوان',steps:'١. رتّبوا الأصداف حسب الحجم.\n٢. اختر تصميماً: زهرة، طائر، سلحفاة.\n٣. الصق الأصداف على القاعدة.\n٤. لوّن التفاصيل الصغيرة.',tips:'أنصتوا لصوت البحر في الصدفة الكبيرة — لحظة مدهشة للأطفال.',hands:true},
      {n:155,name:'حديقة الزجاجة المصغرة',goal:'فهم دورة النبات والمسؤولية طويلة المدى',age:'٥-٦ سنوات',time:'٤٠ دقيقة',materials:'قارورة زجاج شفافة واسعة، حصى صغير، تربة، نباتات صغيرة، رذاذ ماء',steps:'١. ضع طبقة حصى في القاع للتصريف.\n٢. أضف طبقة تربة فوقها.\n٣. اغرس نبتة أو اثنتين برفق.\n٤. رشّ الماء وأغلق القارورة، وراقبوها أسبوعياً.',tips:'شاهدوا قطرات الماء على الزجاج — دورة الماء المصغّرة أمام أعينهم.',hands:true},
      {n:156,name:'عصا المطر من الأغصان',goal:'صنع آلة موسيقية طبيعية واكتشاف الصوت',age:'٥-٦ سنوات',time:'٣٥ دقيقة',materials:'أنبوب كرتون طويل، مسامير خشبية أو أعواد أسنان، أرز أو حصى صغير، لاصق',steps:'١. اغرس الأعواد داخل الأنبوب بشكل متقاطع.\n٢. أغلق أحد الطرفين بإحكام.\n٣. اسكب حفنة أرز ثم أغلق الطرف الآخر.\n٤. زيّن الأنبوب واقلبه ببطء لتسمع صوت المطر.',tips:'أغمضوا أعينكم واستمعوا: هل يشبه المطر حقاً؟ نشاط تأملي جميل.',hands:true},
      {n:157,name:'بذور في صورة',goal:'تنمية اللمس والتصنيف والصبر',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'بذور متنوعة: عدس، فاصولياء، ذرة، أرز، غراء، كرتون',steps:'١. ارسم شكلاً بسيطاً على الكرتون.\n٢. صنّف البذور في أطباق حسب النوع.\n٣. ضع الغراء في منطقة واحدة والصق نوعاً واحداً.\n٤. كرّر بأنواع مختلفة لكل منطقة.',tips:'المسوا كل نوع وصفوه: ناعم، خشن، صلب. ثروة لغوية حسّية.',hands:true},
      {n:158,name:'ساعة الشمس البسيطة',goal:'فهم دوران الأرض وقياس الوقت طبيعياً',age:'٥-٦ سنوات',time:'٣٠ دقيقة',materials:'طبق ورقي، عود خشبي، طين لتثبيته، قلم، مكان مشمس',steps:'١. اغرس العود في منتصف الطبق وثبّته بالطين.\n٢. ضع الطبق في الشمس صباحاً.\n٣. علّم موضع الظل كل ساعة واكتب الوقت.\n٤. بنهاية اليوم صارت لديك ساعة شمسية.',tips:'تجربة تحتاج يوماً كاملاً — علّم الأطفال الصبر والملاحظة المتكررة.',hands:true},
      {n:159,name:'بيت الحشرات المفيدة',goal:'غرس الرحمة بالكائنات الصغيرة والوعي البيئي',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'علبة خشبية أو كرتونية، أعواد مجوفة، صنوبر، أوراق جافة، سلك',steps:'١. املأ العلبة بالأعواد المجوفة والمواد الطبيعية.\n٢. اضغطها جيداً حتى لا تسقط.\n٣. علّق العلبة في زاوية هادئة بالحديقة.\n٤. راقبوها أسبوعياً دون إزعاج.',tips:'تحدّثوا: النحل والدعسوقة أصدقاء المزارع. ليست كل حشرة مؤذية.',hands:true},
      {n:160,name:'عطر الزهور المنزلي',goal:'تجربة استخلاص حسّية وتنمية حاسة الشم',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'بتلات ورد أو ياسمين، ماء دافئ، مصفاة، قارورة صغيرة، ملعقة',steps:'١. اجمعوا البتلات وضعوها في وعاء.\n٢. اهرسوها بالملعقة برفق.\n٣. أضف ماءً دافئاً واتركه ساعة.\n٤. صفّ السائل في القارورة وشمّوه.',tips:'اربطه بصناعة العطور في الطائف. سمّوا الرائحة: قوية، خفيفة، حلوة.',hands:true},
    ]},
    {cat:'<i class="ic ic-tool"></i> تركيب وبناء بسيط',catKey:'build',items:[
      {n:161,name:'جسر خافضات اللسان',goal:'فهم مبادئ البناء والتوازن والقوة',age:'٥-٦ سنوات',time:'٣٥ دقيقة',materials:'خافضات لسان خشبية، غراء خشب، أوزان صغيرة للاختبار',steps:'١. الصق خافضين معاً لتقوية كل ضلع.\n٢. كوّن مثلثات — الشكل الأقوى في البناء.\n٣. اربط المثلثات لتصنع جسراً بين كرسيين.\n٤. اختبروا: كم وزناً يتحمّل قبل أن ينكسر؟',tips:'المثلث أقوى من المربع — اتركوهم يكتشفون ذلك بالتجربة لا بالإخبار.',hands:true},
      {n:162,name:'برج الماصّات الشاهق',goal:'تنمية التخطيط والعمل الجماعي وحل المشكلات',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'ماصّات شرب، شريط لاصق، مقص',steps:'١. قسّم الأطفال مجموعات ثنائية.\n٢. التحدي: أطول برج يقف وحده خلال ١٥ دقيقة.\n٣. لا يُسمح بالإسناد على الجدار.\n٤. قيسوا الأبراج وناقشوا: لماذا وقف هذا وسقط ذاك؟',tips:'القاعدة العريضة تمنع السقوط — دعوهم يستنتجون بأنفسهم.',hands:true},
      {n:163,name:'أرجوحة الدمية',goal:'تطبيق مفهوم الحركة البندولية وتنمية الابتكار',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'علبة كرتون، خيط، عودان، دمية صغيرة، مقص',steps:'١. اصنع إطاراً على شكل حرف قائم من العيدان.\n٢. اربط خيطين متوازيين في العارضة العلوية.\n٣. اربط قطعة كرتون بينهما كمقعد.\n٤. ضع الدمية وادفعها برفق.',tips:'اسأل: هل تتأرجح أسرع لو قصّرنا الخيط؟ جرّبوا واكتشفوا.',hands:true},
      {n:164,name:'مصعد البكرة',goal:'اكتشاف مبدأ البكرة وتسهيل الرفع',age:'٥-٦ سنوات',time:'٣٥ دقيقة',materials:'بكرة خيط فارغة، عود، خيط متين، سلّة صغيرة، ألعاب كأوزان',steps:'١. ثبّت البكرة على عود بين كرسيين لتدور بحرية.\n٢. مرّر الخيط فوق البكرة.\n٣. اربط السلّة في طرف والمقبض في الطرف الآخر.\n٤. ضع لعبة في السلّة واسحب.',tips:'قارنوا: أسهل بالبكرة أم بالرفع المباشر؟ أول درس في الآلات البسيطة.',hands:true},
      {n:165,name:'متاهة الكرة في الصندوق',goal:'تنمية التخطيط والتحكم الحركي الدقيق',age:'٥-٦ سنوات',time:'٤٠ دقيقة',materials:'غطاء صندوق كرتون، ماصّات أو كرتون مقصوص، غراء، كرة صغيرة',steps:'١. ارسم مسار المتاهة على قاع الغطاء.\n٢. الصق الماصّات على خطوط المسار كجدران.\n٣. اصنع فتحات حفر يجب تجنبها.\n٤. أمِل الصندوق بيديك لتوجيه الكرة للنهاية.',tips:'دع كل طفل يتحدى صديقه في متاهته. فخر بالتصميم لا بالفوز فقط.',hands:true},
      {n:166,name:'رافعة الملعقة القاذفة',goal:'فهم الرافعة والقوة بشكل عملي',age:'٥-٦ سنوات',time:'٣٠ دقيقة',materials:'خافضات لسان، مطاط، ملعقة بلاستيك، كرات ورق صغيرة',steps:'١. اربط ست خافضات معاً كحزمة.\n٢. اربط خافضين آخرين من طرف واحد.\n٣. أدخل الحزمة بين الخافضين وثبّت الملعقة.\n٤. ضع كرة ورق واضغط ثم أفلت.',tips:'اجعلوا هدفاً على مسافة. قِسْ: أيّ زاوية تقذف أبعد؟',hands:true},
      {n:167,name:'منزل من العصي والطين',goal:'ربط البناء بالتراث المحلي',age:'٥-٦ سنوات',time:'٤٥ دقيقة',materials:'أعواد خشبية، طين، قاعدة كرتون، قش أو عشب جاف',steps:'١. اغرس الأعواد في الطين كجدران.\n٢. املأ الفراغات بين الأعواد بالطين.\n٣. اصنع سقفاً من الأعواد المتقاطعة.\n٤. غطّ السقف بالقش.',tips:'اعرض صور البيوت الطينية في نجد. تراث معماري بأيدي الأطفال.',hands:true},
      {n:168,name:'قارب يطفو حقاً',goal:'اكتشاف الطفو والكثافة بالتجربة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'فلين أو علبة صغيرة، عود، ورق مثلث كشراع، حوض ماء، طين للتثبيت',steps:'١. اصنع الهيكل من الفلين.\n٢. اغرس العود في المنتصف وثبّته بالطين.\n٣. الصق الشراع الورقي على العود.\n٤. ضعه في الماء وانفخ على الشراع.',tips:'جرّبوا: ماذا لو وضعنا حجراً في القارب؟ متى يغرق؟',hands:true},
      {n:169,name:'دولاب الهواء الدوّار',goal:'اكتشاف طاقة الرياح بشكل محسوس',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'ورق مربع مقوى، دبوس ضغط، ماصّة أو عود، مقص، خرزة',steps:'١. قصّ من كل زاوية نحو المركز دون قطعه.\n٢. اطوِ زاوية واحدة من كل ضلع نحو المنتصف.\n٣. ثبّتها كلها بالدبوس في المركز.\n٤. اغرس الدبوس في العود مع خرزة ليدور بحرية.',tips:'اركضوا في الفناء وشاهدوا الدوران. ما الذي يحرّكه؟ الهواء.',hands:true},
      {n:170,name:'مسار الكرة المتدحرجة',goal:'فهم الميل والسرعة والجاذبية',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'أنابيب كرتون مشقوقة طولياً، شريط لاصق، كرات صغيرة، جدار أو لوح',steps:'١. الصق الأنابيب على الجدار بميول مختلفة.\n٢. اربطها لتصير مساراً متصلاً.\n٣. أطلق الكرة من الأعلى.\n٤. عدّلوا الميل حتى تصل الكرة للنهاية دون سقوط.',tips:'التجربة والخطأ هي جوهر النشاط. لا تصلح لهم المسار بنفسك.',hands:true},
    ]},
    {cat:'<i class="ic ic-sparkle"></i> حسّي ولمسي',catKey:'sensory',items:[
      {n:171,name:'كيس الحس المغلق',goal:'تنمية اللمس والوصف اللغوي بغير النظر',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'أكياس بلاستيك محكمة، جل شعر شفاف، خرز صغير، ملون طعام، لاصق قوي',steps:'١. املأ الكيس بالجل وقطرات ملون.\n٢. أضف خرزاً أو نجوماً صغيرة.\n٣. أغلق الكيس بإحكام والصق الحواف بلاصق قوي.\n٤. الطفل يضغط ويحرّك المحتويات بأصابعه.',tips:'آمن تماماً وقابل للغسل. ممتاز للأطفال الذين يحتاجون تفريغاً حسّياً.',hands:true},
      {n:172,name:'صندوق الرمل الحسّي',goal:'تهدئة الجهاز العصبي وتنمية اللعب الحر',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'صندوق بلاستيك، رمل نظيف أو أرز أو عدس، أدوات حفر، مجسّمات صغيرة',steps:'١. املأ الصندوق بالحبوب أو الرمل.\n٢. أخفِ مجسّمات صغيرة بداخله.\n٣. الطفل يبحث عنها بيديه أو بالملعقة.\n٤. يصنّف ما وجده حسب النوع.',tips:'استخدم العدس والأرز إن كان الرمل غير متاح — النتيجة نفسها.',hands:true},
      {n:173,name:'لوحة الملامس المتنوعة',goal:'إثراء المفردات الحسّية وتنمية التمييز',age:'٣-٥ سنوات',time:'٢٥ دقيقة',materials:'لوح كرتون، قطع: صوف، ورق صنفرة، قطن، ورق ألمنيوم، إسفنج، غراء',steps:'١. قسّم اللوح إلى مربعات.\n٢. الصق مادة مختلفة في كل مربع.\n٣. الطفل يلمس كل مربع ويصفه: خشن، ناعم، بارد.\n٤. أغمض عينيه وخمّن الملمس.',tips:'سجّل الكلمات الجديدة التي تعلّمها كل طفل. ثروة لغوية حقيقية.',hands:true},
      {n:174,name:'عجينة الرغوة الطائرة',goal:'تجربة حسّية مبهرة وتنمية الدهشة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'رغوة حلاقة، نشا ذرة، ملون طعام، وعاء',steps:'١. اضغط كمية من رغوة الحلاقة في الوعاء.\n٢. أضف نشا الذرة تدريجياً مع الخلط.\n٣. أضف قطرات ملون.\n٤. اعجن حتى تصير كتلة خفيفة كالسحاب.',tips:'ملمس فريد جداً — خفيف وناعم. تأكّد من عدم وجود حساسية لدى الأطفال.',hands:true},
      {n:175,name:'زجاجة الهدوء المتلألئة',goal:'أداة عملية لتنظيم الانفعالات والتهدئة',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'قارورة بلاستيك شفافة، ماء دافئ، غراء لامع، بريق، لاصق قوي',steps:'١. املأ القارورة ثلثيها بالماء الدافئ.\n٢. أضف ملعقتَي غراء لامع ورشّة بريق.\n٣. أكمل بالماء وأغلق الغطاء بلاصق قوي.\n٤. رجّها وراقب البريق يهبط ببطء.',tips:'استخدمها كساعة تهدئة: حين تغضب، رجّها وتنفّس حتى يهدأ البريق.',hands:true},
      {n:176,name:'مسار المشي الحافي',goal:'تنمية الإحساس بالقدم والتوازن',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'صواني مسطحة، مواد: رمل، حصى ناعم، عشب، إسفنج مبلول، قماش',steps:'١. رتّب الصواني في صف على الأرض.\n٢. ضع مادة مختلفة في كل صينية.\n٣. الأطفال يمشون حفاة عبر المسار.\n٤. يصفون ما تشعر به أقدامهم عند كل محطة.',tips:'احرص على سلامة المواد ونظافتها. تجربة لا تُنسى للأطفال.',hands:true},
      {n:177,name:'بالونات الأوزان الغامضة',goal:'تنمية مفهوم الثقل والخفة والمقارنة',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'بالونات، أرز، دقيق، قطن، حصى، ماء، قمع',steps:'١. املأ كل بالون بمادة مختلفة بنفس الحجم تقريباً.\n٢. اربطها جيداً.\n٣. الأطفال يحملونها ويرتّبونها من الأخف للأثقل.\n٤. افتحوا البالونات وتحقّقوا من التخمينات.',tips:'نفس الحجم لكن أوزان مختلفة — مفهوم الكثافة مبسّط جداً.',hands:true},
      {n:178,name:'ثلج الألوان الذائب',goal:'دمج الحس بالتجربة العلمية عن الحرارة',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'قوالب ثلج ملون، ملح خشن، صينية، ماصّات، ألوان سائلة',steps:'١. جمّد ماءً ملوناً في قالب كبير.\n٢. ضع الكتلة في صينية.\n٣. رشّ الملح عليها وشاهدوا الحفر تتكوّن.\n٤. نقّط ألواناً في الحفر بالماصّة.',tips:'الملح يخفض درجة تجمد الماء — شرح بسيط لظاهرة يرونها بأعينهم.',hands:true},
      {n:179,name:'حديقة الصوت الخفي',goal:'تنمية الإصغاء والتمييز السمعي',age:'٣-٦ سنوات',time:'٢٠ دقيقة',materials:'علب صغيرة متماثلة معتمة، حشوات: أرز، عملات، قطن، حصى، أزرار',steps:'١. املأ كل زوج علب بنفس المحتوى.\n٢. اخلط العلب على الطاولة.\n٣. الطفل يهزّ العلبة ويبحث عن توأمها بالصوت.\n٤. افتحوها للتحقّق.',tips:'ابدأ بثلاثة أزواج فقط. الصوت أصعب تمييزاً من الصورة.',hands:true},
      {n:180,name:'عالم الأرز الملون',goal:'تنمية اللعب الحر والتصنيف والتفريغ الحسّي',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'أرز، ملون طعام، خل، أكياس، صندوق، أدوات صبّ وملاعق',steps:'١. لوّن الأرز في أكياس منفصلة: ملعقة خل وقطرات ملون.\n٢. انشره ليجفّ ساعة.\n٣. ضع الألوان في الصندوق بطبقات.\n٤. الأطفال يصبّون وينقلون بالملاعق والأكواب.',tips:'الصبّ والنقل يدرّبان التآزر البصري الحركي بشكل ممتاز.',hands:true},
    ]},
    {cat:'<i class="ic ic-bulb"></i> علوم بأيدينا',catKey:'science_craft',items:[
      {n:181,name:'مصباح الليمون',goal:'اكتشاف الكهرباء الطبيعية بشكل مبهر',age:'٥-٦ سنوات',time:'٣٠ دقيقة',materials:'ليمونتان، مسمار جلفنة، قطعة نحاس، أسلاك بمشابك، لمبة LED صغيرة',steps:'١. اغرس مسماراً وقطعة نحاس في كل ليمونة.\n٢. اربط نحاس الأولى بمسمار الثانية بسلك.\n٣. اربط الطرفين الحرين بأطراف اللمبة.\n٤. أطفئ الإضاءة وشاهدوا التوهج الخافت.',tips:'قد يكون الضوء خافتاً جداً — أطفئ الأنوار. تحضير مسبق ضروري.',hands:true},
      {n:182,name:'بركان الرغوة الملون',goal:'مشاهدة تفاعل كيميائي آمن ومثير',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'قارورة، بيكربونات الصوديوم، خل، صابون سائل، ملون، صينية عميقة',steps:'١. ضع في القارورة ملعقتَي بيكربونات وملعقة صابون وقطرات ملون.\n٢. ضع القارورة في الصينية.\n٣. اسكب الخل دفعة واحدة.\n٤. راقبوا الرغوة تتدفق.',tips:'الصابون يجعل الرغوة أكثر وأطول بقاءً. اسألوا: من أين جاءت الفقاعات؟',hands:true},
      {n:183,name:'قوس قزح في كوب',goal:'فهم الكثافة بشكل بصري لا يُنسى',age:'٥-٦ سنوات',time:'٣٠ دقيقة',materials:'عسل، صابون سائل، ماء ملون، زيت، كحول ملون، كوب طويل شفاف، ملعقة',steps:'١. اسكب العسل في القاع أولاً.\n٢. أضف الصابون ببطء على ظهر الملعقة.\n٣. ثم الماء الملون، ثم الزيت، ثم الكحول.\n٤. شاهدوا الطبقات لا تختلط.',tips:'الصبّ البطيء على ظهر الملعقة هو سرّ نجاح التجربة.',hands:true},
      {n:184,name:'زهرة الورق المتفتحة في الماء',goal:'اكتشاف الخاصية الشعرية للورق',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق ملون، مقص، ألوان، طبق ماء واسع',steps:'١. قصّ زهرة بست بتلات لكل طفل.\n٢. لوّنها كما يحب.\n٣. اطوِ البتلات نحو المركز.\n٤. ضعها على سطح الماء وراقب التفتّح.',tips:'لحظة سحرية حقيقية. الورق يمتصّ الماء فتنفتح الطيّات.',hands:true},
      {n:185,name:'الحليب الراقص',goal:'مشاهدة التوتر السطحي وتأثير الصابون',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'طبق، حليب كامل الدسم، ألوان طعام، صابون سائل، عود قطن',steps:'١. اسكب طبقة حليب في الطبق.\n٢. نقّط ألواناً مختلفة على السطح متباعدة.\n٣. اغمس عود القطن في الصابون.\n٤. المس مركز الطبق وشاهدوا الألوان تنفجر وترقص.',tips:'استخدم حليباً كامل الدسم — قليل الدسم لا يعطي النتيجة نفسها.',hands:true},
      {n:186,name:'البيضة العائمة',goal:'فهم الكثافة والطفو بتجربة بسيطة',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'كوبان شفافان، ماء، ملح كثير، بيضتان، ملعقة',steps:'١. املأ الكوبين بالماء.\n٢. أذب ست ملاعق ملح في أحدهما.\n٣. ضع بيضة في كل كوب.\n٤. لاحظوا: تغرق في العذب وتطفو في المالح.',tips:'اربطه بالبحر الميت. اسأل: لماذا نطفو في البحر أسهل من المسبح؟',hands:true},
      {n:187,name:'مكبّر الصوت الورقي',goal:'اكتشاف انتقال الصوت وتركيزه',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق مقوى، لاصق، مقص',steps:'١. لفّ الورق على شكل مخروط.\n٢. قصّ الطرف الضيق ليصير فتحة صغيرة.\n٣. ثبّت الشكل باللاصق.\n٤. تكلّم في الطرف الضيق وقارن الصوت.',tips:'جرّبوا أيضاً وضعه على الأذن للاستماع. الصوت يُجمع ولا يتشتّت.',hands:true},
      {n:188,name:'نبتة في كيس شفاف',goal:'مشاهدة الإنبات كاملاً من البداية',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'كيس بلاستيك محكم، قطن، بذور فاصولياء، ماء، لاصق',steps:'١. بلّل القطن وضعه في الكيس.\n٢. ضع بذرتين على القطن.\n٣. أغلق الكيس والصقه على نافذة مشمسة.\n٤. راقبوا يومياً وارسموا ما ترون.',tips:'الجذر ينمو لأسفل والساق لأعلى دائماً — لاحظوها معهم.',hands:true},
      {n:189,name:'مغناطيسي يبحث',goal:'اكتشاف المغناطيسية والتصنيف العلمي',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'مغناطيس، صينية بها أشياء متنوعة: مشبك، زر، ملعقة، خشب، بلاستيك، عملة',steps:'١. الطفل يتوقّع أولاً: أيّ الأشياء سينجذب؟\n٢. سجّل التوقعات في جدول بسيط.\n٣. اختبر كل شيء بالمغناطيس.\n٤. قارن التوقع بالنتيجة وصنّف.',tips:'التوقّع قبل التجربة هو التفكير العلمي الحقيقي — لا تتخطّ هذه الخطوة.',hands:true},
      {n:190,name:'سباق قطرات الماء',goal:'فهم الميل والانزلاق والتوتر السطحي',age:'٤-٦ سنوات',time:'٢٠ دقيقة',materials:'ورق شمعي أو بلاستيك، ماصّة، ماء ملون، لوح مائل',steps:'١. ثبّت الورق الشمعي على لوح مائل.\n٢. كل طفل يضع قطرة ماء ملونة في الأعلى.\n٣. أطلقوا القطرات معاً.\n٤. أيّ قطرة تصل أولاً؟ جرّبوا قطرات أكبر.',tips:'لاحظوا شكل القطرة الكروي — الماء يتماسك مع نفسه.',hands:true},
    ]},
    {cat:'<i class="ic ic-calendar"></i> مناسبات وفصول',catKey:'seasonal',items:[
      {n:191,name:'علم الوطن بالبصمات',goal:'تعزيز الانتماء الوطني بعمل جماعي',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'لوح كبير أبيض، ألوان خضراء وبيضاء آمنة، قلم للسيف والشهادة',steps:'١. ارسم مستطيل العلم على اللوح.\n٢. كل طفل يضع بصمة يده الخضراء داخله.\n٣. املأوا المساحة ببصمات الجميع.\n٤. اكتبوا الشهادة والسيف بالأبيض.',tips:'مثالي لليوم الوطني. اكتب اسم كل طفل بجانب بصمته.',hands:true},
      {n:192,name:'نخلة الوطن من الكرتون',goal:'ربط الرمز الوطني بالعمل اليدوي',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'أسطوانة كرتون، ورق أخضر، ورق بني، تمر بلاستيكي أو كرات بنية، غراء',steps:'١. غلّف الأسطوانة بالورق البني كجذع.\n٢. قصّ سعفاً طويلاً من الورق الأخضر.\n٣. الصق السعف في أعلى الجذع.\n٤. علّق كرات التمر تحت السعف.',tips:'تحدّثوا: النخلة في شعار المملكة، لماذا؟ العطاء والصمود.',hands:true},
      {n:193,name:'زينة رمضان المتسلسلة',goal:'تعزيز أجواء الشهر بمشاركة الأطفال',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'ورق ملون، مقص، غراء، خيط، بريق',steps:'١. قصّ شرائط ورقية متساوية.\n٢. الصق أطراف الشريط ليصير حلقة.\n٣. أدخل الشريط التالي في الحلقة قبل لصقه.\n٤. كوّنوا سلسلة طويلة وعلّقوها.',tips:'احسبوا الحلقات: كل حلقة يوم من رمضان. تقويم يدوي جميل.',hands:true},
      {n:194,name:'فانوس رمضان بالزجاج الملون',goal:'دمج الفن بأجواء الشهر الكريم',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'برطمان زجاجي، ورق شفاف ملون، غراء أبيض مخفف، فرشاة، شمعة LED',steps:'١. قصّ الورق الشفاف قطعاً صغيرة.\n٢. ادهن البرطمان بالغراء المخفف.\n٣. الصق القطع متداخلة حتى يُغطى.\n٤. بعد الجفاف ضع شمعة LED بالداخل.',tips:'أطفئوا الأنوار معاً وشاهدوا الألوان على الجدران — لحظة مؤثرة.',hands:true},
      {n:195,name:'بطاقة العيد المنفوخة',goal:'صنع هدية شخصية لأفراد الأسرة',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'ورق مقوى، ألوان، ملصقات، بريق، مقص',steps:'١. اطوِ الورقة نصفين كبطاقة.\n٢. ارسم على الغلاف زخرفة عيد أو هلالاً.\n٣. اكتب أو ارسم رسالتك في الداخل.\n٤. زيّنها بالبريق والملصقات.',tips:'دع الطفل يقرر لمن ستكون البطاقة ولماذا اختار هذا الشخص.',hands:true},
      {n:196,name:'شجرة الفصول الأربعة',goal:'فهم تعاقب الفصول بشكل بصري',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'لوح كرتون كبير، ورق بني للجذع، ألوان، قطن، ورق أخضر وأصفر وأحمر',steps:'١. ارسم شجرة بأربعة أفرع كبيرة.\n٢. الفرع الأول: أوراق خضراء (ربيع).\n٣. الثاني: أوراق كثيفة (صيف)، الثالث: صفراء وحمراء (خريف).\n٤. الرابع: عارٍ مع قطن كثلج (شتاء).',tips:'علّقوها ومرّوا عليها كل فصل: أين نحن الآن؟',hands:true},
      {n:197,name:'مطر الشتاء في الزجاجة',goal:'محاكاة دورة الماء بشكل مبسّط',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'قارورة شفافة، ماء دافئ، رغوة حلاقة، ملون أزرق، ماصّة',steps:'١. املأ نصف القارورة بالماء.\n٢. ضع طبقة رغوة حلاقة فوقه كالسحابة.\n٣. نقّط الملون الأزرق على الرغوة بالماصّة.\n٤. شاهدوا اللون يتسرّب كالمطر.',tips:'شرح بسيط: السحابة تمتلئ بالماء حتى تثقل فينزل المطر.',hands:true},
      {n:198,name:'ثلج الشتاء الاصطناعي',goal:'تجربة حسّية موسمية مدهشة',age:'٤-٦ سنوات',time:'٢٥ دقيقة',materials:'بيكربونات الصوديوم، بلسم شعر أبيض، وعاء، بريق فضي',steps:'١. ضع ثلاثة أكواب بيكربونات في الوعاء.\n٢. أضف نصف كوب بلسم تدريجياً واخلط.\n٣. اعجن حتى يصير كالثلج المتماسك البارد.\n٤. أضف البريق وشكّلوا رجل ثلج صغيراً.',tips:'بارد الملمس فعلاً ويتشكّل كالثلج. مثالي لأطفال لم يروا الثلج.',hands:true},
      {n:199,name:'سلة الربيع المزهرة',goal:'الاحتفاء بالفصل وتنمية الترتيب',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'طبق ورقي، مقص، ورق ملون، غراء، شريط، زهور ورقية',steps:'١. قصّ الطبق نصفين والصق نصفاً على ورقة كسلة.\n٢. اصنع زهوراً من الورق الملون.\n٣. الصق سيقاناً خضراء تخرج من السلة.\n٤. ثبّت الزهور على السيقان.',tips:'اخرجوا للفناء وابحثوا عن علامات الربيع الحقيقية أولاً.',hands:true},
      {n:200,name:'تقويم يومي بأيدينا',goal:'تعليم الأيام والشهور والتسلسل الزمني',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'لوح كرتون، بطاقات صغيرة، مشابك، أقلام ملونة، خيط',steps:'١. قسّم اللوح: اليوم، الشهر، الطقس، الفصل.\n٢. اصنع بطاقات لكل يوم وشهر وحالة طقس.\n٣. علّق البطاقات بمشابك قابلة للتبديل.\n٤. كل صباح طفل يحدّث التقويم.',tips:'روتين صباحي ثابت يبني مفهوم الزمن تدريجياً عند الطفل.',hands:true},
    ]},
    {cat:'<i class="ic ic-gift"></i> اصنع وخذ للبيت',catKey:'takehome',items:[
      {n:201,name:'إطار صورة عائلتي',goal:'تعزيز الانتماء الأسري وتنمية المهارات الحركية الدقيقة',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'أعواد آيس كريم خشبية (٨ لكل طفل)، غراء أبيض، ألوان خشبية أو أكريليك، خرز وأزرار، صورة عائلية يحضرها ولي الأمر',steps:'١. اطلب من الأهل مسبقاً إرسال صورة عائلية مطبوعة صغيرة مع الطفل.\n٢. الطفل يلصق أربعة أعواد على شكل مربع، ثم أربعة فوقها لتقوية الإطار.\n٣. يلوّن الإطار ويزيّنه بالخرز والأزرار كما يحب.\n٤. بعد الجفاف، تُلصق الصورة من الخلف ويُكتب اسم الطفل والتاريخ.',tips:'الرسالة للأهل: «صنعه بيديه، علّقوه في مكان يراه» — هذا يرفع اعتزاز الطفل بعمله.',hands:true,takehome:true},
      {n:202,name:'علّاقة مفاتيح لبابا',goal:'تنمية العضلات الدقيقة وتعزيز مشاعر العطاء تجاه الأب',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'عجينة سيراميك باردة أو صلصال يجفّ بالهواء، حلقة معدنية صغيرة، خرز ملوّن، خيط متين، ألوان',steps:'١. كل طفل يشكّل قطعة صغيرة من العجينة (قلب، نجمة، حرف اسم أبيه).\n٢. اثقب القطعة من الأعلى بقلم قبل أن تجف.\n٣. اتركها تجف يوماً كاملاً ثم يلوّنها الطفل.\n٤. اربط الحلقة والخيط وأضف خرزتين، واغلّفها في كيس صغير.',tips:'اجعل التسليم مناسبة: «هدية من صنع يديّ». ذكّر الأهل ألا يصلحوا العيوب — قيمتها في كونها بيد الطفل.',hands:true,takehome:true},
      {n:203,name:'حصّالة نقودي',goal:'تعليم الادخار وترتيب الأولويات المالية مبكراً',age:'٤-٦ سنوات',time:'٤٥ دقيقة',materials:'عبوة بلاستيكية فارغة نظيفة لكل طفل، ورق ملوّن، غراء، ألوان، مقص آمن (يستخدمه المعلّم للفتحة)',steps:'١. المعلّم يفتح شقاً علوياً في كل عبوة قبل النشاط (لا يستخدم الطفل المقص هنا).\n٢. الطفل يغلّف العبوة بالورق الملوّن ويزيّنها.\n٣. يكتب أو يلصق اسمه وكلمة «ادّخاري».\n٤. تحدّث معه: ماذا تريد أن تشتري بعد أن تمتلئ؟',tips:'أرفق ورقة صغيرة للأهل بفكرة «ريال كل أسبوع». هدف الادخار المحدّد يجعل الفكرة ملموسة للطفل.',hands:true,takehome:true},
      {n:204,name:'زرع في كوب يكبر معي',goal:'تعليم المسؤولية والصبر ومراقبة دورة نمو النبات',age:'٣-٦ سنوات',time:'٢٥ دقيقة',materials:'أكواب شفافة، قطن أو تربة، بذور فاصولياء أو عدس، ماء، ملصقات أسماء',steps:'١. كل طفل يملأ كوبه بالقطن المبلّل أو التربة.\n٢. يضع بذرتين قرب جدار الكوب ليراهما وهما تنبتان.\n٣. يلصق ملصقاً باسمه وتاريخ الزراعة.\n٤. يأخذه للبيت مع تعليمات السقي: رشّتان يومياً قرب النافذة.',tips:'اطلب من الأهل إرسال صورة للنبتة بعد أسبوع — المتابعة تُكمل الفائدة التربوية.',hands:true,takehome:true},
      {n:205,name:'لوحة بصمة يدي',goal:'توثيق مرحلة الطفولة وتنمية الوعي بالذات',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'لوح كرتون مقوّى أو عجينة ملح، ألوان أكريليك آمنة، فرشاة عريضة، قلم دائم، مناديل مبللة',steps:'١. لوّن كف يد الطفل بلون يختاره بنفسه.\n٢. اطبع الكف في وسط اللوح واتركه يجف.\n٣. اكتب حول البصمة: الاسم، العمر، التاريخ.\n٤. زيّن الحواف بنقاط ملونة ونظّف اليدين مباشرة.',tips:'هذه من أكثر الهدايا التي يحتفظ بها الأهل سنوات. صوّرها قبل التسليم للأرشيف.',hands:true,takehome:true},
      {n:206,name:'حامل أقلامي',goal:'إعادة التدوير وصنع شيء نافع للاستخدام اليومي',age:'٤-٦ سنوات',time:'٣٥ دقيقة',materials:'علبة معدنية أو أسطوانية فارغة بحواف آمنة، خيوط صوف ملونة، غراء، أزرار، ورق لاصق',steps:'١. تأكّد أن حواف العلبة مغطاة بشريط لاصق قبل أن يلمسها الطفل.\n٢. الطفل يلفّ الخيط الملوّن حول العلبة من الأسفل للأعلى مع الغراء.\n٣. يبدّل ألوان الخيط ليصنع خطوطاً.\n٤. يلصق أزراراً وحروف اسمه على الوجه الأمامي.',tips:'اللفّ المتكرر تمرين ممتاز للأصابع. للأصغر سناً: علبة أقصر ولفّات أقل.',hands:true,takehome:true},
      {n:207,name:'بطاقة معايدة لجدّتي',goal:'تنمية اللغة التعبيرية وصلة الرحم',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'ورق مقوّى ملوّن، أقلام، ملصقات، ورق مقصوص بأشكال ورود، غراء',steps:'١. اطوِ الورقة نصفين لتصير بطاقة.\n٢. الطفل يرسم في الغلاف وردة أو وجهاً مبتسماً.\n٣. من الداخل: يملي جملته والمعلّمة تكتبها، ثم يوقّع باسمه أو ببصمته.\n٤. يزيّنها بالملصقات ويضعها في مغلّف.',tips:'اترك الجملة من كلام الطفل حرفياً — «أحبك يا جدتي وأبي يوديني لك» أجمل من أي عبارة جاهزة.',hands:true,takehome:true},
      {n:208,name:'فانوس رمضان',goal:'ربط الطفل بأجواء الشهر الفضيل وتنمية الحس الفني',age:'٤-٦ سنوات',time:'٤٥ دقيقة',materials:'ورق مقوّى، ورق شفاف ملوّن (سلوفان)، مقص آمن، غراء، شمعة LED صغيرة، خيط للتعليق',steps:'١. اطوِ الورق المقوّى واصنع فتحات على شكل نجوم وأهلّة (المعلّم يقصّ للصغار).\n٢. الطفل يلصق الورق الشفاف الملوّن خلف الفتحات من الداخل.\n٣. اطوِ الفانوس على شكل أسطواني وألصق الحواف.\n٤. ضع شمعة LED بالداخل وعلّق الخيط من الأعلى.',tips:'شمعة LED فقط — لا لهب مطلقاً. الضوء عبر الورق الملوّن يبهر الأطفال ويجعلها هدية مميزة.',hands:true,takehome:true},
      {n:209,name:'حقيبة مصحفي',goal:'غرس احترام المصحف وتنمية مهارة الترتيب',age:'٤-٦ سنوات',time:'٤٠ دقيقة',materials:'قطعتا قماش (٢٠×٢٥ سم)، خيط سميك وإبرة بلاستيكية كبيرة، أزرار، ألوان قماش، شريط',steps:'١. ثبّت القطعتين ببعضهما بمشابك.\n٢. الطفل يخيط الحواف الثلاث بغرزة كبيرة بإبرة بلاستيكية آمنة.\n٣. يزيّن الوجه بألوان القماش واسمه.\n٤. أضف شريطاً كمقبض وزراً للإغلاق.',tips:'الإبرة البلاستيكية الكبيرة آمنة تماماً. الخياطة من أقوى تمارين التآزر بين اليد والعين.',hands:true,takehome:true},
      {n:210,name:'مغناطيس ثلاجتنا',goal:'تنمية التشكيل الدقيق وصنع قطعة تُرى يومياً',age:'٣-٦ سنوات',time:'٣٠ دقيقة',materials:'عجينة تجفّ بالهواء، قطع مغناطيس لاصقة، ألوان أكريليك، ورنيش شفاف اختياري',steps:'١. الطفل يشكّل قطعة صغيرة: فاكهة، حيوان، حرف اسمه.\n٢. اتركها تجف تماماً (يوم كامل).\n٣. الطفل يلوّنها في الحصة التالية.\n٤. ألصق المغناطيس خلفها بعد جفاف اللون.',tips:'قسّمه على حصتين: تشكيل ثم تلوين. الانتظار بين المرحلتين درس في الصبر.',hands:true,takehome:true},
      {n:211,name:'قارورة الرمل الملوّن',goal:'تنمية التركيز والتحكم الدقيق وتذوّق التدرّج اللوني',age:'٤-٦ سنوات',time:'٣٠ دقيقة',materials:'قوارير زجاجية أو بلاستيكية صغيرة بغطاء، رمل نظيف ملوّن بألوان طعام، ملاعق صغيرة، قمع ورقي',steps:'١. لوّن الرمل مسبقاً بألوان الطعام واتركه يجف.\n٢. الطفل يسكب طبقة من لون بالملعقة عبر القمع.\n٣. يبدّل اللون لطبقة ثانية وثالثة دون خضّ القارورة.\n٤. أغلق الغطاء بإحكام والصق اسمه.',tips:'السكب البطيء بالملعقة تمرين تحكّم ممتاز. أغلق الغطاء بغراء قوي قبل التسليم.',hands:true,takehome:true},

          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;margin-right:38px;flex-wrap:wrap">

        </div>
      </summary>
      <div style="padding:16px">

        <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">المواد المطلوبة</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(act.materials||'—')}</div></div>
        <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:6px">خطوات التنفيذ</div><div style="font-size:13px;color:#334155;line-height:1.9;white-space:pre-line">${esc(act.steps||'—')}</div></div>

        ${act.attachment?`<a href="${act.attachment.data}" download="${esc(act.attachment.name)}" style="display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;text-decoration:none"><i class="ic ic-paperclip"></i> ${esc(act.attachment.name)} (${act.attachment.size||''})</a>`:''}
      </div>
    </details>`;
  return `
  <div style="padding:20px">
    <div style="background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;border-radius:16px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden">

// ===== واجهة المعلمة: الأنشطة المُسندة لها + تعليم التنفيذ =====
_teacherActivities(catColors){
  const me=Auth.user;
  const assigns=DB.activityAssignments().filter(a=>
    a.scope==='all'||(a.scope==='branch'&&a.branchId===me.branchId)||(a.scope==='teacher'&&a.teacherId===me.id)
  ).sort((a,b)=>(b.sentAt||'').localeCompare(a.sentAt||''));
  const reports=DB.activityReports();
  const myRep=(aid)=>reports.find(r=>r.assignmentId===aid&&r.teacherId===me.id);
  const doneCnt=assigns.filter(a=>myRep(a.id)?.done===true).length;
  return `
  <div style="padding:20px">

      <div style="display:flex;gap:12px;flex-wrap:wrap">

        <div style="background:rgba(255,255,255,.18);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700"><i class="ic ic-check"></i> ${doneCnt} منفّذ</div>
      </div>
    </div>

        <div style="background:${cc}11;border-bottom:2px solid ${cc}33;padding:14px 16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <span style="font-weight:800;font-size:16px;color:#1e293b">${esc(a.name)}</span> ${done?'<span class="badge badge-green"><i class="ic ic-check"></i> نُفّذ</span>':notDone?'<span class="badge badge-red"><i class="ic ic-x"></i> لم يُنفّذ</span>':'<span class="badge badge-yellow"><i class="ic ic-hourglass"></i> بانتظار التنفيذ</span>'}
          </div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:12px;font-size:11px"><i class="ic ic-clock"></i> ${esc(a.time||'—')}</span> <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:12px;font-size:11px"><i class="ic ic-child"></i> ${esc(a.age||'—')}</span> <span style="background:#eef2ff;color:#4338ca;padding:2px 8px;border-radius:12px;font-size:11px"><i class="ic ic-user"></i> من: ${esc(a.sentByName||'الإدارة')}</span> </div>
        </div>
        <div style="padding:16px">
          ${a.image?`<img src="${a.image}" style="width:100%;max-height:260px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:12px">`:''}
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">الهدف</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(a.goal||'—')}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px">المواد المطلوبة</div><div style="font-size:13px;color:#334155;line-height:1.7">${esc(a.materials||'—')}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:6px">خطوات التنفيذ</div><div style="font-size:13px;color:#334155;line-height:1.9;white-space:pre-line">${esc(a.steps||'—')}</div></div>
          ${a.tips?`<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:3px"><i class="ic ic-bulb"></i> نصيحة</div><div style="font-size:12px;color:#78350f;line-height:1.7">${esc(a.tips)}</div></div>`:''}
          ${a.attachment?`<a href="${a.attachment.data}" download="${esc(a.attachment.name)}" style="display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;text-decoration:none;margin-bottom:14px"><i class="ic ic-paperclip"></i> ${esc(a.attachment.name)} (${a.attachment.size||''})</a>`:''}
          <div style="border-top:1px solid #e2e8f0;padding-top:14px">
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:8px">هل نفّذتِ النشاط؟ <span style="color:#dc2626">(الصورة إلزامية للتنفيذ)</span></div>
            <textarea id="actnote-${a.id}" class="input" rows="2" placeholder="ملاحظة (اختياري): كيف تم التنفيذ، عدد الأطفال..." style="resize:none;margin-bottom:8px">${esc(r?.note||'')}</textarea>
            <label style="cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:9px 12px;border:1.5px ${r?.photo?'solid #86efac':'dashed #f59e0b'};border-radius:8px;background:${r?.photo?'#f0fdf4':'#fffbeb'};color:${r?.photo?'#166534':'#92400e'};margin-bottom:10px">
              ${r?.photo?'<i class="ic ic-check"></i> تم إرفاق الصورة — اضغطي لتغييرها':'<i class="ic ic-camera"></i> أرفقي صورة التنفيذ (إلزامية) *'}
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="teacherActivityPhoto('${a.id}',this)">
            </label>
            ${r?.photo?`<div style="margin-bottom:10px"><a href="${r.photo}" target="_blank"><img src="${r.photo}" style="max-height:90px;border-radius:8px;border:1px solid #e2e8f0"></a></div>`:''}
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <button class="btn ${done?'btn-success':'btn-secondary'}" onclick="teacherReportActivity('${a.id}',true)"><i class="ic ic-check"></i> تم التنفيذ</button>
              <button class="btn ${notDone?'btn-danger':'btn-secondary'}" onclick="teacherReportActivity('${a.id}',false)"><i class="ic ic-x"></i> لم يُنفّذ</button>
              <button class="btn btn-secondary" style="margin-right:auto" onclick="printAssignedActivity('${a.id}')" title="طباعة ورقة النشاط"><i class="ic ic-printer"></i> طباعة النشاط</button>
            </div>
            ${r?`<div style="font-size:11px;color:#94a3b8;margin-top:8px">آخر تحديث: ${formatRelTime(r.at)}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
},

// ===== متابعة تنفيذ الأنشطة (للإدارة) =====
_activityTracking(catColors){
  const bid=Auth.branchId();
  let assigns=DB.activityAssignments();
  if(bid) assigns=assigns.filter(a=>a.scope==='all'||a.branchId===bid);
  assigns=assigns.sort((a,b)=>(b.sentAt||'').localeCompare(a.sentAt||''));
  const reports=DB.activityReports();
  const teachers=DB.users().filter(u=>u.role==='teacher');
  const targetTeachers=(a)=>{
    if(a.scope==='teacher') return teachers.filter(t=>t.id===a.teacherId);
    if(a.scope==='branch') return teachers.filter(t=>t.branchId===a.branchId);
    return teachers; // all
  };
  return `
  <div style="padding:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px">
      <h2 style="margin:0;font-size:20px;font-weight:800;color:#4f46e5"><i class="ic ic-chart"></i> متابعة تنفيذ الأنشطة</h2>
      <button class="btn btn-secondary" onclick="App.go('activities')">← رجوع للمكتبة</button>
    </div>
    ${assigns.length===0?`<div class="empty-state"><div class="es-icon"><i class="ic ic-chart"></i></div><p>لم تُرسل أي أنشطة للمعلمات بعد</p></div>`:
    assigns.map(a=>{
      const tt=targetTeachers(a);
      const recs=tt.map(t=>({t,r:reports.find(r=>r.assignmentId===a.id&&r.teacherId===t.id)}));
      const doneN=recs.filter(x=>x.r?.done===true).length;
      const cc=catColors[a.catKey]||'#4f46e5';
      const scopeLbl=a.scope==='all'?'كل المعلمات':a.scope==='branch'?('فرع: '+DB.branchName(a.branchId)):('معلمة: '+esc(a.teacherName||'—'));
      return `<div class="card" style="border-right:5px solid ${cc}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <div><span style="font-size:16px;font-weight:800">${esc(a.name)}</span><div style="font-size:12px;color:#64748b;margin-top:2px"><i class="ic ic-target"></i> ${esc(scopeLbl)} · أُرسل ${formatRelTime(a.sentAt)} · من ${esc(a.sentByName||'—')}</div></div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="badge badge-green"><i class="ic ic-check"></i> ${doneN}/${tt.length}</span> <button class="btn btn-danger btn-xs" onclick="deleteActivityAssignment('${a.id}')"><i class="ic ic-trash"></i> حذف الإرسال</button>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${recs.map(({t,r})=>{
            const st=r?.done===true?['#dcfce7','#15803d','<i class="ic ic-check"></i> نُفّذ']:r?.done===false?['#fee2e2','#b91c1c','<i class="ic ic-x"></i> لم يُنفّذ']:['#f1f5f9','#64748b','<i class="ic ic-hourglass"></i> بانتظار'];
            return `<div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;min-width:150px;max-width:190px;background:#fff">
              <div style="display:flex;align-items:center;gap:6px"><span style="background:${st[0]};color:${st[1]};font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px">${st[2]}</span><span style="font-size:12px;font-weight:600">${esc(t.name)}</span></div>
              ${r?.note?`<div style="font-size:11px;color:#64748b;margin-top:5px"><i class="ic ic-edit"></i> ${esc(r.note)}</div>`:''}
              ${r?.photo?`<a href="${r.photo}" target="_blank" title="اضغطي لعرض الصورة كاملة"><img src="${r.photo}" style="width:100%;max-height:110px;object-fit:cover;border-radius:6px;margin-top:6px;border:1px solid #e2e8f0"></a>`:''}
              ${r?.at?`<div style="font-size:9px;color:#cbd5e1;margin-top:4px">${formatRelTime(r.at)}</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
},

// ---------- ACCOUNTING (super admin only) ----------
accounting(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const subs=DB.subscriptions();
  const children=DB.children();
  const branches=DB.branches();
  const filterBranch=App.params.accBranch||'all';
  const filterPeriod=App.params.accPeriod||'all';
  const filterPay=App.params.accPay||'all';
  const dateFrom=App.params.accFrom||'';
  const dateTo=App.params.accTo||'';
  const searchQ=(App.params.accQ||'').toLowerCase();

  let filtered=subs;
  if(filterBranch!=='all') filtered=filtered.filter(s=>s.branchId===filterBranch);
  if(filterPeriod!=='all') filtered=filtered.filter(s=>s.period===filterPeriod);
  // فلتر الفترة الزمنية: يطابق إذا تقاطع نطاق الاشتراك مع النطاق المحدد
  if(dateFrom) filtered=filtered.filter(s=>(s.endDate||'')>=dateFrom);
  if(dateTo)   filtered=filtered.filter(s=>(s.startDate||'')<=dateTo);
  // فلتر حالة الدفع — استخدم الدالة المشتركة
  if(filterPay==='paid')      filtered=filtered.filter(s=>Views._paymentState(s)==='paid');
  else if(filterPay==='pending')   filtered=filtered.filter(s=>Views._paymentState(s)==='pending');
  else if(filterPay==='defaulter') filtered=filtered.filter(s=>Views._paymentState(s)==='defaulter');
  else if(filterPay==='deferred')  filtered=filtered.filter(s=>s.paymentStatus==='deferred');
  if(searchQ) filtered=filtered.filter(s=>{const c=children.find(x=>x.id===s.childId);return c&&(c.name.toLowerCase().includes(searchQ)||c.parentName.toLowerCase().includes(searchQ));});
  filtered.sort((a,b)=>(b.createdAt||b.startDate||'').localeCompare(a.createdAt||a.startDate||''));

  // إحصائيات الحالات الثلاث (تُحسَب من جميع الاشتراكات لا المفلترة)
  const pendingList=subs.filter(s=>Views._paymentState(s)==='pending');
  const defaulterList=subs.filter(s=>Views._paymentState(s)==='defaulter');
  const deferredList=subs.filter(s=>s.paymentStatus==='deferred');
  const totalRevenue=subs.reduce((a,s)=>a+s.paidAmount,0);
  const totalPending=subs.reduce((a,s)=>a+Math.max(0,(s.price||0)-(s.paidAmount||0)),0);
  const totalInvoices=subs.length;
  const defaulterAmount=defaulterList.reduce((a,s)=>a+(s.price-s.paidAmount),0);
  const pendingAmount=pendingList.reduce((a,s)=>a+(s.price-s.paidAmount),0);

  // تقرير دعم قُرّة (يحترم فلتر الفرع/التاريخ)
  let qSubs=subs.filter(s=>s.paymentMethod==='qurrah');
  if(filterBranch!=='all') qSubs=qSubs.filter(s=>s.branchId===filterBranch);
  if(dateFrom) qSubs=qSubs.filter(s=>(s.endDate||'')>=dateFrom);
  if(dateTo)   qSubs=qSubs.filter(s=>(s.startDate||'')<=dateTo);
  qSubs=[...qSubs].sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  const qKids=new Set(qSubs.map(s=>s.childId)).size;
  const qTotal=qSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);
  const qDue=qSubs.reduce((a,s)=>a+Math.max(0,(+s.price||0)-(+s.paidAmount||0)),0);

  return `
  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-val">${totalRevenue.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-money"></i> إجمالي المحصّل (ر.س)</div></div>
    <div class="stat-card red"><div class="stat-val">${defaulterAmount.toLocaleString()}</div><div class="stat-lbl"><span class="dot dot-red"></span> متعثرون ${infoIcon('defaulter')} (${defaulterList.length}) — مستحق فوراً</div></div>
    <div class="stat-card yellow"><div class="stat-val">${pendingAmount.toLocaleString()}</div><div class="stat-lbl"><span class="dot dot-amber"></span> معلّقون ${infoIcon('pending')} (${pendingList.length}) — متابعة دورية</div></div>
    <div class="stat-card blue"><div class="stat-val">${totalInvoices}</div><div class="stat-lbl"><i class="ic ic-receipt"></i> إجمالي الفواتير</div></div>
  </div>
  <div class="card" style="border-right:5px solid #9333ea">
    <div class="card-title" style="color:#7c3aed"><span class="dot dot-purple"></span> تقرير دعم قُرّة${filterBranch!=='all'?` — ${esc(DB.branchName(filterBranch))}`:''}</div>
    <div class="stats-grid" style="margin-bottom:${qSubs.length?'12px':'0'}">
      <div class="stat-card" style="border-color:#9333ea"><div class="stat-val" style="color:#9333ea">${qKids}</div><div class="stat-lbl"><i class="ic ic-child"></i> أطفال مدعومون بقُرّة</div></div>
      <div class="stat-card" style="border-color:#9333ea"><div class="stat-val" style="color:#9333ea">${qTotal.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-money"></i> إجمالي المحصّل من قُرّة (ر.س)</div></div>
      <div class="stat-card yellow"><div class="stat-val">${qDue.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-hourglass"></i> مبالغ قُرّة المتبقية (ر.س)</div></div>
      <div class="stat-card blue"><div class="stat-val">${qSubs.length}</div><div class="stat-lbl"><i class="ic ic-receipt"></i> اشتراكات مدعومة</div></div>
    </div>
    ${qSubs.length?`<details><summary style="cursor:pointer;font-weight:700;color:#7c3aed;font-size:13px;padding:6px 0"><i class="ic ic-clipboard"></i> تفاصيل الأطفال المدعومين (${qSubs.length}) — اضغطي للعرض</summary>
      <div class="table-wrap" style="margin-top:10px"><table>
        <thead><tr><th>الطفل</th><th>ولي الأمر</th><th>الفرع</th><th>من</th><th>إلى</th><th>المبلغ</th><th>المتبقي</th></tr></thead>
        <tbody>${qSubs.map(s=>{const c=children.find(x=>x.id===s.childId);const rem=(+s.price||0)-(+s.paidAmount||0);return `<tr>
          <td><strong>${esc(c?.name||'—')}</strong></td>
          <td style="font-size:12px">${esc(c?.parentName||'—')}</td>
          <td><span class="badge badge-blue" style="font-size:10px">${DB.branchName(s.branchId)}</span></td>
          <td style="font-size:12px">${formatDate(s.startDate)}</td>
          <td style="font-size:12px">${formatDate(s.endDate)}</td>
          <td style="font-weight:700;color:#7c3aed">${(+s.paidAmount||0).toLocaleString()}</td>
          <td style="color:${rem>0?'#ef4444':'#10b981'}">${rem.toLocaleString()}</td>
        </tr>`;}).join('')}</tbody>
      </table></div>
      <button class="btn btn-secondary btn-sm no-print" style="margin-top:10px" onclick="window.print()"><i class="ic ic-printer"></i> طباعة تقرير قُرّة</button>
    </details>`:'<div style="color:#94a3b8;font-size:13px;padding:6px 0">لا توجد اشتراكات مدفوعة عبر قُرّة بهذه المعايير بعد</div>'}
  </div>
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span style="font-size:13px;font-weight:700;color:#475569;align-self:center;margin-left:6px"><i class="ic ic-money"></i> الحالة:</span> <span class="chip ${filterPay==='all'?'active':''}"        onclick="accSet('accPay','all')">الكل (${subs.length})</span> <span class="chip ${filterPay==='defaulter'?'active':''}"  onclick="accSet('accPay','defaulter')" style="${filterPay==='defaulter'?'background:#ef4444;color:#fff':'background:#fee2e2;color:#991b1b'}"><span class="dot dot-red"></span> متعثر (${defaulterList.length})</span>${infoIcon('defaulter')}
      <span class="chip ${filterPay==='pending'?'active':''}"    onclick="accSet('accPay','pending')" style="${filterPay==='pending'?'background:#f59e0b;color:#fff':'background:#fef3c7;color:#92400e'}"><span class="dot dot-amber"></span> معلّق (${pendingList.length})</span>${infoIcon('pending')}
      <span class="chip ${filterPay==='deferred'?'active':''}"   onclick="accSet('accPay','deferred')"><span class="dot dot-amber"></span> مؤجل (${deferredList.length})</span>${infoIcon('deferred')}
      <span class="chip ${filterPay==='paid'?'active':''}"       onclick="accSet('accPay','paid')"><i class="ic ic-check"></i> مدفوع</span> </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;flex:1;min-width:160px">
        <label style="font-size:12px"><i class="ic ic-search"></i> بحث</label>
        <input id="search-accounting" class="input" placeholder="اسم الطفل أو ولي الأمر..." value="${esc(App.params.accQ||'')}" oninput="App.liveSearch('accounting',{...App.params,accQ:this.value},this)">
      </div>
      <div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px"><i class="ic ic-calendar"></i> من تاريخ</label>
        <input class="input" type="date" value="${dateFrom}" onchange="accSet('accFrom',this.value)">
      </div>
      <div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px"><i class="ic ic-calendar"></i> إلى تاريخ</label>
        <input class="input" type="date" value="${dateTo}" onchange="accSet('accTo',this.value)">
      </div>
      <div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label>
        <select class="input" onchange="accSet('accBranch',this.value)">
          <option value="all">الكل</option>
          ${branches.map(b=>`<option value="${b.id}" ${filterBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>
      <div class="input-group" style="margin:0;min-width:120px">
        <label style="font-size:12px"><i class="ic ic-clock"></i> الفترة</label>
        <select class="input" onchange="accSet('accPeriod',this.value)">
          <option value="all" ${filterPeriod==='all'?'selected':''}>الكل</option>
          ${periodOptions(filterPeriod)}
        </select>
      </div>
      ${(dateFrom||dateTo||searchQ||filterBranch!=='all'||filterPeriod!=='all'||filterPay!=='all')?`<button class="btn btn-secondary btn-sm" onclick="App.go('accounting')">✕ مسح الفلاتر</button>`:''}
      <button class="btn btn-sm" style="background:#1d4ed8;color:#fff" onclick="App.go('monthlyClose')"><i class="ic ic-lock"></i> الإقفال الشهري</button>
      <button class="btn btn-secondary btn-sm" onclick="window.print()"><i class="ic ic-printer"></i> طباعة</button>
      <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('acc-table','فواتير')"><i class="ic ic-chart"></i> CSV</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><i class="ic ic-receipt"></i> فواتير الاشتراكات (${filtered.length})</div>
    <div class="table-wrap"><table id="acc-table">
      <thead><tr><th>رقم الفاتورة</th><th>الطفل</th><th>ولي الأمر</th><th>الفرع</th><th>الفترة</th><th>نوع الاشتراك</th><th>من</th><th>إلى</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>طريقة الدفع</th><th>الحالة</th><th>فاتورة</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(s=>{
          const c=children.find(x=>x.id===s.childId);
          const remaining=s.price-s.paidAmount;
          const ps=Views._paymentState(s);
          return `<tr style="${ps==='defaulter'?'background:#fef2f2':''}">

// ===== الإقفال المحاسبي الشهري =====
// يحسب أرقام شهر معيّن (إيرادات الاشتراكات + المبيعات − المصروفات − الرواتب) موزّعة على الفروع
_monthFinance(monthKey){
  const subs=DB.subscriptions().filter(s=>(s.createdAt||s.startDate||'').startsWith(monthKey));
  const sales=DB.sales().filter(s=>(s.date||'').startsWith(monthKey));
  const exps=DB.expenses().filter(e=>(e.date||'').startsWith(monthKey));
  const pays=(DB.hrPayroll?DB.hrPayroll():[]).filter(p=>p.month===monthKey);
  const subRevenue=subs.reduce((a,s)=>a+(+s.paidAmount||0),0);
  const salesRevenue=sales.reduce((a,s)=>a+(+s.price||0),0);
  const expenses=exps.reduce((a,e)=>a+(+e.amount||0),0);
  const payroll=pays.reduce((a,p)=>a+(+p.netSalary||0),0);
  const income=subRevenue+salesRevenue;
  const net=income-expenses-payroll;
  const byBranch=DB.branches().map(b=>{
    const bi=subs.filter(s=>s.branchId===b.id).reduce((a,s)=>a+(+s.paidAmount||0),0)
            +sales.filter(s=>s.branchId===b.id).reduce((a,s)=>a+(+s.price||0),0);
    const bx=exps.filter(e=>e.branchId===b.id).reduce((a,e)=>a+(+e.amount||0),0);
    const bp=pays.filter(p=>{const emp=(DB.hrEmployees?DB.hrEmployees():[]).find(e=>e.id===p.employeeId);return emp&&emp.branchId===b.id;}).reduce((a,p)=>a+(+p.netSalary||0),0);
    return {branchId:b.id,name:b.name,income:bi,expenses:bx,payroll:bp,net:bi-bx-bp};
  });
  return {month:monthKey,subRevenue,salesRevenue,expenses,payroll,income,net,byBranch,
    counts:{subs:subs.length,sales:sales.length,expenses:exps.length,pays:pays.length}};
},
_monthLabel(m){
  if(!m) return '';
  const [y,mo]=m.split('-');
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${String(+mo).padStart(2,'0')}/${y} (${names[(+mo||1)-1]})`;
},
