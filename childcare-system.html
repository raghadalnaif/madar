expenses(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const isSA=Auth.isSuperAdmin();
  const bid=Auth.branchId();
  const exps=DB.expenses();
  const branches=DB.branches();
  const fMonth=App.params.expMonth||T0.slice(0,7); // YYYY-MM
  const fCat=App.params.expCat||'all';
  const fBranch=bid||(App.params.expBranch||'all');
  const catLbl={salary:'<i class="ic ic-user"></i><i class="ic ic-school"></i> رواتب',rent:'<i class="ic ic-building"></i> إيجار',utilities:'<i class="ic ic-bulb"></i> فواتير (كهرباء/ماء/نت)',supplies:'<i class="ic ic-box"></i> مستلزمات',maintenance:'<i class="ic ic-tool"></i> صيانة',transport:'<i class="ic ic-truck"></i> مواصلات',marketing:'<i class="ic ic-megaphone"></i> تسويق',food:'<i class="ic ic-utensils"></i> مأكولات',other:'<i class="ic ic-clipboard"></i> أخرى'};
  let filtered=exps;
  if(fMonth) filtered=filtered.filter(e=>(e.date||'').startsWith(fMonth));
  if(fCat!=='all') filtered=filtered.filter(e=>e.category===fCat);
  if(fBranch!=='all') filtered=filtered.filter(e=>e.branchId===fBranch);
  filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  // إحصائيات الشهر
  const monthTotal=filtered.reduce((a,e)=>a+(+e.amount||0),0);
  const byCat={};
  filtered.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+(+e.amount||0);});
  const topCat=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  // إيرادات نفس الشهر (الدفعات المستلمة) — مع فلترة الفرع إن وجد
  const monthSubs=DB.subscriptions().filter(s=>(s.createdAt||s.startDate||'').startsWith(fMonth)&&(fBranch==='all'||s.branchId===fBranch));
  const monthRevenue=monthSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);

  const totalIncome=monthRevenue+monthSales;

  return `

        </select>
      </div>
      ${!bid?`<div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label>
        <select class="input" onchange="expSet('expBranch',this.value)">
          <option value="all">الكل</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>`:`<div class="input-group" style="margin:0"><label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label><div class="input" style="background:#f8fafc;color:#1d4ed8;font-weight:700">${esc(DB.branchName(bid))}</div></div>`}
      <button class="btn btn-primary btn-sm" onclick="Modals.addExpense()">+ تسجيل مصروف</button>
      <button class="btn btn-secondary btn-sm" onclick="openImport('finance')"><i class="ic ic-upload"></i> استيراد Excel</button>

      ${(fCat!=='all'||(!bid&&fBranch!=='all'))?`<button class="btn btn-secondary btn-sm" onclick="App.go('expenses',{expMonth:'${fMonth}'})">✕ مسح</button>`:''}

      <tbody>
        ${filtered.length?filtered.map(e=>`<tr>
          <td style="font-size:13px">${formatDate(e.date)}</td>
          <td>${catLbl[e.category]||e.category||'—'}</td>
          <td>${esc(e.description||'—')}</td>

      </tbody>

  </div>`;

// ---------- الوثائق الحكومية (سجل تجاري، دفاع مدني...) ----------

  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const branches=DB.branches();
  const docs=DB.govDocs();
  const fBranch=App.params.gdBranch||'all';

  if(fBranch!=='all') filtered=filtered.filter(d=>d.branchId===fBranch);
  if(fStatus!=='all') filtered=filtered.filter(d=>{
    const st=DB.govDocStatus(d);
    if(fStatus==='expired') return st==='expired';
    if(fStatus==='soon') return st==='soon7'||st==='soon30';
    if(fStatus==='active') return st==='active';
    return true;
  });
  filtered=[...filtered].sort((a,b)=>(a.expiryDate||'').localeCompare(b.expiryDate||''));

  const expiredCnt=docs.filter(d=>DB.govDocStatus(d)==='expired').length;
  const soonCnt=docs.filter(d=>['soon7','soon30'].includes(DB.govDocStatus(d))).length;
  const activeCnt=docs.filter(d=>DB.govDocStatus(d)==='active').length;

  const statusBadge=(st)=>{
    const map={expired:['badge-red','<span class="dot dot-red"></span> منتهية'],soon7:['badge-red','<span class="dot dot-amber"></span> تنتهي خلال 7 أيام'],soon30:['badge-yellow','<span class="dot dot-amber"></span> تنتهي خلال 30 يوم'],active:['badge-green','<span class="dot dot-green"></span> سارية'],none:['badge-gray','—']};
    const [c,l]=map[st]||map.none;
    return `<span class="badge ${c}">${l}</span>`;
  };
  const attachCell=(d)=>{
    if(!d.fileData) return '<span style="color:#94a3b8">—</span>';
    if((d.fileType||'').startsWith('image/')) return `<a href="${d.fileData}" target="_blank"><img src="${d.fileData}" style="max-width:48px;max-height:48px;border-radius:6px;border:1px solid #e2e8f0;object-fit:cover"></a>`;
    return `<a href="${d.fileData}" target="_blank" download="${esc(d.fileName||'document')}" class="btn btn-secondary btn-xs"><i class="ic ic-file"></i> فتح</a>`;
  };

  return `
  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-val">${docs.length}</div><div class="stat-lbl"><i class="ic ic-bank"></i> إجمالي الوثائق</div></div>
    <div class="stat-card red"><div class="stat-val">${expiredCnt}</div><div class="stat-lbl"><span class="dot dot-red"></span> منتهية</div></div>
    <div class="stat-card yellow"><div class="stat-val">${soonCnt}</div><div class="stat-lbl"><span class="dot dot-amber"></span> تنتهي قريباً (≤30 يوم)</div></div>
    <div class="stat-card green"><div class="stat-val">${activeCnt}</div><div class="stat-lbl"><span class="dot dot-green"></span> سارية</div></div>
  </div>
  <div class="print-cover">
    <h1><i class="ic ic-bank"></i> الوثائق الحكومية</h1>
    <p>${fBranch==='all'?'كل الفروع':esc(DB.branchName(fBranch))} · تاريخ الطباعة: ${formatDate(T0)}</p>
  </div>
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label>
        <select class="input" onchange="gdSet('gdBranch',this.value)">
          <option value="all" ${fBranch==='all'?'selected':''}>الكل</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px"><i class="ic ic-pin"></i> الحالة</label>
        <select class="input" onchange="gdSet('gdStatus',this.value)">
          <option value="all" ${fStatus==='all'?'selected':''}>الكل</option>
          <option value="expired" ${fStatus==='expired'?'selected':''}>منتهية</option>
          <option value="soon" ${fStatus==='soon'?'selected':''}>تنتهي قريباً</option>
          <option value="active" ${fStatus==='active'?'selected':''}>سارية</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="Modals.addGovDoc()">+ إضافة وثيقة</button>
      <button class="btn btn-secondary btn-sm" onclick="printAllGovDocs()"><i class="ic ic-printer"></i> طباعة الكل / PDF</button>
      <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('gd-table','الوثائق-الحكومية')"><i class="ic ic-chart"></i> CSV</button>
      ${(fBranch!=='all'||fStatus!=='all')?`<button class="btn btn-secondary btn-sm" onclick="App.go('govDocs')">✕ مسح</button>`:''}
    </div>
  </div>
  <div class="card">
    <div class="card-title"><i class="ic ic-bank"></i> الوثائق (${filtered.length})</div>
    <div class="table-wrap"><table id="gd-table">
      <thead><tr><th>الفرع</th><th>نوع الوثيقة</th><th>رقم الوثيقة</th><th>تاريخ الانتهاء</th><th>الحالة</th><th>المرفق</th><th>أضافها</th><th class="no-print">إجراءات</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(d=>`<tr>
          <td><span class="badge badge-blue" style="font-size:10px"><i class="ic ic-building"></i> ${esc(DB.branchName(d.branchId))}</span></td>
          <td>${esc(d.type==='other'?(d.customType||'أخرى'):Views._govDocTypeLabel(d.type))}</td>
          <td style="font-size:13px">${esc(d.docNumber||'—')}</td>
          <td style="font-size:13px">${formatDate(d.expiryDate)}</td>
          <td>${statusBadge(DB.govDocStatus(d))}</td>
          <td>${attachCell(d)}</td>
          <td style="font-size:12px;color:#64748b">${esc(d.addedBy||'—')}</td>
          <td class="no-print">
            <button class="btn btn-secondary btn-xs" onclick="Modals.editGovDoc('${d.id}')"><i class="ic ic-edit"></i></button>
            <button class="btn btn-danger btn-xs" onclick="deleteGovDoc('${d.id}')"><i class="ic ic-trash"></i></button>
          </td>
        </tr>`).join(''):`<tr><td colspan="8"><div class="empty-state"><div class="es-icon"><i class="ic ic-bank"></i></div><p>لا توجد وثائق مسجّلة${fBranch!=='all'||fStatus!=='all'?' بهذه الفلاتر':''}</p></div></td></tr>`}

},

// ---------- DAILY CASH CLOSING ----------
cashClosing(){
  if(!Auth.isSchoolAdmin()&&!Auth.isSuperAdmin()) return Views._forbidden();
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const fDate=App.params.ccDate||T0;
  const branches=DB.branches();
  const fBranch=Auth.isSuperAdmin()?(App.params.ccBranch||(bid||'all')):bid;

  // الدفعات المسجلة لهذا اليوم
  const allPayments=DB.payments().filter(p=>(p.date||'').startsWith(fDate));
  const allSales=DB.sales().filter(s=>(s.date||'').startsWith(fDate));
  // فلتر بالفرع
  const childInBranch=(childId)=>{const c=DB.children().find(x=>x.id===childId);return c&&(fBranch==='all'||c.branchId===fBranch);};
  const payments=allPayments.filter(p=>fBranch==='all'?true:childInBranch(p.childId));
  const sales=allSales.filter(s=>fBranch==='all'?true:(!s.branchId||s.branchId===fBranch));

  const byPM={cash:0,mada:0,transfer:0,qurrah:0};
  payments.forEach(p=>{const pm=p.paymentMethod||'cash';byPM[pm]=(byPM[pm]||0)+(+p.amount||0);});
  sales.forEach(s=>{const pm=s.paymentMethod||'cash';byPM[pm]=(byPM[pm]||0)+(+s.price||0);});
  const total=byPM.cash+byPM.mada+byPM.transfer+byPM.qurrah;

  // السجل السابق لهذا اليوم/الفرع (إن وجد)
  const closings=DB.cashClosings();
  const existing=closings.find(c=>c.date===fDate&&c.branchId===(fBranch==='all'?'all':fBranch));

  // سجل آخر 10 تقفيلات
  const recent=closings.filter(c=>!bid||c.branchId===bid||c.branchId==='all').slice(0,10);

  return `
  <div class="card no-print" style="padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff">
    <div style="font-size:18px;font-weight:800"><i class="ic ic-money"></i> تقفيل الصندوق اليومي</div>
    <p style="opacity:.9;font-size:13px;margin-top:4px">طابق الكاش الفعلي بالدرج مع المسجّل في النظام. أي فرق سيُسجّل للمحاسب.</p>
  </div>

  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px"><i class="ic ic-calendar"></i> التاريخ</label>
        <input class="input" type="date" value="${fDate}" max="${T0}" onchange="App.go('cashClosing',{...App.params,ccDate:this.value})">
      </div>
      ${Auth.isSuperAdmin()?`<div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label>
        <select class="input" onchange="App.go('cashClosing',{...App.params,ccBranch:this.value})">
          <option value="all" ${fBranch==='all'?'selected':''}>كل الفروع</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>`:''}
    </div>
  </div>

  ${existing?`<div class="alert-box alert-green" style="margin-bottom:16px">
    <div>
      <strong><i class="ic ic-check"></i> تم تقفيل ${formatDate(fDate)}</strong><br>
      <span style="font-size:12px">بواسطة ${esc(existing.closedBy||'—')} في ${new Date(existing.at).toLocaleString('ar-SA')} — الفعلي: ${(+existing.actualCash||0).toLocaleString()} ر.س | الفرق: <strong style="color:${existing.diff===0?'#10b981':existing.diff>0?'#3b82f6':'#ef4444'}">${existing.diff>=0?'+':''}${(+existing.diff||0).toLocaleString()} ر.س</strong>
      ${existing.notes?'<br><em>ملاحظة: '+esc(existing.notes)+'</em>':''}
    </div>
  </div>`:''}

  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-val">${byPM.cash.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-money"></i> كاش</div></div>
    <div class="stat-card blue"><div class="stat-val">${byPM.mada.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-card"></i> مدى/شبكة</div></div>
    <div class="stat-card yellow"><div class="stat-val">${byPM.transfer.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-bank"></i> حوالة</div></div>
    <div class="stat-card" style="border-color:#9333ea"><div class="stat-val" style="color:#9333ea">${byPM.qurrah.toLocaleString()}</div><div class="stat-lbl"><span class="dot dot-purple"></span> قُرّة (دعم)</div></div>
    <div class="stat-card red" style="border-color:#1d4ed8"><div class="stat-val" style="color:#1d4ed8">${total.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-chart"></i> إجمالي اليوم (ر.س)</div></div>
  </div>

  <div class="card">
    <div class="card-title"><i class="ic ic-edit"></i> تفاصيل اليوم — ${formatDate(fDate)}</div>
    ${(payments.length+sales.length)?`<div class="table-wrap"><table>
      <thead><tr><th>الوقت</th><th>النوع</th><th>الطفل</th><th>المبلغ</th><th>طريقة الدفع</th><th>أضافها</th></tr></thead>
      <tbody>
        ${payments.map(p=>{const c=DB.children().find(x=>x.id===p.childId);return `<tr>
          <td style="font-size:12px">دفعة اشتراك</td>
          <td><span class="badge badge-green" style="font-size:10px"><i class="ic ic-money"></i> دفعة</span></td>
          <td>${esc(c?.name||'—')}</td>
          <td style="color:#10b981;font-weight:700">${(+p.amount||0).toLocaleString()} ر.س</td>
          <td style="font-size:12px">${({cash:'<i class="ic ic-money"></i> كاش',mada:'<i class="ic ic-card"></i> مدى',transfer:'<i class="ic ic-bank"></i> حوالة',qurrah:'<span class="dot dot-purple"></span> قُرّة'})[p.paymentMethod]||p.paymentMethod}</td>
          <td style="font-size:12px;color:#64748b">${esc(p.addedBy||'—')}</td>
        </tr>`;}).join('')}
        ${sales.map(s=>`<tr>
          <td style="font-size:12px">مبيعات</td>
          <td><span class="badge badge-blue" style="font-size:10px"><i class="ic ic-bag"></i> بيع</span></td>
          <td>${esc(s.childName||DB.childName(s.childId)||'—')}</td>
          <td style="color:#3b82f6;font-weight:700">${(+s.price||0).toLocaleString()} ر.س</td>
          <td style="font-size:12px">${({cash:'<i class="ic ic-money"></i> كاش',mada:'<i class="ic ic-card"></i> مدى',transfer:'<i class="ic ic-bank"></i> حوالة',qurrah:'<span class="dot dot-purple"></span> قُرّة'})[s.paymentMethod]||s.paymentMethod}</td>
          <td style="font-size:12px;color:#64748b">${esc(s.addedBy||'—')}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`:`<div class="empty-state"><div class="es-icon"><i class="ic ic-inbox"></i></div><p>لا توجد دفعات أو مبيعات مسجّلة لهذا اليوم</p></div>`}
  </div>

  ${total>0&&!existing?`<div class="card" style="border-right:6px solid #1d4ed8">
    <div class="card-title"><i class="ic ic-lock"></i> إقفال اليوم</div>
    <p style="font-size:13px;color:#64748b;margin-bottom:14px">عدّ الكاش الفعلي بالدرج وأدخله أدناه. سيُسجَّل أي فرق للمحاسب.</p>
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1e40af">
      <i class="ic ic-money"></i> الكاش المتوقع حسب النظام: <strong>${byPM.cash.toLocaleString()} ر.س</strong>
    </div>
    <div class="input-group">
      <label><i class="ic ic-money"></i> الكاش الفعلي في الدرج (ر.س)</label>
      <input class="input" id="cc-actual" type="number" value="${byPM.cash}" min="0" oninput="document.getElementById('cc-diff').textContent=((+this.value||0)-${byPM.cash}).toLocaleString();const d=(+this.value||0)-${byPM.cash};document.getElementById('cc-diff-wrap').style.color=d===0?'#10b981':d>0?'#3b82f6':'#ef4444'">
    </div>
    <div class="input-group" id="cc-diff-wrap" style="color:#10b981;font-weight:700">
      الفرق: <span id="cc-diff">0</span> ر.س
    </div>
    <div class="input-group">
      <label><i class="ic ic-edit"></i> ملاحظات (اختياري)</label>
      <textarea class="input" id="cc-notes" rows="2" placeholder="مثال: نقص 50 ر.س لشراء بطارية ميزان..." style="resize:vertical"></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveCashClosing('${fDate}','${fBranch}',${byPM.cash},${byPM.mada},${byPM.transfer})"><i class="ic ic-lock"></i> تأكيد التقفيل</button>
  </div>`:''}

  <div class="card">
    <div class="card-title"><i class="ic ic-clipboard"></i> سجل التقفيلات السابقة</div>
    ${recent.length?`<div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>الفرع</th><th>المتوقع</th><th>الفعلي</th><th>الفرق</th><th>بواسطة</th><th>ملاحظات</th></tr></thead>
      <tbody>${recent.map(c=>`<tr>
        <td style="font-weight:600">${formatDate(c.date)}</td>
        <td style="font-size:12px">${c.branchId==='all'?'كل الفروع':DB.branchName(c.branchId)}</td>
        <td>${(+c.expectedCash||0).toLocaleString()} ر.س</td>
        <td>${(+c.actualCash||0).toLocaleString()} ر.س</td>
        <td style="color:${c.diff===0?'#10b981':c.diff>0?'#3b82f6':'#ef4444'};font-weight:700">${c.diff>=0?'+':''}${(+c.diff||0).toLocaleString()} ر.س</td>
        <td style="font-size:12px;color:#64748b">${esc(c.closedBy||'—')}</td>
        <td style="font-size:12px;color:#64748b">${esc(c.notes||'—')}</td>
      </tr>`).join('')}</tbody>
    </table></div>`:`<div class="empty-state"><div class="es-icon"><i class="ic ic-folder"></i></div><p>لا توجد تقفيلات سابقة</p></div>`}
  </div>`;
},

// ---------- CHILD STATEMENT (super admin only) ----------
statement(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const childId=App.params.childId;
  const children=DB.children();
  if(!childId){
    return `<div class="card">
      <div class="card-title"><i class="ic ic-file"></i> كشف حساب طفل</div>
      <p style="color:#64748b;margin-bottom:14px">اختاري الطفل لعرض كشف حسابه الكامل (الاشتراكات، الدفعات، المبيعات، الحضور).</p>
      <input class="input" placeholder="ابحث باسم الطفل..." oninput="statementSearch(this.value)">
      <div id="stm-results" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
        ${children.slice(0,12).map(c=>`<button class="btn btn-secondary btn-sm" onclick="App.go('statement',{childId:'${c.id}'})">${esc(c.name)}</button>`).join('')}
      </div>
    </div>`;
  }
  const c=children.find(x=>x.id===childId);
  if(!c) return `<div class="card"><p>الطفل غير موجود.</p><button class="btn btn-primary" onclick="App.go('statement')">رجوع</button></div>`;
  const subs=DB.subscriptions().filter(s=>s.childId===childId).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  const sales=DB.sales().filter(s=>s.childId===childId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const att=DB.attendance().filter(a=>a.childId===childId);
  const totalCharged=subs.reduce((a,s)=>a+(+s.price||0),0)+sales.reduce((a,s)=>a+(+s.price||0),0);
  const totalPaid=subs.reduce((a,s)=>a+(+s.paidAmount||0),0)+sales.reduce((a,s)=>a+(+s.price||0),0); // sales تدفع كاملة
  const balance=totalCharged-totalPaid;
  const presentDays=att.filter(a=>a.status==='present').length;
  const absentDays=att.filter(a=>a.status==='absent').length;
  const lateDays=att.filter(a=>a.status==='late').length;

  return `
  <div class="card no-print" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" onclick="App.go('statement')">← رجوع للبحث</button>
    <button class="btn btn-secondary btn-sm" onclick="window.print()"><i class="ic ic-printer"></i> طباعة</button>
    <button class="btn btn-primary btn-sm" onclick="printChildStatement('${childId}')"><i class="ic ic-file"></i> تصدير PDF</button>
    <div style="flex:1"></div>
    <span style="font-size:13px;color:#64748b">تاريخ الطباعة: ${formatDate(T0)}</span> </div>

  <div class="card" style="background:linear-gradient(135deg,#1d4ed8 0%,#172554 100%);color:#fff;border:0">
    <h2 style="margin:0 0 6px;font-size:22px;font-weight:800"><i class="ic ic-file"></i> كشف حساب — ${esc(c.name)}</h2>
    <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.95">
      <span><i class="ic ic-user"></i> ولي الأمر: <strong>${esc(c.parentName||'')}</strong></span> <span><i class="ic ic-phone"></i> ${esc(c.parentPhone||'')}</span> <span><i class="ic ic-building"></i> ${DB.branchName(c.branchId)}</span> <span>${periodTag(c.period)}</span> <span><i class="ic ic-calendar"></i> منذ: ${formatDate(c.joinDate)}</span> </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-val">${totalCharged.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-clipboard"></i> إجمالي المستحق (ر.س)</div></div>
    <div class="stat-card green"><div class="stat-val">${totalPaid.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-check"></i> إجمالي المدفوع (ر.س)</div></div>
    <div class="stat-card ${balance>0?'red':'green'}"><div class="stat-val">${balance.toLocaleString()}</div><div class="stat-lbl">${balance>0?'<i class="ic ic-alert"></i> المتبقي':'<i class="ic ic-check"></i> الرصيد'} (ر.س)</div></div>
    <div class="stat-card yellow"><div class="stat-val">${presentDays}</div><div class="stat-lbl"><i class="ic ic-calendar"></i> أيام حضور (غياب: ${absentDays}، تأخر: ${lateDays})</div></div>
  </div>

  <div class="card">
    <div class="card-title"><i class="ic ic-clipboard"></i> الاشتراكات (${subs.length})</div>
    ${subs.length?`<div class="table-wrap"><table>
      <thead><tr><th>الفاتورة</th><th>النوع</th><th>من</th><th>إلى</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th></tr></thead>
      <tbody>${subs.map(s=>{
        const r=s.price-s.paidAmount;
        const ps=Views._paymentState(s);
        return `<tr>
          <td style="font-size:12px;font-weight:700;color:#1d4ed8">${esc(s.invoiceNo||'—')}</td>
          <td>${planName(s.type)}</td>
          <td style="font-size:12px">${formatDate(s.startDate)}</td>
          <td style="font-size:12px">${formatDate(s.endDate)}</td>
          <td style="font-weight:700">${s.price} ر.س</td>
          <td style="color:#10b981">${s.paidAmount} ر.س</td>
          <td style="color:${r>0?'#ef4444':'#10b981'};font-weight:700">${r} ر.س</td>
          <td>${ps==='defaulter'?Views._defaulterBadge():ps==='pending'?Views._pendingBadge():Views._payBadge(s)}</td>
        </tr>`;}).join('')}</tbody>
    </table></div>`:`<p style="color:#94a3b8">لا توجد اشتراكات</p>`}
  </div>

  ${sales.length?`<div class="card">
    <div class="card-title"><i class="ic ic-bag"></i> مبيعات إضافية (${sales.length})</div>
    <div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>المنتج</th><th>السعر</th><th>طريقة الدفع</th></tr></thead>
      <tbody>${sales.map(s=>{
        const items={exit_card:'بطاقة خروج',uniform:'الزي الرسمي',other:s.itemName||'أخرى'};
        return `<tr>
          <td>${formatDate(s.date)}</td>
          <td>${esc(items[s.itemType]||s.itemName||'—')}</td>
          <td style="font-weight:700">${s.price} ر.س</td>
          <td>${payTag(s.paymentMethod)}</td>
        </tr>`;}).join('')}</tbody>
    </table></div>
  </div>`:''}

  ${balance>0?`<div class="alert-box alert-red no-print" style="margin-top:14px">
    <i class="ic ic-alert"></i> على ولي الأمر متبقي ${balance.toLocaleString()} ر.س — يُنصح بالتواصل للتحصيل.
    ${c.parentPhone?`<a href="https://wa.me/${c.parentPhone.replace(/^\+?/,'').replace(/^0/,'966')}?text=${encodeURIComponent('السلام عليكم '+(c.parentName||'')+'، نذكّركم بمتبقي '+(balance)+' ر.س على اشتراك '+(c.name||'')+'. شكراً لتعاونكم.')}" target="_blank" class="btn btn-success btn-sm" style="margin-right:10px"><i class="ic ic-message"></i> إرسال تذكير واتساب</a>`:''}
  </div>`:''}`;
},

// ---------- AUDIT LOG (super admin only) ----------
auditLog(){
  if(!Auth.isSuperAdmin()) return Views._forbidden();
  const alTab=App.params.alTab||'log';
  const branches=DB.branches();
  const branchColorAL=(bid)=>{
    if(!bid) return {bg:'#f1f5f9',fg:'#475569',tint:'#f8fafc'};
    const idx=branches.findIndex(b=>b.id===bid);
    const cols=[{bg:'#dbeafe',fg:'#1e40af',tint:'#eff6ff'},{bg:'#dcfce7',fg:'#166534',tint:'#f0fdf4'},{bg:'#fef3c7',fg:'#92400e',tint:'#fffbeb'},{bg:'#fce7f3',fg:'#9f1239',tint:'#fdf2f8'}];
    return cols[idx>=0?idx%cols.length:0];
  };
  const allNotifs=DB.notifications();
  const unreadN=allNotifs.filter(n=>!n.isRead).length;
  const tabBar=`<div style="display:flex;gap:8px;margin-bottom:16px">
    <button onclick="App.go('auditLog',{alTab:'log'})" style="background:${alTab==='log'?'#1d4ed8':'#fff'};color:${alTab==='log'?'#fff':'#374151'};border:2px solid ${alTab==='log'?'#1d4ed8':'#e2e8f0'};border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit"><i class="ic ic-search"></i> سجل النشاط</button>
    <button onclick="App.go('auditLog',{alTab:'notifs'})" style="background:${alTab==='notifs'?'#1d4ed8':'#fff'};color:${alTab==='notifs'?'#fff':'#374151'};border:2px solid ${alTab==='notifs'?'#1d4ed8':'#e2e8f0'};border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit"><i class="ic ic-bell"></i> التنبيهات${unreadN>0?` <span style="background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:4px">${unreadN}</span>`:''}
    </button>
  </div>`;

  if(alTab==='notifs'){
    const nfBranch=App.params.nfBranch||'all';
    const nfType=App.params.nfType||'all';
    const nfDate=App.params.nfDate||'';
    let notifs=allNotifs;
    if(nfBranch!=='all') notifs=notifs.filter(n=>n.branchId===nfBranch);
    if(nfType!=='all') notifs=notifs.filter(n=>n.type===nfType);
    if(nfDate) notifs=notifs.filter(n=>(n.createdAt||'').startsWith(nfDate));
    const typeLabel={new_child:'<i class="ic ic-child"></i> طفل جديد',new_sub:'<i class="ic ic-clipboard"></i> اشتراك جديد',first_att:'<i class="ic ic-star"></i> أول حضور'};
    
    return `${tabBar}
    <div class="card no-print" style="padding:14px;margin-bottom:16px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="input-group" style="margin:0;min-width:160px">
          <label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label>
          <select class="input" onchange="App.go('auditLog',{...App.params,nfBranch:this.value})">
            <option value="all">جميع الفروع</option>
            ${branches.map(b=>`<option value="${b.id}" ${nfBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
          </select>
        </div>
        <div class="input-group" style="margin:0;min-width:150px">
          <label style="font-size:12px"><i class="ic ic-tag"></i> النوع</label>
          <select class="input" onchange="App.go('auditLog',{...App.params,nfType:this.value})">
            <option value="all">الكل (${allNotifs.length})</option>
            <option value="new_child" ${nfType==='new_child'?'selected':''}> طفل جديد</option>
            <option value="new_sub" ${nfType==='new_sub'?'selected':''}> اشتراك جديد</option>
            <option value="first_att" ${nfType==='first_att'?'selected':''}> أول حضور</option>
          </select>
        </div>
        <div class="input-group" style="margin:0;min-width:150px">
          <label style="font-size:12px"><i class="ic ic-calendar"></i> تاريخ</label>
          <input class="input" type="date" value="${nfDate}" onchange="App.go('auditLog',{...App.params,nfDate:this.value})">
        </div>
        ${unreadN>0?`<button class="btn btn-secondary btn-sm" onclick="DB.markNotifsRead();App.refresh()">✓ تعليم الكل كمقروء</button>`:''}
        ${(nfBranch!=='all'||nfType!=='all'||nfDate)?`<button class="btn btn-secondary btn-sm" onclick="App.go('auditLog',{alTab:'notifs'})">✕ مسح</button>`:''}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ic ic-bell"></i> التنبيهات — ${notifs.length} تنبيه</div>
      ${notifs.length?notifs.slice(0,300).map(n=>{
        const c=branchColorAL(n.branchId);

  const actionColor={
    'دفعة مُسجَّلة':'#10b981','تعديل اشتراك':'#3b82f6','حذف طفل':'#ef4444',

  return `${tabBar}
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;flex:1;min-width:180px">
        <label style="font-size:12px"><i class="ic ic-search"></i> بحث</label>
        <input id="search-audit" class="input" placeholder="بحث في التفاصيل أو المستخدم..." value="${esc(App.params.alQ||'')}" oninput="App.liveSearch('auditLog',{...App.params,alQ:this.value},this)">
      </div>
      <div class="input-group" style="margin:0;min-width:140px">
        <label style="font-size:12px"><i class="ic ic-tag"></i> نوع الإجراء</label>
        <select class="input" onchange="App.go('auditLog',{...App.params,alAction:this.value})">
          <option value="all">الكل (${log.length})</option>

  </div>
  <div class="card">
    <div class="card-title"><i class="ic ic-search"></i> سجل النشاط — ${filtered.length} إجراء</div>
    ${filtered.length?`<div class="table-wrap"><table>
      <thead><tr><th>التاريخ والوقت</th><th>الإجراء</th><th>الكيان</th><th>التفاصيل</th><th>بواسطة</th></tr></thead>

        return `<tr>
          <td style="font-size:12px;white-space:nowrap">${dateStr}<br><span style="color:#94a3b8">${timeStr}</span></td>
          <td><span class="badge" style="background:${color}20;color:${color};border:1px solid ${color}40;font-size:11px">${esc(e.action||'—')}</span></td>

// ---------- BRANCH MONTHLY REPORT ----------
branchReport(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const isSA=Auth.isSuperAdmin();
  const bid=Auth.branchId();
  const fMonth=App.params.brMonth||T0.slice(0,7);
  const fBranch=bid||(App.params.brBranch||'all');
  const branches=DB.branches();
  const subs=DB.subscriptions();
  const exps=DB.expenses();
  const children=DB.children();
  const targetBranches=fBranch==='all'?branches:branches.filter(b=>b.id===fBranch);

  const branchData=targetBranches.map(b=>{
    const bSubs=subs.filter(s=>s.branchId===b.id&&(s.createdAt||s.startDate||'').startsWith(fMonth));
    const bAllSubs=subs.filter(s=>s.branchId===b.id);
    const bExps=exps.filter(e=>e.branchId===b.id&&(e.date||'').startsWith(fMonth));
    const activeChildIds=[...new Set(bAllSubs.filter(s=>s.isActive&&s.endDate>=T0).map(s=>s.childId))];
    const rev=bSubs.reduce((a,s)=>a+(+s.paidAmount||0),0);
    const charged=bSubs.reduce((a,s)=>a+(+s.price||0),0);
    const exp=bExps.reduce((a,e)=>a+(+e.amount||0),0);
    const net=rev-exp;
    const defaulters=bAllSubs.filter(s=>Views._paymentState(s)==='defaulter');
    const pending=bAllSubs.filter(s=>Views._paymentState(s)==='pending');
    const byPM={};
    bSubs.forEach(s=>{byPM[s.paymentMethod]=(byPM[s.paymentMethod]||0)+(+s.paidAmount||0);});
    return {b,bSubs,rev,charged,exp,net,defaulters,pending,activeChildIds,byPM};
  });

  const totalRev=branchData.reduce((a,d)=>a+d.rev,0);
  const totalExp=branchData.reduce((a,d)=>a+d.exp,0);
  const totalNet=totalRev-totalExp;
  const totalActive=branchData.reduce((a,d)=>a+d.activeChildIds.length,0);

  return `
  <div class="card no-print" style="padding:14px;margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="input-group" style="margin:0;min-width:160px">
        <label style="font-size:12px"><i class="ic ic-calendar"></i> الشهر</label>
        <input class="input" type="month" value="${fMonth}" onchange="App.go('branchReport',{...App.params,brMonth:this.value})">
      </div>
      ${!bid?`<div class="input-group" style="margin:0;min-width:180px">
        <label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label>
        <select class="input" onchange="App.go('branchReport',{...App.params,brBranch:this.value})">
          <option value="all">جميع الفروع</option>
          ${branches.map(b=>`<option value="${b.id}" ${fBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>`:`<div class="input-group" style="margin:0"><label style="font-size:12px"><i class="ic ic-building"></i> الفرع</label><div class="input" style="background:#f8fafc;color:#1d4ed8;font-weight:700">${esc(DB.branchName(bid))}</div></div>`}
      <button class="btn btn-secondary btn-sm" onclick="window.print()"><i class="ic ic-printer"></i> طباعة</button>
      ${isSA?`<button class="btn btn-primary btn-sm" onclick="printBranchReport('${fMonth}','${fBranch}')"><i class="ic ic-file"></i> تصدير PDF</button>`:''}
    </div>
  </div>

  <div class="stats-grid">
    ${isSA?`<div class="stat-card green"><div class="stat-val">${totalRev.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-money"></i> إجمالي المحصّل (ر.س)</div></div>
    <div class="stat-card red"><div class="stat-val">${totalExp.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-trend-down"></i> إجمالي المصروفات (ر.س)</div></div>
    <div class="stat-card ${totalNet>=0?'blue':'red'}"><div class="stat-val" style="color:${totalNet>=0?'#1d4ed8':'#ef4444'}">${totalNet.toLocaleString()}</div><div class="stat-lbl">${totalNet>=0?'<i class="ic ic-star"></i> صافي الربح':'<i class="ic ic-alert"></i> خسارة'} (ر.س)</div></div>`:''}
    <div class="stat-card yellow"><div class="stat-val">${totalActive}</div><div class="stat-lbl"><i class="ic ic-child"></i> أطفال نشطون</div></div>
  </div>

  ${branchData.map(({b,bSubs,rev,charged,exp,net,defaulters,pending,activeChildIds,byPM})=>`
  <div class="card" style="margin-bottom:16px">
    <div style="background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="font-size:16px;font-weight:700"><i class="ic ic-building"></i> ${esc(b.name)}</div>
      <div style="font-size:13px;opacity:.85">تقرير شهر ${fMonth}</div>
    </div>
    <div class="stats-grid" style="margin-bottom:14px">
      ${isSA?`<div class="stat-card green" style="padding:14px"><div class="stat-val" style="font-size:22px">${rev.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-money"></i> المحصّل (ر.س)</div></div>
      <div class="stat-card red" style="padding:14px"><div class="stat-val" style="font-size:22px">${exp.toLocaleString()}</div><div class="stat-lbl"><i class="ic ic-trend-down"></i> المصروفات (ر.س)</div></div>
      <div class="stat-card ${net>=0?'blue':'red'}" style="padding:14px"><div class="stat-val" style="font-size:22px;color:${net>=0?'#1d4ed8':'#ef4444'}">${net.toLocaleString()}</div><div class="stat-lbl">${net>=0?'<i class="ic ic-star"></i> الربح':'<i class="ic ic-alert"></i> الخسارة'} (ر.س)</div></div>`:''}
      <div class="stat-card yellow" style="padding:14px"><div class="stat-val" style="font-size:22px">${activeChildIds.length}</div><div class="stat-lbl"><i class="ic ic-child"></i> نشطون</div></div>
      <div class="stat-card red" style="padding:14px;border-color:#ef4444"><div class="stat-val" style="font-size:22px;color:#ef4444">${defaulters.length}</div><div class="stat-lbl"><span class="dot dot-red"></span> متعثرون</div></div>
      <div class="stat-card yellow" style="padding:14px;border-color:#f59e0b"><div class="stat-val" style="font-size:22px;color:#f59e0b">${pending.length}</div><div class="stat-lbl"><span class="dot dot-amber"></span> معلّقون</div></div>
    </div>
    ${isSA?`<div style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:6px"><i class="ic ic-card"></i> توزيع طريقة الدفع (هذا الشهر)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${Object.entries(byPM).length
          ? Object.entries(byPM).map(([pm,amt])=>`<span class="badge badge-blue">${payTag(pm)}: ${amt.toLocaleString()} ر.س</span>`).join('')
          : '<span style="color:#94a3b8;font-size:12px">لا توجد اشتراكات مسجّلة هذا الشهر</span>'}
      </div>
    </div>`:''}
    ${bSubs.length?`
    <div style="font-size:12px;color:#64748b;border-top:1px solid #f1f5f9;padding-top:10px">
      عدد الفواتير: ${bSubs.length}${isSA?` | إجمالي مستحق: ${charged.toLocaleString()} ر.س | نسبة التحصيل: <strong>${charged?Math.round(rev/charged*100):0}%</strong>`:''}
    </div>
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th>الطفل</th><th>نوع الاشتراك</th><th>المبلغ</th><th>المدفوع</th><th>طريقة الدفع</th><th>الحالة</th></tr></thead>
      <tbody>${bSubs.slice(0,15).map(s=>{const c=children.find(x=>x.id===s.childId);const ps=Views._paymentState(s);return `<tr>
        <td><strong>${esc(c?.name||'—')}</strong><br><small style="color:#64748b">${esc(c?.parentName||'')}</small></td>
        <td>${planName(s.type)}</td>
        <td>${s.price} ر.س</td>
        <td style="color:#10b981;font-weight:600">${s.paidAmount} ر.س</td>
        <td style="font-size:12px">${payTag(s.paymentMethod)}</td>
        <td>${Views._payBadge(s)}</td>
      </tr>`;}).join('')}
      ${bSubs.length>15?`<tr><td colspan="6" style="text-align:center;color:#94a3b8;font-size:12px">... و${bSubs.length-15} فاتورة أخرى</td></tr>`:''}
      </tbody>
    </table></div>`:''}
  </div>`).join('')}`;
},

// ---------- CHILD NOTES ----------
childNotes(){

  const bid=Auth.branchId();
  const allNotes=DB.childNotes().filter(n=>(!sid||n.schoolId===sid)&&(!bid||n.branchId===bid));
  const children=DB.children().filter(c=>(!sid||c.schoolId===sid)&&(!bid||c.branchId===bid));
  const fDate=App.params.cnDate||'';
  const fType=App.params.cnType||'all';
  const fChild=App.params.cnChild||'';
  let filtered=allNotes;
  if(fDate) filtered=filtered.filter(n=>n.date===fDate);
  if(fType!=='all') filtered=filtered.filter(n=>n.type===fType);
  if(fChild) filtered=filtered.filter(n=>n.childId===fChild);
  const typeLbl={parent:'<i class="ic ic-upload"></i> لولي الأمر',internal:'<i class="ic ic-lock"></i> داخلية'};

  const parentCount=allNotes.filter(n=>n.type==='parent').length;

      <div>
        <div style="font-size:18px;font-weight:800"><i class="ic ic-edit"></i> ملاحظات الأطفال اليومية</div>
        <p style="opacity:.9;font-size:13px;margin-top:4px">سجّلي ملاحظات لكل طفل — للإدارة أو لإرسالها لولي الأمر عبر واتساب</p>
      </div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)" onclick="openChildNoteModal('','${T0}')">+ إضافة ملاحظة</button>

  <div class="stats-grid" style="margin-bottom:16px">

    <div class="stat-card green"><div class="stat-val">${todayCount}</div><div class="stat-lbl"><i class="ic ic-calendar"></i> ملاحظات اليوم</div></div>
    <div class="stat-card yellow"><div class="stat-val">${parentCount}</div><div class="stat-lbl"><i class="ic ic-upload"></i> مُرسَلة لأولياء الأمور</div></div>
    <div class="stat-card blue"><div class="stat-val">${allNotes.length-parentCount}</div><div class="stat-lbl"><i class="ic ic-lock"></i> ملاحظات داخلية</div></div>

      <div class="input-group" style="margin:0;min-width:150px">
        <label style="font-size:12px"><i class="ic ic-bookmark"></i> النوع</label>
        <select class="input" onchange="App.go('childNotes',{...App.params,cnType:this.value})">

        <label style="font-size:12px"><i class="ic ic-child"></i> الطفل</label>
        <select class="input" onchange="App.go('childNotes',{...App.params,cnChild:this.value})">

          ${children.map(c=>`<option value="${c.id}" ${fChild===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}

      <thead><tr><th>التاريخ</th><th>الطفل</th><th>الملاحظة</th><th>النوع</th><th>بواسطة</th><th>إجراء</th></tr></thead>

        return `<tr>
          <td style="white-space:nowrap;font-size:13px">${formatDate(n.date)}</td>
          <td><strong>${esc(c?.name||'—')}</strong><br><small style="color:#64748b">${esc(c?.parentName||'')}</small></td>
          <td style="max-width:260px;font-size:13px;line-height:1.5">${esc(n.note)}</td>

            <button class="btn btn-danger btn-xs" onclick="deleteChildNote('${n.id}')"><i class="ic ic-trash"></i></button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`}
  </div>`;
},

// ---------- INTERNAL MESSAGES ----------
messages(){
  const me=Auth.user;
  const role=me?.role;
  if(role!=='superadmin'&&role!=='school_admin'&&role!=='teacher') return Views._forbidden();
  const isSA=role==='superadmin';
  const isTeacher=role==='teacher';
  const myBid=Auth.branchId();
  const allMsgs=DB.internalMessages();
  const branches=DB.branches();
  const teachers=DB.users().filter(u=>u.role==='teacher');

  const branchColor=(bid)=>{
    if(!bid) return {bg:'#f1f5f9',fg:'#475569',light:'#fff'};
    const idx=branches.findIndex(b=>b.id===bid);
    const cols=[{bg:'#dbeafe',fg:'#1e40af',light:'#eff6ff'},{bg:'#dcfce7',fg:'#166534',light:'#f0fdf4'},{bg:'#fef3c7',fg:'#92400e',light:'#fffbeb'},{bg:'#fce7f3',fg:'#9f1239',light:'#fdf2f8'}];
    return cols[idx>=0?idx%cols.length:0];
  };

  // بناء قائمة المحادثات حسب الدور
  let threads=[];
  if(isTeacher){
    threads=[{key:'t:'+me.id,label:'الإدارة',type:'teacher',tid:me.id,bid:me.branchId}];
  } else if(role==='school_admin'){
    threads=[{key:'b:'+myBid,label:'المدير العام',icon:'user',type:'branch',bid:myBid}];
    teachers.filter(t=>t.branchId===myBid).forEach(t=>threads.push({key:'t:'+t.id,label:t.name,icon:'user',type:'teacher',tid:t.id,bid:myBid}));
  } else { // superadmin
    branches.forEach(b=>threads.push({key:'b:'+b.id,label:(b.name.split(' - ')[0]||b.name),icon:'building',type:'branch',bid:b.id}));
    teachers.forEach(t=>threads.push({key:'t:'+t.id,label:t.name+' — '+((DB.branchName(t.branchId)||'').split(' - ')[0]||''),icon:'user',type:'teacher',tid:t.id,bid:t.branchId}));
  }
  // ترقية قيمة thread القديمة (معرّف فرع) إلى صيغة b:
  let activeKey=App.params.thread||'';
  if(activeKey&&!activeKey.includes(':')) activeKey='b:'+activeKey;
  const active=threads.find(t=>t.key===activeKey)||threads[0];
  const activeThread=active?active.key:'';

  const inThread=(m,t)=>{
    if(!t) return false;
    if(t.type==='teacher') return m.tThread===t.tid;
    return !m.tThread&&(m.fromBranchId===t.bid||m.toBranchId===t.bid)&&m.fromRole!=='teacher';
  };
  let threadMsgs=allMsgs.filter(m=>inThread(m,active)).sort((a,b)=>(a.at||'').localeCompare(b.at||''));
  const toMark=threadMsgs.filter(m=>!(m.readBy||[]).includes(me.id)&&m.fromUserId!==me.id).map(m=>m.id);
  if(toMark.length) setTimeout(()=>DB.markInternalRead(toMark,me.id),300);

  const sidebar=threads.map(t=>{
    const c=branchColor(t.bid);
    const tMsgs=allMsgs.filter(m=>inThread(m,t));
    const unread=tMsgs.filter(m=>!m.recalled&&m.fromUserId!==me.id&&!(m.readBy||[]).includes(me.id)).length;
    const last=[...tMsgs].sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
    const lastPreview=last?(last.recalled?'<i class="ic ic-ban"></i> رسالة مُسترجَعة':(last.message||'<i class="ic ic-paperclip"></i> مرفق').slice(0,36)):'';
    const on=t.key===activeThread;
    return `<div onclick="App.go('messages',{thread:'${t.key}'})" style="cursor:pointer;padding:12px 14px;border-bottom:1px solid #e2e8f0;background:${on?c.light:'#fff'};border-right:4px solid ${on?c.fg:'transparent'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
        <strong style="color:${c.fg};font-size:13px">${t.icon?`<i class="ic ic-${t.icon}"></i> `:''}${esc(t.label)}</strong>
        ${unread>0?`<span style="background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px">${unread}</span>`:''}
      </div>
      <div style="font-size:11px;color:#64748b;line-height:1.4">${esc(lastPreview)||'لا توجد رسائل بعد'}</div>
      ${last?`<div style="font-size:10px;color:#94a3b8;margin-top:2px">${formatRelTime(last.at)}</div>`:''}
    </div>`;
  }).join('');

  const showSidebar=!isTeacher;
  const activeColor=branchColor(active?active.bid:null);
  const headerLabel=active?('<i class="ic ic-message"></i> '+esc(active.label)):'<i class="ic ic-message"></i> اختر محادثة';
  const subHint='رسائل داخلية آمنة — لا تُرسل عبر واتساب';

  return `
  <div class="card no-print msg-intro" style="padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#1d4ed8,#172554);color:#fff">
    <div style="font-size:18px;font-weight:800"><i class="ic ic-message"></i> الرسائل الداخلية</div>
    <p style="opacity:.9;font-size:13px;margin-top:4px">قناة تواصل مباشرة وآمنة بين المدير العام ومديرات الفروع — للملاحظات الإدارية والاستفسارات اليومية</p>
  </div>

  <div class="msg-layout ${showSidebar?'':'solo'}">
    ${showSidebar?`<div class="card" style="padding:0;overflow:hidden">
      <div style="padding:12px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:700;color:#1e293b"><i class="ic ic-download"></i> المحادثات</div>
      <div class="msg-conv">${sidebar||'<div style="padding:32px;text-align:center;color:#94a3b8">لا توجد محادثات</div>'}</div>
    </div>`:''}

    <div class="card msg-thread" style="padding:0">
      <div style="padding:14px 16px;background:${activeColor.light};border-bottom:1px solid ${activeColor.fg}33">
        <div style="font-size:14px;font-weight:700;color:${activeColor.fg}">${headerLabel}</div>
        <div style="font-size:11px;color:#64748b;margin-top:2px">${subHint}</div>
      </div>
      <div id="msg-list" class="msg-list">
        ${threadMsgs.length===0?`<div style="text-align:center;color:#94a3b8;padding:60px 20px;font-size:14px">
          <div style="font-size:42px;margin-bottom:10px"><i class="ic ic-message"></i></div>
          <div>لا توجد رسائل بعد</div>
          <div style="font-size:12px;margin-top:6px">ابدأ المحادثة بكتابة رسالة في الأسفل</div>
        </div>`:threadMsgs.map(m=>{
          const mine=m.fromUserId===me.id;
          const fromBranch=branches.find(b=>b.id===m.fromBranchId);
          const c=branchColor(m.fromBranchId);
          // رسالة مُسترجَعة → فقاعة رمادية محايدة بتنبيه «تم استرجاع الرسالة»
          if(m.recalled){
            return `<div style="display:flex;${mine?'justify-content:flex-end':'justify-content:flex-start'}">
              <div class="msg-bubble" style="background:#f1f5f9;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:14px;padding:9px 14px">
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-style:italic"><i class="ic ic-ban"></i> تم استرجاع الرسالة</div>
                <div style="font-size:10px;color:#cbd5e1;margin-top:4px;text-align:left">${formatRelTime(m.recalledAt||m.at)}</div>
              </div>
            </div>`;
          }
          const bgColor=mine?'#1d4ed8':(m.fromRole==='superadmin'?'#f5f3ff':c.light);
          const fgColor=mine?'#fff':'#1e293b';
          const borderC=mine?'#1d4ed8':(m.fromRole==='superadmin'?'#a78bfa':c.fg);
          return `<div style="display:flex;${mine?'justify-content:flex-end':'justify-content:flex-start'}">
            <div class="msg-bubble" style="position:relative;background:${bgColor};color:${fgColor};border:1px solid ${borderC}33;border-radius:14px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;${mine?'color:rgba(255,255,255,.85)':'color:#64748b'};font-weight:700">
                ${m.fromRole==='superadmin'?'<i class="ic ic-user"></i>':'<i class="ic ic-building"></i>'} ${esc(m.fromName||'—')}
                ${fromBranch&&!mine&&m.fromRole!=='superadmin'?`<span style="background:${c.bg};color:${c.fg};padding:1px 6px;border-radius:6px;font-size:10px">${esc(fromBranch.name.split(' - ')[0]||fromBranch.name)}</span>`:''}
                ${mine?`<button onclick="recallMessage('${m.id}')" title="استرجاع الرسالة للطرفين" style="margin-right:auto;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:6px;font-size:11px;padding:1px 7px;cursor:pointer;font-family:inherit">↩︎ استرجاع</button>`:''}
              </div>
              <div style="font-size:13px;line-height:1.6;white-space:pre-wrap">${esc(m.message)}</div>
              ${m.attachment?`<div style="margin-top:6px;padding:6px 10px;background:${mine?'rgba(255,255,255,.15)':'#f1f5f9'};border-radius:8px;display:flex;align-items:center;gap:8px">
                <span style="font-size:14px"><i class="ic ic-paperclip"></i></span> <a href="${m.attachment.data}" download="${esc(m.attachment.name||'مرفق.pdf')}" style="font-size:12px;color:${mine?'#fff':'#1d4ed8'};text-decoration:underline;font-weight:600">${esc(m.attachment.name||'مرفق.pdf')}</a>
                <span style="font-size:11px;color:${mine?'rgba(255,255,255,.6)':'#94a3b8'}">(${m.attachment.size||''})</span> </div>`:''}
              <div style="font-size:10px;${mine?'color:rgba(255,255,255,.7)':'color:#94a3b8'};margin-top:5px;text-align:left">
                ${formatRelTime(m.at)} ${mine&&(m.readBy||[]).length>1?'· ✓✓ مقروء':mine?'· ✓ مُرسَلة':''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${!active?'':`<div class="msg-composer" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;align-items:flex-end">
          <textarea id="msg-input" class="input" rows="1" placeholder="اكتب رسالتك... (Enter للإرسال · Shift+Enter سطر جديد)" style="flex:1;resize:none;font-family:inherit;max-height:120px" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendInternalMessage('${activeThread}');}"></textarea>
          <button class="btn btn-primary" style="flex-shrink:0" onclick="sendInternalMessage('${activeThread}')"><span class="msg-send-lbl"><i class="ic ic-upload"></i> إرسال</span><span class="msg-send-ic"><i class="ic ic-upload"></i></span></button>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label style="cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;padding:6px 10px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc">
            <i class="ic ic-paperclip"></i> إرفاق PDF
            <input type="file" id="msg-attachment" accept=".pdf,.PDF" style="display:none" onchange="handleMsgAttachment(this)">
          </label>
          <span id="msg-att-name" style="font-size:12px;color:#1d4ed8"></span> <span id="msg-att-clear" style="display:none;font-size:12px;color:#ef4444;cursor:pointer" onclick="clearMsgAttachment()">✕ إلغاء المرفق</span> </div>
      </div>`}
    </div>
  </div>
  <img src="__none__" style="display:none" onerror="(function(){const ml=document.getElementById('msg-list');if(ml) ml.scrollTop=ml.scrollHeight;})()">
  `;
},

// ---------- سجل الفواتير الضريبية ----------
taxInvoices(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const f=App.params?.tiType||'all';
  const q=(App.params?.tiQ||'').trim();
  let list=invoiceLedger().slice().reverse();
  if(f==='388') list=list.filter(i=>i.typeCode==='388');
  if(f==='381') list=list.filter(i=>i.typeCode==='381');
  if(q) list=list.filter(i=>(i.invoiceNo||'').includes(q)||(i.buyer?.name||'').includes(q));
  const all=invoiceLedger();
  const inv=all.filter(i=>i.typeCode==='388');
  const notes=all.filter(i=>i.typeCode==='381');
  const sum=a=>Zatca.round(a.reduce((x,i)=>x+i.totals.gross,0));
  const sumTax=a=>Zatca.round(a.reduce((x,i)=>x+i.totals.tax,0));
  const net=Zatca.round(sum(inv)-sum(notes)), netTax=Zatca.round(sumTax(inv)-sumTax(notes));
  const money=n=>Zatca.money(n).replace(/\B(?=(\d{3})+$)/,'');
  const ready=zatcaReady();
  return `
  <div class="section-header">
    <h2><i class="ic ic-receipt"></i> سجل الفواتير الضريبية</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="exportTaxInvoicesCSV()"><i class="ic ic-download"></i> تصدير السجل</button>
      ${Auth.isSuperAdmin()?`<button class="btn btn-secondary btn-sm" onclick="App.go('settings',{tab:'zatca'})"><i class="ic ic-settings"></i> إعدادات الفوترة</button>`:''}
    </div>
  </div>
  ${ready?'':`<div class="alert-box alert-yellow" style="margin-bottom:16px"><i class="ic ic-alert"></i> بيانات المنشأة الضريبية غير مكتملة — الفواتير الصادرة الآن قد لا تُقبل عند الربط مع منصة فاتورة. ${Auth.isSuperAdmin()?'<a href="#" onclick="App.go(\'settings\',{tab:\'zatca\'});return false;" style="font-weight:700">أكمليها الآن</a>':''}</div>`}
  <div class="stats-grid" style="margin-bottom:18px">
    <div class="stat-card"><div class="stat-label"><i class="ic ic-file"></i> فواتير صادرة</div><div class="stat-value">${inv.length}</div></div>
    <div class="stat-card"><div class="stat-label"><i class="ic ic-refresh"></i> إشعارات دائنة</div><div class="stat-value">${notes.length}</div></div>
    <div class="stat-card"><div class="stat-label"><i class="ic ic-money"></i> صافي المبيعات شامل الضريبة</div><div class="stat-value">${money(net)} <small>ر.س</small></div></div>
    <div class="stat-card"><div class="stat-label"><i class="ic ic-scale"></i> صافي ضريبة القيمة المضافة</div><div class="stat-value">${money(netTax)} <small>ر.س</small></div></div>
  </div>
  <div class="filters-bar">
    <input class="input" style="max-width:240px" placeholder="بحث برقم الفاتورة أو اسم المشتري..." value="${esc(q)}"
      oninput="App.go('taxInvoices',{...App.params,tiQ:this.value})">
    <span class="chip ${f==='all'?'active':''}" onclick="App.go('taxInvoices',{...App.params,tiType:'all'})">الكل</span>
    <span class="chip ${f==='388'?'active':''}" onclick="App.go('taxInvoices',{...App.params,tiType:'388'})">الفواتير</span>
    <span class="chip ${f==='381'?'active':''}" onclick="App.go('taxInvoices',{...App.params,tiType:'381'})">الإشعارات الدائنة</span>
  </div>
  <div class="card">
    <div class="table-wrap"><table>
      <thead><tr><th>الرقم</th><th>النوع</th><th>التاريخ</th><th>المشتري</th><th>قبل الضريبة</th><th>الضريبة</th><th>الإجمالي</th><th>ICV</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${list.length?list.map(i=>{
          const note=i.typeCode==='381';
          return `<tr>
            <td><strong>${esc(i.invoiceNo)}</strong>${i.refInvoiceNo?`<br><small style="color:#94a3b8">مرجع: ${esc(i.refInvoiceNo)}</small>`:''}</td>
            <td><span class="badge ${note?'badge-orange':'badge-blue'}" style="font-size:10px">${note?'إشعار دائن':(i.subtype==='0100000'?'فاتورة معيارية':'فاتورة مبسّطة')}</span></td>
            <td style="font-size:12px">${esc(i.issueDate)}<br><small style="color:#94a3b8">${esc(i.issueTime)}</small></td>
            <td style="font-size:12.5px">${esc(i.buyer?.name||'عميل نقدي')}</td>
            <td class="num">${money(i.totals.net)}</td>
            <td class="num">${money(i.totals.tax)}</td>
            <td class="num" style="font-weight:700;color:${note?'#dc2626':'#1d4ed8'}">${note?'-':''}${money(i.totals.gross)}</td>
            <td style="text-align:center;color:#94a3b8">${i.icv}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-secondary btn-xs" onclick="reprintInvoice('${esc(i.invoiceNo)}')" title="عرض وطباعة"><i class="ic ic-printer"></i></button>
              <button class="btn btn-secondary btn-xs" onclick="downloadInvoiceXML('${esc(i.invoiceNo)}')" title="تنزيل UBL 2.1"><i class="ic ic-download"></i></button>
              ${!note?`<button class="btn btn-secondary btn-xs" onclick="openCreditNoteModal('${esc(i.invoiceNo)}')" title="إشعار دائن"><i class="ic ic-refresh"></i></button>`:''}
            </td>
          </tr>`;}).join(''):`<tr><td colspan="9"><div class="empty-state"><i class="ic ic-receipt ic-xl"></i><p>لا توجد فواتير صادرة بعد</p></div></td></tr>`}
      </tbody>
    </table></div>
  </div>
  <div style="margin-top:14px;font-size:11.5px;color:#94a3b8;line-height:1.9">
    <i class="ic ic-lock"></i> الفواتير الصادرة سجلّ ثابت لا يُعدَّل ولا يُحذف — أي تصحيح يتم بإصدار إشعار دائن، كما يشترط نظام الفوترة الإلكترونية. يجب الاحتفاظ بالسجل ٦ سنوات على الأقل.
  </div>`;
},

  } else if(tab==='paymethods'){

      <div style="font-size:12px;color:#64748b;margin-bottom:14px">أضيفي أو عدّلي طرق الدفع التي تقبلينها. تظهر في تسجيل الاشتراكات والدفعات والمصروفات وتقارير الصندوق.</div>

            <input class="input" id="z-cr" value="${esc(sp.crNumber)}" placeholder="1010xxxxxx" maxlength="10" inputmode="numeric">
          </div>
        </div>
      </div>

        </div>

      <button class="btn btn-primary" onclick="saveSettingsZatca()"><i class="ic ic-save"></i> حفظ بيانات الفوترة الإلكترونية</button>
    </div>`;

sales(){

  const isSA=Auth.isSuperAdmin();
  const sid=Auth.isSuperAdmin()?null:Auth.schoolId();
  const bid=Auth.branchId();
  let allSales=DB.sales();
  if(sid) allSales=allSales.filter(s=>s.schoolId===sid);
  if(bid) allSales=allSales.filter(s=>s.branchId===bid);
  const todaySales=allSales.filter(s=>s.date===T0);
  const totalToday=todaySales.reduce((a,s)=>a+(s.price||0),0);
  const totalAll=allSales.reduce((a,s)=>a+(s.price||0),0);
  const itemLabel={'exit_card':'<i class="ic ic-id-card"></i> بطاقة خروج','uniform':'<i class="ic ic-shirt"></i> زي رسمي','other':'<i class="ic ic-box"></i> أخرى'};
  const rows=[...allSales].reverse().map(s=>{
    const child=DB.children().find(c=>c.id===s.childId);
    const who=child?esc(child.name):esc(s.parentName||'—');
    const whoSub=child&&child.parentName?`<br><small style="color:#94a3b8">${esc(child.parentName)}</small>`:'';
    return `<tr>
      <td>${formatDate(s.date)}</td>
      <td>${who}${whoSub}</td>
      <td>
        <span class="badge badge-blue">${itemLabel[s.itemType]||s.itemType}</span> ${s.itemName?`<br><small style="color:#374151">${esc(s.itemName)}</small>`:''}
      </td>

      <td>${payTag(s.paymentMethod)}</td>
      ${Auth.isSuperAdmin()?`<td><small style="color:#64748b">${DB.branchName(s.branchId)}</small></td>`:''}

  return `
  <div class="section-header">
    <h2><i class="ic ic-bag"></i> المبيعات</h2>
    <button class="btn btn-primary" onclick="Modals.addSale()">+ إضافة مبيعة</button>

    ${isSA?`<div class="stat-card green"><div class="stat-val">${totalAll.toLocaleString()} ر.س</div><div class="stat-lbl"><i class="ic ic-money"></i> إجمالي المبيعات</div></div>`:''}
    <div class="stat-card blue"><div class="stat-val">${allSales.length}</div><div class="stat-lbl"><i class="ic ic-clipboard"></i> إجمالي السجلات</div></div>
  </div>

    <div class="empty-state"><div class="es-icon"><i class="ic ic-bag"></i></div><p>لا توجد مبيعات مسجلة بعد</p>
    <button class="btn btn-primary" onclick="Modals.addSale()">+ إضافة أول مبيعة</button></div>
  `:`

hr(){
  if(!Auth.isSuperAdmin()&&!Auth.isSchoolAdmin()) return Views._forbidden();
  const isSchAdmin=Auth.isSchoolAdmin()&&!Auth.isSuperAdmin();
  const tab=App.params.hrTab||(isSchAdmin?'attendance':'employees');
  const bid=Auth.branchId();
  const branches=DB.branches();
  const tabs=isSchAdmin?[
    {k:'attendance',icon:'<i class="ic ic-check"></i>',label:'الحضور'},
    {k:'leaves',icon:'<i class="ic ic-umbrella"></i>',label:'الإجازات'},
  ]:[
    {k:'employees',icon:'<i class="ic ic-users"></i>',label:'الموظفون'},
    {k:'attendance',icon:'<i class="ic ic-check"></i>',label:'الحضور'},
    {k:'leaves',icon:'<i class="ic ic-umbrella"></i>',label:'الإجازات'},
    {k:'payroll',icon:'<i class="ic ic-money"></i>',label:'مسير الرواتب'},
  ];
  let emps=DB.hrEmployees().filter(e=>e.status!=='deleted');
  if(bid) emps=emps.filter(e=>e.branchId===bid);
  const filterBranch=App.params.hrBranch||'all';
  if(!bid&&filterBranch!=='all') emps=emps.filter(e=>e.branchId===filterBranch);
  const statusBadge=(s)=>({active:'<span class="badge badge-green">نشط</span>',on_leave:'<span class="badge badge-yellow">إجازة</span>',resigned:'<span class="badge" style="background:#e2e8f0;color:#64748b">استقال</span>',terminated:'<span class="badge badge-red">منتهي الخدمة</span>',archived:'<span class="badge" style="background:#f1f5f9;color:#64748b"><i class="ic ic-folder"></i> مؤرشف</span>'})[s]||'';
  const docAlert=(e)=>{
    const fields=[{label:'الإقامة',d:e.iqamaExpiry},{label:'العقد',d:e.contractEnd},{label:'الصحية',d:e.healthCertExpiry}];
    let alerts=[];
    fields.forEach(f=>{
      if(!f.d) return;
      const st=DB.hrDocStatus(f.d);
      const days=diffDays(f.d,T0);
      if(st==='expired') alerts.push(`<span style="color:#ef4444;font-size:11px"><span class="dot dot-red"></span> ${f.label} منتهية</span>`);
      else if(st==='soon7') alerts.push(`<span style="color:#ef4444;font-size:11px"><i class="ic ic-alert"></i> ${f.label}: ${days} يوم</span>`);
      else if(st==='soon60') alerts.push(`<span style="color:#f59e0b;font-size:11px"><i class="ic ic-hourglass"></i> ${f.label}: ${days} يوم</span>`);
    });
    return alerts.join(' · ');
  };
  // رصيد الإجازة السنوية (نظام العمل السعودي: أقل من 5 سنوات 21 يوم، 5 سنوات فأكثر 30 يوم)
  const annualBalance=(e)=>Views._annualBalance(e); // رصيد تراكمي موحّد
  let content='';
  if(tab==='employees'){
    const q=(App.params.hrQ||'').trim();
    let list=emps;
    if(q) list=list.filter(e=>e.name.includes(q)||e.jobTitle?.includes(q)||(e.nationalId||e.iqamaNo||'').includes(q));
    const statusFilter=App.params.hrSt||'active';
    if(statusFilter!=='all') list=list.filter(e=>(e.status||'active')===statusFilter);
    const hrSort=App.params.hrSort||'name';
    list=[...list];
    if(hrSort==='name') list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
    else if(hrSort==='hire_new') list.sort((a,b)=>(b.contractStart||'').localeCompare(a.contractStart||''));
    else if(hrSort==='hire_old') list.sort((a,b)=>(a.contractStart||'').localeCompare(b.contractStart||''));
    else if(hrSort==='salary_high') list.sort((a,b)=>(+b.basicSalary||0)-(+a.basicSalary||0));
    else if(hrSort==='salary_low') list.sort((a,b)=>(+a.basicSalary||0)-(+b.basicSalary||0));
    else if(hrSort==='contract') list.sort((a,b)=>{const da=a.contractEnd||'9999';const db=b.contractEnd||'9999';return da.localeCompare(db);});
    else if(hrSort==='branch') list.sort((a,b)=>(branches.find(x=>x.id===a.branchId)?.name||'').localeCompare(branches.find(x=>x.id===b.branchId)?.name||'','ar'));
    const alertCount=emps.filter(e=>{
      return ['iqamaExpiry','contractEnd','healthCertExpiry'].some(k=>e[k]&&['soon7','soon60','expired'].includes(DB.hrDocStatus(e[k])));
    }).length;
    content=`
    <div>

  bulkWhatsApp(type){
    const subs=DB.subscriptions();
    const children=DB.children();
    const settings=DB.settings();
    const applyVars=(tmpl,c,s)=>(tmpl||'')
      .replace(/{name}/g,c.name||'')
      .replace(/{parentName}/g,c.parentName||'')
      .replace(/{date}/g,formatDate(s.endDate))
      .replace(/{remaining}/g,String(s.price-s.paidAmount));
    let list=[];
    let title='';
    let tmpl='';
    if(type==='defaulters'){
      list=subs.filter(s=>Views._paymentState(s)==='defaulter');
      title='تذكيرات المتعثرين بالسداد';
      tmpl=settings.waTemplateDefaulter||'السلام عليكم {parentName}، اشتراك طفلكم {name} انتهى بتاريخ {date} ولا يزال متبقي {remaining} ر.س. يرجى التواصل.';
    } else {
      list=subs.filter(s=>Views._paymentState(s)==='pending');
      title='تذكيرات المعلّقين';
      tmpl=settings.waTemplatePending||'السلام عليكم {parentName}، يوجد {remaining} ر.س متبقي على اشتراك {name} (ينتهي {date}). يرجى إتمام السداد.';
    }
    const rows=list.map(s=>{
      const c=children.find(x=>x.id===s.childId)||{};
      const phone=(c.parentPhone||'').replace(/^\+?/,'').replace(/^0/,'966');
      const msg=applyVars(tmpl,c,s);
      const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:'';
      return {c,s,url,phone};
    });
    App.showModal(`
    <div class="modal-overlay" onclick="if(event.target===this)App.closeModal()">
    <div class="modal" style="max-width:660px">
      <div class="modal-header"><h2>${title} (${rows.length})</h2><button class="close-btn" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="background:#fef9c3;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#92400e">
          <i class="ic ic-alert"></i> كل رابط يفتح واتساب ويملأ الرسالة تلقائياً. اضغط إرسال في واتساب لكل شخص.
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>الطفل</th><th>ولي الأمر</th><th>المتبقي</th><th>الهاتف</th><th>إرسال</th></tr></thead>
          <tbody>${rows.map(r=>`<tr>
            <td><strong>${esc(r.c.name||'—')}</strong></td>
            <td style="font-size:13px">${esc(r.c.parentName||'—')}</td>
            <td style="color:#ef4444;font-weight:700">${(r.s.price-r.s.paidAmount).toLocaleString()} ر.س</td>
            <td style="font-size:12px">${r.c.parentPhone||'—'}</td>
            <td>${r.url?`<a href="${r.url}" target="_blank" class="btn btn-wa btn-xs"><i class="ic ic-message"></i> إرسال</a>`:'<span style="color:#94a3b8;font-size:12px">لا يوجد رقم</span>'}</td>
          </tr>`).join('')}
          </tbody>
        </table></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="App.closeModal()">إغلاق</button>
      </div>
    </div></div>`);
  },

  runPayroll(month){
    const emps=DB.hrEmployees().filter(e=>(e.status||'active')==='active'||(e.status||'active')==='on_leave');
    const bid=Auth.branchId();
    const list=bid?emps.filter(e=>e.branchId===bid):emps;
    const existing=new Set(DB.hrPayroll().filter(p=>p.month===month).map(p=>p.employeeId));
    const toAdd=list.filter(e=>!existing.has(e.id));
    if(toAdd.length===0){toast('المسير موجود لجميع الموظفين هذا الشهر');return;}
    // حساب الغياب من سجل الحضور
    const daysInMonth=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate();
    const workingDays=Math.round(daysInMonth*26/31); // تقريب 26 يوم عمل/شهر (م. العمل السعودي)
    const newRecords=toAdd.map(e=>{
      const absences=DB.hrAttendance().filter(a=>a.employeeId===e.id&&a.date.startsWith(month)&&a.status==='absent').length;
      const lateMinTotal=DB.hrAttendance().filter(a=>a.employeeId===e.id&&a.date.startsWith(month)&&a.status==='late').reduce((s,a)=>s+(+a.lateMinutes||0),0);
      const dailyRate=(+e.basicSalary||0)/workingDays;
      const absenceDeduction=Math.round(dailyRate*absences*100)/100;
      const lateDeduction=Math.round(lateMinTotal/(8*60)*dailyRate*100)/100;
      // خصم الإجازة المرضية: اليوم 31-90 خصم 25% من الراتب اليومي (نظام العمل السعودي)
      const yearStart=month.slice(0,4)+'-01-01';
      const yearEnd=month.slice(0,4)+'-12-31';
      const sickLeaves=DB.hrLeaves().filter(l=>l.employeeId===e.id&&l.type==='sick'&&l.status==='approved');
      const totalSickYTD=sickLeaves.filter(l=>l.startDate>=yearStart&&l.startDate<=yearEnd).reduce((s,l)=>s+(+l.days||0),0);
      const monthSickDays=sickLeaves.filter(l=>l.startDate.startsWith(month)).reduce((s,l)=>s+(+l.days||0),0);
      // حساب أيام في النطاق 75% (31-90) للشهر
      const prevSick=totalSickYTD-monthSickDays;
      let sick75Days=0;
      for(let i=0;i<monthSickDays;i++){const dayNum=prevSick+i+1;if(dayNum>=31&&dayNum<=90) sick75Days++;}
      const sickDeduction=Math.round(sick75Days*dailyRate*0.25*100)/100;
      const gosiDeduction=Math.round((+e.basicSalary||0)*(+e.gosiRate||9)/100*100)/100;
      const netSalary=(+e.basicSalary||0)+(+e.housingAllowance||0)+(+e.transportAllowance||0)+(+e.otherAllowances||0)-absenceDeduction-lateDeduction-sickDeduction-gosiDeduction;
      return {id:uid(),employeeId:e.id,month,basicSalary:+e.basicSalary||0,housingAllowance:+e.housingAllowance||0,transportAllowance:+e.transportAllowance||0,otherAllowances:+e.otherAllowances||0,gosiRate:+e.gosiRate||9,gosiDeduction,absenceDays:absences,absenceDeduction,lateDeduction,sickDeduction,sick75Days,loanDeduction:0,otherDeductions:0,bonus:0,netSalary,paymentStatus:'pending',paymentDate:'',notes:'',generatedAt:T0,generatedBy:Auth.user?.name||'—'};
    });
    const existing2=DB.hrPayroll();
    newRecords.forEach(r=>existing2.push(r));
    DB.save('hr_payroll',existing2);
    toast(`تم إنشاء مسير ${newRecords.length} موظف لشهر ${month}`);
    App.go('hr',{hrTab:'payroll',hrMonth:month});
  },

// ===== بوابة المنصة: تسجيل / دخول المدرسة =====
async function doTenantLogin(){
  const username=document.getElementById('tl-user')?.value?.trim();
  const password=document.getElementById('tl-pass')?.value?.trim();
  const errEl=document.getElementById('tenant-login-err');
  const btn=document.getElementById('tl-btn');
  if(!username||!password){if(errEl){errEl.textContent='أدخلي اسم المستخدم وكلمة المرور';errEl.style.display='flex';}return;}
  if(btn){btn.disabled=true;btn.textContent='...جاري الدخول';}
  try{
    const res=await tenantApiCall('/tenant/login',{method:'POST',body:JSON.stringify({username,password})});
    TenantSession.save({token:res.token,tenant:res.tenant});
    TenantSession.pendingCreds={username,password}; // لتأسيس أول مدير عام إن كانت مدرسة جديدة بلا بيانات بعد
    if(!res.active){
      document.getElementById('app').innerHTML=Views.subscriptionStatus(res.tenant);
      return;
    }
    await startAppForTenant();
  }catch(e){
    if(errEl){errEl.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';errEl.style.display='flex';}
  }finally{
    if(btn){btn.disabled=false;btn.textContent='تسجيل الدخول';}
  }
}
async function doTenantRegister(){
  const name=document.getElementById('tr-name')?.value?.trim();
  const membershipType=document.getElementById('tr-type')?.value;
  const contactPerson=document.getElementById('tr-contact')?.value?.trim();
  const phone=document.getElementById('tr-phone')?.value?.trim();
  const email=document.getElementById('tr-email')?.value?.trim();
  const username=document.getElementById('tr-user')?.value?.trim();
  const password=document.getElementById('tr-pass')?.value?.trim();
  const errEl=document.getElementById('tenant-register-err');
  const btn=document.getElementById('tr-btn');
  const showErr=(m)=>{if(errEl){errEl.textContent=' '+m;errEl.style.display='flex';}};
  if(errEl) errEl.style.display='none';
  if(!name||!contactPerson||!phone||!username||!password){showErr('يرجى تعبئة جميع الحقول المطلوبة');return;}
  if(password.length<6){showErr('كلمة المرور 6 أحرف على الأقل');return;}
  if(!/^[a-zA-Z0-9_.-]{3,40}$/.test(username)){showErr('اسم المستخدم بالإنجليزية فقط بدون مسافات (٣ أحرف فأكثر)');return;}
  if(btn){btn.disabled=true;btn.textContent='...جاري الإرسال';}
  try{
    await tenantApiCall('/tenant/register',{method:'POST',body:JSON.stringify({name,membershipType,contactPerson,phone,email,username,password})});
    document.getElementById('app').innerHTML=Views.subscriptionStatus({name,membershipType,status:'pending'});
  }catch(e){
    showErr(e.code==='username_taken'?'اسم المستخدم مستخدم مسبقاً، اختاري اسماً آخر':'تعذّر إرسال الطلب، حاولي لاحقاً');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='إرسال طلب التسجيل';}
  }
}

// ===== تشغيل التطبيق بعد نجاح دخول المدرسة =====
async function startAppForTenant(){
  API_TOKEN=TenantSession.token;
  document.getElementById('app').innerHTML=`<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;background:linear-gradient(150deg,#1d4ed8,#141e46)"><img src="logo-madar-mark.svg" style="width:140px;height:92px;object-fit:contain;margin-bottom:16px" onerror="this.style.display='none'"><p style="color:#fff;font-size:22px;font-weight:700">${esc(TenantSession.tenant?.name||'مدار')}</p><p style="color:rgba(255,255,255,.7);font-size:14px;margin-top:10px"><i class="ic ic-hourglass"></i> جاري الاتصال بقاعدة البيانات...</p></div>`;
  try{
    await DB.initStorage();
  }catch(e){
    if(e.code==='subscription_inactive'){
      const t={...TenantSession.tenant,...(e.tenantInfo||{})};
      TenantSession.save({token:TenantSession.token,tenant:t});
      document.getElementById('app').innerHTML=Views.subscriptionStatus(t);
      return;
    }
    if(e.code==='unauthorized'){
      TenantSession.clear();
      document.getElementById('app').innerHTML=Views.platformGate('login');loadLandingPackages();loadLandingPackages();
      return;
    }
    console.error('[boot] تعذّر الاتصال بالخادم:',e);
    document.getElementById('app').innerHTML=Views.connectionError();
    return;
  }
  DB.init();
  TenantSession.pendingCreds=null; // استُهلكت إن لزم الأمر، لا نُبقي كلمة المرور صريحة في الذاكرة
  // إصلاحات تاريخية خاصة بمدرسة "مدارك/روافد" المُرحّلة فقط — لا تُطبَّق على مدرسة جديدة
  if(TenantSession.tenant?.id==='default'){
    (()=>{
      const fixes={
        'b1':{correct:'الفرع الأول - هارون الرشيد', old:['الفرع الرئيسي','الفرع الأول']},
        'b2':{correct:'الفرع الثاني - زامل بن سليم', old:['الفرع الثاني']},
      };
      const branches=DB.branches();
      let changed=false;
      branches.forEach(b=>{
        const fix=fixes[b.id];
        if(fix&&fix.old.includes(b.name)){b.name=fix.correct;changed=true;}
      });
      if(changed) DB.save('branches',branches);
    })();
    (()=>{
      try{
        const HLAT=24.6882151, HLNG=46.7946825; // هارون الرشيد
        const ZLAT=24.6941321, ZLNG=46.7871351; // زامل بن سليم
        const near=(a,v)=>Math.abs((+a||0)-v)<1e-6;
        const empty=(v)=>v==null||v===''||v===undefined;
        const branches=DB.branches();
        let changed=false;
        const b2=branches.find(x=>x.id==='b2'||(x.name||'').includes('زامل بن سليم'));
        if(b2&&near(b2.lat,HLAT)&&near(b2.lng,HLNG)){b2.lat=null;b2.lng=null;changed=true;}
        if(b2&&empty(b2.lat)){b2.lat=ZLAT;b2.lng=ZLNG;if(!b2.geoRadius)b2.geoRadius=150;changed=true;}
        const b1=branches.find(x=>x.id==='b1'||(x.name||'').includes('هارون الرشيد'));
        if(b1&&empty(b1.lat)){b1.lat=HLAT;b1.lng=HLNG;if(!b1.geoRadius)b1.geoRadius=150;changed=true;}
        if(changed) DB.save('branches',branches);
      }catch(e){}
    })();
  }
  Auth.init();
  if(!Auth.user){
    // مدرسة جديدة أُنشئ مديرها العام للتو — سجّلي دخوله تلقائياً دون خطوة إضافية
    const admin=DB.users().find(u=>u.role==='superadmin');
    if(admin) Auth.login(admin.username,admin.password);
  }
  App.render();
  _watchForNewBuild();
}

function pvAddPackage(){
  PV_PACKAGES.push({id:'pkg'+Date.now(),name:'باقة جديدة',desc:'',price:0,billing:'monthly',
    maxBranches:1,maxChildren:0,maxUsers:0,features:['children','subscriptions','attendance'],
    highlight:false,active:true,order:PV_PACKAGES.length+1});
  pvGoTab('packages');
}
function pvRemovePackage(id){
  const used=PV_TENANTS.filter(t=>t.packageId===id).length;
  if(used&&!confirm(`هذه الباقة مرتبطة بـ ${used} مدرسة. حذفها سيترك تلك المدارس بلا باقة. المتابعة؟`)) return;
  if(!used&&!confirm('حذف هذه الباقة؟')) return;
  PV_PACKAGES=PV_PACKAGES.filter(p=>p.id!==id);
  pvGoTab('packages');
}
function pvPkgField(id,field,val){
  const p=PV_PACKAGES.find(x=>x.id===id); if(!p) return;
  if(['price','maxBranches','maxChildren','maxUsers','order'].includes(field)) p[field]=+val||0;
  else if(field==='highlight'||field==='active') p[field]=!!val;
  else p[field]=val;
}
function pvPkgFeature(id,key,on){
  const p=PV_PACKAGES.find(x=>x.id===id); if(!p) return;
  p.features=p.features||[];
  if(on){ if(!p.features.includes(key)) p.features.push(key); }
  else p.features=p.features.filter(f=>f!==key);
  const el=document.getElementById('pkgcount-'+id);
  if(el) el.textContent=p.features.length;
}
function pvPkgSelectGroup(id,keysCsv,on){
  const keys=keysCsv.split(',');
  keys.forEach(k=>{
    pvPkgFeature(id,k,on);
    const cb=document.getElementById('f-'+id+'-'+k);
    if(cb) cb.checked=on;
  });
}

// ===== معالجة صور الشعار: تصغير في المتصفح قبل الرفع =====
// الشعارات تُرفع كنص base64 داخل الطلب، وحجم الصورة الأصلية قد يتجاوز حدود
// الخادم أو nginx فيُرفض الطلب. نصغّرها هنا فتصبح عشرات الكيلوبايت فقط.
function shrinkImage(file,maxSide,maxBytes){
  maxSide=maxSide||512; maxBytes=maxBytes||150*1024;
  return new Promise((resolve,reject)=>{
    if(!file) return reject(new Error('لم يتم اختيار ملف'));
    if(!/^image\//.test(file.type)) return reject(new Error('الملف ليس صورة — اختاري صورة بصيغة PNG أو JPG'));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('تعذّرت قراءة الملف'));
    fr.onload=ev=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('تعذّر فتح الصورة — قد تكون تالفة أو بصيغة غير مدعومة'));
      img.onload=()=>{
        let {width:w,height:h}=img;
        if(!w||!h) return reject(new Error('أبعاد الصورة غير صالحة'));
        const sc=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d');
        cx.imageSmoothingQuality='high';
        cx.clearRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        // PNG يحفظ الشفافية؛ إن كبر الحجم ننتقل إلى JPEG بجودة متدرّجة
        let out=cv.toDataURL('image/png');
        if(out.length>maxBytes*1.37){
          const flat=document.createElement('canvas'); flat.width=w; flat.height=h;
          const fx=flat.getContext('2d');
          fx.fillStyle='#fff'; fx.fillRect(0,0,w,h); fx.drawImage(cv,0,0);
          for(const q of [0.9,0.8,0.7,0.6,0.5]){
            out=flat.toDataURL('image/jpeg',q);
            if(out.length<=maxBytes*1.37) break;
          }
        }
        resolve(out);
      };
      img.src=ev.target.result;
    };
    fr.readAsDataURL(file);
  });
}
function _uploadErrMsg(e){
  const m=String(e&&e.message||e||'');
  if(/413|too large|entity/i.test(m)) return 'الخادم رفض حجم الصورة — جرّبي صورة أصغر، أو اطلبي رفع حدّ الرفع في إعداد nginx.';
  if(/401|403|unauthorized/i.test(m)) return 'انتهت جلسة الدخول — سجّلي الدخول مرة أخرى ثم أعيدي المحاولة.';
  if(/networkerror|failed to fetch|network/i.test(m)) return 'تعذّر الوصول إلى الخادم — تحقّقي من الاتصال.';
  return m||'تعذّر رفع الشعار';
}

async function _scLogoPick(input){
  const file=input.files&&input.files[0];

  const prev=document.getElementById('sc-logo-preview');

    App.refresh();
  }catch(e){
    toast(_uploadErrMsg(e),'error');

  input.value='';
}

function pvAutoEndDate(){
  const term=document.getElementById('pv-term')?.value;
  const startEl=document.getElementById('pv-start');
  const endEl=document.getElementById('pv-end');
  if(!term||!startEl?.value||!endEl) return;
  const addMonths=(dateStr,n)=>{
    const d=new Date(dateStr+'T00:00:00');
    d.setMonth(d.getMonth()+n);
    d.setDate(d.getDate()-1); // آخر يوم مشمول بالمدة
    return d.toISOString().slice(0,10);
  };
  if(term==='monthly') endEl.value=addMonths(startEl.value,1);
  else if(term==='yearly') endEl.value=addMonths(startEl.value,12);
  else if(term==='two_years') endEl.value=addMonths(startEl.value,24);
}
