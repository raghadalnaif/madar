// ── عدّاد الفواتير (ICV) وسلسلة التجزئة (PIH) ─────────────────
function invoiceLedger(){ return DB.get('invoices')||[]; }
function lastInvoice(){ const l=invoiceLedger(); return l.length?l[l.length-1]:null; }
function nextICV(){ const li=lastInvoice(); return (li?(+li.icv||0):0)+1; }
function currentPIH(){ const li=lastInvoice(); return (li&&li.hash)?li.hash:Zatca.GENESIS_PIH; }
function nextInvoiceNo(typeCode){
  const s=DB.settings();
  const prefix=(typeCode==='381'?(s.creditPrefix||'CN'):(s.invoicePrefix||'INV'));
  const same=invoiceLedger().filter(i=>i.typeCode===typeCode);
  const maxN=same.reduce((m,i)=>{const n=parseInt(String(i.invoiceNo||'').replace(/^[A-Za-z]+-/,''));return isNaN(n)?m:Math.max(m,n);},0);
  return prefix+'-'+(maxN+1).toString().padStart(5,'0');
}

// ── بناء سطور الفاتورة من اشتراك ─────────────────────────────
function lineFromAmounts(name,grossOrNet,cat,rate,inclusive,qty){
  const q=qty||1;
  let net,tax;
  if(inclusive){ net=Zatca.round(grossOrNet/(1+rate/100)); tax=Zatca.round(grossOrNet-net); }
  else{ net=Zatca.round(grossOrNet); tax=Zatca.round(net*rate/100); }
  return {name,quantity:q,unitPrice:Zatca.round(net/q),netAmount:net,taxCategory:cat,taxRate:rate,taxAmount:tax,grossAmount:Zatca.round(net+tax)};
}

// ── إصدار فاتورة نظامية وتخزينها كسجل ثابت ───────────────────
// opts: {typeCode, subtype, lines, buyer, paymentMethod, supplyDate, supplyEndDate,
//        prepaidAmount, note, refInvoiceNo, sourceType, sourceId}
async function issueInvoice(opts){
  const s=DB.settings();
  const seller=sellerProfile();
  const now=new Date();
  const typeCode=opts.typeCode||'388';
  const buyer=opts.buyer||{};
  // نوع الفاتورة: معيارية إذا كان للمشتري رقم ضريبي، وإلا مبسّطة
  const subtype=opts.subtype||(Zatca.validVat(buyer.vatNumber)?'0100000':'0200000');
  const lines=(opts.lines||[]).map((l,i)=>({...l,index:i+1}));
  const netTotal=Zatca.round(lines.reduce((a,l)=>a+l.netAmount,0));
  const taxTotal=Zatca.round(lines.reduce((a,l)=>a+l.taxAmount,0));
  const grossTotal=Zatca.round(netTotal+taxTotal);
  const prepaid=Zatca.round(opts.prepaidAmount||0);

  const inv={
    id:uid(),
    uuid:Zatca.uuid(),
    icv:nextICV(),
    pih:currentPIH(),
    hash:'',
    invoiceNo:opts.invoiceNo||nextInvoiceNo(typeCode),
    typeCode,                       // 388 فاتورة · 381 إشعار دائن · 383 إشعار مدين
    subtype,                        // 0100000 معيارية · 0200000 مبسّطة
    issueDate:Zatca.dateOnly(now),
    issueTime:Zatca.timeOnly(now),
    issuedAt:Zatca.isoZ(now),
    supplyDate:opts.supplyDate||Zatca.dateOnly(now),
    supplyEndDate:opts.supplyEndDate||'',
    currency:'SAR',
    seller,
    buyer:{name:buyer.name||'',vatNumber:(buyer.vatNumber||'').trim(),phone:buyer.phone||'',address:buyer.address||{}},
    lines,
    totals:{net:netTotal,tax:taxTotal,gross:grossTotal,prepaid,payable:Zatca.round(grossTotal-prepaid)},
    paymentMethod:opts.paymentMethod||'',
    paymentMeansCode:payMeansCode(opts.paymentMethod),
    note:opts.note||'',
    refInvoiceNo:opts.refInvoiceNo||'',   // إلزامي للإشعارات الدائنة/المدينة
    reasonCode:opts.reasonCode||'',
    sourceType:opts.sourceType||'',       // subscription | sale | manual
    sourceId:opts.sourceId||'',
    issuedBy:Auth.user?.name||'',
    branchId:opts.branchId||'',
    createdAt:new Date().toISOString(),
  };
  // التجزئة تُحسب على ملف UBL المُقنَّن، وتصبح PIH للفاتورة التالية
  inv.xml=buildUBL(inv);
  inv.hash=await Zatca.sha256B64(inv.xml.replace(/>\s+</g,'><').trim());
  inv.qr=Zatca.qrBase64({sellerName:seller.name,vatNumber:seller.vatNumber,timestamp:inv.issuedAt,
                         total:inv.totals.gross,vatAmount:inv.totals.tax,hash:inv.hash});
  const ledger=invoiceLedger();
  ledger.push(inv);
  DB.save('invoices',ledger);
  return inv;
}
function findInvoice(idOrNo){
  return invoiceLedger().find(i=>i.id===idOrNo||i.uuid===idOrNo||i.invoiceNo===idOrNo)||null;
}
function invoiceForSource(sourceType,sourceId){
  return invoiceLedger().filter(i=>i.sourceType===sourceType&&i.sourceId===sourceId&&i.typeCode==='388').pop()||null;
}

// ── مولّد ملف UBL 2.1 (المواصفة السعودية) ─────────────────────
function buildUBL(inv){
  const x=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const m=n=>Zatca.money(n);
  const S=inv.seller, B=inv.buyer, A=S.address;
  const catOf=l=>VAT_CATEGORIES[l.taxCategory]||VAT_CATEGORIES.S;
  // تجميع الضريبة حسب الفئة والنسبة
  const groups={};
  inv.lines.forEach(l=>{
    const k=l.taxCategory+'|'+l.taxRate;
    if(!groups[k]) groups[k]={cat:l.taxCategory,rate:l.taxRate,net:0,tax:0,reason:l.exemptionReason||''};
    groups[k].net=Zatca.round(groups[k].net+l.netAmount);
    groups[k].tax=Zatca.round(groups[k].tax+l.taxAmount);
  });
  const taxSubtotals=Object.values(groups).map(g=>`
    <cac:TaxSubtotal>
      <cbc:TaxableAmount currencyID="SAR">${m(g.net)}</cbc:TaxableAmount>
      <cbc:TaxAmount currencyID="SAR">${m(g.tax)}</cbc:TaxAmount>
      <cac:TaxCategory>
        <cbc:ID schemeID="UN/ECE 5305" schemeAgencyID="6">${g.cat}</cbc:ID>
        <cbc:Percent>${Number(g.rate).toFixed(2)}</cbc:Percent>
        ${g.cat!=='S'?`<cbc:TaxExemptionReasonCode>${x(g.reason||'VATEX-SA-OOS')}</cbc:TaxExemptionReasonCode>
        <cbc:TaxExemptionReason>${x(VAT_EXEMPTION_REASONS[g.reason]||'')}</cbc:TaxExemptionReason>`:''}
        <cac:TaxScheme><cbc:ID schemeID="UN/ECE 5153" schemeAgencyID="6">VAT</cbc:ID></cac:TaxScheme>
      </cac:TaxCategory>
    </cac:TaxSubtotal>`).join('');
  const lines=inv.lines.map(l=>`
  <cac:InvoiceLine>
    <cbc:ID>${l.index}</cbc:ID>
    <cbc:InvoicedQuantity unitCode="PCE">${Number(l.quantity||1).toFixed(6)}</cbc:InvoicedQuantity>
    <cbc:LineExtensionAmount currencyID="SAR">${m(l.netAmount)}</cbc:LineExtensionAmount>
    <cac:TaxTotal>
      <cbc:TaxAmount currencyID="SAR">${m(l.taxAmount)}</cbc:TaxAmount>
      <cbc:RoundingAmount currencyID="SAR">${m(l.grossAmount)}</cbc:RoundingAmount>
    </cac:TaxTotal>
    <cac:Item>
      <cbc:Name>${x(l.name)}</cbc:Name>
      <cac:ClassifiedTaxCategory>
        <cbc:ID schemeID="UN/ECE 5305" schemeAgencyID="6">${l.taxCategory}</cbc:ID>
        <cbc:Percent>${Number(l.taxRate).toFixed(2)}</cbc:Percent>
        <cac:TaxScheme><cbc:ID schemeID="UN/ECE 5153" schemeAgencyID="6">VAT</cbc:ID></cac:TaxScheme>
      </cac:ClassifiedTaxCategory>
    </cac:Item>
    <cac:Price><cbc:PriceAmount currencyID="SAR">${m(l.unitPrice)}</cbc:PriceAmount></cac:Price>
  </cac:InvoiceLine>`).join('');
  const isNote=inv.typeCode!=='388';
  const root=isNote?'CreditNote':'Invoice';
  const ns=isNote
    ?'urn:oasis:names:specification:ubl:schema:xsd:CreditNote-2'
    :'urn:oasis:names:specification:ubl:schema:xsd:Invoice-2';
  return `<?xml version="1.0" encoding="UTF-8"?>
<${root} xmlns="${ns}"
  xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2"
  xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2"
  xmlns:ext="urn:oasis:names:specification:ubl:schema:xsd:CommonExtensionComponents-2">
  <cbc:ProfileID>reporting:1.0</cbc:ProfileID>
  <cbc:ID>${x(inv.invoiceNo)}</cbc:ID>
  <cbc:UUID>${x(inv.uuid)}</cbc:UUID>
  <cbc:IssueDate>${x(inv.issueDate)}</cbc:IssueDate>
  <cbc:IssueTime>${x(inv.issueTime)}</cbc:IssueTime>
  <cbc:${isNote?'CreditNoteTypeCode':'InvoiceTypeCode'} name="${x(inv.subtype)}">${x(inv.typeCode)}</cbc:${isNote?'CreditNoteTypeCode':'InvoiceTypeCode'}>
  ${inv.note?`<cbc:Note languageID="ar">${x(inv.note)}</cbc:Note>`:''}
  <cbc:DocumentCurrencyCode>SAR</cbc:DocumentCurrencyCode>
  <cbc:TaxCurrencyCode>SAR</cbc:TaxCurrencyCode>
  ${isNote&&inv.refInvoiceNo?`<cac:BillingReference><cac:InvoiceDocumentReference><cbc:ID>${x(inv.refInvoiceNo)}</cbc:ID></cac:InvoiceDocumentReference></cac:BillingReference>`:''}
  <cac:AdditionalDocumentReference>
    <cbc:ID>ICV</cbc:ID><cbc:UUID>${inv.icv}</cbc:UUID>
  </cac:AdditionalDocumentReference>
  <cac:AdditionalDocumentReference>
    <cbc:ID>PIH</cbc:ID>
    <cac:Attachment><cbc:EmbeddedDocumentBinaryObject mimeCode="text/plain">${x(inv.pih)}</cbc:EmbeddedDocumentBinaryObject></cac:Attachment>
  </cac:AdditionalDocumentReference>
  <cac:AccountingSupplierParty>
    <cac:Party>
      <cac:PartyIdentification><cbc:ID schemeID="CRN">${x(S.crNumber)}</cbc:ID></cac:PartyIdentification>
      <cac:PostalAddress>
        <cbc:StreetName>${x(A.street)}</cbc:StreetName>
        <cbc:BuildingNumber>${x(A.buildingNumber)}</cbc:BuildingNumber>
        <cbc:PlotIdentification>${x(A.additionalNumber)}</cbc:PlotIdentification>
        <cbc:CitySubdivisionName>${x(A.district)}</cbc:CitySubdivisionName>
        <cbc:CityName>${x(A.city)}</cbc:CityName>
        <cbc:PostalZone>${x(A.postalCode)}</cbc:PostalZone>
        <cac:Country><cbc:IdentificationCode>SA</cbc:IdentificationCode></cac:Country>
      </cac:PostalAddress>
      <cac:PartyTaxScheme>
        <cbc:CompanyID>${x(S.vatNumber)}</cbc:CompanyID>
        <cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme>
      </cac:PartyTaxScheme>
      <cac:PartyLegalEntity><cbc:RegistrationName>${x(S.name)}</cbc:RegistrationName></cac:PartyLegalEntity>
    </cac:Party>
  </cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>
    <cac:Party>
      ${B.vatNumber?`<cac:PartyTaxScheme><cbc:CompanyID>${x(B.vatNumber)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>`:''}
      <cac:PartyLegalEntity><cbc:RegistrationName>${x(B.name||'عميل نقدي')}</cbc:RegistrationName></cac:PartyLegalEntity>
    </cac:Party>
  </cac:AccountingCustomerParty>
  <cac:Delivery><cbc:ActualDeliveryDate>${x(inv.supplyDate)}</cbc:ActualDeliveryDate>${inv.supplyEndDate?`<cbc:LatestDeliveryDate>${x(inv.supplyEndDate)}</cbc:LatestDeliveryDate>`:''}</cac:Delivery>
  <cac:PaymentMeans><cbc:PaymentMeansCode>${x(inv.paymentMeansCode)}</cbc:PaymentMeansCode>${isNote?`<cbc:InstructionNote>${x(inv.note||'إشعار دائن')}</cbc:InstructionNote>`:''}</cac:PaymentMeans>
  <cac:TaxTotal>
    <cbc:TaxAmount currencyID="SAR">${m(inv.totals.tax)}</cbc:TaxAmount>${taxSubtotals}
  </cac:TaxTotal>
  <cac:TaxTotal><cbc:TaxAmount currencyID="SAR">${m(inv.totals.tax)}</cbc:TaxAmount></cac:TaxTotal>
  <cac:LegalMonetaryTotal>
    <cbc:LineExtensionAmount currencyID="SAR">${m(inv.totals.net)}</cbc:LineExtensionAmount>
    <cbc:TaxExclusiveAmount currencyID="SAR">${m(inv.totals.net)}</cbc:TaxExclusiveAmount>
    <cbc:TaxInclusiveAmount currencyID="SAR">${m(inv.totals.gross)}</cbc:TaxInclusiveAmount>
    <cbc:PrepaidAmount currencyID="SAR">${m(inv.totals.prepaid)}</cbc:PrepaidAmount>
    <cbc:PayableAmount currencyID="SAR">${m(inv.totals.payable)}</cbc:PayableAmount>
  </cac:LegalMonetaryTotal>${lines}
</${root}>`;
}

function getQRDataURL(text){
  if(!text) return Promise.resolve('');
  // المولّد المضمّن أولاً — لا يعتمد على الشبكة، ورمز الفاتورة شرط نظامي
  try{ return Promise.resolve(QRGen.toDataURL(text,200)); }catch(e){}
  // احتياطي: المكتبة الخارجية إن كانت محمّلة
  return new Promise(resolve=>{
    if(typeof QRCode==='undefined'){resolve('');return;}
    const div=document.createElement('div');
    div.style.cssText='position:absolute;top:-9999px;left:-9999px;width:200px';
    document.body.appendChild(div);
    try{new QRCode(div,{text,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}
    catch(e){try{document.body.removeChild(div);}catch(_){}resolve('');return;}
    setTimeout(()=>{
      const canvas=div.querySelector('canvas'), img=div.querySelector('img');
      const src=canvas?.toDataURL('image/png')||img?.src||'';
      try{document.body.removeChild(div);}catch(_){}
      resolve(src);
    },350);
  });
}

  const child=DB.children().find(c=>c.id===sub.childId)||{};
  const branch=DB.branches().find(b=>b.id===sub.branchId)||{};
  const cfg=DB.settings();

  // فاتورة الاشتراك تُصدَر مرة واحدة وتُحفَظ كسجل ثابت لا يتغيّر بعدها
  let inv=invoiceForSource('subscription',sub.id);
  if(!inv){
    const cat=cfg.vatCategory||'S';
    const rate=(cat==='S')?(Number(cfg.vatRate)||15):0;
    const inclusive=cfg.vatInclusive!==false;
    const line=lineFromAmounts(
      `اشتراك ${planName(sub.type)} — ${periodName(sub.period)} · ${child.name||''}`,
      Number(sub.price)||0, cat, rate, inclusive, 1);
    line.exemptionReason=cfg.vatExemptionReason||'';
    inv=await issueInvoice({
      typeCode:'388',
      lines:[line],
      buyer:{name:child.parentName||child.name||'',vatNumber:(child.parentVatNumber||'').trim(),phone:child.parentPhone||''},
      paymentMethod:sub.paymentMethod,
      supplyDate:sub.startDate||undefined,
      supplyEndDate:sub.endDate||'',
      prepaidAmount:Number(sub.paidAmount)||0,
      sourceType:'subscription', sourceId:sub.id, branchId:sub.branchId||'',
    });
    // نربط رقم الفاتورة النظامي بالاشتراك
    const all=DB.subscriptions();
    const ix=all.findIndex(z=>z.id===sub.id);
    if(ix>-1){ all[ix]={...all[ix],invoiceNo:inv.invoiceNo,invoiceUuid:inv.uuid}; DB.save('subscriptions',all); }
  }
  await renderInvoiceDoc(inv,{childName:child.name,branchName:branch.name,
    subPeriod:(sub.startDate&&sub.endDate)?[sub.startDate,sub.endDate]:null});
}

// إشعار دائن نظامي مرتبط بفاتورة أصلية (استرجاع / إلغاء / تصحيح)
async function issueCreditNote(invoiceNo,amount,reason){
  const orig=findInvoice(invoiceNo);
  if(!orig){ toast('لم يتم العثور على الفاتورة الأصلية','error'); return null; }
  const amt=Math.min(Zatca.round(amount||orig.totals.gross),orig.totals.gross);
  if(!(amt>0)){ toast('المبلغ غير صحيح','error'); return null; }
  const l0=orig.lines[0]||{taxCategory:'S',taxRate:15};
  const line=lineFromAmounts(`إشعار دائن على الفاتورة ${orig.invoiceNo}`,amt,l0.taxCategory,l0.taxRate,true,1);
  line.exemptionReason=l0.exemptionReason||'';
  const note=await issueInvoice({
    typeCode:'381', subtype:orig.subtype, lines:[line],
    buyer:orig.buyer, paymentMethod:orig.paymentMethod,
    supplyDate:orig.supplyDate, refInvoiceNo:orig.invoiceNo,
    note:reason||'استرجاع / إلغاء', reasonCode:'1',
    sourceType:'credit_note', sourceId:orig.id, branchId:orig.branchId,
  });
  toast('<i class="ic ic-check"></i> تم إصدار إشعار دائن '+note.invoiceNo);
  return note;
}
function openCreditNoteModal(invoiceNo){
  const orig=findInvoice(invoiceNo);
  if(!orig){ toast('لم يتم العثور على الفاتورة','error'); return; }
  App.modal=`<div class="modal-overlay" onclick="if(event.target===this)App.closeModal()"><div class="modal" style="max-width:480px">

      <div class="inv-row" style="margin-bottom:10px"><span>الفاتورة الأصلية</span><strong>${esc(orig.invoiceNo)}</strong></div>

async function _doCreditNote(invoiceNo){
  const amt=+(document.getElementById('cn-amt')?.value||0);
  const reason=document.getElementById('cn-reason')?.value||'';
  App.closeModal();
  const n=await issueCreditNote(invoiceNo,amt,reason);
  if(n) await renderInvoiceDoc(n,{});
}

      </div>
      <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px"><i class="ic ic-chart"></i> عدد السجلات المحمّلة في الذاكرة (mem):</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${Object.entries(mem).map(([k,v])=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between"><span style="font-size:13px;color:#374151">${k}</span><span style="font-size:14px;font-weight:700;color:${v>0?'#059669':'#64748b'}">${v}</span></div>`).join('')}
      </div>
      <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px"><i class="ic ic-save"></i> في localStorage (المتصفح):</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${Object.entries(ls).map(([k,v])=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between"><span style="font-size:13px;color:#374151">${k}</span><span style="font-size:14px;font-weight:700;color:${v>0?'#059669':'#64748b'}">${v}</span></div>`).join('')}
      </div>
      <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:14px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;color:#92400e;margin-bottom:6px"><i class="ic ic-bulb"></i> لماذا قد تكون البيانات صفر؟</div>
        <div style="font-size:12px;color:#78350f;line-height:1.7">إذا كان Firebase غير متصل وأظهر 0 أطفال، فالبيانات موجودة في Firebase لكن الاتصال فشل. تحقق من: <strong>Firebase Console → Authentication → Sign-in method → Anonymous → مفعّل</strong></div>
      </div>
      <button class="btn btn-primary" onclick="exportAllData()"><i class="ic ic-download"></i> تصدير جميع البيانات Excel الآن</button>
    </div>
  </div></div>`);
}

// =========================================================
//  INIT
// =========================================================
(function boot(){
  const h=(location.hash||'').replace(/^#/,'').split(/[?\/]/)[0];
  if(h==='provider'){renderProviderArea();return;}
  if(h==='attend'){document.getElementById('app').innerHTML=Views.staffCheckin();return;}
  TenantSession.init();
  if(TenantSession.token&&TenantSession.tenant){
    startAppForTenant();
  }else{
    document.getElementById('app').innerHTML=Views.platformGate('login');loadLandingPackages();loadLandingPackages();
  }
})();

// شريط تنبيه عائم قابل لإعادة الاستخدام — يطلب من المستخدم إعادة تحميل الصفحة
// (لا نعيد التحميل تلقائياً كي لا يُقطع على المستخدم عمله في منتصف إدخال بيانات)
let _reloadBannerShown=false;
function _showReloadBanner(msg){
  if(_reloadBannerShown) return;
  _reloadBannerShown=true;
  const banner=document.createElement('div');
  banner.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:#1d4ed8;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99999;display:flex;align-items:center;gap:12px;font-family:Tajawal,sans-serif;font-size:14px';
  banner.innerHTML=`<span style="flex:1">${msg}</span><button style="background:#fff;color:#1d4ed8;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit">تحديث الآن</button>`;
  banner.querySelector('button').onclick=()=>{location.href=location.pathname+'?r='+Date.now();};
  document.body.appendChild(banner);
}
// تنبيه عند توفر تحديث جديد للنظام — يفحص دورياً (ولا يعيد التحميل تلقائياً
// كي لا يقطع على المستخدم عمله) حتى لا تبقى علامة مفتوحة عالقة على نسخة
// قديمة تكتب على Firebase بينما بقية الأجهزة انتقلت للسيرفر الجديد
function _watchForNewBuild(){
  const check=async()=>{
    try{
      const res=await fetch(location.pathname,{cache:'no-store'});
      const html=await res.text();
      const m=html.match(/BUILD='([^']+)'/);
      if(m&&window.MADAREK_BUILD&&m[1]!==window.MADAREK_BUILD){
        _showReloadBanner('<i class="ic ic-refresh"></i> يتوفر تحديث جديد للنظام — يُفضّل التحديث الآن');
      }
    }catch(e){}
  };
  setInterval(check,120000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
}
// شفاء ذاتي: جهاز عالق على Firebase (لأن الخادم كان متعطلاً لحظة فتح الصفحة)
// يُعاد فحصه دورياً — فور توفر الخادم نطلب من المستخدم تحديثاً بسيطاً
// لإعادة الإقلاع على وضع الخادم الموثوق بدل البقاء معزولاً عن بقية الفروع
function _watchForBackendRecovery(){
  if(_storageMode==='backend') return;
  const check=async()=>{
    try{
      await _backendGetAll();
      _showReloadBanner('<i class="ic ic-refresh"></i> الاتصال بالخادم عاد — يُرجى التحديث الآن لمزامنة بياناتك مع بقية الفروع');
    }catch(e){}
  };
  setInterval(check,30000);
}

// إخفاء تنبيه اشتراك منتهي من الرئيسية (يُحفظ محلياً — يختفي تلقائياً بعد 5 أيام من الانتهاء)
function dismissSubAlert(subId){
  const key='_dismissed_alerts';
  const map=JSON.parse(localStorage.getItem(key)||'{}');
  map[subId]=T0;
  // تنظيف القديم (أكثر من 10 أيام)
  Object.keys(map).forEach(k=>{if(diffDays(T0,map[k])>10) delete map[k];});
  localStorage.setItem(key,JSON.stringify(map));
  App.refresh();
}
// ===== البحث السريع الشامل (Ctrl+K) =====
let _qsActive=-1;
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openQuickSearch();}
  if(e.key==='Escape'){closeQuickSearch();}
});
function openQuickSearch(){
  const ov=document.getElementById('quick-search-overlay');
  const inp=document.getElementById('qs-input');
  if(!ov||!inp) return;
  ov.classList.add('open');
  inp.value='';
  inp.focus();
  runQuickSearch('');
}
function closeQuickSearch(){
  document.getElementById('quick-search-overlay')?.classList.remove('open');
  _qsActive=-1;
}
function runQuickSearch(q){
  const el=document.getElementById('qs-results');
  if(!el) return;
  q=(q||'').trim();
  _qsActive=-1;
  if(!q){el.innerHTML='<div style="padding:32px;text-align:center;color:#94a3b8;font-size:14px">اكتب للبحث... أو اضغط Esc للإغلاق</div>';return;}
  const results=[];
  // بحث في الأطفال
  DB.children().filter(c=>{
    const n=(c.name||'').toLowerCase();
    const p=(c.parentName||'').toLowerCase();
    const qL=q.toLowerCase();
    return n.includes(qL)||p.includes(qL);
  }).slice(0,5).forEach(c=>{
    const sub=DB.subscriptions().find(s=>s.childId===c.id&&s.isActive);
    results.push({type:'child',icon:'<i class="ic ic-child"></i>',bg:'#dcfce7',label:c.name,sub:`${esc(c.parentName||'')} · ${DB.branchName(c.branchId)||''} · ${esc(periodShort(c.period))}${sub?' · اشتراك فعال':' · بدون اشتراك'}`,action:()=>{App.go('children',{search:c.name});closeQuickSearch();},typeLbl:'طفل',typeCls:'background:#dcfce7;color:#166534'});
  });
  // بحث في الاشتراكات
  DB.subscriptions().filter(s=>{
    const c=DB.children().find(x=>x.id===s.childId);
    return (c?.name||'').toLowerCase().includes(q.toLowerCase())&&s.isActive;
  }).slice(0,3).forEach(s=>{
    const c=DB.children().find(x=>x.id===s.childId);
    results.push({type:'sub',icon:'<i class="ic ic-clipboard"></i>',bg:'#dbeafe',label:`اشتراك: ${c?.name||''}`,sub:`${formatDate(s.startDate)} → ${formatDate(s.endDate)} · ${s.isActive?'فعال':'منتهي'}`,action:()=>{App.go('subscriptions',{childId:s.childId});closeQuickSearch();},typeLbl:'اشتراك',typeCls:'background:#dbeafe;color:#1e40af'});
  });
  // بحث في الموظفين
  if(Auth.isSuperAdmin()){
    DB.hrEmployees().filter(e=>e.status!=='deleted'&&((e.name||'').toLowerCase().includes(q.toLowerCase())||(e.jobTitle||'').toLowerCase().includes(q.toLowerCase()))).slice(0,4).forEach(e=>{
      results.push({type:'emp',icon:'<i class="ic ic-user"></i>',bg:'#fef3c7',label:e.name,sub:`${esc(e.jobTitle||'—')} · ${DB.branchName(e.branchId)||''} · ${(+e.basicSalary||0).toLocaleString()} ر.س`,action:()=>{closeQuickSearch();Modals.viewHrEmployee(e.id);},typeLbl:'موظف',typeCls:'background:#fef3c7;color:#92400e'});
    });
  }
  if(!results.length){el.innerHTML=`<div style="padding:32px;text-align:center;color:#94a3b8;font-size:14px">لا توجد نتائج لـ «${esc(q)}»</div>`;return;}
  el.innerHTML=results.map((r,i)=>`<div class="qs-item" data-idx="${i}" onclick="qsSelect(${i})" onmouseenter="_qsActive=${i}">
    <div class="qs-icon" style="background:${r.bg}">${r.icon}</div>
    <div style="flex:1;min-width:0">
      <div class="qs-label">${esc(r.label)}</div>
      <div class="qs-sub">${r.sub}</div>
    </div>
    <span class="qs-type" style="${r.typeCls}">${r.typeLbl}</span> </div>`).join('');
  window._qsResults=results;
}
function qsSelect(i){
  const r=window._qsResults?.[i];
  if(r) r.action();
}
function qsKeyNav(e){
  const items=document.querySelectorAll('.qs-item');
  if(!items.length) return;
  if(e.key==='ArrowDown'){e.preventDefault();_qsActive=Math.min(_qsActive+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();_qsActive=Math.max(_qsActive-1,0);}
  else if(e.key==='Enter'){e.preventDefault();if(_qsActive>=0) qsSelect(_qsActive);return;}
  items.forEach((el,i)=>el.style.background=i===_qsActive?'#f0fdf4':'');
  if(_qsActive>=0) items[_qsActive].scrollIntoView({block:'nearest'});
}
</script>
